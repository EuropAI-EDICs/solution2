      if (d !== null && d !== undefined) {
        lyr.setStyle({fillColor: ramp(d), fillOpacity: 0.5,
                       color: '#3d4a5c', weight: 0.8, dashArray: '3,3'});
        if (pv) pv.textContent = steps[i] + ': afgeleid — ' +
          ((meta.derivedNote || {})[cell] || 'stroomopwaartse metingen') +
          ' (' + d + ' ' + meta.unit + ')';
      } else {
        lyr.setStyle({fillColor: ramp(v), fillOpacity: v === null ? 0.25 : 0.85,
                       color: '#d8dde3', weight: 0, dashArray: ''});
        if (pv) pv.textContent = steps[i] + ': ' +
          (v === null ? 'geen meting' : v + ' ' + meta.unit);
      }
      if (pv && (meta.cellPg || {})[cell])
        pv.textContent += ' \u00b7 peilgebied ' + meta.cellPg[cell].name;
    });
    label.textContent = steps[i];
    slider.value = i;
  }
  slider.addEventListener('input', function () { stop(); setStep(+slider.value); });
  showDerived.addEventListener('change', function () {
    stop();
    // lui lookup: de statische legenda staat ná dit script in de pagina
    var el = document.getElementById('derived-legend-note');
    if (el) el.style.display = showDerived.checked ? '' : 'none';
    setStep(+slider.value);
  });

  var playBtn = document.getElementById('play');
  var timer = null;
  function stop () {
    if (timer) { clearInterval(timer); timer = null; }
    playBtn.innerHTML = '&#9654; Afspelen';
  }
  playBtn.addEventListener('click', function () {
    if (timer) { stop(); return; }
    playBtn.innerHTML = '&#9632; Stoppen';
    var i = +slider.value;
    timer = setInterval(function () {
      i = (i + 1) % steps.length;
      setStep(i);
    }, 700);
  });

  setStep(0);
})();
</script>
<div class="legend" style="position:absolute;z-index:1000;right:12px;bottom:20px;"><div class="title">Grondwaterdiepte</div><div class="row"><span class="swatch" style="background:hsl(0, 72%, 46%)"></span><span>Laag</span></div><div class="row"><span class="swatch" style="background:hsl(55, 72%, 46%)"></span><span>Midden</span></div><div class="row"><span class="swatch" style="background:hsl(110, 72%, 46%)"></span><span>Hoog</span></div><div class="note">Kleur = waarde per cel per tijdstap (mediaan over meetlocaties in de cel); grijze cellen hebben die stap geen meting.</div></div></body>
</html>
