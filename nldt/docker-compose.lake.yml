# RustFS + Postgres CDC source for nLDT lake (no RisingWave).
# Usage: docker compose -f docker-compose.lake.yml up -d
# Elasticsearch: http://localhost:9200  (optional discovery index nldt-lake-v1)

services:
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: nldtadmin
      RUSTFS_SECRET_KEY: nldtadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - nldt_lake_rustfs:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  rustfs-init:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: nldtadmin
      RUSTFS_SECRET_KEY: nldtadmin
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/rc alias set rustfs http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"; do
          echo "Waiting for RustFS...";
          sleep 2;
        done
        /usr/bin/rc ls rustfs/nldt-poc-lake >/dev/null 2>&1 || /usr/bin/rc mb rustfs/nldt-poc-lake
        exit 0

  postgres-cdc:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: nldt
      POSTGRES_PASSWORD: nldt
      POSTGRES_DB: nldt_cdc
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    volumes:
      - nldt_cdc_pg:/var/lib/postgresql/data
      - ./scripts/sql/cdc_postgres_init.sql:/docker-entrypoint-initdb.d/01_cdc.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nldt -d nldt_cdc"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - nldt_elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nldt_lake_rustfs:
  nldt_cdc_pg:
  nldt_elasticsearch:
