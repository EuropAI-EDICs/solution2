# MinIO + Postgres CDC source for nLDT lake (no RisingWave).
# Usage: docker compose -f docker-compose.lake.yml up -d
# Elasticsearch: http://localhost:9200  (optional discovery index nldt-lake-v1)

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - nldt_lake_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-38Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/nldt-poc-lake || true;
      exit 0;
      "

  postgres-cdc:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: nldt
      POSTGRES_PASSWORD: nldt
      POSTGRES_DB: nldt_cdc
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    volumes:
      - nldt_cdc_pg:/var/lib/postgresql/data
      - ./scripts/sql/cdc_postgres_init.sql:/docker-entrypoint-initdb.d/01_cdc.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nldt -d nldt_cdc"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - nldt_elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  nldt_lake_minio:
  nldt_cdc_pg:
  nldt_elasticsearch:
