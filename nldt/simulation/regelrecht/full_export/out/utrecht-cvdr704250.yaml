  text: Voor alle openbare wegen in beheer bij de provincie met een verkeersintensiteit van meer dan 1000 motorvoertuigen per etmaal als kalenderjaargemiddelde worden geluidproductieplafonds vastgesteld.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.7__art_4.70
