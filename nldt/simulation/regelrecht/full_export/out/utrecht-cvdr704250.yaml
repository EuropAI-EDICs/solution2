- number: '9.15'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied uitbreiding woningbouw onder voorwaarden mogelijk kan regels bevatten voor woningbouw mits is voldaan aan de volgende voorwaarden: a. de woningbouw past in het door gedeputeerde staten vastgestelde programma Wonen en werken of is opgenomen in de Bijlage XIX Wonen ; b. de woningbouw vindt plaats in aansluiting op het Stedelijk gebied ; c. de woningbouw leidt niet tot extra bodemdaling; d. de woningbouw wordt in samenhang ontwikkeld met lokale en regionale groenontwikkeling waarbij de omvang van de woningbouw in evenwichtige verhouding staat tot de hoeveelheid te ontwikkelen natuur en recreatie; en e. de realisatie van natuur en recreatie en de duurzame instandhouding daarvan is verzekerd, en f. de woningbouw draagt bij aan een goede kwaliteit van de nieuwe kernrandzone . 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan. Een beeldkwaliteitsparagraaf
    maakt onderdeel uit van de onderbouwing.'
