- number: '9.4'
  text: '1. In afwijking van deze verordening kan een omgevingsplan dat betrekking heeft op locaties binnen het Gebied eiland van Schalkwijk regels bevatten: a. die activiteiten mogelijk maken die voldoen aan de voorwaarden, genoemd in de pijlers 1 tot en met 7 in de bijlage XIII Eiland van Schalkwijk ; en b. over woningbouw tot een maximum van 250 woningen. 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.1__subsec_9.1.1__art_9.4
- number: '9.5'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Landelijk gebied kan voorzien in legalisatie van het bestaand gebruik van en bestaande bebouwing voor stedelijke activiteiten, als voldaan is aan de volgende voorwaarden: a. er is gemotiveerd dat tegen dit gebruik en tegen deze bebouwing redelijkerwijs niet meer juridisch kan worden opgetreden; en b. de legalisatie heeft, op de schaal van het gehele buitengebied van een gemeente, slechts betrekking op enkele gevallen. 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.1__subsec_9.1.1__art_9.5
- number: '9.6'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Landelijk gebied bevat geen regels die toestaan dat een woning, woonschip of woonark landschappelijk niet goed inpasbaar is. 2. Een omgevingsplan dat betrekking heeft op locaties binnen het Landelijk gebied kan regels bevatten die: a. de uitbreiding van bestaande woningen mogelijk maken onder de voorwaarde dat de regels voorzien in een maximale inhoudsmaat, zodanig dat de woning landschappelijk goed inpasbaar is; b. voorzien in de vergroting van ligplaatsen van woonschepen of woonarken of in de vergroting van de maatvoering van woonschepen of woonarken onder de voorwaarde dat de regels voorzien in een maximale oppervlakte van de ligplaats en een maximale maatvoering van het woonschip of woonark , zodanig dat het woonschip of de woonark landschappelijk goed inpasbaar is; of c. nieuwe vervangende ligplaatsen voor woonschepen of woonarken toestaan, mits is voldaan aan de volgende voorwaarden: 1. het gaat om woonschepen
    en woonarken die afkomstig zijn uit zeer kwetsbare gebieden en de nieuwe locatie is uit ruimtelijk oogpunt aanmerkelijk minder bezwaarlijk, of de vervangende ligplaats is uitsluitend bestemd voor woonschepen met een historische waarde; en 2. de maatvoering van woonschepen of woonarken en ligplaats is zodanig, dat het woonschip of de woonark landschappelijk goed inpasbaar is. 3. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan. Een beeldkwaliteitsparagraaf maakt deel uit van de onderbouwing, als het nieuwe besluit substantieel grotere maten mogelijk maakt ten opzichte van het vigerende besluit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.1__subsec_9.1.1__art_9.6
