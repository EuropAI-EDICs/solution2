- number: '5.4'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied windenergie kan regels bevatten die de realisatie van windturbines met een vermogen van 3 MW of meer toestaan, mits voldaan is aan de volgende voorwaarden: a. de windturbines worden in een in de omgeving passende combinatie van meerdere windturbines opgesteld; en b. er wordt voorzien in een opruimplicht na beëindiging van de activiteit. 2. In afwijking van het eerste lid kan een omgevingsplan regels bevatten die de realisatie van windturbines met een vermogen van minder dan 3 MW toestaan, mits wordt onderbouwd waarom windturbines met een vermogen van 3 MW of meer niet mogelijk zijn. 3. In afwijking van het eerste lid kan een omgevingsplan regels bevatten die de realisatie van een solitaire windturbine toestaan, mits wordt onderbouwd waarom meerdere windturbines niet mogelijk zijn en dat de energieopbrengst van die solitaire windturbine opweegt tegen de impact die een solitaire turbine heeft op de omgeving. 4.
    De motivering van een omgevingsplan bevat: a. een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan; b. een beeldkwaliteitsparagraaf ; en c. een beschrijving van hoe de omwonenden en andere stakeholders in de planvorming zijn betrokken.'
