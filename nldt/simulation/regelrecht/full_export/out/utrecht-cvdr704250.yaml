- number: '8.6'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied glastuinbouw niet toegestaan bevat geen regels die glastuinbouw toestaan, tenzij het de verplaatsing van solitaire glastuinbedrijven, gevestigd in de Ronde Venen en omgeving, naar de gronden in aansluiting op bestaand kassengebied in de Polder Derde Bedijking betreft. 2. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied glastuinbouw niet toegestaan kan regels bevatten die toestaan dat bestaande glastuinbouwbedrijven worden uitgebreid, mits is voldaan aan de volgende voorwaarden: a. de uitbreiding is beperkt tot een omvang die noodzakelijk is voor een doelmatige voortzetting van het glastuinbouwbedrijf tot een maximum van 2 hectare; b. er is geen sprake van zwaarwegende landschappelijke bezwaren; en c. bestaande omringende activiteiten worden niet onevenredig aangetast of beperkt. 3. De motivering van een omgevingsplan bevat: a. een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden
    is voldaan; en b. dat verplaatsing van het glastuinbouwbedrijf naar een Concentratiegebied glastuinbouw niet mogelijk is.'
