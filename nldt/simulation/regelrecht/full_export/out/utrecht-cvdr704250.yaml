- number: '6.3'
  text: '1. De instructieregel opgenomen in Artikel 6.2 , eerste lid houdt in ieder geval in dat een omgevingsplan dat betrekking heeft op locaties binnen het Natuurnetwerk Nederland geen regels bevat die activiteiten toestaan die: a. nadelige gevolgen kunnen hebben voor de wezenlijke kenmerken en waarden van het natuurnetwerk Nederland, bedoeld in Bijlage XI Wezenlijke kenmerken en waarden ; of b. kunnen leiden tot een vermindering van de kwaliteit, de oppervlakte of de samenhang van het natuurnetwerk Nederland. 2. In een omgevingsplan kan uitsluitend van het eerste lid worden afgeweken om nieuwe activiteiten of wijziging van bestaande activiteiten mogelijk te maken als: a. sprake is van: 1. een groot openbaar belang, waarbij er geen reële alternatieven zijn die het Natuurnetwerk Nederland niet of minder aantasten; 2. een plan waarop de meerwaardebenadering wordt toegepast; of 3. een beperkte wijziging, waarbij die wijziging of toevoeging noodzakelijk is voor de instandhouding van de bestaande
    activiteiten; b. nadelige gevolgen voor het Natuurnetwerk Nederland door deze nieuwe activiteiten of deze wijziging van bestaande activiteiten zoveel mogelijk worden voorkomen, door deze in het omgevingsplan alleen mogelijk te maken op een locatie waar het Natuurnetwerk Nederland zo beperkt mogelijk kan worden aangetast en door het toegestane ruimtebeslag, de toegestane bebouwing en het toegestane gebruik zoveel mogelijk te beperken; c. de aantasting tijdig wordt gecompenseerd en de te realiseren compenserende maatregelen, zowel ontwikkeling, instandhouding en beheer, voldoende zijn verzekerd; d. de motivering van het omgevingsplan een onderbouwing bevat waaruit blijkt dat aan deze voorwaarden is voldaan; en e. de tijdige realisatie van de compenserende maatregelen zeker wordt gesteld door in de regels van het omgevingsplan een voorwaardelijke verplichting op te nemen waarin is bepaald dat deze maatregelen zo spoedig mogelijk, maar in ieder geval gegarandeerd binnen 3 jaar na de nieuwe
    activiteit of de gewijzigde bestaande activiteiten, zijn uitgevoerd en daarna in stand worden gehouden. 3. In afwijking van het eerste lid kan een omgevingsplan dat betrekking heeft op locaties binnen de Militaire terreinen of terreinen met militaire objecten binnen het Natuurnetwerk Nederland regels bevatten die terreinverharding of bouwactiviteiten toestaan, mits is verzekerd dat nadelige gevolgen voor het Natuurnetwerk Nederland tijdig worden gecompenseerd. 4. Onder de oppervlakte van het Natuurnetwerk Nederland bedoeld in het eerste lid wordt in ieder geval niet de bestaande legale bebouwing, en de daaraan direct grenzende strook grond die bestaand en legaal is ingericht ten dienste van die bebouwing, en bestaande legale halfverhardingen of verhardingen begrepen. 5. Voor zover een locatie binnen de Waardevolle Houtopstanden - oude bosgroeiplaatsen binnen het Natuurnetwerk Nederland ligt, geldt voor die locatie de instructieregel opgenomen in Artikel 6.13 van deze verordening. 6.
    De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.1__subsec_6.1.2__art_6.3
