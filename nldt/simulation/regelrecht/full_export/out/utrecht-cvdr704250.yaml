- number: '2.15'
  text: 1. Een omgevingsplan dat betrekking heeft op locaties binnen het Waterbergingsgebied bevat geen regels die ontwikkelingen in de fysieke leefomgeving toestaan die in strijd zijn met de waterbergingsfunctie, tenzij die ontwikkelingen plaatsvinden op basis van bestaande uitbreidingsrechten ter plaatse van de al aanwezige functies. 2. De motivering van een omgevingsplan bevat een beschrijving van het door de gemeente te voeren beleid ter zake en de wijze waarop met het waterbergingsbelang is omgegaan.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.2__subsec_2.2.1__art_2.15
