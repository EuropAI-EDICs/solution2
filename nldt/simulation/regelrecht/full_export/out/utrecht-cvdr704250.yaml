- number: '4.72'
  text: De regels in deze afdeling zijn gesteld met het oog op de doelmatige uitoefening van taken en bevoegdheden voor infrastructuur en waterstaatswerken.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.8__art_4.72
- number: '4.73'
  text: 'Het verbod in artikel 5.1 van de wet geldt, in afwijking van artikel 16.7 van het Besluit activiteiten leefomgeving, niet voor een ontgrondingsactiviteit in het kader van: a. het ontgronden, aanleggen, verbeteren, onderhouden of wijzigen van wegen, spoorwegen of andere grote infrastructurele werken als: 1. de activiteit plaatsvindt door of vanwege het Rijk, de provincie, een gemeente of een waterschap; 2. de grondlagen dieper dan 3 meter onder het maaiveld niet worden ontgraven; en 3. de activiteit plaatsvindt ter uitvoering van een omgevingsplan. b. het aanleggen, veranderen of verwijderen van een waterstaatswerk door of namens de waterbeheerder als de grondlagen dieper dan 2 meter onder het oorspronkelijke maaiveld ongemoeid blijven. c. het uitvoeren van een maatregel uit een omgevingsplan, projectbesluit of omgevingsvergunning voor een omgevingsplanactiviteit als de grondlagen dieper dan 2 meter onder het oorspronkelijke maaiveld ongemoeid blijven.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.8__art_4.73
- number: '5.1'
  text: Deze afdeling is van toepassing op nieuwe functies voor energie uit wind, zon en biomassa.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_5__subchp_5.1__art_5.1
- number: '5.2'
  text: In afwijking van Artikel 9.3 kan een omgevingsplan verstedelijking in het Landelijk gebied toestaan om nieuwe functies voor energie en transformatorstations mogelijk te maken.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_5__subchp_5.1__art_5.2
- number: '5.3'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied kleine windturbine kan regels bevatten die de realisatie van een windturbine tot een ashoogte van 20 meter toestaat onder de voorwaarde dat de windturbine wordt geplaatst op of in aansluiting op bestaande bouwperceel. 2. In afwijking van het eerste lid kan een omgevingsplan regels bevatten die de realisatie van een windturbine tot een ashoogte van 30 meter toestaat als dat noodzakelijk is om volledig of bijna volledig in eigen energiebehoefte van de bestaande bouwwerken te voorzien. 3. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt: a. dat aan de genoemde voorwaarden is voldaan; en b. dat de energieopbrengst van die windturbine opweegt tegen de impact die de turbine heeft op de omgeving.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_5__subchp_5.1__art_5.3
  machine_readable:
    endpoint: kleine_windturbine_bestaand_bouwperceel
    competent_authority:
      name: Bevoegd gezag omgevingsplan (gemeente binnen het Gebied kleine windturbine)
      type: CATEGORY
