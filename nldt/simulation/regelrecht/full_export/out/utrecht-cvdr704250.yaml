- number: '5.5'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied zonneveld kan regels bevatten die de realisatie van opwekking van zonne-energie toestaan door middel van zonnevelden , mits is voldaan aan de volgende voorwaarden: a. de structuren in het landschap herkenbaar blijven en voorzien wordt in een goede landschappelijke inpassing; b. de zonnepanelen in een opstelling worden geplaatst die ruimte biedt voor een bij het gebied passende bodemkwaliteit en waterkwaliteit; en c. voorzien wordt in een opruimplicht na beëindiging van de activiteit. 2. De motivering van een omgevingsplan bevat: a. een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan; b. een beeldkwaliteitsparagraaf ; c. een beschrijving van hoe de omwonenden en andere stakeholders in de planvorming zijn betrokken; en d. een beschrijving van het door de gemeente te voeren beleid inzake de mogelijkheden voor kavelruil vanwege het behouden en verbeteren van een goede landbouwstructuur.'
