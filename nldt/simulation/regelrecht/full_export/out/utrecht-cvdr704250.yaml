          subject: $in_gebied_cultuurhistorische_hoofdstructuur
          value: true
- number: '7.10'
  text: '1. In afwijking van Artikel 9.3 kan een omgevingsplan verstedelijking toestaan in de Historische buitenplaatszone en het Gebied militair erfgoed , onder voorwaarde dat de verstedelijking : a. kleinschalig is; b. gericht is op het creëren van economische kostendragers ten behoeve van het behoud, herstel of de versterking, of een combinatie hiervan, van de cultuurhistorische waarde van de Historische buitenplaatszone dan wel het Gebied militair erfgoed ; en c. zorgvuldig wordt ingepast in de omgeving. 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.1__subsec_7.1.2__art_7.10
- number: '7.11'
  text: 'Het Landschap bestaat uit: a. het Landschap Eemland ; b. het Landschap Gelderse Vallei ; c. het Landschap Groene Hart ; d. het Landschap Rivierengebied ; en e. het Landschap Utrechtse Heuvelrug .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.2__subsec_7.2.1__art_7.11
- number: 7.11a
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen een Landschap bevat: a. regels ter bescherming van de voorkomende kernkwaliteiten; en b. geen regels die nieuwe activiteiten toestaan die de kernkwaliteiten onevenredig aantasten. 2. De kernkwaliteiten zijn per gebied vastgelegd in de Bijlage XVI Kernkwaliteiten landschap . 3. De motivering van een omgevingsplan bevat: a. een beschrijving van de voorkomende kernkwaliteiten; en b. de wijze waarop met de bescherming van de kernkwaliteiten is omgegaan.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.2__subsec_7.2.1__art_7.11a
  machine_readable:
    endpoint: art_7_11a
