- number: '9.11'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Landelijk gebied kan regels bevatten die toestaan dat op agrarische bedrijfspercelen waar het agrarisch gebruik is beëindigd de bedrijfswoning en overige bedrijfsgebouwen een stedelijke functie , niet zijnde wonen, krijgen, mits is voldaan aan de volgende voorwaarden: a. het bouwperceel is niet optimaal gesitueerd en uitgerust voor de grondgebonden landbouw of, in het geval van een glastuinbouwbedrijf, het bouwperceel ligt niet in een Concentratiegebied glastuinbouw ; b. door sloop wordt de oppervlakte van de fysiek aanwezige bebouwing met 50% gereduceerd, waarbij te behouden historisch waardevolle of karakteristieke bebouwing niet in de berekening wordt betrokken, tenzij: 1. het gaat om een nieuwe functie die voorziet in een kleinschalige woonzorgvoorziening ; of 2. het gaat om een nieuwe functie die bijdraagt aan recreatieve beleving of recreatief gebruik waaraan in het gebied nadrukkelijk behoefte bestaat; 3. het
    gaat om de hervestiging van één of enkele bedrijven die op hun oorspronkelijke locatie een ruimtelijk obstakel vormden of de kwaliteit van de leefomgeving ernstig aantasten en die op de nieuwe locatie, nabij de kern, goed inpasbaar zijn; 4. het gaat om vestiging van bedrijven die vanwege hun werkzaamheden met zwaar rijdend materieel zich voornamelijk richten op het landelijk gebied; 5. er is sprake van 2 of meer bouwpercelen waar de agrarische functie is beëindigd en op de betrokken bouwpercelen gezamenlijk wordt het vereiste slooppercentage van 50% wel gehaald; of 6. de ruimtelijke kwaliteit wordt op een andere wijze verhoogd dan alleen door sloop van bebouwing, in een mate die een lager slooppercentage dan 50% rechtvaardigt; c. te handhaven en nieuw op te richten bedrijfsgebouwen worden zo compact mogelijk gesitueerd binnen het voormalige bouwperceel en het bouwperceel wordt evenredig met de oppervlakte gesloopte gebouwen verkleind; d. de bestaande cultuurhistorische, landschappelijke
    en natuurwaarden worden behouden; en e. de omliggende agrarische bedrijven worden niet in hun bedrijfsvoering belemmerd. 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
