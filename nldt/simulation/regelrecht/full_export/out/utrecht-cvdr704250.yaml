- number: '9.30'
  text: '1. Deze paragraaf is van toepassing op activiteiten waardoor de ervaring van de natuurlijke geluiden in het Stiltegebied kan worden verstoord. 2. Het eerste lid is niet van toepassing op: a. de uitoefening van land-, tuin- of bosbouw of beroepsmatige visserij; b. de aanleg, het onderhoud of de exploitatie van kabels en buisleidingen voor het transport van energie of voor de openbare drinkwatervoorziening, met inbegrip van toestellen noodzakelijk voor dat transport en voorzieningen voor de directe aansluiting van eindgebruikers in de nabije omgeving; c. de aanleg, het onderhoud of de exploitatie van infrastructurele werken en telecommunicatiewerken; d. de bouw of het onderhoud van gebouwen; en e. de bescherming, het onderhoud of het beheer van het gebied, inclusief dijkwerkzaamheden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.4__subsec_9.4.2__art_9.30
- number: '9.31'
  text: '1. Degene die een activiteit uitvoert en weet of redelijkerwijs kan vermoeden dat die activiteit nadelige gevolgen kan hebben voor het Stiltegebied , is verplicht: a. alle maatregelen te nemen die redelijkerwijs van diegene kunnen worden gevraagd om die gevolgen te voorkomen; b. voor zover deze niet kunnen worden voorkomen: die gevolgen zoveel mogelijk te beperken of ongedaan te maken; en c. als die gevolgen onvoldoende kunnen worden beperkt: die activiteit achterwege te laten voor zover dat redelijkerwijs van diegene kan worden gevraagd. 2. Voor activiteiten in het Stiltegebied houdt deze plicht in ieder geval in dat: a. alle passende preventieve maatregelen tegen verstoring van het stiltegebied worden getroffen; b. de beste beschikbare technieken worden toegepast; en c. geen significante verstoring wordt veroorzaakt.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.4__subsec_9.4.2__art_9.31
- number: '9.32'
  text: 'Het is verboden zonder omgevingsvergunning in een Stiltegebied de volgende activiteiten uit te voeren: a. een muziekinstrument of ander vergelijkbaar geluidapparaat te gebruiken, tenzij het geluidniveau op een afstand van 50 meter van de activiteit minder dan LAeq,1h = 35 dB(A) bedraagt; b. een motorrijtuig te gebruiken buiten de openbare weg, voor bestemmingsverkeer openstaande wegen, en andere locaties met de functie Verkeer, tenzij het gaat om het gebruik van een motorrijtuig: 1. bij het houden van toezicht op de naleving van publiekrechtelijke regels; 2. door een persoon met een opsporingsbevoegdheid in de uitoefening van zijn functie; 3. voor de openbare veiligheid of de afwending van dreigend gevaar; 4. voor het vervoer van een mindervalide in een gehandicaptenvoertuig; 5. bij het rijden naar en parkeren op een tijdelijk parkeerterrein met maximaal 30 parkeerplaatsen voor personenvoertuigen; of 6. bij het parkeren, bedoeld in Artikel 3.8 ; c. een vaartuig te gebruiken, tenzij
    het gaat om gebruik van een vaartuig: 1. met een snelheid van minder dan 12 kilometer per uur; 2. zonder verbrandings- of explosiemotor; 3. voor de openbare veiligheid of de afwending van dreigend gevaar; 4. bij het houden van toezicht op de naleving van publiekrechtelijke regels; of 5. voor de uitoefening van een functie met opsporingsbevoegdheid; d. vuurwerk te gebruiken, tenzij het gaat om: 1. het gebruik van vuurwerk dat noodzakelijk is voor het oproepen van personen; 2. het gebruik van vuurwerk voor het afwenden van dreigend gevaar; of 3. het gebruik van consumentenvuurwerk in de Bufferzone stiltegebied op een afstand van minder dan 50 meter van het eigen woonhuis, ter gelegenheid van de jaarwisseling gedurende de in het Vuurwerkbesluit aangewezen periode; e. een airgun of ander knalapparatuur te gebruiken; f. een motorisch aangedreven werktuig met bijbehorende transportmiddelen te gebruiken voor seismologisch onderzoek, opsporingsonderzoek naar of ontginning van bodemstoffen. g.
    een omroepinstallatie, sirene, hoorn of ander vergelijkbaar toestel bestemd voor het versterken of voortbrengen van geluid te gebruiken, tenzij het gaat om gebruik voor: 1. de openbare veiligheid of de afwending van dreigend gevaar; 2. het houden van toezicht op de naleving van publiekrechtelijke regels; of 3. de uitoefening van een functie met opsporingsbevoegdheid; h. een modelvliegtuig, modelboot, modelauto of onbemande luchtvaartuigsystemen, UAS, te gebruiken, tenzij het gaat om: 1. een modelvliegtuig, modelboot of modelauto zonder een verbrandingsmotor; of 2. het gebruik van onbemande luchtvaartuigsystemen, UAS, voor de openbare veiligheid of de afwending van dreigend gevaar, het houden van toezicht op de naleving van publiekrechtelijke regels, of de uitoefening van een functie met opsporingsbevoegdheid; i. een vuurwapen te gebruiken, tenzij het gaat om gebruik door een persoon met een opsporingsbevoegdheid in de uitoefening van zijn functie, of in geval van nood; j. een toertocht
    voor motorrijtuigen te houden, tenzij het gaat om een toertocht met elektrisch aangedreven motorrijtuigen; k. een motorrijtuig of vaartuig proef te draaien, tenzij het gaat om proefdraaien van een eigen motorrijtuig of vaartuig bij een woning; en l. activiteiten met een toestel anders dan, bedoeld onder a. tot en met k. uit te voeren.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.4__subsec_9.4.2__art_9.32
- number: '9.33'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een activiteit binnen het Gebied stille kern , wordt de omgevingsvergunning alleen verleend voor zover: a. zwaarwegende maatschappelijke belangen daartoe dwingen; b. alternatieven buiten het Gebied stille kern ontbreken; c. de activiteit op kaart Gebied bestaand evenement of activiteit staat; en d. rekening wordt gehouden met de doelstelling van artikel 9.26 .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.4__subsec_9.4.2__art_9.33
- number: '9.34'
  text: 1. Voor niet-plaatsgebonden activiteiten kunnen maximaal 12 omgevingsvergunningen per kalenderjaar worden verleend, elk met een tijdsduur van maximaal 24 uur. 2. Bij de verlening van een vergunning voor een milieubelastende activiteit op grond van hoofdstuk 3 van het Besluit activiteiten leefomgeving wordt rekening gehouden met de doelstelling van Artikel 9.26 . 3. Bij het stellen van maatwerkvoorschriften op grond van het Besluit activiteiten leefomgeving wordt rekening gehouden met de doelstelling van Artikel 9.26 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.4__subsec_9.4.2__art_9.34
- number: '9.35'
  text: 'In aanvulling op de aanvraagvereisten in de wet worden bij een aanvraag om een omgevingsvergunning voor een activiteit in een stiltegebied, bedoeld in Artikel 9.32 , minimaal de volgende gegevens en bescheiden verstrekt: a. een beschrijving van de activiteit, de locatie, de datum en tijd van de activiteit; b. voor zover relevant een plattegrond van de activiteit; c. de aard van het geluid en de mogelijkheden het geluid te beperken; d. de motivering van de keuze voor de locatie, onderzochte alternatieve locaties en bezwaren daartegen; e. als de locatie binnen het Gebied stille kern is gelegen: of het een activiteit betreft, bedoeld in artikel 9.32 , of een beschrijving van het maatschappelijk belang van de activiteit; en f. mogelijk samenhangende besluiten.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.4__subsec_9.4.2__art_9.35
- number: '9.36'
  text: Een afschrift van een verleende vergunning wordt toegezonden aan de gemeente of gemeenten waarbinnen Stiltegebied ligt.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.4__subsec_9.4.2__art_9.36
- number: '9.37'
  text: a. Gedeputeerde staten plaatsen op of bij de grenzen van stiltegebieden borden langs alle openbare wegen, paden en vaarwegen die toegang geven tot een Stiltegebied of die daaraan grenzen. b. Bijlage IV Modelborden bevat het model voor dat bord.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.4__subsec_9.4.3__art_9.37
- number: '10.1'
