- number: '9.19'
  text: '1. Een omgevingsplan laat uitsluitend nieuwvestiging van zelfstandige kantoren toe, voor zover dit betrekking heeft op: a. zelfstandige kantoren met een lokaal vestigingsgebied, voor zover deze niet gevestigd kunnen worden in gerealiseerde gebouwen of binnen plancapaciteit op basis van het vigerende omgevingsplan; b. een eenmalige uitbreiding van gerealiseerde kantoren met maximaal 10% van het bestaande bvo van het gebouw, voor zover deze niet gerealiseerd kan worden op basis van het omgevingsplan; of c. transformatie naar zelfstandige kantoren tot een maximum bvo van 1.500 m2 per gebouw. 2. Voor zover een omgevingsplan onbenutte plancapaciteit voor zelfstandige kantoren bevat, wordt deze uitsluitend in stand gelaten als er sprake is van: a. een verleende vergunning voor een zelfstandig kantoor ; b. een ontvankelijke aanvraag om een vergunning voor een zelfstandig kantoor die voor terinzagelegging van het ontwerp omgevingsplan is ingediend; c. behoefte aan zelfstandige kantoren,
    waarbij in de behoeftebepaling rekening wordt gehouden met de geraamde vraag naar kantoren binnen een redelijke termijn en het actuele aanbod van kantoren in bestaande panden; d. zicht op realisatie van zelfstandige kantoren met een lokaal vestigingsgebied, voor zover deze niet gevestigd kunnen worden in gerealiseerde gebouwen; e. uitbreidingsmogelijkheden voor zelfstandige kantoren bedoeld onder a en b of reeds gerealiseerde kantoren; of f. zelfstandige kantoren die voorzien zijn ter plaatse van bestaande gebouwen met een andere functie, tot een maximum bvo van 1500 m2 per gebouw. 3. Het eerste en tweede lid zijn niet van toepassing op een locatie binnen het Gebied Kantoor op knooppunt Utrecht Centraal en het Gebied Kantoor op knooppunt Leidsche Rijn Centrum mits de behoefte aan kantoren is aangetoond. 4. Tot 1 januari 2029 zijn het eerste en tweede lid op locaties binnen de Reductielocaties niet van toepassing op delegatiebesluiten bedoeld in artikel 2.8 van de wet , alsmede het besluit
    tot verlenen van een omgevingsvergunning voor een omgevingsplanactiviteit afwijken van de binnenplanse regels van het omgevingsplan, waar ingevolge het Inpassingsplan Kantoren nog plancapaciteit voor zelfstandige kantoren aanwezig is. 5. Een omgevingsplan dat betrekking heeft op locaties binnen de Reductielocaties kan de verplaatsing van plancapaciteit voor zelfstandige kantoren toelaten, mits gelijktijdig binnen dezelfde locatie reductie plaatsvindt van minimaal hetzelfde bvo voor zelfstandige kantoren op een onbebouwd perceel. 6. Een omgevingsplan dat betrekking heeft op locaties binnen de Gebiedstransformatie of herstructurering kan regels bevatten voor verplaatsing van bestaande plancapaciteit voor zelfstandige kantoren, mits is voldaan aan de volgende voorwaarden: a. verplaatsing van bestaande plancapaciteit voor zelfstandige kantoren naar een ander bouwperceel binnen de locatie is noodzakelijk voor gebiedstransformatie of herstructurering; b. het bvo voor zelfstandige kantoren
    op het nieuwe bouwperceel is ten hoogste gelijk aan het bvo op basis van de maximale gebruiksmogelijkheden van het te verlaten bouwperceel; c. het betreft geen bestaande plancapaciteit voor een voormalig zelfstandig kantoor dat is getransformeerd in een andere functie; en d. gelijktijdig met de verplaatsing van plancapaciteit worden de gebruiksmogelijkheden voor zelfstandige kantoren op het te verlaten bouwperceel beëindigd. 7. Een ondergeschikt kantoor wordt zoveel mogelijk gerealiseerd bovenop bebouwing die feitelijk reeds aanwezig is en niet als kantoor wordt gebruikt. 8. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
