- number: '4.48'
  text: '1. Voor zover een omgevingsplan betrekking heeft op locaties binnen het Beperkingengebied lokale spoorweg bevat het regels voor bestaande gebouwen die getransformeerd worden tot geluidgevoelige gebouwen mits zij een binnenwaarde van maximaal 33 dB Lden hebben. 2. Voor zover een omgevingsplan betrekking heeft op locaties binnen het Beperkingengebied lokale spoorweg : a. zijn nieuwe geluidgevoelige gebouwen in buiten de bebouwde kom toegestaan tot een geluidbelasting van maximaal 60 dB Lden op de gevel; en b. nieuwe geluidgevoelige gebouwen binnen de bebouwde kom toegestaan tot een geluidbelasting van 65 dB Lden op de gevel. 3. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat wordt voldaan aan: a. de voorwaarden in het eerste en tweede lid; en b. er maatregelen worden genomen om de hinder van geluid, trillingen, elektromagnetische straling of emissies van koper- of ijzerslijpsel, veroorzaakt door de lokale spoorweg, nu en in de toekomst te voorkomen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.3__subsec_4.3.2__art_4.48
