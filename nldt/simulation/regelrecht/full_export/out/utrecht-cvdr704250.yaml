- number: '7.4'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied UNESCO Werelderfgoed Neder-Germaanse Limes (bufferzone) bevat regels ter instandhouding en versterking van de uitzonderlijke universele waarde van de Neder-Germaanse Limes. 2. Als uitzonderlijke universele waarde van de Neder-Germaanse Limes gelden de kernkwaliteiten, bedoeld in de Bijlage XV . 3. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied UNESCO Werelderfgoed Neder-Germaanse Limes (bufferzone) bevat in ieder geval een verbod op het zonder omgevingsvergunning uitvoeren van activiteiten met een oppervlakte van 100 m2 of meer, waarbij de bodem tot meer dan 30 centimeter onder maaiveld wordt geroerd. 4. De oppervlakte- en dieptemaat kunnen zowel naar boven als naar beneden worden bijgesteld, voor zover archeologische gegevens hier aanleiding toe geven en de bijstelling ondersteund wordt door een motivering, opgesteld door een archeologisch deskundige. 5. Het archeologisch onderzoek en
    ex-situ behoud in de vorm van een opgraving wordt uitgevoerd conform de geldende kwaliteitsregels in de Nederlandse archeologie, door een daartoe op grond van artikel 5.3 Erfgoedwet gecertificeerd bedrijf. 6. De motivering van een omgevingsplan bevat: a. een beschrijving van de in de directe omgeving van het plangebied aanwezige uitzonderlijke universele waarde van de Neder-Germaanse Limes; en b. een beschrijving en motivering van de wijze waarop die waarde wordt beschermd.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.1__subsec_7.1.1__art_7.4
