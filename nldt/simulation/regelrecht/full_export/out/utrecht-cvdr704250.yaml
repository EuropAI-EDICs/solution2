- number: '6.5'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen de Groene contour bevat geen regels die activiteiten toestaan die de mogelijkheid om nieuwe natuur te realiseren op die gronden beperken waardoor deze gronden niet meer of in mindere mate kunnen bijdragen aan uitbreiding en versterking van het natuurnetwerk Nederland . 2. In afwijking van het eerste lid, kan een omgevingsplan regels bevatten die voorzien in nieuwe activiteiten of die wijziging van bestaande activiteiten mogelijk maken als: a. sprake is van groot openbaar belang; b. reële alternatieven die een verlies aan mogelijkheden om nieuwe natuur te realiseren voorkomen of beperken, ontbreken; c. het verlies aan mogelijkheden om nieuwe natuur te realiseren, zoveel mogelijk wordt beperkt; d. het overblijvende verlies aan mogelijkheden om nieuwe natuur te realiseren wordt gecompenseerd met de realisatie van nieuwe natuur binnen de Groene contour met een oppervlakte van minimaal de oppervlakte van het verlies aan mogelijkheden
    om nieuwe natuur te realiseren. 3. Het eerste lid is niet van toepassing op de uitbreiding van agrarische bouwblokken. 4. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
