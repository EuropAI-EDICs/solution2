- number: '9.18'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Stedelijk gebied kan regels bevatten voor bedrijventerreinen mits is voldaan aan de volgende voorwaarden: a. de uitbreiding bedrijventerrein past in het door gedeputeerde staten vastgestelde programma Wonen en werken of de uitbreiding bedrijventerrein is een kleinschalige ontwikkeling tot 1 hectare netto per bedrijventerrein , waarbij een gemeente in totaal 1 tot en met 3 hectare netto per 10 jaar kan toevoegen op basis van de bestaande omvang van het huidige bedrijventerreinenareaal in een gemeente: 1. maximaal 3 hectare per 10 jaar voor gemeente Utrecht, gemeente Vijfheerenlanden, gemeente Nieuwegein, gemeente Amersfoort, gemeente Veenendaal, gemeente Woerden, gemeente De Ronde Venen, gemeente Bunschoten; 2. maximaal 2 hectare per 10 jaar voor gemeente Soest, gemeente Houten, gemeente Zeist, gemeente Leusden, gemeente Stichtse Vecht, gemeente IJsselstein, gemeente Bunnik, gemeente Montfoort, gemeente Woudenberg,
    gemeente Wijk bij Duurstede; 3. maximaal 1 hectare per 10 jaar voor gemeente Rhenen, gemeente Utrechtse Heuvelrug, gemeente de Bilt, gemeente Lopik, gemeente Renswoude, gemeente Baarn, gemeente Oudewater, gemeente Eemnes. b. de revitalisering, herstructurering en efficiënter gebruik van bestaande bedrijventerreinen zijn verzekerd; c. de uitbreiding bedrijventerrein laat alleen bedrijven toe die maximaal 1 milieucategorie, of vergelijkbare gebruiksruimte voor geluid en geur, lager zijn dan de vastgelegde milieucategorie in het omgevingsplan, voor zover dit mogelijk is volgens de feitelijke milieuruimte; d. voor de uitbreiding bedrijventerrein wordt een minimum percentage aan groen-blauwe inrichting opgenomen voor het onbebouwde terrein waarbij de onverharde gronden landschappelijk worden ingepast; e. de uitbreiding bedrijventerrein leidt niet tot: 1. bedrijfskavels groter dan 5 hectare; 2. samenvoeging van kavels als hierdoor bedrijfskavels groter dan 5 hectare ontstaan; of 3. het realiseren
    of verbinden van gebouwen waardoor zij de grens van een bedrijfskavel overschrijden en er daardoor een bedrijfskavel van 5 hectare of meer ontstaat, tenzij het gaat om verplaatsing van een bedrijf dat reeds gevestigd is in de provincie en op de huidige locatie een ruimtelijk of functioneel knelpunt veroorzaakt; f. de uitbreiding bedrijventerreinen vindt plaats in aansluiting op een bestaand bedrijventerrein ; en g. de uitbreiding bedrijventerreinen leidt niet tot extra bodemdaling. 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan en dat de uitbreiding bedrijventerrein een duurzame ontwikkeling is.'
