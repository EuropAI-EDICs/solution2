- number: '9.13'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Landelijk gebied kan regels bevatten die op agrarische bedrijfspercelen waar het agrarisch gebruik is beëindigd de bouw van 1 of meerdere nieuwe woningen toestaan, mits voldaan is aan de volgende voorwaarden: a. het bouwperceel is niet optimaal gesitueerd en uitgerust voor de grondgebonden landbouw of, in geval van een glastuinbouwbedrijf, het bouwperceel ligt niet in een Concentratiegebied glastuinbouw ; b. alle bedrijfsbebouwing op de betrokken bouwpercelen wordt gesloopt, tenzij het gaat om historisch waardevolle of karakteristieke bebouwing of bedrijfswoning. De historisch waardevolle of karakteristieke bebouwing krijgt een passende functie die bijdraagt aan dat behoud. Wanneer 750 m2 tot 2.500 m2 aan bebouwing wordt gesloopt, is de bouw van 1 nieuwe woning toegestaan. Wanneer 2.500 m2 tot 4.000 m2 aan bebouwing wordt gesloopt, is de bouw van 2 woningen toegestaan. Wanneer er 4.000 m2 of meer aan bebouwing wordt
    gesloopt, is de bouw van 3 woningen toegestaan. Voor kassen geldt dat er 5.000 m2 aan bedrijfsbebouwing wordt gesloopt voor 1 woning. Afwijking van de vereiste sloopoppervlakten, het aantal te bouwen woningen en van de verplichting om het totaal aan bedrijfsbebouwing te slopen, is mogelijk mits dit leidt tot verhoging van de ruimtelijke kwaliteit; c. de nieuwe woning of woningen worden gesitueerd binnen de voormalige bouwpercelen, in samenhang met de te handhaven boerderij of bedrijfswoning, de betrokken bouwpercelen worden evenredig verkleind en de woningen worden landschappelijk goed ingepast, tenzij situering van de nieuwe woning op een andere locatie in het landelijk gebied leidt tot verhoging van de ruimtelijke kwaliteit; en d. de omliggende agrarische bedrijven worden niet in hun bedrijfsvoering belemmerd. 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
