- number: '9.23'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen de Recreatiezone bevat regels ter bescherming van de instandhouding en de bereikbaarheid van bestaande recreatieve voorzieningen. 2. In afwijking van Artikel 9.3 kan een omgevingsplan dat betrekking heeft op locaties binnen de Recreatiezone regels bevatten die voorzien in nieuwe bovenlokale recreatieve voorzieningen. 3. In afwijking van artikel 9.3 kan een omgevingsplan dat betrekking heeft op locaties binnen de Recreatiezone ten behoeve van bovenlokale recreatievoorzieningen regels bevatten die verstedelijking toestaan, mits voldaan is aan de volgende voorwaarden: a. de verstedelijking wordt in samenhang met de realisatie van de bovenlokale recreatieve voorzieningen ontwikkeld waarbij de omvang van de verstedelijking in evenwichtige verhouding staat tot de hoeveelheid extra bovenlokale recreatieve voorzieningen; en b. de tijdige realisering van de recreatievoorziening en de duurzame instandhouding daarvan is verzekerd.
    4. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan. Een integrale visie en een beeldkwaliteitsparagraaf maken onderdeel uit van de onderbouwing.'
