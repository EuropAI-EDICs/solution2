- number: '9.14'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied uitbreiding woningbouw onder voorwaarden mogelijk kan regels bevatten voor een eenmalige uitbreiding tot maximaal 50 woningen mits is voldaan aan de volgende voorwaarden: a. de eenmalige uitbreiding tot maximaal 50 woningen is noodzakelijk voor de vitaliteit van de kern; b. aangetoond is dat niet binnen de kern in de behoefte voorzien kan worden; c. de woningbouw vindt plaats in aansluiting op het Stedelijk gebied en qua aard en omvang past bij de kern; d. de woningbouw leidt niet tot extra bodemdaling; e. de woningbouw draagt bij aan een goede kwaliteit van de nieuwe kernrandzone ; f. en omliggende functies worden niet onevenredig geschaad. 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan. Een beeldkwaliteitsparagraaf maakt onderdeel uit van de onderbouwing.'
