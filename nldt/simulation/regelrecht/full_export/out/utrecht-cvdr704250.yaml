    Oude Gracht (lijst B, nrs. 24 en 25), de Vecht (lijst A, nr. 5), de Kromme Rijn ten oosten van de Waterlinieweg en de Leidsche Rijn ten westen van het Amsterdam-Rijnkanaal B&W van Utrecht B&W van Utrecht 3 Insteekhaven B&W van Amersfoort B&W van Amersfoort Zoogdieren Aardmuis Bosmuis Dwergmuis Dwergspitsmuis Egel Gewone bosspitsmuis Huisspitsmuis Ondergrondse woelmuis Ree Rosse woelmuis Tweekleurige bosspitsmuis Veldmuis Vos Woelrat Amfibieën Bruine kikker Gewone pad Kleine watersalamander Meerkikker Middelste groene kikker of Bastaardkikker De wezenlijke kenmerken en waarden (WKW) omvatten de actuele en potentiële natuurwaarden van het NNN en de daarvoor vereiste bodem- en watercondities. De WKW zijn opgesteld met als doel het beschermen, in stand houden, verbeteren en ontwikkelen van de natuur, mede vanwege de intrinsieke waarde, en het behouden en herstellen van de biologische diversiteit. De WKW worden per deelgebied beschreven aan de hand van: a. de aanwezige ecosystemen (waaronder
    biotopen en habitats), b. de potenties, c. de robuustheid van het systeem inclusief de verbindingsfunctie voor soorten, d. bijzondere soorten; en e. de abiotische en ruimtelijke condities die deze soorten en ecosystemen nodig hebben De in het rapport ‘ Uitwerking van de Wezenlijke kenmerken en Waarden van het NNN ’ (hierna het rapport) onder de paragrafen ‘Wezenlijke kenmerken en waarden’, ‘potentiële waarden’ en ‘abiotische en ruimtelijke condities’ opgenomen kenmerken en waarden moeten in ieder geval worden beschouwd als wezenlijk. Voordat een nieuw omgevingsplan wordt vastgesteld is aanvullend op de uitwerkingen in dit rapport een (veld-)onderzoek ter plekke noodzakelijk. In het onderzoek moet in beeld worden gebracht wat de feitelijke situatie in het veld is, waarbij in ieder geval de kenmerken en waarden beschreven in het rapport worden betrokken. En ook moet het onderzoek ingaan op het vóórkomen van, en de functionaliteit van het leefgebied voor, soorten op de rode lijsten, wettelijk
    beschermde soorten en Utrechtse aandachtssoorten en het functioneren van beheertypen en potentiële natuurwaarden. De in het rapport benoemde kansen en knelpunten behoren niet tot de WKW maar kunnen benut worden voor de verbetering van het NNN (bijvoorbeeld in het geval van de toepassing van de meerwaardebenadering). In het rapport wordt ook ingegaan op vervangbaarheid van natuur. Hier moet rekening mee gehouden worden in het geval dat compensatie aan de orde is. 1. Als er sprake is van aantasting van een natuurtype worden bij compensatie onderstaande toeslagen gehanteerd. In het geval van de uitzondering groot openbaar belang, geldt dat: a. de oppervlakte van de te realiseren compensatie is minimaal net zo groot als de oppervlakte natuur die verloren gaat; en b. het aantal natuurpunten van de te realiseren compensatie is groter dan of gelijk aan het aantal natuurpunten van de aantasting (opgave). In het geval van uitzondering meerwaardebenadering geldt dat in totaliteit sprake moet zijn
    van een aantoonbare versterking van het natuurnetwerk Nederland op alle aspecten (wezenlijke kenmerken en waarde, oppervlakte en samenhang) die aantoonbaar is en bovendien binnen 10 jaar moet kunnen bereikt. Onderstaande toeslagen voor oppervlakte natuurtypen, moeten hierin in ieder geval bij worden betrokken. 2. Het aantal natuurpunten voor het aantal hectares dat wordt aangetast, wordt berekend volgens de formule: Npopg = A1*(1,0+Tt1)*(1,0+Tn1) + A2*(1,0+Tt2)*(1,0+Tn2)+ A3*(1,0+Tt3) enz. waarbij wordt verstaan onder: Npopg: natuurpunten compensatieopgave; A1: de oppervlakte met het beheertype 1; A2: de oppervlakte met het beheertype 2; A3: de oppervlakte met het beheertype 3; Tt1: de toeslag voor de hersteltijd van het beheertype 1 dat wordt aangetast, bepaald op basis van tabel 3; Tt2: de toeslag voor de hersteltijd van het beheertype 2 dat wordt aangetast, bepaald op basis van tabel 3; Tt3: de toeslag voor de hersteltijd van het beheertype 3 dat wordt aangetast, bepaald op basis
    van tabel 3; Tn1: de toeslag voor het beheertype 1, bepaald op basis van tabel 1 en 2; Tn2: de toeslag voor het beheertype 2, bepaald op basis van tabel 1 en 2; en Tn3: de toeslag voor het beheertype 3, bepaald op basis van tabel 1 en 2. 3. Het aantal natuurpunten voor de te realiseren compensatie wordt berekend volgens de formule: Npcomp = A11*(1,0+Tn11)+A12*(1,0+Tn12)+A13*(1,0+Tn13) enz. waarbij wordt verstaan onder: Npcomp: natuurpunten te realiseren compensatie; A11: de te realiseren oppervlakte met het beheertype 11; A12: de te realiseren oppervlakte met het beheertype 12; A13: de te realiseren oppervlakte met het beheertype 13; Tn1: de toeslag voor het te realiseren beheertype 11, bepaald op basis van tabel 1 en 2; Tn2: de toeslag voor het te realiseren beheertype 12, bepaald op basis van tabel 1 en 2; en Tn3: de toeslag voor het te realiseren beheertype 13, bepaald op basis van tabel 1 en 2. Tabel 1. Inleiding natuurbeheertypen in klassen naar (natuur)waarde die de provincie daaraan
    toekent in het kader van NNN-compensatie K lasse 1 hoogste waardering N0.6.01 veenmoerasrietland en moerasheide; N06.04 vochtige heide; N06.05 zwakgebufferd ven; N10.01 nat schraalland en N11.01 droog schraalgrasland Klasse 2 ''midden''-waardering N04.01 kranswierwater; N05.01 moeras; N06.06 zuur ven of hoogveenven; N07.01 droge heide; N.07.02 zandverstuiving; N10.02 vochtig hooiland; N12.05 kruiden- en faunarijke akker; N12.03 glanshaverhooiland en N13.01 vochtig weidevogel grasland Klasse 3 laagste waardering Overige natuurbeheertypen Tabel 2. Toeslag per ha per klasse van het natuurbeheertype dat verloren gaat (Tn) Natuurbeheertypen Toeslag per hectare Klasse 1 0,6 Klasse 2 0,3 Klasse 3 0 Tabel 3. Toeslag per ha voor de hersteltijd, de tijd dat het natuurbeheertype dat verloren gaat, ter plaatste aanwezig is geweest (Tt) Hersteltijd in jaren Toeslag per hectare 0 jaar 0 < 10 jaar 0,1 10-25 jaar 0,3 25-50 jaar 0,5 50-100 jaar 0,75 100-200 jaar 1,0 > 200 jaar 1,5 Koersdocument Eiland
    van Schalwijk Wie over het Eiland van Schalkwijk rijdt, vaart of wandelt, ervaart Nederland zoals het ooit bedoeld was. Het Eiland van Schalkwijk is een open en groen gebied ten zuiden van de kern Houten. Het wordt aangeduid als eiland omdat het vrijwel geheel wordt omsloten door water, het Amsterdam-Rijnkanaal, de Lek en het Lekkanaal. De overige grenzen worden gevormd door de gemeentegrens van Houten. Het eiland kent een prachtig en gaaf cultuurlandschap. Het heeft unieke ruimtelijke kwaliteiten, die van betekenis zijn voor het eiland zelf, maar ook voor de omgeving. Zo heeft het eiland sterke landschappelijke en cultuurhistorische kwaliteiten en een sterke agrarische identiteit en grondgebruik. Het eiland kent fruitteelt en bosschages, maar bovenal kent het eiland uitgestrekte vlakten weidelandschap met een onaangetaste cope-verkavelingsstructuur uit de 17e eeuw. Dit areaal aan weidelandschap maakt het eiland zeer geschikt voor melkveehouderij. De landbouw is dan ook de belangrijkste
    economische drager en landschapsbeheerder. Over het eiland loopt een gave lintstructuur met boerderijen, woonhuizen, kleinschalige bedrijvigheid en lokale voorzieningen. Deze mix van functies hoort bij de dorpscultuur en -identiteit in de beide kernen Schalkwijk en Tull en ''t Waal. Net als de sterke sociale cohesie en het actieve verenigingsleven. Unieke kwaliteiten zijn het feit dat de Nieuwe Hollandse Waterlinie in noord-zuid richting over het eiland loopt en tevens de ligging aan de Lek. Juist het feit dat het eiland omringd is door water met een gering aantal verbindingen met de omgeving heeft ertoe geleid dat de oorspronkelijke kwaliteiten anno 2010 vrijwel onaangetast zijn. Het is dit landschap dat midden in een dynamische stedelijke omgeving ligt: het Utrechtse stadsgewest en in de economische as Amsterdam - Eindhoven. In de op één na dichtst bevolkte provincie van Nederland, is het eiland van Schalkwijk, met ongeveer 10 inwoners per hectare, één van de dunst bevolkte gebieden.
    In de structuurvisie Randstad 2040 maakt het eiland onderdeel uit van een zoeklocatie voor nieuwe groenblauwe toplocaties. Mede op basis van de Ontwikkelingsvisie NV Utrecht, is dit overgenomen in de Gebiedsagenda Utrecht 2009. De kansen voor het realiseren van een Randstedelijke groene long zijn hier groot. De daadwerkelijke invulling echter is nog ver weg. Het vormgeven van een groenblauw gebied met Randstedelijke betekenis in een gebied met hoge verstedelijkingsdruk is een formidabele opgave. In de Intentieverklaring van de provincie Utrecht en de gemeente Houten hebben partijen afgesproken dat zij samenwerken om de kwaliteiten van het gebied duurzaam in stand te houden. De Houtense rapportages ''Plannenatlas Eiland van Schalkwijk'' en ''Bouwstenen Kadernota Eiland van Schalkwijk'' fungeren als startpunt voor de visievorming. Dit Koersdocument geeft nader invulling aan deze ambitie. Het is een procesdocument gericht op de: a. afstemming t.a.v. strategie, inhoud en uitvoering; b. samenwerking
    tussen de provincie Utrecht en de gemeente Houten. Belangrijk in de samenwerking tussen gemeente en provincie is dat gezocht wordt naar gemeenschappelijkheid in de aanpak van een duurzame ontwikkeling in de leefomgeving van het Eiland van Schalkwijk. Centraal staat de notie dat uiteindelijk een kader wordt ontwikkeld dat: voorziet in een lange termijnvisie op het gebied; gericht is op samenwerking tussen publieke en private partijen; een faciliterend ontwikkelingskader biedt voor initiatieven. Het Eiland van Schalkwijk vraagt een langetermijnvisie Pijler een Alle inspanning op het Eiland is gericht op behoud en ontwikkeling van het landschap en het versterken van de economische basis daarvan. Net zo belangrijk is het vergroten van de leefbaarheid voor bewoners en het aantrekkelijker maken voor bezoekers. Gemeente en provincie - elk vanuit eigen verantwoordelijkheden en bevoegdheden - werken samen aan een toekomst voor het Eiland van Schalkwijk waarin groen (met landbouw als belangrijkste
    kracht), blauw en leefbare kernen met elkaar zijn verweven op een manier die de ruimtelijke kwaliteit van het gebied ten goede komt. Pijler twee Alle ontwikkelingen dragen bij aan de duurzame toekomst van het Eiland. Duurzaamheid is een veelomvattend begrip. Elk initiatief, elk project vraagt een eigen duiding en definitie. Rode draad is dat ontwikkelingen krachtiger en kansrijker zijn wanneer ze op de lange termijn waarde hebben voor en mens (people), milieu (planet) en markt (profit). Gemeente en provincie proberen samen een kader te ontwikkelen dat helpt op het Eiland van Schalkwijk concreter handen en voeten te geven aan dat containerbegrip. Pijler drie Landbouw is en blijft de belangrijkste beheerder van het landschap op het Eiland. De landbouw op het Eiland van Schalkwijk is de enige economische functie die het landschap gebiedsdekkend kan ''dragen''. Het is immers een agrarisch landschap. Het is een politiek maatschappelijke keuze om het beheer bij de landbouw onder te brengen.
    Het is daarom een politiek maatschappelijke plicht om de randvoorwaarden hier op te laten aansluiten. Er moet een vitale landbouwsector ontstaan. Maar juist op het Eiland van Schalkwijk is de situatie, binnen het bredere perspectief van de toekomst van de landbouw in de provincie Utrecht, uitermate prangend. Heel veel grond is niet langer eigendom van agrarische ondernemers, maar in bezit van ontwikkelaars en beleggers. Dit blokkeert agrarische investeringen in het gebied. Verrommeling en verpaupering zijn nu nog niet manifest, maar liggen zeer zeker op de loer. Nu allerwegen blijkt - zie onder meer de Eindbalans van de Ontwikkelingsvisie Noordvleugel Utrecht 2015-2030 - dat grootschalige woningbouw absoluut niet in beeld is, is er een kans de rol van de landbouw te versterken, als economische drager en hoofdbeheerder van het Eiland Pijler vier Verbreding van de landbouw is de motor van de duurzame ontwikkeling van het Eiland. De ontwikkelingen in de landbouw nopen tot een heroriëntatie.
    In een aantal agrarische bedrijfstakken neemt de economische vitaliteit af. Soms vanwege mondiale ontwikkelingen, soms door bijvoorbeeld concurrerende claims op de ruimte. Tegelijkertijd neemt de ruimtebehoefte, bijvoorbeeld in de melkveehouderij, toe. De sector heeft aangegeven kansen te zien voor een verbreding van de bedrijfsvoering. Daarmee wordt een bijdrage geleverd aan de vitaliteit van de sector (belangrijk voor de rol als beheerder - zie pijler drie), maar ook belangrijk als aanjager voor een verdere ontwikkeling van het Eiland. Zowel recreatie, natuur als duurzame energie kunnen hierin een rol spelen. Het Eiland moet een proeftuin zijn voor innovatieve landbouw. De spin off hiervan op de gebiedsontwikkeling is richting bezoekers (cultuurhistorisch erfgoed), richting klimaat (duurzame energie) en ecologie en biodiversiteit (natuurtoevoegingen). Dit brengt een mooie mix voor mens, markt en milieu! Pijler vijf De Nieuwe Hollandse Waterlinie is de hoofddrager van het toeristisch-recreatief
    profiel van het Eiland. Het rijke cultureel erfgoed - het gave landschap met daarin een van de meest gave delen van de Nieuwe Hollandse Waterlinie - is een belangrijke troef van het Eiland van Schalkwijk. Deze kwaliteiten moeten beter beleefbaar en toegankelijk worden voor een breed publiek. Hiermee krijgt het Eiland een (boven)regionaal toeristisch-recreatief profiel. In een klein aantal gebieden wordt de toeristisch-recreatieve functie belangrijker dan de landbouw. Dit geldt met name voor de ''parels'' uit de Nieuwe Hollandse Waterlinie, zoals de forten en hun directe omgeving. Pijler zes Woningbouw, onder strakke voorwaarden, is geen doel maar een middel om te bouwen aan de duurzame toekomst van het Eiland. Om de vitaliteit van de kleine kernen in stand te houden is ruimte nodig voor het toevoegen van een kleine hoeveelheid woningen. Deze zijn vooral bedoeld voor jongeren en ouderen. De inzet van de gemeente is om woningbouw op het Eiland zoveel mogelijk te beperken tot het voldoen
    aan de lokale vraag en behoefte. Daarnaast worden de mogelijkheden onderzocht om ruimte te bieden voor kleinschalige woningbouw, in het kader van ''rood voor groen'' (diverse mogelijkheden om stedelijke bebouwing toe te staan in ruil voor ontwikkeling van natuur), als kostendrager voor het realiseren van maatschappelijk gewenste ontwikkelingen op het Eiland. Daar zullen strakke voorwaarden aan worden verbonden, met name op het gebied van duurzaamheid en landschappelijke kwaliteit. Pijler zeven Er vinden geen grootschalige verkeersingrepen plaats op het Eiland. Ontwikkelingen op het Eiland mogen niet leiden tot nieuwe grootschalige weginfrastructuur. De huidige ontsluitingsstructuur is leidend. Wel is het mogelijk dat wegen worden verbeterd en opgewaardeerd, bijvoorbeeld om economische ontwikkelingen mogelijk te maken (landbouw) of recreatieve punten beter te ontsluiten. Ook kleinschalige verbeteringen krijgen ruimte. Toeristisch-recreatief autoverkeer zal vooral worden ''afgevangen''
    bij ''groene poorten'', zoals het recreatief transferium bij de A27. Het vervoer op het Eiland wordt zo duurzaam mogelijk: fiets, elektrische auto''s en voetgangers krijgen meer ruimte. Samenwerking leidt tot uitvoering Pijler acht Werken aan een duurzame toekomst voor het Eiland betekent hechte samenwerking tussen publieke en private partijen. De ontwikkelingsopgaven op het Eiland van Schalkwijk zijn complex. Het streven is werken aan een duurzame toekomst, maar publieke partijen hebben weinig financiële middelen en geen grondposities. De ontwikkeling van het gebied is absoluut niet gebaat bij een blauwdruk van de toekomst, maar veel meer bij flexibiliteit, die op zijn beurt geen vrijbrief mag bieden. Alleen met voldoende lokaal ondernemerschap, een wervend toekomstperspectief en samenwerking tussen meerdere partijen is het mogelijk daadwerkelijk iets van de grond te krijgen. Het is zaak om, ook na de vaststelling van de structuurvisie Eiland van Schalkwijk door de gemeente, samenwerking
    te blijven stimuleren en publieke en private partijen uit te dagen met nieuwe initiatieven te komen die bijdragen aan de duurzame ontwikkeling van het gebied. Het Eiland van Schalkwijk vraagt dat ontwikkeling wordt gefaciliteerd Pijler negen In de gemeentelijke structuurvisie voor het Eiland van Schalkwijk wordt gekoerst op het toepassen van een mix van sturingsregimes, van strak tot flexibel, waarmee een optimale combinatie wordt gezocht van ruimte voor ondernemerschap en het waarborgen van landschappelijke kwaliteiten. De gemeentelijke structuurvisie moet uitnodigen bij te dragen aan de realisatie van gewenste ontwikkelings­richtingen. Het kan voorkomen dat er soms ruimte moet worden geboden aan initiatieven die niet direct passend lijken binnen de gewenste koers voor het betreffende deel van het Eiland. Een zekere marge en handelingsruimte is noodzakelijk om ondernemerschap mogelijk te maken. Daarom wordt de structuurvisie gelaagd opgebouwd, met een differentiatie in sturingsniveau
    en mate van flexibiliteit: gebieden waar (bijna) niets mag worden toegevoegd of gewijzigd, gebieden met beperkte flexibiliteit en gebieden met (onder voorwaarden) ruimte voor toevoeging van andere functies. Pijler tien Publieke partijen wegen samen af en bepalen samen welke initiatieven ten goede komen aan de duurzame toekomst van het Eiland van Schalkwijk. Als een initiatief zich aandient dat bij kan dragen aan die duurzame toekomst wordt gezamenlijk bepaald of de vigerende kaders van de overheden daar voldoende ruimte voor bieden of dat ruimte moet worden gecreëerd. Dit is alleen mogelijk als er in het voortraject via accountmanagement bij de verschillende overheden een ingang is voor het begeleiden van het initiatief. In het in te stellen bestuurlijk gebiedsoverleg tussen gemeente Houten en provincie Utrecht wordt in complexe of omvangrijke initiatieven een adviesgevende uitspraak gedaan aan het bevoegd gezag. Bereikbaarheidsscan Om na te gaan of een bereikbaarheidsonderzoek noodzakelijk
    is, moet bij elk omgevingsplan in een vroeg stadium inzicht worden gegeven in het aantal verplaatsingen dat de ontwikkeling in de leefomgeving tot gevolg heeft voor de verschillende vervoerwijzen in relatie tot de omliggende verkeers- en vervoersnetwerken (wegennet, openbaar-vervoernetwerk, fiets- en looproutes). Als er sprake is van een (relatief) groot aantal verplaatsingen en/of het vermoeden bestaat dat er zich een knelpunt in de bereikbaarheid gaat voordoen op het omliggende verkeers- en vervoersnetwerken, is een bereikbaarheidsonderzoek noodzakelijk. Daarbij moet zichtbaar worden gemaakt hoe de desbetreffende ontwikkeling in de leefomgeving zich verhoudt tot het geheel aan (te verwachten) ontwikkelingen in een gebied of gemeente en de omliggende gemeenten. Wanneer er sprake is van meerdere (te verwachten) ontwikkelingen in een gebied, gemeente of regio kan er sprake zijn van een stapeling van effecten op de diverse verkeers- en vervoersnetwerken waardoor specifieke knelpunten in
    de bereikbaarheid ontstaan of zich er juist kansen voordoen om netwerken te versterken. Dit kan tevens een aangrijpingspunt vormen voor eventuele kostenverevening (het verdelen van de kosten van infrastructuuraanpassingen over verschillende projecten). Bereikbaarheidsonderzoek Als een bereikbaarheidsonderzoek noodzakelijk blijkt, is het aan te bevelen om in ieder geval in te gaan op een aantal algemene aspecten zoals: a. of de ontwikkeling qua locatie en type mobiliteit passend is binnen het bereikbaarheidsbeleid van de provincie Utrecht zoals omschreven in de vigerende versie van het Mobiliteitsprogramma en de Omgevingsvisie; b. of het aantal (te verwachten) verplaatsingen van de diverse vervoerswijzen passend is op de ontsluitende en omliggende verkeers- en vervoersnetwerken of dat er knelpunten ontstaan; c. of er sprake is van andere ontwikkelingen in de leefomgeving die van invloed (kunnen) zijn op het functioneren van de verkeers- en vervoersnetwerken; d. met welke maatregel(en)
    wordt voorzien in een afdoende aansluiting van de locatie op de ontsluitende en omliggende verkeers- en vervoersnetwerken voor de diverse vervoerswijzen; e. of er voldoende financiële middelen zijn gereserveerd om de maatregelen aan de verkeers- en vervoersnetwerken en andere benodigde maatregelen voor de diverse vervoerswijzen te bekostigen; f. wanneer de maatregel(en) voor de diverse vervoerswijzen wordt/worden gerealiseerd in relatie tot de ontwikkeling in de leefomgeving zodat een tijdige ontsluiting en goed functionerende netwerken voor alle modaliteiten kunnen worden gewaarborgd. Ten aanzien van auto (personen en goederen) daarnaast specifiek op: a. de capaciteit van het omliggend autowegennet in relatie tot de extra autoverplaatsingen; b. maatregelen die het aantal autobewegingen kunnen beperken zoals parkeerbeleid of geïntegreerd deelvervoer. Ten aanzien van openbaar vervoer daarnaast ook specifiek op: a. het kwaliteitsniveau (centrale ontsluiting, goede doorstroming, haltelocaties)
    van het huidige en toekomstige openbaar vervoer (en, als van toepassing, in relatie tot het vestigingsmilieu); b. de betaalbaarheid van de benodigde aanpassing van het kwaliteitsniveau; c. de bereikbaarheid en toegankelijkheid van haltevoorzieningen en knooppunten. Ten aanzien van lopen en fietsen daarnaast ook specifiek op: a. de huidige en geplande fietsinfrastructuur (binnen en buiten het plangebied); b. de ontsluiting van de ontwikkeling door loop- en fietsroutes. Het resultaat van dit onderzoek moet voldoende inzicht geven of de locatie goed en tijdig is ontsloten en welke maatregelen er, ook op de omliggende netwerken, nodig zijn. Het inzicht in het aantal verplaatsingen dat de ontwikkeling in de leefomgeving tot gevolg heeft (bereikbaarheidsscan) alsmede de resultaten van het bereikbaarheidsonderzoek worden samen met de overige zaken met betrekking tot verkeer en vervoer opgenomen in het omgevingsplan. Relevante overige zaken met betrekking tot verkeer en vervoer (bereikbaarheidsaspecten)
    die in omgevingsplannen aan de orde komen zijn (voor zover relevant en niet al behandeld in het bereikbaarheidsonderzoek zelf): a. verkeersveiligheid; b. kwaliteit leefomgeving (geluidbelasting, mede in relatie tot stiltegebieden; luchtverontreiniging; compenserende maatregelen); c. parkeervoorzieningen voor auto en fiets; d. deelmobiliteit, vervoermanagement en parkmanagement; e. (kwaliteitsnet) goederenvervoer (multimodaal vervoer, overslagmogelijkheden); f. transport gevaarlijke stoffen (in relatie tot het routenet gevaarlijke stoffen); g. andere randvoorwaarden vanuit deze verordening. De Bijlage Cultuurhistorie benoemt de uitzonderlijke universele waarde van de UNESCO Werelderfgoederen Hollandse Waterlinies en Neder-Germaanse Limes, en beschrijft de te behouden en te versterken cultuurhistorische waarden van de Cultuurhistorische hoofdstructuur, bestaande uit 5 hoofdgebieden met elk een eigen cultuurhistorisch thema. Binnen deze thematische hoofdgebieden zijn verschillende deelgebieden
    te onderscheiden. Per deelgebied ligt de focus op de kenmerkende cultuurhistorische samenhang . Voor een uitgebreidere beschrijving van alle aanwezige cultuurhistorische waarden verwijzen we naar de Cultuurhistorische Atlas van de provincie Utrecht, ook wel bekend als de CHAT (online beschikbaar als digitale kaart). 1.1 UNESCO Werelderfgoed Hollandse Waterlinies De uitzonderlijke universele waarde van het Werelderfgoed Hollandse Waterlinies, bestaande uit de Stelling van Amsterdam (SvA) en de Nieuwe Hollandse Waterlinie (NHW), is gelegen in het uitgebreide en ingenieuze systeem van militaire verdediging door inundatie. De SvA betreft een doorgaand stelsel van liniedijken in een grote ring om Amsterdam (vaste afstand tot het stadscentrum), terwijl de NHW zich sterker voegt naar eigenschappen en elementen van het aanwezige landschap. De hoofdkenmerken van de Hollandse Waterlinies zijn het strategisch landschap, het watermanagement en de militaire werken. De belangrijkste te onderscheiden
    componenten van de uitzonderlijke universele waarde van het Werelderfgoed Hollandse Waterlinies zijn, voor de Nieuwe Hollandse Waterlinie: a. het unieke, in samenhang met het landschap ontworpen negentiende en twintigste-eeuwse hydrologische en militairverdedigingssysteem, bestaande uit: 1. inundatiegebieden; 2. een zone met verdedigingswerken als forten, batterijen, lunetten, betonnen mitrailleurkazematten en groepsschuilplaatsen in hun samenhang met de omgeving; 3. voormalige schootsvelden (visueel open) en verboden kringen (merendeels onbebouwd gebied) rondom de forten; 4. waterwerken als waterlichamen, sluizen, inlaten, duikers en dijken functionerend in samenhang met verdedigingswerken en inundatiegebieden; 5. overige elementen als beschutte wegen, (resten van) loopgraven en tankgrachten; 6. de landschappelijke inpassing en camouflage van de voormalige militaire objecten; en 7. de historische vestingstructuur van de vestingsteden, waaronder Nieuwersluis, gelegen in de Provincie
    Utrecht; b. de grote openheid; en c. het groene en overwegend rustige karakter. en voor de Stelling van Amsterdam: a. het unieke, samenhangende en goed bewaard gebleven, laatnegentiende-eeuwse en vroegtwintigste-eeuwse hydrologische en militair-landschappelijk geheel, bestaande uit: 1. een doorgaand stelsel van liniedijken in een grote ring om Amsterdam; 2. sluizen en voor- en achterkanalen ; 3. de forten, liggend op regelmatige afstand, voornamelijk langs dijken ; 4. inundatiegebieden; 5. voormalige schootsvelden (visueel open) en verboden kringen (merendeels onbebouwd gebied); en 6. de landschappelijke inpassing en camouflage van de voormalige militaire objecten; b. de relatief grote openheid; en c. de groene en relatief stille ring rond Amsterdam. 1.2 UNESCO Werelderfgoed Neder-Germaanse Limes De uitzonderlijke universele waarde van het Werelderfgoed Neder-Germaanse Limes is gelegen in de unieke, samenhangende en goed bewaard gebleven voormalige (militaire) grens van het Romeinse
    Rijk, die de gehele militaire ontwikkelingsgeschiedenis van het Romeinse Rijk in de eerste 4 eeuwen van onze jaartelling laat zien en getuigt van inventieve en innovatieve omgang met het dynamische rivierenlandschap in onze streken. De belangrijkste te onderscheiden componenten van de uitzonderlijke universele waarde van het Werelderfgoed Neder-Germaanse Limes zijn: a. de grensrivier, met scheepswrakken (in de voormalige bedding), waterwerken en archeologisch waardevolle geulopvullingen; b. de Limesweg, op de zuidelijke oevers van de Rijn; c. forten (castella) met bijbehorende kampdorpen (vici), grafvelden, wachttorens en waterwerken. 2.1 Historische buitenplaatszones De cultuurhistorische waarde van de Historische buitenplaatszone ligt met name in: a. de samenhang van parkstructuren, hoofdhuizen en bijgebouwen; b. de zichtassen en zichtrelaties tussen buitenplaatsen en de omgeving; c. de kenmerken van de buitenplaatszone in relatie tot het onderliggende landschap. De zichtassen en zichtrelaties,
    die als lange lijnen doorlopen vanuit de buitenplaatsen en landgoederen naar hun omgeving, hebben een directe relatie met de aanleg en structuur van de historische buitenplaatsen en landgoederen. Aantasting van een zichtas/zichtrelatie betekent een directe aantasting van de waarde van de buitenplaats/het landgoed. Daarom is het van belang dat de nog aanwezige zichtassen en zichtrelaties bij ontwikkelingen worden gerespecteerd en gehandhaafd. Zie voor een aanduiding op de kaart de Cultuurhistorische Atlas (CHAT). Stichtse Lustwarande De Stichtse Lustwarande is een brede buitenplaatszone op de zuidflank van de Heuvelrug, tussen Utrecht en Amerongen. De ruim 100 buitenplaatsen hebben zich voornamelijk in een 3 zones in de gradiënt van laag naar hoog geformeerd: a. Voornamelijk in de natte kleizone aangelegde zeventiende- en achttiende-eeuwse grote, formele buitenplaatsen, veelal als verbouwing/vernieuwing van middeleeuwse ridderhofsteden en bestaande uithoven. Voor de parkaanleg is gebruik
    gemaakt van oudere verkavelingen, waarbij lange zichtlijnen soms tot ver over de hogere stuwwal werden doorgetrokken. b. Tussen de Arnhemse Bovenweg en de N237-N225 op de rand van het zand gelegen negentiende-eeuwse buitenplaatsen in landschappelijke stijl. Aan de zuidzijde van de N237-N225 lagen de overplaatsen. Op de hogere zandgronden werden de schaarse veedriften ten behoeve van nieuwe lanenstelsels rechtgetrokken en is de kale heide bebost met park- en jachtbossen, eind negentiende eeuw gevolgd door productiebossen. c. Vroeg twintigste-eeuwse buitenplaatsen hoger op de Heuvelrug langs de N227. De Stichtse Lustwarande kent een afwisseling van open (weiden, overplaatsen) en gesloten (parken, bossen) delen. Kenmerkend zijn de ontworpen zichtrelaties (zichtlijnen of panorama’s) vanaf de weg op de hoofdhuizen en vanuit de hoofdhuizen op het omliggende park, de overplaats en het landschap. Structurerende onderdelen van deze zichtrelaties zijn bosschages, uitzichtpunten en gewelfde gazons,
    evenals voor de landschapsparken kenmerkende slingerende lanen, waterpartijen en tuinelementen (bruggen, theekoepels, follies). Formele buitenplaatsen hebben hun toegang als centrale zichtlaan haaks op het huis. De buitenplaatsen zelf zijn meestal enigszins verhoogd gelegen, symmetrisch opgezette, blokvormige gebouwen, georiënteerd op de weg maar op enige afstand daarvan. De bijgebouwen zijn daaraan ondergeschikt, zowel qua maatvoering als qua ligging. De parkaanleg is meestal dwars op de zuidflank van de Heuvelrug georiënteerd, met een kenmerkende opeenvolging van park, parkbos en productiebos. Langbroekerwetering Tussen Odijk en Wijk bij Duurstede, langs Kromme Rijn en Langbroekerwetering, liggen een kleine 20 kastelen en ridderhofsteden. De oudste dateren uit de dertiende eeuw, maar de meesten hebben een vroeg-negentiende-eeuws neogotisch uiterlijk. Door de lage ruimtelijke dynamiek is de feodale karakteristiek van dit gebied goed bewaard gebleven. Kenmerkend zijn de kleine huisplaatsen
    binnen rechthoekige omgrachtingen, de verdekte toegangen, de poortgebouwen over de wetering en de duiventorens. Het gebied is cultuurhistorisch van uitzonderlijke kwaliteit vanwege het stroomruglandschap van de onbedijkte Kromme Rijn en het aanpalende coulisselandschap van de Langbroekerwetering, dat zich door de aanwezigheid van de landgoederen heeft ontwikkeld tot een afwisseling van open weilanden en gesloten blokbossen, doorsneden door boom- en houtwallanen. De kastelen en ridderhofsteden liggen als besloten eilandjes binnen de ritmiek van de regelmatige cope-verkaveling en vormen een contrast met de overwegend kleine boerderijen aan de wetering. Vecht De kern van de Vechtstreek is een smalle buitenplaatszone langs de rivier, tussen Oud-Zuilen en Vreeland. In de zeventiende en vooral in de achttiende eeuw hebben Amsterdamse kooplieden hier een buitenplaats als zomerverblijf gesticht, veelal in classicistische stijl. De theekoepel aan het water werd het beeldmerk van dit luxelandschap,
    het smeedijzeren toegangshek het visitekaartje. Door economische neergang zijn vele buitenplaatsen rond 1800 afgebroken en werden formele tuinen omgewerkt tot landschappelijke parken. Van de oorspronkelijk ruim 100 buitenplaatsen zijn er nu nog zo’n 40 over. Ook de buitenplaatsen langs de Angstel en het Gein rekenen we tot deze zone. Hier is het agrarische karakter dominant gebleven, met hier en daar een tot buitenplaats uitgegroeide boerderij of kasteel, zoals bij Loenersloot. Karakteristiek voor deze buitenplaatszone is het halfopen landschap met een afwisseling van besloten buitenplaatsen, open weilanden met boerderijen, en historische kernen. Het open zicht tussen jaagpad en Vecht, en de doorzichten tussen en achter de buitenplaatsen naar het open weiland, verhogen de belevingswaarde. Van hoge cultuurhistorische waarde zijn de (resten van) formele en vroeg-landschappelijke tuinaanleg en de nog aanwezige landschapsstructuren van verdwenen buitenplaatsen. Ruimtelijk kenmerkend zijn
    de oriëntatie van de buitenplaatsen op de rivier en op de dijkweg (met dwarsprofiel van de oude Napoleonweg, Route Impériale), en de compacte tuinen en overplaatsen. Amersfoortseweg (Wegh der Weegen) De Amersfoortseweg (N237) is in 1653 aangelegd als zeer brede, kaarsrechte, met bomen beplante weg in formele landschapsstijl, tussen Amersfoort en Utrecht. Het 11 kilometer lange traject tussen de Amersfoortse Galgenberg en de buitenplaats Vollenhoven kreeg een regelmatige vakkenverkaveling (24 vakken van ieder 100 roeden, i.e. 376m, breed) voor de aanleg van buitenplaatsen. Het is het grootste infrastructurele project uit de zeventiende eeuw in de provincie Utrecht. Essentieel voor de Amersfoortseweg is het symmetrisch-monumentale karakter. De cultuurhistorische kwaliteit ligt vooral in de nog geheel aanwezige verkavelingsritmiek met haakse dwarsassen (sorties), die rond Huis ter Heide en Soesterberg in de loop der tijd aan weerszijden van de weg naar achteren zijn verlengd. Door verbredingen
    en omleggingen is het monumentale karakter van de weg op diverse plaatsen aangetast, maar tussen Soesterberg en de Stichtse Rotonde is de oorspronkelijke structuur nog zichtbaar. Het heldere zeventiende-eeuwse concept van buitenplaatsen centraal op de uitgezette vakken is slechts zeer ten dele gerealiseerd, maar vormt een inspiratiebron voor toekomstige ontwikkelingen. Kenmerkend voor de bestaande buitenplaatsen zijn het vrije zicht dwars over de weg en de lanen- en wallenstructuur. Meer informatie ten aanzien van de kenmerken van de weg (Wegh der Weegen/Amersfoortseweg) is te vinden bij het thema Historische Infrastructuur en in de Cultuurhistorische Atlas (CHAT). Laagte van Pijnenburg In het noordelijke deel van de Heuvelrug ligt de Laagte van Pijnenburg, een buitenplaatsenzone langs een oude turfvaart (Praamgracht/Pijnenburgergrift) en de Amsterdamsestraatweg en Hilversumsestraatweg. Vanaf midden zeventiende eeuw hebben Amsterdammers hier hun buitenplaats gesticht. Lage Vuursche ontstond
    omstreeks 1640 als kleine nederzetting rond Drakenstein. Met de komst van de Oranjes (Paleis Soestdijk) kreeg het gebied vorstelijke allure. De buitenplaatsen liggen grotendeels op de strookverkavelingen van de oudere hoogveenontginningen, waarvan de richting is bepaald door de stuwwallen. Rechte lanenstelsels met houtwallen, oorspronkelijk georiënteerd op omliggende kerktorens, doorsnijden de bossen. Kenmerkend voor de Laagte van Pijnenburg zijn de veel voorkomende combinatie van classicistische en landschappelijke aanleg, de compacte en duidelijk van omliggende bossen begrensde parkaanleg, en het zicht op het hoofdhuis vanaf de ontsluitingsas. Valleilandgoederen Aan de westrand van de Gelderse Vallei ligt een buitenplaatszone die grotendeels gebaseerd is op dertiende-eeuwse strookvormige verkavelingen. Aan de middeleeuwse ontginningsas Ekris ligt het kasteelterrein van Groenewoude. Geerestein is een ridderhofstad die eind achttiende eeuw tot buitenplaats is uitgegroeid. Bijzonder is
    het 1 kilometer lange zichtkanaal in de as van het huis. Op de overgang naar de Heuvelrug vinden we het in oorsprong vroeg achttiende-eeuwse landgoed Den Treek met landschapspark uit omstreeks 1820. Den Treek vormde het centrum van de oostelijke bebossing van de Heuvelrug, die eind negentiende eeuw goed op gang kwam en onder meer resulteerde in het Sterrenbosch. Een vierde landgoed, De Boom, werd met een landschappelijke aanleg in 1879 gesticht langs de Heiligerbergerbeek, die tot aan Amersfoort fungeerde als ontginningsas voor meerdere buitenplaatsen. Karakteristiek voor de Valleilandgoederen is het coulisselandschap op basis van verschillende verkavelingsrichtingen (met herkenbare ontginningsassen), verrijkt met gesloten parkbossen met historische paden- en houtwallenstructuur. Het gebied kent een aantal lange zichtlijnen. Door samenspel van parken en kleinschalige agrarische bedrijven is het een typisch landgoederenlandschap. Amelisweerd Aan de zuidelijke stadsrand van Utrecht ligt
    langs de Kromme Rijn de buitenplaatszone Amelisweerd. Rhijnauwen, Oud en Nieuw Amelisweerd zijn in oorsprong middeleeuwse kastelen die zich in de achttiende eeuw tot buitenplaatsen ontwikkelden. Met behoud van de oude verkavelingslijnen is hier een staalkaart aan tuinstijlen ontstaan die nog steeds zichtbaar is. Uniek is het rivierbos met de hoogste bomen van Nederland. De cultuurhistorische kwaliteit van het gebied wordt verhoogd door de resten van het Romeinse castellum Fectio en de 2 grootste forten van de Nieuwe Hollandse Waterlinie (Rhijnauwen en Vechten). Amelisweerd heeft met ruim 1 miljoen bezoekers per jaar een grote recreatieve betekenis en is te beschouwen als een cultuurhistorisch park. Het gebied wordt gekarakteriseerd door aaneengeschakelde parkbossen langs de Kromme Rijn met half open uitzicht op de Koningslaan aan de zuidzijde, en door weiden met lanen en houtwallen aan de noordzijde. Kasteel de Haar Kasteel De Haar vormt het centrum van een grootse, eind negentiende-eeuwse
    parkaanleg in diverse deeltuinen, met zichtlijnen die tot ver buiten het park reiken. Kasteel, park, boerderijen en bijgebouwen vormen met het naastgelegen brinkdorp Haarzuilens een ensemble, dat volgens de reconstructivistische visie van architect P.J. Cuypers naar middeleeuws ideaalbeeld is geconcipieerd. De zuidelijke begrenzing van het gebied is gelegd op de Heycop-Vleutense wetering, de voormalige loop van de Oude Rijn, waaraan de vijftiende-eeuwse Hamtoren ligt. De groenbuffer rond De Haar en Haarzuilens is cultuurhistorisch van groot belang omdat deze de kenmerkende historische structuurlijnen en het contrast tussen park en noordwestelijk agrarisch gebied zichtbaar houdt. Landgoed Linschoten Tussen Woerden en Montfoort ligt het Landgoed Linschoten, een in het open poldergebied van het Groene Hart gelegen groene enclave die sinds de middeleeuwen als eenheid wordt beheerd. Dit eeuwenlange centrale beheer heeft geresulteerd in een uniek ruim 300 hectare groot ensemble van huis en
    parkbos aan het riviertje de Lange Linschoten, met bijbehorende boerderijen (15), grienden en landerijen, voornamelijk ter weerszijden van de Haardijk. Met de bouw van het huis in 1637 startte de buitenplaatsontwikkeling. Tuinarchitect J.D. Zocher jr. transformeerde in 1834 de oude formele aanleg met de vijvers en het grand canal in het huidige landschapspark met een grote slingerende waterpartij en met zichtlijnen vanuit het huis naar buiten. Maarsbergse Flank Op de oostelijke flank van de Utrechtse Heuvelrug, rondom de plaatsen Maarn en Maarsbergen, ligt een tiental buitenplaatsen. Deze buitenplaatsen hebben een gezamenlijke oriëntatie op de Gelderse Vallei. Dominant in historie en presentatie is kasteel Maarsbergen, ontstaan uit een twaalfde-eeuwse proostdij en in de tweede helft van de zeventiende eeuw ontwikkeld tot een buitenplaats met grootse formele aanleg in de vorm van een centrale as, lanenstelsels, grachten en een sterrenbos op de zogeheten Focoldusheuvel. Vanaf de negentiende
    eeuw, toen het open heidegebied bebost werd, zijn hier enkele buitenplaatsen bijgekomen (Berghuisje, Plattenberg), een ontwikkeling die na de ontsluiting van het gebied (station Maarn) versneld is voortgezet met de aanleg van jongere buitenplaatsen langs de Amersfoortseweg als De Viersprong (1894), Zonnekanje (1925), De Hoogt (1908), ’t Stort (1903), Stameren (1905), Huis te Maarn (1906-1915) en Zonheuvel (1836/1902). Voorts op grotere afstand van de weg het landhuis Landeck (1922) en Anderstein (1913) aansluitend aan het terrein van Maarsbergen. Deze zone kenmerkt zich door voornamelijk in de bossen opgenomen buitenplaatsen met een sterk gevarieerde parkaanleg van formeel-classicistische, landschappelijk tot modern-architectonische tuinstijl, waarbij gebruik is gemaakt van het bestaande agrarische houtwallenlandschap. Opvallend is de geringe rol van water in de aanleg. Kenmerkend is de inpassing van recreatievoorzieningen als zwembaden en tennisbanen. Prattenburg-Remmerstein Deze buitenplaatszone
    wordt gedomineerd door 2 grote buitenplaatsen op de zuidelijke oostflank van de Utrechtse Heuvelrug: Prattenburg en Remmerstein. Beide buitenplaatsen kennen een lange ontwikkelings­geschiedenis die teruggaat tot de middeleeuwen. Hun voorlopers, versterkte hofsteden, lagen aan de voet van de flank, langs de oude route van de Cuneraweg. Prattenburg is begin zeventiende eeuw omgevormd tot buitenplaats en is sinds 1694 in bezit van de familie Van Asch van Wijck. Rond 1887 werd een nieuw huis gebouwd in kasteelachtige allure, diverse bijgebouwen toegevoegd en een landschappelijk park aangelegd. Remmerstein werd eind zeventiende eeuw eveneens omgevormd tot buitenplaats en kreeg in de tweede helft van de achttiende eeuw een uitgebreid lanenstelsel met sterrenbos rond de zogeheten Paasheuvel. De lanen zijn onder meer uitgezet op de kerktorens van Wageningen en Rhenen. In 1912 kreeg Remmerstein een nieuw huis wat hoger op de flank met een bijzondere tuin in architectonische stijl, overgaand in
    een open weiland met uitzicht over de Gelderse Vallei. Kenmerkend voor deze zone is het landgoederenlandschap waarbij bosbouw dominant was. Dat uit zich in een typerende combinatie van lange laanstructuren door de uitgestrekte bossen met parkaanleg die rond de huizen is geconcentreerd. 2.2 Militair erfgoed Nieuwe Hollandse Waterlinie De Nieuwe Hollandse Waterlinie is een 85 kilometer lange verdedigingslinie tussen de voormalige Zuiderzee en de Biesbosch. De aanleg startte in het begin van de negentiende eeuw, met als doel het economisch hart van Nederland te beschermen tegen aanvallen uit het oosten. De Nieuwe Hollandse Waterlinie bestaat uit een hoofdweerstandslijn (achterste begrenzing), verdedigingswerken, sluizen/kanalen/keerkaden en een open inundatiegebied (het gebied dat onder water kon worden gezet). De inundatiegebieden vormden het hoofdbestanddeel van de verdediging. Op plaatsen waar inundatie niet mogelijk was, of op plaatsen waar wegen de linie doorkruisten, bouwde men forten.
    Omstreeks 1870 kreeg de oostzijde van de stad Utrecht een tweede ring van grote forten. Tijdens de mobilisaties van 1914-1918 en van 1939-1940 werd de linie versterkt met tussenstellingen bestaande uit series kazematten en groepsschuilplaatsen. In 1951 werd de linie opgeheven. De voormalige schootsvelden rondom de forten zijn vaak nog onbebouwd en hebben weinig opgaande begroeiing (de ‘verboden kringen’ rond de forten kenden tot 1963 strenge bouwbeperkingen). De openheid van de voormalige inundatiegebieden versterkt de beleving van de linie. De Kromme Rijn zorgde voor de belangrijkste toevoer van water (‘de kraan van de NHW’) benodigd voor de inundatie van de gebieden van de Nieuwe Hollandse Waterlinie. Van belang is het behoud van het karakter en het huidige verloop van de rivier en van de sporen in het landschap van het historische verloop van de rivier. Van de Nieuwe Hollandse Waterlinie willen wij de volgende kernkwaliteiten behouden: a. Het unieke, in samenhang met het landschap
    ontworpen negentiende en twintigste-eeuwse hydrologische en militairverdedigingssysteem, bestaande uit een samenhangend stelsel van onder andere forten, dijken, kanalen en inundatiekommen; b. groen en overwegend rustig karakter; c. openheid Oude Hollandsche Waterlinie De Oude Hollandse Waterlinie ligt tussen de voormalige Zuiderzee en de Biesbosch. Het Utrechtse deel ligt ten oosten van de riviertjes ’t Gein, de Amstel, de Kromme Mijdrecht en de Meije en beslaat het westelijk deel van de Lopikerwaard. Deze verdedigingslinie ligt geheel in het veengebied. Door de ruime aanwezigheid van water is hier volstaan met een gering aantal verdedigingswerken. De keten van inundatiegebieden vergde vele tientallen kilometers aan kades en watergangen. De Oude Hollandse Waterlinie leunde sterk op vestingsteden: Gorinchem, Nieuwpoort, Schoonhoven, Oudewater, Woerden, Nieuwersluis, Weesp, Naarden en Muiden. De liniesteden waren stervormige bolwerken met grachten en bastions. Daartussen lagen op strategische
    plekken veldschansen, aarden werken, voorzien van bastions en een gracht, maar zonder bebouwing. Het waren primitieve forten, bedoeld voor tijdelijke bezetting in tijden van oorlog. De contouren van deze forten en veldschansen zijn nog steeds terug te vinden in het landschap. In 1672 werd de Oude Hollandse Waterlinie voor het eerst getest: een sterk Frans leger slaagde er niet in om er doorheen te komen. Omdat het middendeel van de linie zwakke plekken kende, verschoof hij aan het eind van de achttiende eeuw richting Utrecht. In 1795 bleek de linie niet bestand tegen strenge vorst die zelfs de grote rivieren deed bevriezen. Na de Franse tijd werd de landverdediging opnieuw georganiseerd en werd de Nieuwe Hollandse Waterlinie ten oosten van de stad Utrecht aangelegd. Voor het deelgebied van de Oude Hollandse Waterlinie ligt de cultuurhistorische waarde met name in het behoud van de aangewezen, nog in het landschap zichtbare forten en linies, exclusief de bijbehorende vestingsteden en
    inundatiezones. Grebbelinie De Grebbelinie is een 60 kilometer lange waterlinie, gelegen in de Gelderse Vallei tussen de voormalige Zuiderzee en de Nederrijn. De linie is vanaf het midden van de achttiende eeuw aangelegd om de vijand uit het oosten te weren. De Grebbelinie is een samenhangend verdedigingsstelsel van liniedijk, keerkaden, aarden verdedigingswerken, sluizen, waterlopen, inundatie- en schootsvelden. In 1939/1940 is de linie versterkt met loopgraven, tankgrachten en kazematten om een Duitse aanval uit het oosten tegen te houden. De hoofdweerstandslijn, gevormd door het Valleikanaal met liniedijk en de Eem boven Amersfoort, werd toen uitgebreid met een voorpostenlijn en een stoplijn als achterste begrenzing. In 1944/1945 is door de Duitse bezetter de ‘Pantherstellung’ deels op de Grebbelinie aangelegd. De verdediging in de breedte is uniek aan deze linie. De forten markeren de plaats van de linie in het landschap, zij liggen op strategische plekken, gebouwd ter verdediging
    van een acces, zoals (spoor)wegen en stroomruggen. De openheid van de voormalige inundatiegebieden versterkt de beleving van de linie. De Grebbelinie is nog grotendeels ongeschonden aanwezig en manifesteert zich als een groen lint door het landschap. Van de Grebbelinie willen we de volgende kernkwaliteiten behouden: a. het in samenhang met het landschap ontworpen hydrologische en militaire verdedigingsstelsel uit de achttiende tot en met de twintigste eeuw, bestaande uit liniedijk, keerkaden, aarden verdedigingswerken, waterlopen, inundatie- en schootsvelden; b. openheid van de voormalige inundatievelden; c. het groene karakter van het lint door het landschap. Een uitgebreide beschrijving en handvatten voor het omgaan met de kernkwaliteiten hebben we opgenomen in de Kwaliteitsgids voor de Utrechtse Landschappen, gebiedskatern Gelderse Vallei . Soesterberg en omgeving Centraal op de Utrechtse Heuvelrug ligt een uitgebreid militair oefengebied. Een eerste tijdelijk kamp werd in 1804 door
    de Franse generaal Marmont aangelegd. De 3 kilometer lange contour is nog zichtbaar. De Pyramide van Austerlitz staat thans symbool voor de Franse Tijd in Nederland. Nabij de Amersfoortseweg verrees in 1815 het Kamp van Zeist. Het vormde de basis voor de ontwikkeling van een groot oefenterrein op de Leusderheide, dat vanaf 1870 een gesloten militair gebied werd en na WOII in gebruik kwam voor tanks. Na bouw van de Bernardkazerne werd ook de Vlasakkers als oefenterrein voor tanks ingericht. Een derde ontwikkeling volgde vanaf 1913 toen bij Soesterberg een vliegkamp werd ingericht. Het werd de bakermat van onze luchtmacht. In 1941 werd het vliegkamp door de Duitsers tot een echt vliegveld met landingsbanen omgevormd. In de jaren 1950 groeide Soesterberg uit tot een NAVO-basis. Met de sluiting in 2008 kwam er een definitief einde aan deze militaire vliegbasis. Tegen Amersfoort, op de grens met de gemeente Leusden, ligt ook Kamp Amersfoort, een Nationaal Monument en 1 van de 3 bekendste
    Nederlandse herinneringscentra aan WOII. Camouflage, afgeslotenheid, forse infrastructuur en opeenvolgende kampementen zijn de sleutelbegrippen van dit uitgestrekte militaire oefengebied. Er is een web van brede banen en wegen ontstaan met verspreid gelegen kazernes, bunkers en observatieposten. Voor het deelgebied van de (voormalige) Vliegbasis Soesterberg ligt de cultuurhistorische waarde met name in het behoud van de historische structuren en de nog aanwezige objecten van land- en luchtmacht en de elementen uit de Koude Oorlog. 2.3 Agrarisch cultuurlandschap De cultuurhistorische waarde van het Agrarisch cultuurlandschap ligt met name in: a. de aanwezige ontginningsstructuur en -richting; b. de structuur, maatvoering, kenmerken en karakter van de boerderijlinten; c. het waterbeheersingssysteem; d. de openheid van het landschap. Lopikerwaard De Lopikerwaard vormt samen met de Krimpenerwaard (Zuid-Holland) een van de grootste aaneengesloten veenweidegebieden van Nederland. Lage ruimtelijke
    dynamiek binnen de door rivieren omsloten waard heeft gezorgd voor het nagenoeg volledig intact blijven van het twaalfde-eeuwse cope-ontginningssysteem, dat wordt gekenmerkt door enkele zeer lange, oost-west gerichte ontginningslinten. Kenmerkend zijn de vaste dieptematen, het patroon van scheisloten en de boerderijlinten met oriëntatie op de ontginningsbasis. Het contrast tussen de dicht bebouwde, doorgaans dubbelzijdige linten en het open tussenliggende polderland is karakteristiek voor de Lopikerwaard. Een fijnmazig sloot- en boezemsysteem typeert het westelijk deel. De randen van de waard hebben kenmerkende open (Lekdijk) en meer gesloten (IJsseldijk) boerderijlinten langs de dijk. Kockengen-Kamerik-Zegveld Het gebied Kockengen-Kamerik-Zegveld is een typisch twaalfde-eeuws cope-ontginningslandschap dat nog behoorlijk intact is. Het is een schoolvoorbeeld van onder centrale regie uitgevoerde, zeer regelmatige cope-ontginning en vormt (met het in Zuid-Holland doorlopende deel) het
    grootste aaneengesloten complex daarvan in Nederland. Het betreft een binnen Europa unieke veenontginning, met vaste dieptematen, een regelmatig patroon van (veelal verbrede) sloten en een ritme van (dwars)kaden en boerderijlinten met oriëntatie op de ontginningsbasis. Zowel enkelzijdige als dubbelzijdige linten komen voor, met een veelal half open karakter. Er worden 3 deelgebieden onderscheiden: het schaakbordpatroon van zeer regelmatige ontginningsblokken rond Kockengen (cope), de waaiervormige verkaveling van Zegveld (opstrek) en het gebied rond Kamerik met ten opzichte van de ontginningsbasis verschoven boerderijlinten. Westbroek De middeleeuwse veenontginning ten westen van de Vecht rond Tienhoven-Westbroek-Maartensdijk is een open poldergebied met een karakteristieke, opstrekkende strookverkaveling bestaande uit percelen van 7 tot 12 kilometer lengte. Het wordt doorsneden door enkele verspringende boerderijlinten. Het verspringen is een gevolg van de verschillende ontginningsstadia
    van het gebied en heeft geleid tot kenmerkende zogenaamde bajonetaansluitingen bij de dwarswegen. Kenmerkend voor het gebied zijn voorts de vele turfvaarten. De verkeersbundel Utrecht-Hilversum markeert het contrast tussen de lange open gezichten van Westbroek en het meer verstedelijkte gebied Groenekan en Maartensdijk. De Gageldijk markeert de huidige stadsrand van Utrecht, van waaraf het open weidelandschap met verre open gezichten tot aan ’t Gooi zich uitstrekt. Linschoten Binnen de driehoek Woerden-Oudewater-Montfoort liggen de Linschoter ontginningen. Tezamen met de boerderijlinten langs de Lange Linschoten, het landgoed Linschoten en de Linie van Linschoten is dit gebied cultuurhistorisch zeer waardevol. De oudste, deels nog onregelmatige ontginningen liggen op de brede stroomrug, waar het engdorp Linschoten zich heeft ontwikkeld. In de middeleeuwen zijn vanaf de stroomrug, de Lange Linschoten en de noordelijke IJsseldijk de achterliggende gebieden in verkavelingsblokken strookvormig
    ontgonnen. Langs de ontginningsassen concentreerde zich de bebouwing in een enkel of dubbel lint. De Montfoortsche Vaart was onderdeel van de vaarroute tussen Montfoort en Amsterdam en dateert uit 1617. De Linie van Linschoten (onderdeel van de Oude Hollandse Waterlinie, aangelegd in 1796) bestaat uit een deels afgegraven aarden schans die als groene structuur nog goed zichtbaar is in het open land. Ronde Venen Het radiale patroon van de middeleeuwse strokenverkaveling van de Ronde Venen, het turfwinningslandschap van de Vinkeveense Plassen en de orthogonale structuur van de droogmakerijen, vormen samen een staalkaart van kenmerkend agrarisch grondgebruik door de eeuwen heen. Vanaf de veenriviertjes Kromme Mijdrecht, Drecht, Waver en Winkel is in de middeleeuwen het grote veenkussen radiaal ontgonnen naar een centraal gelegen hoger punt. De zuid- en oostzijde werd benaderd vanuit de daartoe gegraven Ennipwetering, Geer- en Veenkade en de oostzijde vanuit de Oukoperdijk en de Groenlandsekade.
    Met zuwes werd het gebied in taartpunten verdeeld en in opstrekkende stroken ontgonnen. Halverwege vestigden zich de ringvormige boerderijlinten van Vinkeveen, Wilnis, Mijdrecht en Waverveen. Van deze ontginningen resteert langs de veenriviertjes nog slechts een smalle zone, terwijl ze in het zuidenoosten nog goed bewaard zijn gebleven. Door intensieve turfwinning in de zeventiende en achttiende eeuw zijn in het noordoosten de Vinkeveense Plassen ontstaan, met een karakteristiek patroon van legakkers en petgaten. In de negentiende eeuw zijn de overige plassen in een viertal droogmakerijen verkaveld binnen zware ringdijken. Soester Eng De Soester Eng vormt binnen het stedelijk gebied van Soest een ongeveer 1000 jaar oud open akkerbouwlandschap, dat ontgonnen is op een door landijs afgevlakt deel van de stuwwal. Op de noord- en noordoost flank van het akkerland, de zogenaamde eng, ontstond een langgerekte boerennederzetting met de lagere weide- en maatgronden (hooiland) aan de andere kant,
    langs de Eem. Dit dorp, Soest, wordt voor het eerst genoemd in 1028. Door eeuwenlange bemesting volgens het potstalsysteem kreeg de Soester Eng een 60 tot 80 centimeter dik humus ophogingsdek. Door 20ste-eeuwse verstedelijking is driekwart van de Soester Eng bebouwd geraakt. Het resterende zuidelijke deel van de eng wordt aan de westzijde begrensd door de erfgrenzen achter de Molenstraat en aan de zuidzijde door die achter de Nieuweweg en de Parklaan. De noord- en oostzijde wordt grotendeels begrensd door de spoorlijn. Begraafplaats en de bebouwing aan de Veldweg maken geen deel uit van het gebied. De grootste waarde ligt in de herkenbaarheid van de Soester Eng als open, nauwelijks beplant en zichtbaar geperceleerd historisch akkerbouwcomplex met enkele historische wegen en restanten van verbindingen naar zowel de boerderijen aan de Lange Brink als naar de voormalige heidevelden en veengebieden. Markante elementen zijn de in 2006 herbouwde korenmolen De Windhond en de 4000 jaar oude
    grafheuvel het Enghenbergje. Vanaf hooggelegen punten zijn er vergezichten naar de Lazarusberg, de Kerktoren, Soest-Zuid, Amersfoort en de Eempolder. De Soester Eng is met het flankendorp Soest, de lage weidelanden en de hogere heidegronden het beste en nog relatief meest gave voorbeeld op de Utrechtse Heuvelrug van het middeleeuwse landbouwsysteem op de zandgrond. Cope-ontginningscomplex Hei- en Boeicop, e.o. De Vijfheerenlanden is een typisch Hollands polderlandschap, waar het strakke middeleeuwse ontginningsregiem van de Utrechtse bisschop en zijn kapittels nog doorheen schemert. Centraal daarin gelegen bevindt zich het cope-ontginningscomplex Hei- en Boeicop, één van de grootste aaneengesloten veengebieden van Nederland. Lage ruimtelijke dynamiek door geringe verstedelijking binnen de door rivieren en dwarsdijken omsloten gebied heeft gezorgd voor het intact blijven van de twaalfde-eeuwse cope-ontginningen, gekenmerkt door een opeenvolging van systematische en regelmatige ontginningsblokken
    haaks op de Diefdijk als belangrijke waterkerende dwarsdijk. Uitgangspunt was een vaste dieptemaat van 1000 meter in Bolgerijen, 1250 meter in Hei- en Boeicop en Zijderveld en 1500 meter in Middelkoop en Leerbroek. De belangrijkste cultuurhistorische kenmerken van de Vijfheerenlanden zijn: a. De waardevolle boerderijlinten met oriëntatie op de ontginningsbases van weteringen en kaden: Zijderveld (enkelzijdig kort lintdorp), Hei- en Boeicop (dubbelzijdig lintdorp Hei- en Boeicop, enkelzijdig boerderijlint Overboeicop), Diefdijk (enkelzijdig lang), Overheicop (enkelzijdig kort), Middelkoop (enkelzijdig lang), Leerbroek (enkelzijdig lang), Loosdorp (enkelzijdig kort), Schoonrewoerd (dubbelzijdig lintdorp); b. Monumentale boerderijen, waarvan vele op woonterpen gebouwd; c. Lintdorpen met dorpskerken Zijderveld, Hei- en Boeicop, Schoonrewoerd, Middelkoop en Leerbroek; d. Kasteelterrein Ter Leede; e. Strookvormige verkaveling met vaste dieptemaat per ontginningsblok en met een gemiddelde kavelbreedte
    van 40 tot 80 meter als gevolg van latere opsplitsingen (115 meter oorspronkelijke ontginningsmaat); f. Structuur van deels doorlopende dwarskaden en zijdewenden als begrenzing van de ontginningsblokken, waarvan enkele oude bestuursgrenzen aangeven; g. Systeem van middelweteringen halverwege de ontginningsblokken; h. Waterstaatskundige relicten als molenplaatsen, gemalen, sluizen/stuwen e.d. Zouweboezem De in 1277 aangelegde Zouwendijk moest de Alblasserwaard beschermen tegen toestromend water uit de hoger gelegen Vijfheerenlanden. In 1370 werd de Oude Zederik gegraven om water uit de polders naar de Lek af te voeren. Op de kruising van de Lekdijk en de Oude Zederik werd een afwateringssluis gebouwd, waarna hier het buurtschap Sluis ontstond. De buitendijkse boezem werd in de achttiende eeuw aangevuld met een veel grotere binnendijkse boezem. De oude sluizen zijn bij de dijkverbetering verdwenen. Het grootste deel van het binnendijkse gedeelte van de historische Zouweboezem, is nu natuurgebied
    en kenmerkt zich door de onbebouwde ruimte van de vroegere boezem en het historische grondgebruik van griend- en rietteelt. Het grondgebruik en de omringende kades maken het gebied als boezem duidelijk herkenbaar. Het deel direct achter de Lekdijk is door het gebruik als boomgaard minder herkenbaar. De Zouwendijk en de tegenoverliggende Zederikkade (de begeleidende kades rond de boezem en aan de Oude Zederik) vormen de kenmerkende begrenzing van het binnendijkse boezemgebied. Daarin is het toevoerkanaal aan de oostkant bewaard gebleven. Aan de kade staat ook de historische Vlietmolen, een wipwatermolen die het water uit de polder Lakerveld uitmaalde op de Oude Zederik, de kooikerswoning en enkele boerderijen. Van belang langs de Zouwendijk zijn de wielen die getuigen van vroegere dijkdoorbraken. In het buitendijkse deel is de uitwatering naar de Lek herkenbaar als door bomen en riet omzoomde ‘kreek’. De bergboezem is daar min of meer herkenbaar in een stelsel van waterlopen en kadetracés,
    aansluitend op de uitwatering. Ook het buitendijks kanaal vanuit de binnendijkse bergboezem is nog aanwezig. In de buurtschap Sluis zijn de belangrijkste beelddragers van de uitwateringssituatie aan de Lekdijk het vroegere gemaal en het monument, bestaand uit fragmenten van de 3 verdwenen sluizen (hoek Sluis - Zouwendijk) en de stoker- en machinistenwoning. Ondersteunend is het dijkbewakingshuis (Sluis 16) tegenover het gemaal. 2.4 Historische infrastructuur Het beleid van de Historische infrastructuur richt zich op het behoud en de versterking van de samenhang en de beleefbaarheid van de 3 iconische routes: Route Impériale, Via Regia en Wegh der Weegen. De cultuurhistorische waarde ligt met name in: a. het historische tracé; b. de historische structuur van de weg; c. sporen in het landschap gerelateerd aan de historische aanleg; d. bijbehorende historische elementen, waaronder trek- en jaagpaden, sluisjes en (grens)paaltjes. Route Impériale In 1812/1813 werd op last van Napoleon Bonaparte
    de Route Impériale 1e Classe No.2 van Parijs naar Amsterdam aangelegd als 1 van de 14 belangrijkste wegen in zijn Keizerrijk. De weg van Breda-Gorinchem-Utrecht-Amsterdam maakt hier onderdeel van uit en is één van de oudste verharde wegen in de provincie Utrecht. Na de val van Napoleon is de weg opgenomen in het Rijkswegenstelsel. De route volgde meestal een zo recht mogelijk tracé, vaak met een kerktoren van het volgende dorp als oriëntatiepunt. Grotendeels werd in de provincie Utrecht gebruik gemaakt van bestaande wegen, die vervolgens werden aangepast aan de Franse standaarden (o.a. 4 meter brede verharde strook op verhoogde baan, beplanting met bomen aan weerszijden en aan de buitenzijde een sloot of greppel). De weg volgde de dijken en oeverwallen langs kanalen en rivieren. Sommige bochtige tracés werden afgesneden door ‘coupures’ (zoals de Amsterdamsestraatweg en tussen Lexmond en Vianen en tussen Baambrugge en Abcoude). De weg was vooral bestemd voor personen- en postverkeer (zwaar
    verkeer was niet toegestaan). Door de opkomst van de spoorwegen degradeerde de weg en bleef het smalle profiel tot in de twintigste eeuw gehandhaafd. De eerste en grootste structurele aanpassing was een verbreding die voortvloeide uit het Rijkswegenplan van 1927 (deels verdwijnen beplanting, bermsloten en jaagpaden). In het herziene Rijkswegenplan van 1932 werd besloten om speciale autosnelwegen buiten de bebouwde kom aan te leggen (A2). Hierdoor werd het doorgaande autoverkeer verbannen van deze weg en zijn verdere verbredingen en doorbraken uitgebleven. De speciale kenmerkende eigenschappen zijn zodoende op veel plaatsen nog bewaard gebleven. De weg kenmerkt zich door: a. veelal een grillig tracé, gebruikmakend van oude dijken en oeverwallen, deels met rechtstanden (aangelegde ‘coupures’); b. de loop van stad naar stad en van dorp naar dorp, door diverse beschermde stads- en dorpsgezichten en door gebieden met een hoge landschappelijke waarde (zelfs Nationale Landschappen); c. het
    smalle profiel, over de gehele lengte goed bewaard gebleven en soms extra smal in dorpen en op dijktracés met bebouwing; d. de historische lintbebouwing die vaak pal aan de weg staat (bijvoorbeeld in Jutphaas); e. een grote variatie aan functies langs de weg (woningen, boerderijen, landhuizen, tolhuizen, uitspanningen, diverse weggerelateerde functies en bedrijven); f. de originele laanbeplanting van een bomenrij ter weerszijden die op diverse plaatsen nog aanwezig is; g. kleinschaligheid (slechts op enkele plaatsen aangetast door grootschalige ontwikkelingen); h. het onderdeel zijn van de omgeving. Via Regia De verbinding van Utrecht naar Rhenen (en verder naar Wageningen en Arnhem) is een van de oudste wegen in ons land en gaat terug op de Via Regia (Koningsweg of Heerweg), een oude handelsweg van Utrecht naar Keulen. De Via Regia bestond zeker al in de 10e eeuw, aangezien de Utrechtse bisschop met enige regelmaat naar Keulen diende te reizen. Bijzonder is de ligging aan de voet van
    de stuwwal tussen hoog (dekzand) en laag (klei). Hij volgt zoveel mogelijk dezelfde hoogtelijn om niveauverschil te vermijden. Grote delen van de route bestonden uit een dubbelweg: een bovenweg op de zuidflank die door de betere begaanbaarheid de eigenlijke Via Regia is, en de benedenweg, die als kerkweg de dorpen aan de voet van de stuwwal met elkaar verbond. Uiteindelijk werd de benedenweg tussen de dorpen de hoofdweg, dat is nu de N225. De N225 begint tegenwoordig bij Driebergen, waar deze aansluit op de A12. Het stuk Utrecht-Zeist maakt nu deel uit van de N237 (Utrecht-Amersfoort), het deel Zeist-Driebergen staat onder lokaal beheer. De weg heeft sinds de jaren ''50 weinig tracéwijzigingen ondergaan en loopt nog dwars door de dorpskernen van Zeist, Driebergen, Doorn, Leersum, Amerongen, Elst en Rhenen. Langs de weg zijn in de 19e eeuw tientallen buitenplaatsen verrezen, die de weg een grandeur gaven die op sommige plaatsen nog aanwezig is. Dankzij de lusttuinen van de villa''s en
    de bosaanplant op de Heuvelrug is en was de weg ook zeer lommerrijk. De weg, én de interlokale trams die er tussen 1879 en 1949 hebben gereden, openden het gebied voor het toerisme. Langs de hele weg verrezen hotels, pensions en uitspanningen, waarvan soms nog restanten herkenbaar zijn. De weg is een van de interessantste in de provincie. Hij kent een rijke geschiedenis als belangrijke verbindingsweg (postkoets en drukste tramroute) en verbindt een grote diversiteit aan landschappen en identiteiten met elkaar (bos, weides, rivier en landgoederen en boerennederzettingen). De weg loopt door de dorpen heen en wordt gekenmerkt door de ligging op de grens van hoog naar laag en door de vele buitenplaatsen, landgoederen en villa’s, de bebossing en de tabaksteelt. Wegh der Weegen De Wegh der Weegen (Amersfoortseweg (N237) is in 1653 aangelegd als een classicistische weg op gezamenlijk initiatief van de stad Amersfoort en de Staten van Utrecht. Een comfortabele en bestendige verbinding door de
    wildernis over de onvruchtbare zandgrond tussen Utrecht en Amersfoort was gewenst. Het is het grootste infrastructurele project uit de zeventiende eeuw in de provincie Utrecht. Architect van de weg was vermoedelijk Jacob van Campen. De 11 kilometer kaarsrechte weg tussen de Amersfoortse Galgenberg en de buitenplaats Vollenhoven werd als ‘cierlijke weg’ aangelegd met een zeer breed profiel met van oorsprong 3 rijen bomen aan beide zijden. Dit benadrukte het voorname karakter en de rechte lijn. De weg werd opgedeeld in een regelmatige vakkenverkaveling (24 vakken van ieder 100 roeden (=376m) breed en diep). De vakken werden afgebakend met wallen beplant met hakhout. Om de gebiedsontwikkeling te kunnen financieren werd de grond ter weerszijden van de weg gratis uitgegeven voor de bouw van buitenplaatsen (met hun overplaatsen op de kavel aan de andere zijde van de weg, zodat er uitzicht was op eigen bezit), in ruil voor de verplichting van het aanleggen van de weg, het beplanten en bewallen
    en het onderhoud volgens voorwaarden. De kavels werden gescheiden door sorties, voorzien van wallen met beplanting aan beide zijden. De sorties dienden als ontsluitingsweg voor de heide ten noorden en zuiden van de weg, zodat verkeer en schaapskuddes de weg konden oversteken. Essentieel voor de Wegh der Weegen (Amersfoortseweg) is het symmetrisch-monumentale karakter. De cultuurhistorische kwaliteit ligt vooral in de nog geheel aanwezige verkavelingsritmiek met haakse dwarsassen (sorties) en achterpaden, die rond Huis ter Heide en Soesterberg in de loop der tijd aan weerszijden van de weg naar achteren zijn verlengd en ook in de lanen- en wallenstructuur. Door verbredingen en omleggingen is het monumentale karakter van de weg op diverse plaatsen aangetast, maar tussen Soesterberg en de Stichtse Rotonde is de oorspronkelijke structuur nog zichtbaar. Meer informatie ten aanzien van de buitenplaatsen aan de Amersfoortseweg is te vinden bij het thema Historische Buitenplaatsen en in de Cultuurhistorische
    Atlas (CHAT). 2.5 Archeologie De cultuurhistorische waarde van Archeologie ligt met name in: a. voor de deelgebieden Utrechtse Heuvelrug, Limes en Dorestad: 1. de samenhang tussen de verschillende archeologische structuren en elementen; 2. de relatie tussen archeologische structuren en elementen en het landschap; b. aanvullend voor het deelgebied Limes: 1. de lineaire structuur van de Limes. Limes De Limes is de voormalige noordgrens van het Romeinse Rijk. Het betreft de grootste lineaire structuur van Europa, lopend van Roemenië tot in Groot-Brittannië. In de provincie Utrecht volgt de Limes de loop van de Neder-, Kromme en Oude Rijn. De Limes is bovengronds vrijwel nergens zichtbaar. De archeologische resten liggen verborgen in de bodem, veelal onder het grondwaterpeil, waardoor in onze gebieden sprake is van een unieke conservering. Het verhaal van de Limes is zowel het verhaal van de Romeinse soldaten in de forten als het verhaal van de inheemse bevolking daaromheen en de wisselwerking
    tussen beide groepen. In deze verordening wordt het accent gelegd op de aan de militaire aanwezigheid gerelateerde ruimtelijke structuren: a. de grensrivier, met scheepswrakken (in de voormalige bedding), waterwerken en archeologisch waardevolle geulopvullingen; b. de Limesweg, op de zuidelijke oevers van de Rijn; c. forten (castella) met bijbehorende kampdorpen (vici), grafvelden, wachttorens en waterwerken; d. een zone langs en op korte afstand van de Romeinse Rijn en Limesweg met daarbinnen (het mogelijk voorkomen van), (water)wegen, (semi-militaire) nederzettingen, religieuze centra, grafvelden en aanverwante monumenten. Utrechtse Heuvelrug De Utrechtse Heuvelrug is 150.000 jaar geleden ontstaan tijdens de voorlaatste ijstijd, het Saalien. Het stuwwallenlandschap bezit een grote diversiteit aan archeologische waarden uit verschillende perioden, van de Steentijd tot de Tweede Wereldoorlog. Juist de stapeling van tijdlagen maakt de Utrechtse Heuvelrug zo bijzonder. Deze is het sterkst
    op de zuidelijke flanken. Op deze gradiënt (overgangszone naar de lagere kleigronden) bevinden zich diverse concentraties van prehistorische grafheuvels, celtic fields en vroegmiddeleeuwse grafvelden. Ook treffen we hier nederzettingsterreinen uit de Brons- en IJzertijd aan als voorlopers van de middeleeuwse esdorpen met hun bouwgronden (engen), alsmede middeleeuwse wegenpatronen en tabaksvelden uit de Nieuwe Tijd. De belangrijkste bekende archeologische locaties op de Heuvelrug zijn: a. Kwintelooyen (Steentijd); b. Celtic fields, grafheuvels en nederzettingen (met name Brons- en IJzertijd); c. Merovingisch grafveld Rhenen en Oud-Leusden (Vroege Middeleeuwen); d. Plantage Willem III (tabakscultuur, Nieuwe Tijd); e. Grebbeberg, Kamp Amersfoort, Vliegbasis Soesterberg (Tweede Wereldoorlog). Dorestad Dorestad geniet internationale bekendheid als icoon van Europese handel en is een strategisch belangrijke plaats geweest, onder andere in de strijd tussen Friezen en Franken. De bloeitijd van
    Dorestad als handelsnederzetting lag in de achtste en het begin van de negende eeuw. In de tweede helft van de negende eeuw had Dorestad ernstig te lijden onder expedities van (Deense) Vikingen. In 863 werd de nederzetting grotendeels verwoest. Wederopbouw bleef uit. Het agrarische deel van de nederzetting is waarschijnlijk voort blijven bestaan, getuige de melding van ‘villa Wic’ in historische bronnen uit het jaar 948. Dorestad lag voor een deel ter plaatse van het huidige Wijk bij Duurstede. De langgerekte nederzetting ontstond langs de oever van Kromme Rijn en Lek. De Kromme Rijn verlegde haar loop vanaf de achtste tot de twaalfde eeuw steeds verder naar het (noord)oosten, waardoor een nieuwe strook drassig land ontstond tussen de bewoning en de rivier. De belangrijkste bekende archeologische locaties zijn: a. handelskwartier met haven; b. bestuurlijk centrum; c. kerk en grafveld; d. agrarische zone met boerderijen. Landschap Eemland Voor het landschap Eemland willen we de volgende
    kernkwaliteiten behouden: a. extreme openheid; b. slagenverkaveling; c. veenweidekarakter; d. historie van de Zuiderzee; e. Grebbelinie; f. overgangsgebieden (bij Eemnes, Soest en Amersfoort). Deze kernkwaliteiten hebben in de verschillende deelgebieden van Eemland verschillende accenten. Een uitge­breide beschrijving en handvatten voor het omgaan met de kernkwaliteiten hebben we opgenomen in de Kwaliteitsgids voor de Utrechtse Landschappen . Bij ontwikkelingen in het landschap van Eemland vinden we het vooral van belang dat de open ruimte behouden wordt. Dit betekent behoud van een continue open ruimte langs de Eem, van Randmeer tot Amersfoort. Bij ontwikkelingen kan de openheid versterkt worden door verplaatsing van bebouwing, begroeiing of andere opgaande elementen. Nieuwe bebouwing vestigt zich bij voorkeur in randzones of in bestaande linten, waarbij deze laatste wel transparant blijven. Landschap Gelderse Vallei Voor het landschap Gelderse Vallei willen we de volgende kernkwaliteiten
    behouden: a. rijk gevarieerde kleinschaligheid; b. stelsel van beken, griften en kanalen; c. Grebbelinie; d. Overgang van Vallei naar stuwwal (luwe Flank). Deze kernkwaliteiten hebben in de verschillende deelgebieden van de Gelderse Vallei verschillende accenten. Een uitgebreide beschrijving en handvatten voor het omgaan met de kernkwaliteiten hebben we opgenomen in de Kwaliteitsgids voor de Utrechtse Landschappen . De Grebbelinie maakt ook deel uit van de Cultuurhistorische hoofdstructuur, zie hiervoor het artikel Cultuurhistorische hoofdstructuur. Bij ontwikkelingen in het landschap van de Gelderse Vallei vinden we het vooral van belang dat de kleinschaligheid, die dit landschap zo aantrekkelijk maakt behouden blijft. In het verleden zijn al veel kleinschalige landschapselementen verdwenen, waardoor ruimten groter zijn geworden. Ze hebben hun functie verloren en zijn verwijderd. Daarnaast vragen wij aandacht voor het waarborgen en ontwikkelen van de contrasten in de te onderscheiden
    deelgebieden van de Gelderse Vallei. Landschap Groene Hart Voor het landschap Groene Hart willen we de volgende kernkwaliteiten behouden: a. openheid; b. (veen)weidekarakter (incl. strokenverkaveling, lintbebouwing, etc.); c. landschappelijke diversiteit; d. rust & stilte. Deze kernkwaliteiten zijn benoemd in de Voorloper Groene Hart. De kernkwaliteiten hebben in de verschillende deelgebieden van het Groene Hart verschillende accenten. Een uitgebreide beschrijving en handvatten voor het omgaan met de kernkwaliteiten hebben we opgenomen in de Kwaliteitsgids voor de Utrechtse Landschappen . In het Groene Hart liggen agrarische cultuurlandschappen die deel uit maken van de Cultuurhistorische hoofdstructuur, zie hiervoor het artikel Cultuurhistorische hoofdstructuur. Bij ontwikkelingen in het landschap van het Groene Hart staat het bevorderen van de diversiteit op het schaalniveau van de verschillende typen landschap centraal. Daarbij worden de kernkwaliteiten gerespecteerd en benut te worden
    om de contrasten tussen de verschillende typen landschap te behouden. Enkel en alleen het accent leggen op rust en stilte doet geen recht aan het Groene Hart. Het waarborgen van rust vraagt ook het bieden van ruimte voor vormen van dynamiek. Daarbij ligt de focus op het vergroten van de contrasten in rust en dynamiek tussen de agrarische landschappen van de velden en de dynamische landschappen van de oude stroomruggen. De provincie vraagt dus zorgvuldig om te gaan met de open, lege ruimte en de dynamiek te concentreren in de ‘zones’. Landschap Rivierengebied Voor het landschap Rivierengebied willen we de volgende kernkwaliteiten behouden: a. schaalcontrast van zeer open naar besloten; b. samenhangend stelsel van rivier - uiterwaard - oeverwal - kom; c. samenhangend stelsel van hoge stuwwal - flank - kwelzone - oeverwal – rivier; d. de Kromme Rijn als vesting en vestiging. Deze kernkwaliteiten hebben in de verschillende deelgebieden van Rivierengebied verschillende accenten. Een uitgebreide
    beschrijving en handvatten voor het omgaan met de kernkwaliteiten hebben we opgenomen in de Kwaliteitsgids voor de Utrechtse Landschappen . Bij ontwikkelingen in het landschap van het Rivierengebied staat het waarborgen en ontwikkelen van de eigen identiteiten van de 5 deelgebieden centraal. Dit richt zich zowel op het goed tot uiting komen van de karakteristieke kenmerken langs de centrale ruggengraat, als van de geleidelijke overgangen tussen de deelgebieden. Landschap Utrechtse Heuvelrug Voor het landschap Utrechtse Heuvelrug willen we de volgende kernkwaliteiten behouden: a. robuuste eenheid; b. reliëfbeleving; c. extreme historische gelaagdheid. Deze kernkwaliteiten hebben in de verschillende deelgebieden van Utrechtse Heuvelrug verschillende accenten. Een uitgebreide beschrijving en handvatten voor het omgaan met de kernkwaliteiten hebben we opgenomen in de Kwaliteitsgids voor de Utrechtse Landschappen . Op de Utrechtse Heuvelrug ligt een agrarisch cultuurlandschap dat deel uit
    maken van de Cultuurhistorische hoofdstructuur, zie hiervoor het artikel Cultuurhistorie. Bij ontwikkelingen in het landschap van de Utrechtse Heuvelrug vragen we aandacht voor het in stand houden van het reliëf en voor het in stand houden van het samenhangend boscomplex. Vanwege het reliëf en de overige kwaliteiten van de Heuvelrug willen we in dit gebied geen grootschalige ontgrondingen. Kleinschalige ontgrondingen voor natuurontwikkeling of recreatieve ontwikkeling zijn welmogelijk, mits geen onevenredige afbreuk wordt gedaan aan de kwaliteiten. Luchtvaartterrein De provincie Utrecht beschikt over afwisselende landschappen - met daarin de historisch waardevolle steden Utrecht en Amersfoort - en andere karakteristieke grotere en kleinere steden en dorpen. Het landelijk gebied kenmerkt zich door uitgestrekte veenweidegebieden, plassen, bossen op de Heuvelrug, het halfopen landschap van de Gelderse Vallei, het Kromme Rijngebied en het rivierenlandschap. Op het gebied van landschap, wonen,
    werken, voorzieningen en historie kent onze provincie unieke kenmerken en kwaliteiten. Het spanningsveld tussen ruimte voor wonen, werken en infrastructuur ten opzichte van ruimte voor natuur, landschap en groen rond de stad en voor de uitoefening van agrarische functies is kenmerkend voor de provincie Utrecht. Meer dan in welke provincie dan ook is het verdelen en toewijzen van schaarse ruimte één van de belangrijkste onderwerpen in het provinciaal beleid. Dit maakt ook dat er in de provincie Utrecht nauwelijks ruimte is voor luchtvaartterreinen. De enorme ruimtelijke claim van de vliegbasis Soesterberg is mede de oorzaak geweest van de sluiting ervan. Algemene uitgangspunten In het afwegingskader duurzaamheid wordt er een integrale afweging gemaakt tussen de belangen “People, Planet en Profit” en de effecten die een beleid heeft op volgende generaties en elders op de wereld. Aanvragen voor luchthavenbesluiten en luchthavenregelingen, die hinder voor de omgeving kunnen opleveren, zullen
    met name op deze punten beoordeeld worden. Ons streven is de hinder voor de omgeving (mens en dier) zo beperkt mogelijk te houden. Dit betekent dat - als verzoeken worden gedaan om vliegactiviteiten mogelijk te maken - nut en noodzaak van deze activiteiten moeten worden aangetoond. Met betrekking tot het luchtverkeer wordt een onderscheid gemaakt tussen structureel en tijdelijk en uitzonderlijk gebruik: tot en met 12 vliegdagen per jaar is er sprake van tijdelijk en uitzonderlijk gebruik. Hierop zijn de Beleidsregels van toepassing. Vanaf 13 vliegdagen per jaar is er sprake van een structureel gebruik van een terrein. Gemotoriseerd luchtverkeer met een structureel karakter. In een aantal gebieden in de provincie Utrecht is het niet wenselijk dat er verstoring optreedt door opstijgend en dalend gemotoriseerd luchtverkeer. Gezien de effecten van gemotoriseerde luchtvaart zullen in alle gevallen de kwaliteiten stilte en rust, worden aangetast. Nieuwe initiatieven ten aanzien van structureel
    helikopterverkeer en gemotoriseerde kleine en recreatieve luchtvaart in stiltegebieden, het natuurnetwerk Nederland (NNN), de Groene contour, ganzenrustgebieden en weidevogelkerngebieden zijn niet toegestaan. Voor ganzenrustgebieden en weidevogelkerngebieden geldt dit uitsluitend voor de gevoelige periode (wintermaanden, resp. broedseizoen). Rondom deze gebieden wordt een bufferzone van 2 km aangehouden. Binnen deze bufferzone is gemotoriseerd landen en opstijgen uitsluitend toegestaan als de aanvrager voor de aanwijzing van een terrein als luchtvaartterrein voldoende heeft aangetoond dat dit geen invloed heeft op het gevoelige gebied (het zogenaamde nee, tenzij regime). Ook moet er voldaan worden aan de eisen van de Natuurwetgeving en het daarop gebaseerde provinciale beleid. Om het milieu te beschermen, en hinder en gevaar zoveel mogelijk te voorkomen, worden eisen gesteld aan de locatie en het gebruik van nieuwe luchtvaartterreinen, specifiek private, bedrijfsgebonden of commerciële
    luchtvaartterreinen. Hoofdprincipe is dat de provincie geen nieuwe luchtvaartterreinen wil nabij woningen en andere geluidgevoelige functies (te weten onderwijsgebouwen, ziekenhuizen en verpleeghuizen, verzorgingstehuizen, psychiatrische inrichtingen en kinderdagverblijven) in verband met geluidoverlast. De belangrijkste eisen die de provincie stelt aan locatie en het gebruik van een nieuw luchtvaartterrein zijn: a. bij het voorgenomen gebruik mogen er geen woningen en andere geluidgevoelige functies (komen te) liggen binnen de 48 dB Lden geluidcontour; b. een nieuw luchtvaartterrein moet minimaal 500 meter afstand tot de dichtstbijzijnde woning of andere geluidgevoelige functie aanhouden; c. bij het voorgenomen besluit mogen er geen kwetsbare objecten liggen binnen de 10-6 Externe veiligheidscontour (komen te) liggen. Als de 48 dB Lden contour buiten de 500 meter lijn ligt dan geldt die 500 meter lijn uiteraard als grens voor geluidgevoelige functies. Geluid wordt bij luchtvaartterreinen
    uitgedrukt in dB Lden-contouren. Deze contour is een jaargemiddelde en kan pas worden gehandhaafd na afloop van dat jaar. Zeker bij kleinere luchtvaartterreinen zijn Lden-contouren voor de burger onvoorspelbaar. In andere rechtsgebieden, met name de ruimtelijke ordening zijn afstandsgrenzen gebruikelijk. Een afstand van minimaal 500 meter biedt ook voldoende bescherming aan de omwonenden tegen geluidhinder door pieklawaai. Een geluidniveau van 48 dB Lden komt overeen met 10% ernstig gehinderden. Dit wil zeggen dat bij een geluidbelasting van 48 dB Lden vliegtuiglawaai 10 % van de mensen aangeeft ernstig gehinderd te zijn. De provincie is van mening dat het accepteren van meer dan 10 % ernstig gehinderden niet past binnen haar omgevingsdoelstellingen. Van de afstandseis van 500 meter kan alleen worden afgeweken als de aanvrager aantoont dat de beoogde luchtvaartactiviteiten geen negatieve effecten hebben op de leefomgevingskwaliteit van de woningen en de andere geluidgevoelige functies.
    Hierbij zal onder meer worden getoetst aan de optredende piekniveaus op woningen en andere geluidgevoelige functies. Daarnaast wordt het cumulatieve effect van de beoogde vliegactiviteit meegewogen. Met deze afstand kan worden voldaan aan het uitgangspunt van de Omgevingswet dat stelt dat voor piekgeluid een maximale belasting van 65 dB (A) Lmax in de avond (19:00-23:00 uur) en 70 dB(A) gedurende de dagperiode (7.00 – 19.00 uur) aanvaardbaar is. Het landen en opstijgen tijdens de nachtperiode is in de provincie Utrecht niet toegestaan. Dit geldt overigens niet voor traumavluchten. De aanvrager voor de luchtvaartactiviteiten moet berekeningen van de geluideffecten en de effecten op externe veiligheid overleggen zoals opgenomen in het Besluit burgerluchthavens . Op basis daarvan kan getoetst worden aan dit beleidskader. Positie trauma-, politie-, brandweer en SAR-helikopter. Als gemotoriseerde luchtvaartuigen, zoals helikopters of RPAS (drones) worden ingezet in het kader van uitvoering
    van een wettelijke taak of bij spoedeisende hulpverlening, dan is het noodzakelijk dat zij op elk terrein mogen landen of opstijgen. Het gaat hierbij om vluchten ten behoeve van de spoedeisende medische hulpvluchten (HEMS), Search and Rescue (SAR)-vluchten en politievluchten. Om die reden vallen deze activiteiten niet onder het verbod om te landen op of op te stijgen van een niet aangewezen lucht­vaartterrein. Permanente stationering van dergelijke luchtvaartuigen moet wel plaatsvinden op een luchtvaartterrein met een luchthavenbesluit of -regeling. Bij luchtvaartterreinen met uitsluitend een maatschappelijke of nutsfunctie (bijvoorbeeld bij ziekenhuizen) wordt het publieke belang nadrukkelijk meegewogen. Ook hierbij zal worden getoetst of de omgevingskwaliteit niet óf zo min mogelijk wordt belast met de aanwezigheid van de luchtvaartterreinen. Deze bijlage heeft betrekking op verschillende categorieën borden, spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten, te weten:
    permanente, tijdelijke en bijzondere. Permanente borden spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten A. Toegelaten borden, spandoeken en vlaggen bij een bedrijfsgebouw of tankstation a. Borden en spandoeken tegen de gevel zijn toegestaan, op het dak niet. b. Bij een bedrijfsgebouw of tankstation worden alleen borden, spandoeken en vlaggen geplaatst en behouden die betrekking hebben op een beroep, bedrijf of dienst, uitgeoefend in dat gebouw in overeenstemming met het omgevingsplan. c. Borden, spandoeken en vlaggen worden alleen geplaatst en behouden in het gebied tussen het hoofdgebouw en de openbare weg. d. Het aantal en de omvang van borden, spandoeken en vlaggen op een perceel is maximaal: 1. 1 vrijstaand bord in het gebied tussen het hoofdgebouw en de openbare weg met een oppervlak van niet meer dan 2,5 m2; 2. maximaal 1 permanent bord voor de verkoop van agrarische producten; 3. in totaal niet meer dan 9 m2 aan borden en spandoeken plat tegen de gevel bij tankstations;
    4. een dakrandbord rondom de overkapping van de brandstofpompen; 5. 2 borden binnen 5 meter van de inrit met een oppervlak van niet meer dan 2,5 m2; en 6. 4 vlaggen voor of tegen het gebouw met een oppervlak van ieder niet meer dan 6 m2. e. Het permanente bord voor de verkoop van agrarische producten heeft een oppervlakte van niet meer dan 2,5 m2, een lengte van niet meer dan 2 meter en een hoogte van niet meer dan 2,5 meter boven maaiveld. f. Een dakrandbord heeft een hoogte van niet meer dan 1,5 meter en bevat alleen het logo van de brandstofleverancier. g. Borden bij de inrit hebben een hoogte van niet meer dan 1,5 meter boven maaiveld. h. In afwijking van sub d, onder 1. en 5., heeft het brandstofprijzenbord een breedte van niet meer dan 2 meter en een hoogte van niet meer dan 7,5 meter boven maaiveld. Toelichting op A. Toegelaten borden, spandoeken en vlaggen bij een bedrijfsgebouw of tankstation Het betreft borden, spandoeken en vlaggen over de uitoefening van een dienst, beroep
    of bedrijf, inclusief een tankstation. Er moet een duidelijke relatie bestaan tussen het bord of spandoek en de functie van het gebouw. Het gaat daarbij om borden en vlaggen op het gebouw of een bord in de onmiddellijke nabijheid daarvan. Het kan hier gaan om restaurants, hotels, tuincentra enzovoort. Borden tegen de gevel zijn toegestaan, op het dak niet. Inritborden markeren de entree van het betreffende pand. Verder geldt: als er meerdere bedrijven op het terrein zitten, dan moeten zij het toegestane bord delen. De borden, spandoeken of vlaggen moeten worden geplaatst in het gebied tussen het hoofdgebouw en de weg. Naast plaatsing op het erf mogen de borden geplaatst worden volgens de grafische weergave op de volgende tekening. Tijdelijke borden spandoeken, vlaggen, informatiezuilen en verglijkbare objecten B. Toegelaten borden en spandoeken voor de koop, huur of verpachting van een zaak a. In aanvulling op onderdeel A, kunnen maximaal 1 bord en 1 spandoek worden geplaatst en behouden
    die betrekking hebben op de koop, huur of verpachting van de woning of het bedrijfspand op het betreffende erf of bouwperceel. b. Het bord of spandoek heeft een oppervlakte van maximaal 2,5 m2, een lengte van maximaal 2 meter en een hoogte van maximaal 2,5 meter boven maaiveld. c. Het bord of spandoek wordt niet verlicht. d. Het bord of spandoek wordt verwijderd zodra de woning of het bedrijfspand is verkocht, verhuurd of verpacht. Toelichting op B. Toegelaten borden en spandoeken voor de koop, huur of verpachting van een zaak Dit zijn tijdelijke makelaarsborden of -spandoeken. De borden of spandoeken moeten op het betreffende erf of bouwperceel staan. Het gaat dan bijvoorbeeld om woningen, bedrijfspanden, boerderijen of winkels. Borden gericht op het aanbieden van onbebouwd terrein vallen alleen onder de vrijstelling als het bord geplaatst kan worden in de directe nabijheid van een gebouw. Plaatsing in het open veld heeft namelijk een veel grotere impact op het landschap en is daarom
    ongewenst. C. Toegelaten borden bij projecten a. Bij een project worden alleen borden geplaatst en behouden die betrekking hebben op een woningbouwlocatie, wegwerkzaamheden of een bouwwerk, waterwerk of natuurontwikkelingsproject. b. Er worden maximaal 2 informatieborden geplaatst. c. Een bord langs een autosnelweg heeft een oppervlakte van maximaal 28 m2 en een lengte van maximaal 7 meter in 1 richting en een hoogte van maximaal 6 meter boven maaiveld. d. Bij overige wegen heeft het bord een oppervlakte van maximaal 6 m2, een lengte van maximaal 3 meter en een hoogte van maximaal 5 meter boven maaiveld. e. Alleen borden langs een autosnelweg worden verlicht. f. Borden worden verwijderd zodra het project is gerealiseerd. Toelichting op C. Toegelaten borden bij projecten Projecten zijn woningbouwlocatie, wegwerkzaamheden of een bouwwerk, waterwerk of natuurontwikkelingsproject. Bij woningbouwlocaties maakt het bord de bouw van een relatief groot woningproject bekend, dat (eventueel op
    termijn) binnen het stedelijk gebied zal vallen, met vermelding van 1 centraal nummer. De vrijstelling gaat dus uitdrukkelijk niet over een bord bij de bouw van een enkele woning. De vrijstelling voor het plaatsen van informatieborden bij wegwerkzaamheden gaat niet over de verkeerskundige aanwijzingen met snelheidsbeperkingen, omleidingen en dergelijke. Bij bouwwerken, waterwerken of natuurontwikkelingsprojecten kan gedacht worden aan borden en spandoeken met een lijst van betrokken opdrachtgevers en aannemers tijdens de aanleg of uitvoering van het werk. Daarnaast gaat het om de tijdelijke bouwborden en spandoeken bij verbouwingen van panden. D. Toegelaten borden, spandoeken en vlaggen voor de verkoop van agrarische producten a. In aanvulling op onderdeel A kunnen voor de verkoop van agrarische producten de volgende borden, spandoeken en vlaggen worden geplaatst en behouden in de directe omgeving van het verkooppunt: 1. maximaal 2 seizoens- en perceelsgebonden borden en spandoeken;
    en 2. maximaal 2 seizoens- en perceelsgebonden vlaggen voor de tijdelijke verkoop van agrarische vollegrondsproducten op het oogstperceel. b. De seizoen- en perceelsgebonden borden, spandoeken en vlaggen worden maximaal 1 week voor de aanvang van de oogst geplaatst en binnen 1 week na afloop weer verwijderd. c. De seizoen- en perceelsgebonden borden en spandoeken hebben een oppervlakte van maximaal 2,5 m2, een lengte van maximaal 1,5 meter en een hoogte van maximaal 2,5 meter boven maaiveld. d. De seizoen- en perceelsgebonden vlaggen hebben een oppervlakte van maximaal 2,5 m2. e. Het permanente bord en de seizoen- en perceelsgebonden borden, spandoeken en vlaggen worden niet verlicht. Toelichting op D. Toegelaten borden, spandoeken en vlaggen voor de verkoop van agrarische producten Deze regeling biedt de mogelijkheid om een borden en vlaggen te plaatsen voor de verkoop van agrarische streekproducenten in de directe omgeving van het verkooppunt. Ook mogen tijdelijke seizoensborden, spandoeken
    en vlaggen worden geplaatst, bijvoorbeeld bij een kersenboomgaard. Ze mogen zo lang het fruit in de boomgaard beschikbaar is aanwezig zijn. E. Toegelaten borden, spandoeken, vlaggen en vergelijkbare objecten voor openbare wedstrijden, manifestaties, evenementen of tentoonstellingen a. In de openbare ruimte worden alleen borden, spandoeken en vlaggen geplaatst en behouden die betrekking hebben op een openbare wedstrijd, manifestatie, evenement of tentoonstelling. b. De borden, spandoeken en vlaggen worden maximaal 3 weken vooraf geplaatst en uiterlijk 3 dagen na afloop verwijderd. c. De borden, spandoeken en vlaggen worden niet gebruikt voor de gebruikelijke commerciële uitoefening van een beroep, bedrijf of dienst. d. Er worden maximaal 2 borden of spandoeken, maximaal 4 vlaggen en 1 vergelijkbaar object op de betreffende locatie geplaatst. e. Bij in de directe omgeving aanwezige autowegen worden maximaal 2 borden of vlaggen geplaatst. f. De borden, spandoeken, vlaggen en het vergelijkbaar
    object worden niet verlicht, tenzij het een evenement bij een dierentuin of tuincentrum betreft. Toelichting op E. Toegelaten borden, spandoeken, vlaggen en vergelijkbare objecten voor openbare wedstrijden, manifestaties, evenementen of tentoonstellingen Hier gaat het om tijdelijke spandoeken, vlaggen en vergelijkbare objecten voor diverse gebeurtenissen: openbare wedstrijden, manifestaties, evenementen of tentoonstellingen. Uit verkeerstechnisch oogpunt kan het ook wenselijk zijn de route naar een evenement e.d. te bewegwijzeren. Deze vrijstelling geldt ook voor tijdelijke borden voor evenementen zoals fiets- en wandeltochten, wielerrondes en puzzelritten. De wegbeheerder bepaalt of de borden noodzakelijk zijn. Plaatsing van de borden moet gebeuren volgens de voorschriften van de betrokken wegbeheerder. Bijzondere borden spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten F. Toegelaten borden voor duurzame energie a. Voor informatie over terreinen, die specifiek gebruikt
    worden voor het opwekken van duurzame energie, worden alleen de volgende borden geplaatst en behouden: 1. maximaal 1 inritbord en maximaal 1 bord tegen de gevel van een gebouw; en 2. maximaal 1 vrijstaand informatiebord, als het terrein een oppervlakte heeft van 1 hectare of meer. b. Het inritbord heeft een oppervlakte van maximaal 2,5 m2 en een hoogte van maximaal 1,5 meter boven maaiveld. c. Het bord tegen de gevel van een gebouw heeft een oppervlakte van maximaal 2,5 m2. d. Het informatiebord op een terrein van 1 hectare of meer heeft een oppervlakte van maximaal 12 m2. e. De informatie op de borden bestaat voor maximaal 5% uit reclame. f. Er wordt op windmolens alleen merknaam of logo geplaatst op de gondel. g. De borden en de gondel worden niet verlicht. Toelichting op F. Toegelaten borden voor duurzame energie Met het oog op de bewustwording van het publiek is het wenselijk, dat de mogelijkheid bestaat bij de locaties waar duurzame energie opgewekt wordt, voorlichting te geven.
    G. Toegelaten borden voor aankondigingen op rotondes a. Bij een rotonde worden alleen borden geplaatst en behouden door de wegbeheerder om aan te geven dat het onderhoud van de rotonde is gesponsord. b. Er worden maximaal 2 borden op een rotonde geplaatst. c. Een bord op een rotonde heeft een lengte van maximaal 1 meter en een hoogte van maximaal 0,7 meter boven maaiveld. d. De borden op een rotonde worden niet verlicht. Toelichting op G. Toegelaten borden voor aankondigingen op rotondes Het onderhoud van rotondes, in het bijzonder de beplanting, wordt in toenemende mate gesponsord. De vrijstelling maakt het mogelijk om, met borden op de betreffende rotonde, de sponsor kenbaar te maken. H. Toegelaten borden, spandoeken, vlaggen en vergelijkbare objecten voor aankondigingen bij sportvelden en sportterreinen a. Bij een sportveld of sportterrein worden alleen borden, spandoeken, vlaggen en vergelijkbare objecten geplaatst en behouden als het sportveld of sportterrein is opgenomen in het
    omgevingsplan. b. Van borden, spandoeken en vergelijkbare objecten, anders dan borden en spandoeken bij het clubgebouw, is het opschrift of de afbeelding gericht naar het sportveld of sportterrein. c. Het sportterrein is omgeven door een afschermende beplantingsstrook. d. Het bord, spandoek of vergelijkbaar object heeft een hoogte van maximaal 2 meter boven maaiveld. e. Borden en spandoeken worden plat tegen de gevel van een clubgebouw geplaatst, of 1 bord wordt direct voor het clubgebouw of de directe omgeving van de inrit geplaatst. f. De oppervlakte van een bord dat direct voor het clubgebouw wordt geplaatst is maximaal 2,5 m2. g. Een bord bij een inrit van een clubgebouw heeft een oppervlakte van maximaal 2,5 m2 en een hoogte van maximaal 1,5 meter boven maaiveld. h. Er worden maximaal 4 vlaggen voor of tegen het clubgebouw geplaatst, met een oppervlakte van maximaal 6 m2. Toelichting op H. Toegelaten borden, spandoeken, vlaggen en vergelijkbare objecten voor aankondigingen bij sportvelden
    en sportterreinen Borden, spandoeken en vergelijkbare objecten zijn vaak aanwezig rondom sportterreinen. Deze objecten mogen op een sportterrein geplaatst worden, onder voorwaarde dat de zijde met de tekst of de afbeelding naar het speelveld toe staat. Om de landschappelijke impact van deze objecten te beperken, geldt de vrijstelling alleen als het sportterrein is omringd door een afschermende beplantingsstrook. I. Toegelaten borden, vlaggen, spandoeken en vergelijkbare objecten voor het uiten van gedachten en gevoelens a. Bij een erf in de nabijheid van een gebouw worden alleen borden, vlaggen, spandoeken en vergelijkbare objecten geplaatst en behouden die dienen tot het uiten van gedachten en gevoelens als bedoeld in artikel 7 van de Grondwet . b. Er worden maximaal 2 borden , spandoeken of vergelijkbare objecten, of maximaal 4 vlaggen of vergelijkbare objecten geplaatst. c. De borden, vlaggen, spandoeken en vergelijkbare objecten bevatten geen bedrijfsreclame. d. Een bord, spandoek
    en vergelijkbaar object heeft een oppervlakte van maximaal 1 m2, een lengte dan wel breedte van maximaal 1 meter en een hoogte van maximaal 2,5 meter boven het maaiveld. Vlaggen en vergelijkbare objecten hebben gezamenlijk een maximale oppervlakte van 6 m2. e. De borden , vlaggen, spandoeken en vergelijkbare objecten worden niet verlicht. Toelichting op I. Toegelaten borden, vlaggen, spandoeken en vergelijkbare objecten voor het uiten van gedachten en gevoelens Borden, vlaggen, spandoeken en vergelijkbare objecten ter openbaring van gedachten en gevoelens zijn toegestaan volgens artikel 7 van de Grondwet . De vrijheid van meningsuiting bevat 2 elementen: openbaringsvrijheid en verspreidingsvrijheid. Dit laatste ziet op de vorm van het openbaren van een mening: plaats, tijd en wijze van uiting. De openbaringsvrijheid wordt niet beperkt. De verspreidingsvrijheid wordt deels ingeperkt: het kan niet op iedere willekeurige locatie in de open ruimte. De vrijstelling hoort bij een erf met een
    gebouw, dus in een bewoonde omgeving. Verder gelden er afmetingenvoorschriften en is er een maximumaantal borden, vlaggen, spandoeken en vergelijkbare objecten. De borden, vlaggen, spandoeken en vergelijkbare objecten moeten worden geplaatst in het gebied tussen het hoofdgebouw en de weg. Naast plaatsing op het erf mogen de borden geplaatst worden volgens de grafische weergave op de volgende tekening. Uitbreidingslocatie Wonen Toelichting Wonen (max. aantal woningen) Houten 270 250 Eiland van Schalkwijk 20 ''t Goy Woerden 90 Haanwijk (Harmelen) Deze bijlage bevat de voorwaarden als bedoeld in Artikel 6.43 , onder b, van de verordening. Aan deze voorwaarden moet, naast de overige in Artikel 6.43 , aanhef en onder a, genoemde voorwaarden, volledig worden voldaan om de in het artikel beschreven activiteit vergunningvrij te kunnen uitvoeren. Voorwaarden betreffende de voorbereiding van de werkzaamheden: a. initiatiefnemer laat, gelijktijdig met de voor dit soort werkzaamheden wettelijk verplichte
    asbestinventarisatie, door een deskundige een inventarisatie van de aanwezige soorten uitvoeren; b. deze inventarisatie wordt, als bijlage bij de asbestinventarisatie, aan het bevoegd gezag ter beschikking gesteld; c. de activiteit wordt binnen één jaar na de inventarisatie uitgevoerd in verband met de vereiste actualiteit van de inventarisatiegegevens. Voorwaarden betreffende vervangende nestgelegenheid, voortplantings- of rustplaats: a. per aanwezig nest van de kerkuil of steenuil dat door de werkzaamheden wordt vernield, beschadigd of weggenomen, stelt de initiatiefnemer in ieder geval 3 maanden voor de start van de uitvoering minimaal 2 vervangende nestgelegenheden beschikbaar in de vorm van nestkasten; b. per aanwezig nest van de huismus dat door de werkzaamheden wordt vernield, beschadigd of weggenomen, stelt de initiatiefnemer in ieder geval 3 maanden voor de start van de uitvoering minimaal 2 vervangende nestgelegenheden beschikbaar in de vorm van een nestkast en nestmateriaal;
    c. per aanwezige vaste voortplantingsplaats of rustplaats van de steenmarter of boommarter die door de werkzaamheden wordt vernield of beschadigd stelt de initiatiefnemer na afloop van de werkzaamheden in de directe omgeving van het andere bouwwerk waarvan de asbesthoudende dakplaten worden vervangen, vergelijkbaar nestmateriaal beschikbaar. Voorwaarden betreffende de werkzaamheden voor het vervangen van de asbesthoudende dakplaten: a. de werkzaamheden voor het vervangen van de asbesthoudende dakplaten vinden plaats in de periode van 31 augustus tot 15 maart, niet tijdens de vorst en op het moment dat jongen of eieren niet in het nest aanwezig zijn; b. de werkzaamheden laten de constructie van het bouwwerk inclusief betimmering en boeiboorden ongemoeid; c. de werkzaamheden worden per dak binnen 5 aaneengesloten dagen uitgevoerd; d. als uit de inventarisatie of in de periode daarna blijkt dat er een nest van de kerkuil of steenuil aanwezig is, worden de werkzaamheden begeleid door een
    deskundig ecoloog of de plaatselijke uilenwerkgroep; e. na afloop van de werkzaamheden is de locatie waarop het nest of de vaste verblijfplaats van de huismus, kerkuil, steenuil, steenmarter of boommarter was gemaakt, weer op dezelfde wijze geschikt en toegankelijk als vóór het uitvoeren van de werkzaamheden. De Omgevingswet (hierna: de wet) bepaalt in artikel 2.6 dat provinciale staten één omgevingsverordening vaststellen waarin regels over de fysieke leefomgeving worden opgenomen. De wet regelt geen overgangsrecht voor bestaande provinciale verordeningen die opgaan in de omgevingsverordening op basis van de wet. Dus treedt de Omgevingsverordening (PS maart 2022) tegelijk in werking met de wet (1 januari 2024). In de Omgevingsverordening provincie Utrecht zijn regels over de fysieke leefomgeving opgenomen. De Omgevingsverordening is de opvolger van de Interim Omgevingsverordening provincie Utrecht (PS op 10 maart 2021). Onder de systematiek van de wet wordt geen geheel nieuwe Omgevingsverordening
    meer opgesteld, maar worden onderdelen van de verordening gewijzigd. Ook de terinzagelegging en besluitvorming gaan alleen over de te wijzigen onderdelen van de Omgevingsverordening. Deel I van de 1e wijziging is op 1 maart 2024 inwerking getreden, deel II op 1 september 2024. De Omgevingsverordening bevat instructieregels over taken en bevoegdheden van gemeenten en waterschappen. Daarnaast bevat de omgevingsverordening direct werkende regels. Dit zijn regels die rechtstreeks gelden voor bedrijven, burgers en andere initiatiefnemers bij het uitvoeren van een activiteit. Bijvoorbeeld: vergunningplichten, waarbij op basis van een aanvraag eerst een besluit wordt genomen, gelden voor iedereen. Andere voorbeelden van direct werkende regels zijn de meld- en informatieplichten en de specifieke zorgplichten. Het ontwerp van de Omgevingsverordening is gebaseerd op: de Omgevingswet ; het Besluit activiteiten leefomgeving ; het Besluit kwaliteit leefomgeving ; het Omgevingsbesluit ; de Omgevingsregeling
    ; en de Provinciewet . Subsidiariteit De Omgevingsverordening bevat verschillende soorten regels. In de eerste plaats de “verplichte regels”. Dit zijn de regels die de provincie moet opnemen op grond van de wet, zoals bijvoorbeeld regels over beschermde natuurgebieden (natuurnetwerk Nederland) en omgevingswaarden voor regionale kering en wateroverlast. In de tweede plaats zijn regels opgenomen ten behoeve van de provinciale belangen en de provinciale wettelijke taken. Die regels worden alleen gesteld als dit volgt uit het Afwegingskader en dit doelmatig en doeltreffend is. Deze regels bestaan uit instructieregels en regels voor activiteiten. Instructieregels richten zich tot gemeenten en waterschappen en gaan over de inhoud en motivering van een omgevingsplan, waterschapsverordening, peilbesluit, legger en programma’s. Regels voor activiteiten gelden voor iedereen (burgers en bedrijven). Digitaal Stelsel Omgevingswet (DSO) In het digitale stelsel zijn er verschillende functies die allemaal
    met standaarden worden ondersteund. Denk aan het publiceren van omgevingswetbesluiten, het afleveren van een vergunningaanvraag of een melding en aan het opvragen van informatie in het Omgevingsloket. De Omgevingsverordening heeft een formele juridische status en moet daarom voldoen aan digitale vereisten qua bestandsformaat, structurering en vormgeving. Hiermee kan zij formeel gepubliceerd worden en voor digitale dienstverlening aan burgers, bedrijven en partners via "een klik op de kaart” toegankelijk zijn via het DSO. Dit heeft tot gevolg dat de digitaliseringsopgave leidend is voor de opzet van de (wijziging Ontwerp) Omgevingsverordening. Na een “klik op de kaart” zijn de regels en informatie te zien die gelden op een specifieke locatie. Op een specifieke locatie kunnen meerder regels uit de Omgevingsverordening van toepassing zijn. Provinciaal belang STAD EN LAND GEZOND Provinciaal belang Toelichting Bevorderen van een gezonde leefomgeving. De provincie heeft wettelijke/(boven)regionale
    taken op het gebied van geluid, stilte, luchtkwaliteit, geur en waterkwaliteit. Het betreft het beperken van de milieubelasting vanuit diverse bronnen naar waarden die niet negatief bijdragen aan de gezondheid van onze inwoners. Bevorderen van een veilige inrichting van de leefomgeving. De provincie heeft wettelijke/(boven)regionale taken op het gebied van waterveiligheid, externe veiligheid en verkeersveiligheid op en rond de provinciale infrastructuur. Versterken van onderlinge relatie tussen ‘stad’ en ‘land’ De zones rondom de kernen vormen de verbinding tussen het stedelijk en het landelijk gebied. Ze hebben invloed op kwaliteit en uitstraling van de steden en dorpen en van het landelijk gebied. Tegengaan leegstand en verrommeling draagt bij aan vitaliteit van de kern. Zodanige condities scheppen dat een goede recreatieve structuur wordt behouden en versterkt. De recreatieve structuur bestaat uit routenetwerken, waterwegen en voorzieningen zoals recreatieterreinen, verblijfsaccommodaties
    en zwemwater. Het overschrijdt gemeente- en provinciegrenzen. De provincie richt zich op een evenwichtige spreiding van toeristen en recreanten over stad en landelijk gebied, een op de vraag aansluitend aanbod en zorg voor behoud van stilte voor de rustzoekende mens. Bevorderen van een inclusieve samenleving. De provincie kan met haar taken voor de fysieke leefomgeving ook voorwaarden scheppen voor een inclusieve samenleving. Bijvoorbeeld op het gebied van openbaar vervoer of de woningbouwprogrammering. Ook kan ze hiermee bijdragen aan sociale samenhang en aan dat iedereen mee kan doen in de maatschappij. KLIMAATBESTENDIG EN WATERROBUUST Provinciaal belang Toelichting Bevorderen van een klimaatbestendige leefomgeving. De aanpak van de door klimaatverandering veroorzaakte wateroverlast, hittestress, overstromingen en droogte is vaak regionaal. Er is ruimte nodig voor afdoende klimaatbestendige ingrepen en regionale afstemming en samenwerking om te komen tot een klimaatadaptieve inrichting
    van de fysieke leefomgeving. Ontwikkelen van een robuust en duurzaam bodem- en watersysteem. De provincie heeft wettelijke taken op het gebied van de bodem- en watersystemen (zowel grond- als oppervlaktewater). Toekomstige veranderingen en ontwikkelingen vragen om het behoud van een duurzaam evenwicht tussen benutten en beschermen op provinciaal niveau. Het regionale bodem- en watersysteem is de drager van de bovengrondse ruimtelijke ontwikkelingen. Het systeem stopt niet bij gemeentelijke grenzen en vraagt om regionale keuzes. Waarin de provincie rekening houdt met gebied specifieke belangen en opgaven. Bevorderen van het afremmen van bodemdaling. Afremmen van bodemdaling vergt een gemeentegrensoverschrijdende, (boven)regionale aanpak. DUURZAME ENERGIE Provinciaal belang Toelichting Bijdragen aan het verminderen van energiegebruik. De provincie draagt bij aan de inzet op besparing om de impact van de energietransitie te verminderen. Als de energievraag afneemt, wordt de druk op de ruimte
    voor het realiseren van duurzame energie beperkter. Bevorderen van en voldoende ruimte bieden aan de realisatie van duurzame energiebronnen. De realisatie van duurzame energiebronnen vergt een regionale aanpak, omdat de impact veelal verder gaat dan een individuele gemeente. De uitwerking van provinciale en nationale ambities voor energietransitie vraagt om regie op provinciaal schaalniveau. Daarnaast zijn wij bevoegd gezag voor het mogelijk maken van een deel van de duurzame energieprojecten. VITALE STEDEN EN DORPEN Provinciaal belang Toelichting Bevorderen van binnenstedelijke ontwikkeling. Binnenstedelijke ontwikkeling, dat wil zeggen binnen het stedelijk gebied van steden, dorpen en overige kernen, inclusief transformatie, herstructurering en de aanpak van leegstand, heeft bovengemeentelijke aspecten, omdat we te maken hebben met regionale markten voor woon- en werk- en kantoorlocaties. Het gaat daarbij om regionale afstemming en het creëren van een gelijk speelveld in alle gemeenten.
    Voldoende ruimte bieden voor het realiseren van een op de behoefte aansluitend aanbod van woningen en woonvoorzieningen. Er is een regionale woningmarkt die vraagt om regionale programmering en afstemming. Het gaat om een aanbod dat op regionaal niveau in kwantitatieve en kwalitatieve zin is afgestemd op de (toekomstige) behoefte en de vraag van alle woningzoekenden, qua woningtype en woonmilieu en qua betaalbaarheid. Voldoende ruimte bieden voor het functioneren en versterken van een vitale, circulaire en innovatieve regionale economie. De markten voor kantoren en bedrijventerreinen functioneren op regionaal niveau. Dit vraagt om regionale programmering en afstemming. Het gaat om een aanbod dat op regionaal niveau in kwantitatieve en kwalitatieve zin aansluit bij de behoefte. Voldoende ruimte bieden voor behoud en versterking van een goede retailstructuur. Een gevarieerd en bereikbaar aanbod van winkels is mede bepalend voor de binnenstedelijke kwaliteit en de typering van woonmilieus.
    Ontwikkelingen in de ene gemeente kunnen gevolgen hebben voor de retailstructuur in de andere gemeente. DUURAAM, GEZOND EN VEILIG BEREIKBAAR Provinciaal belang Toelichting Zorgdragen voor en voldoende ruimte bieden aan goede, duurzame en veilige bereikbaarheid van woon-, werk- en vrijetijdslocaties. Mobiliteitssystemen overstijgen veelal het lokale niveau en zelfs het regionale niveau. Het gaat om het zo optimaal en zo duurzaam mogelijk afstemmen van ruimtelijke ontwikkeling en mobiliteit, én het met elkaar verbinden van vraag en aanbod en een verdere integratie van de verschillende vervoerwijzen en netwerken. Zorgdragen voor instandhouding van de provinciale infrastructuur en een adequaat provinciaal OV-netwerk. De provincie heeft een verantwoordelijkheid voor provinciale wegen en fietsinfrastructuur, traminfrastructuur en regionaal openbaar vervoer en heeft als decentrale OV-autoriteit een wettelijke verantwoordelijkheid voor de instandhouding van het regionale openbaar vervoer. LEVEND
    LANDSCHAP, ERFGOED EN CULTUUR Provinciaal belang Toelichting Ontwikkelen van kernkwaliteiten van het landschap en behouden van aardkundige waarden. De landschappen vormen gemeentegrensoverschrijdende structuren en kwaliteiten. Ook voor de natuur zijn de landschappen van groot belang. De aardkundige waarden zijn deel van de landschappelijke kwaliteiten. Beschermen en benutten van de waarden van de cultuurhistorische hoofdstructuur. De Cultuurhistorische hoofdstructuur omvat bovengemeentelijke en deels bovenprovinciale structuren waarbij de provincie zorgt voor de eenheid in aanpak van beschermen en benutten. Beschermen en benutten van de Outstanding Universal Value van UNESCO Werelderfgoed. De provincie heeft een wettelijke taak ervoor te zorgen dat de kernkwaliteiten van de bovengemeentelijke structuren van de Neder-Germaanse Limes, de Nieuwe Hollandse Waterlinie en de Stelling van Amsterdam als UNESCO Werelderfgoed niet worden aangetast. Zorgdragen voor een hoogwaardig aanbod cultuur
    en erfgoed. De provincie bevordert het restaureren van rijksmonumenten, het beheren van archeologische vondsten (wettelijke taak), het in stand houden van molens en kasteelmusea, het organiseren van festivals, het aanbieden van cultuur- en erfgoededucatie via het onderwijs en het faciliteren van het bibliotheeknetwerk (wettelijke taak). TOEKOMSTBESTENDIGE NATUUR EN LANDBOUW Provinciaal belang Toelichting Ontwikkelen en versterken van een robuust netwerk van natuur met hoge kwaliteit, en bevorderen van een betere beleefbaarheid. De provincie heeft een wettelijke taak voor de totstandkoming en instandhouding van het Europees en Nationaal Natuurnetwerk. Beleefbaarheid van en maatschappelijke betrokkenheid bij natuur dragen bij aan draagvlak voor natuur en daarmee aan de bescherming ervan. Behouden en versterken van de biodiversiteit. De provincie heeft een wettelijke taak voor het behoud/herstel van een gunstige staat van instandhouding van beschermde en bedreigde soorten en hun leefomgeving,
    en voor de preventie en beheersing van de introductie en verspreiding van invasieve uitheemse soorten. Daarnaast heeft de provincie zorgplicht voor behouden en versterken biodiversiteit. Beschermen en ontwikkelen van houtopstanden. De provincie heeft een wettelijke en bovenregionale taak voor behouden en beschermen houtopstanden. Vanuit het Klimaatakkoord heeft de provincie samen met andere partijen de opdracht tot vergroting van het oppervlak houtopstanden. Bevorderen van een duurzame en economisch rendabele landbouw. De agrarische sector beheert ongeveer de helft van het grondgebied in de provincie Utrecht. Het is belangrijk dat de sector economisch vitaal blijft en deze rol kan blijven vervullen. Vanuit het provinciale belang voor gebruik en kwaliteit van het landelijk gebied bieden we mogelijkheden voor een transitie naar een circulaire, natuurinclusieve, klimaatneutrale en diervriendelijke landbouw (kringlooplandbouw), met behoud van gebiedskwaliteiten en gezonde leefomgeving. Bij
    het opstellen van de verordening zijn de volgende algemene uitgangspunten gehanteerd: bestaande regels worden beleidsneutraal omgezet, tenzij uit de Omgevingsvisie of het stroomschema afwegingskader (zie hieronder) een andere keuze voortvloeit. Beleidsneutraal betekent niet regelneutraal: de instrumentkeuze en de formulering kunnen veranderen; regels worden geformuleerd vanuit het principe ‘Ja, mits’ in plaats van ‘Nee, tenzij’; de verordening bevat zo min mogelijk regels. Daarvoor wordt het 90-10-principe gehanteerd: regels in de verordening zijn bedoeld om in 90% van de gevallen te voldoen. De overige 10% wordt opgelost met flexibiliteit in de toepassing van de regels (bijvoorbeeld maatwerkvoorschriften); regels zijn logisch, eenduidig en samenhangend. De verschillen in systematiek en formulering binnen de huidige regels worden zo veel mogelijk opgelost en de regels zijn op elkaar afgestemd. De verordening bestaat uit verschillende hoofdstukken. Een hoofdstuk is onderverdeeld in afdelingen
    en als het nodig is in paragrafen en sub paragrafen. Hoofdstuk 1 bevat inleidende bepalingen en hoofdstuk 10 bevat bepalingen over uitvoering en procedures. Hoofdstuk 2 t/m 9 regelen de verschillende thema’s, zoals water, bodem, mobiliteit, energie, natuur, cultuur, landschap, landbouw, wonen, werken en recreëren. In de hoofdstukken 2 t/m 9 wordt een bepaalde volgorde aangehouden: omgevingswaarden (alleen in hoofdstuk 2); instructieregels : deze richten zich tot gemeenten, waterschappen en gedeputeerde staten. Regels die zich richten tot de faunabeheer- en wildbeheereenheden zijn ook te vinden bij de instructieregels; regels voor iedereen : deze regels gelden voor iedereen of voor degene die een bepaalde activiteit uitvoert. Wanneer de wet in werking treedt, komt er ook een nieuw Omgevingsloket . Dat wordt dé centrale plek waar alle digitale informatie over de fysieke leefomgeving in samenhang te vinden is. In het Omgevingsloket kunnen burgers en bedrijven zien wat kan en mag in hun
    leefomgeving. Aanvragen of meldingen kunnen gedaan worden via dat loket. Dat betekent dat overheden de regels zo moeten opschrijven dat ze zichtbaar worden in de viewer in het Omgevingsloket. Met die gedachte in het achterhoofd is binnen de regels voor iedereen gewerkt met een bepaalde volgorde: oogmerk; toepassingsbereik; zorgplicht; specifieke zorgplicht; verbod; vrijstelling; vergunningplicht (het is verboden zonder omgevingsvergunning een activiteit uit te voeren); vrijstelling van de vergunningplicht; beoordelingsregel aanvraag omgevingsvergunning; indieningsvereisten aanvraag omgevingsvergunning; meldplicht (het is verboden zonder melding een activiteit uit te voeren); indieningsvereisten meldingen; informatieplichten; eis(en) uitvoeren activiteit; maatwerkvoorschrift maatwerkregel.'
