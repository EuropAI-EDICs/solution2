- number: '2.17'
  text: '1. Bij waterschaarste of dreigende waterschaarste geeft het waterschap, gelet op de verdeling van het beschikbare water over de maatschappelijke en ecologische behoeften, bij de verdeling van het beschikbare water vanuit Amsterdam-Rijnkanaal en Lek wat betreft de in Artikel 3.14 , eerste lid, onder c, van het Besluit kwaliteit leefomgeving bedoelde behoeften, achtereenvolgens prioriteit aan: a. het verwerken van industrieel proceswater; en b. de tijdelijke beregening van kapitaalintensieve gewassen. 2. Bij waterschaarste of dreigende waterschaarste geeft het waterschap, gelet op de verdeling van het beschikbare water over de maatschappelijke en ecologische behoeften, bij de verdeling van het beschikbare water vanuit Amsterdam-Rijnkanaal en Lek wat betreft de in Artikel 3.14 , eerste lid, onder d, van het Besluit kwaliteit leefomgeving bedoelde behoeften, achtereenvolgens prioriteit aan: a. de waterkwaliteit in het Stedelijk gebied ; b. beroepsvaart; c. akkerbouw; d. beregening sportvelden;
    e. grasland; f. recreatievaart; en g. natuur, voor zover het niet gaat om het voorkomen van onomkeerbare schade. 3. Bij waterbehoeften buiten het gebied van het waterschap zijn het eerste en tweede lid van overeenkomstige toepassing.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.2__subsec_2.2.2__art_2.17
- number: '2.18'
  text: 'Bij waterschaarste of dreigende waterschaarste geeft het waterschap, met het oog op de verdeling van het beschikbare water voor het aanvoergebied vanuit de inlaat Grebbesluis in de Neder-Rijn , bij het beheer van de regionale wateren wat betreft de in artikel 3.14 , eerste lid, onder d, van het Besluit kwaliteit leefomgeving bedoelde behoeften, voor de regionale wateren achtereenvolgens prioriteit aan: a. doorspoeling in geval van een milieu-incident of vanwege de volksgezondheid; b. beroepsvaart; c. doorspoeling van stedelijk gebied ter verbetering van de waterkwaliteit of ter bestrijding van stankoverlast; d. akkerbouw en vollegrondstuinbouw; e. sportvelden en greens; f. beregening van gras- en maïsland; g. recreatievaart; en h. overige natuur, voor zover het niet gaat om het voorkomen van onomkeerbare schade, met inbegrip van maatregelen die nodig zijn voor het realiseren van de doelstellingen van de kaderrichtlijn water.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.2__subsec_2.2.2__art_2.18
- number: '2.19'
  text: '1. Het waterbeheerprogramma bevat in ieder geval: a. de beschrijving van de bestaande toestand van watersystemen waarover het beheer van het waterschap zich uitstrekt; b. het beleid voor het beheer van de watersystemen, gericht op de aan de watersystemen toegekende functies en doelstellingen; c. een beschrijving van de maatregelen met prioriteitstelling en fasering, die nodig zijn om de gestelde doelen te realiseren of de geconstateerde knelpunten op te lossen; en d. een raming van de kosten van de gedurende de planperiode te nemen maatregelen, een overzicht in de dekking van de kosten en een indicatie van het verloop van de op te leggen heffingen in de planperiode. 2. De motivering van een waterbeheerprogramma bevat een onderbouwing waarin in ieder geval is opgenomen: a. de aan het waterbeheerprogramma ten grondslag liggende afwegingen en uitkomsten van de uitgevoerde onderzoeken; en b. een overzicht van de strategische doelstellingen in het regionaal waterprogramma, die worden
    gerealiseerd door het uitvoeren van de maatregelen, bedoeld in het eerste lid, onder c.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.2__subsec_2.2.3__art_2.19
- number: '2.20'
  text: '1. De legger bevat in ieder geval: a. het lengteprofiel en de dwarsprofielen van de primaire en regionale waterkeringen en het profiel van vrije ruimte; b. de dwarsprofielen van de oppervlaktewaterlichamen die door het waterschap worden beheerd; en c. een omschrijving van de ondersteunende kunstwerken en de bijzondere constructies die deel uitmaken van de primaire en regionale waterkeringen en van de oppervlaktewaterlichamen die door het waterschap worden beheerd. 2. Het eerste lid is niet van toepassing op de Slaperdijk, bedoeld in Artikel 2.3 .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.2__subsec_2.2.4__art_2.20
- number: '2.21'
  text: 'De in artikel 2.39 , eerste lid, van de wet bedoelde verplichtingen om in de legger vorm en constructie te beschrijven, gelden niet voor: a. waterbergingsgebieden; en b. oppervlaktewaterlichamen die in de legger zijn aangeduid als C-wateren of tertiaire watergangen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.2__subsec_2.2.4__art_2.21
- number: '2.22'
  text: Het waterschap stelt binnen het Verplicht peilbesluitgebied één of meer peilbesluiten vast voor de oppervlaktewaterlichamen in gebieden waar het waterschap onder normale omstandigheden de wateraanvoer en waterafvoer kan beheersen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.2__subsec_2.2.5__art_2.22
- number: '2.23'
  text: '1. Het peilbesluit bevat de begrenzing van het gebied waarbinnen de oppervlaktewaterlichamen gelegen zijn waarop het peilbesluit betrekking heeft. 2. De motivering van een peilbesluit bevat een onderbouwing waarin in ieder geval is opgenomen: a. de aan het besluit ten grondslag liggende afwegingen en uitkomsten van de uitgevoerde onderzoeken; b. een aanduiding van de veranderingen van de waterstanden ten opzichte van de bestaande situatie; en c. een aanduiding van de gevolgen van de te handhaven waterstanden voor de diverse betrokken belangen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.2__subsec_2.2.5__art_2.23
- number: '2.24'
  text: Het waterschap draagt zorg dat een peilbesluit actueel is en in ieder geval is toegesneden op veranderingen in zowel de omstandigheden ter plaatse als de aanwezige functies en belangen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.2__subsec_2.2.5__art_2.24
- number: '2.25'
  text: 'De regels in deze paragraaf zijn gesteld met het oog op: a. het beschermen van de gezondheid van de gebruikers van een Zwemlocatie ; en b. het in en om het zwemwater voorkomen van verdrinking en letsel van de gebruikers.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.1__art_2.25
- number: '2.26'
  text: Deze paragraaf is van toepassing op het beheer van een op grond van artikel 3.2 van het Besluit kwaliteit leefomgeving door gedeputeerde staten aangewezen Zwemlocatie in oppervlaktewater.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.1__art_2.26
- number: '2.27'
  text: 'De houder van een Zwemlocatie : a. is gedurende het badseizoen verantwoordelijk voor een veilige en hygiënische zwemlocatie; b. treft maatregelen op grond van de resultaten van het jaarlijkse, conform de Handreiking fysieke veiligheid zwemmers in oppervlaktewater door of namens gedeputeerde staten uitgevoerde, veiligheidsonderzoek om de veiligheid te waarborgen of te verbeteren; c. draagt er zorg voor dat de maatregelen worden getroffen op basis van het zwemwaterprofiel die redelijkerwijs tot diens verantwoordelijkheid kunnen worden gerekend; d. voert periodiek voldoende beheer en onderhoud uit gericht op de veiligheid en hygiëne voor de gebruikers; e. draagt er zorg voor dat maatregelen worden genomen, die redelijkerwijs tot zijn verantwoordelijkheid kunnen worden gerekend, als er naar aanleiding van de monitoring uitgevoerd door de waterbeheerder van het oppervlaktewater zwemwaterverontreinigingen worden vastgesteld; f. voert periodiek voldoende onderzoek uit naar de omstandigheden
    in en om de zwemwaterlocatie die een negatief effect kunnen hebben op de veiligheid en hygiëne van de gebruikers; g. draagt zorg voor voldoende adequate sanitaire voorzieningen voor de gebruikers; h. draagt er zorg voor door middel van afbakening van een veilige zwemzone dat gebruikers veilig kunnen zwemmen en niet in aanraking kunnen komen met andere vormen van waterrecreatie die de veiligheid van de gebruikers in gevaar kunnen brengen; i. staat, met het oog op gevaren voor de veiligheid en hygiëne van de gebruikers, de provincie of RUD Utrecht of de Omgevingsdienst Utrecht toe tekens bij de zwemlocatie te plaatsen om gebruikers te informeren over een waarschuwing, negatief zwemadvies of zwemverbod; j. houdt, voldoende toezicht op de veiligheid van de zwemmers gedurende de uren dat de zwemlocatie is opengesteld voor het publiek, voor die locaties waar een financiële vergoeding wordt gevraagd aan de gebruikers voor het gebruik van de zwemlocatie; en k. stelt bij onverwachte situaties
    die negatieve gevolgen kunnen hebben op de kwaliteit van het zwemwater of de gezondheid en veiligheid van de zwemmers de provincie of de RUD Utrecht of de Omgevingsdienst Utrecht zo snel mogelijk hiervan op de hoogte.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.1__art_2.27
- number: '2.28'
  text: De regels in deze paragraaf zijn gesteld met het oog op het behoud van landschappelijke, natuurwetenschappelijke, cultuurhistorische en archeologische waarden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.1__art_2.28
- number: '2.29'
  text: Deze paragraaf is van toepassing op activiteiten met woonschepen, vaartuigen, andere drijvende voorwerpen, havens en aanlegplaatsen in het Gebied ligplaatsen .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.1__art_2.29
- number: 2.29a
  text: Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een activiteit met een woonschip, vaartuig, ander drijvend voorwerp, haven of aanlegplaats in het Gebied ligplaatsen , wordt de omgevingsvergunning alleen verleend voor zover het oogmerk van Artikel 2.28 niet onaanvaardbaar geschaad wordt.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.1__art_2.29a
- number: '2.30'
  text: '1. Het is verboden zonder omgevingsvergunning in het Gebied ligplaatsen een woonschip ligplaats te laten nemen, te ankeren, af te meren, of anderszins in het water te plaatsen of te houden. 2. Het is verboden om bij een woonschip een aanlegplaats en daarmee verband houdende oever- en afmeervoorzieningen te maken of te hebben, als: a. het woonschip in strijd met het eerste lid is afgemeerd; b. voor het woonschip een omgevingsvergunning met oeverbeleid geldt; of c. voor het woonschip een voorschrift bedoeld in Artikel 2.32 , derde lid, aan de omgevingsvergunning is verbonden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.2__art_2.30
- number: '2.31'
  text: 'Het verbod in Artikel 2.30 , eerste lid geldt niet voor: a. woonschepen waarvoor een omgevingsvergunning geldt op basis van type- of oeverbeleid; b. een woonschip bij een ligplaats, die als zodanig in een omgevingsplan is aangewezen, als: 1. dat omgevingsplan voldoet aan Artikel 9.6 ; of 2. dat woonschip voldoet aan de maximale maatvoering, bedoeld in Artikel 2.32 , eerste lid, onder b en c; en c. een woonschip in een jachthaven of bedrijfshaven , dat daar in gebruik is als verenigingsaccommodatie.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.2__art_2.31
- number: '2.32'
  text: '1. Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op het ligplaats laten innemen, ankeren, afmeren, of op een andere manier in het water plaatsen of houden van een woonschip in het Gebied ligplaatsen , wordt de omgevingsvergunning alleen verleend als: a. de ligplaats voor het woonschip aangewezen is in een omgevingsplan of als voor de ligplaats van het woonschip al een ontheffing gold op grond van de Interim Omgevingsverordening provincie Utrecht , Verordening bescherming natuur en landschap provincie Utrecht 1996, de Landschapsverordening provincie Utrecht 2011 of de Verordening Natuur en Landschap provincie Utrecht 2017; of b. een woonschip maximaal 30 meter lang, 6 meter breed en 4 meter hoog is. Hierbij gelden de volgende criteria: 1. deze maten zijn inclusief een eventueel terras in het verlengde van de lengterichting van het woonschip op aan waterzijde van het woonschip; 2. deze maten worden gemeten waar zij, met inbegrip van al hetgeen vast aan het woonschip
    verbonden is, boven of onder water het grootst zijn en de hoogte wordt gemeten vanaf de waterlijn en 3. bij het meten worden stuurhutten, masten, lichtkoepels, schoorstenen, antennes en andere ondergeschikte onderdelen buiten beschouwing gelaten. c. de onderlinge afstand tussen 2 woonschepen ten minste minimaal 5 meter bedraagt is; en d. als het gaat om een woonschip in een uiterwaard dan heeft de aanlegplaats op de oever minimale voorzieningen en heeft het woonschip het uiterlijk heeft van een varend voormalig binnenvaartschip. 2. Gedeputeerde staten kunnen in bijzondere gevallen afwijken van het eerste lid. 3. Gedeputeerde staten kunnen aan een omgevingsvergunning het voorschrift verbinden dat deze na afloop van de geldigheidsduur niet meer zal worden verleend aan dezelfde of een andere vergunninghouder of voor hetzelfde of een ander woonschip . 4. Gedeputeerde staten kunnen typebeleid of oeverbeleid opnemen in een omgevingsvergunning. 5. Het college van burgemeester en wethouders
    van de betrokken gemeente, het dagelijks bestuur van het betrokken waterschap, of een andere toepasselijke waterbeheerder, zijn adviseur voor de omgevingsvergunning, tenzij de aanvraag om omgevingsvergunning betrekking heeft op eigendomsoverdracht van een bestaande omgevingsvergunning of verlenging van de periode waarvoor omgevingsvergunning is verleend.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.2__art_2.32
- number: '2.33'
  text: 'In aanvulling op de aanvraagvereisten in de wet worden bij een aanvraag om een omgevingsvergunning, bedoeld in Artikel 2.30 , minimaal de volgende gegevens en bescheiden verstrekt: a. eventuele naam van het woonschip ; b. lengte van het woonschip in centimeters; c. breedte van het woonschip in centimeters; d. hoogte van het woonschip vanaf de waterspiegel in centimeters; e. kenmerk van het omgevingsplan waarin de ligplaats is aangewezen; f. een tekening in A4-formaat op schaal met daarop het woonschip, de ligplaats en eventuele afmeervoorzieningen zoals steigers, vlonders en afmeerpalen; g. de reden voor de aanvraag: 1. verlenging van een bestaande omgevingsvergunning; 2. wijziging van de tenaamstelling van een bestaande omgevingsvergunning; 3. vervanging van het woonschip; 4. verbouwing van het woonschip; of 5. nieuwe ligplaats; h. eventuele kenmerk van een eerder verleende omgevingsvergunning of een eerder verleende provinciale ontheffing; en i. eventuele startdatum en einddatum
    van de werkzaamheden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.2__art_2.33
- number: '2.34'
  text: 'De houder van een omgevingsvergunning kan gedeputeerde staten verzoeken de omgevingsvergunning: a. op naam van een ander te stellen; of b. te verlenen voor een vervangend woonschip op dezelfde locatie.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.2__art_2.34
- number: '2.35'
  text: Artikel 2.35
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.3__art_2.35
- number: '2.36'
  text: Het is verboden in het Gebied ligplaatsen een voorwerp, anders dan een woonschip of woonark , ligplaats te laten nemen, te ankeren, af te meren, of anderszins in, op of vlak boven een water te plaatsen of te houden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.3__art_2.36
- number: 2.36a
  text: 'Het verbod in Artikel 2.36 geldt niet voor: a. een vaartuig of drijvend voorwerp afgemeerd op plaatsen waarbij één van de verkeerstekens E.5 tot en met E.7.1 van bijlage 7 bij het Binnenvaartpolitiereglement en bijlage 7 van het Rijnvaartpolitiereglement zijn geplaatst; b. vaartuigen en voorwerpen in jachthaven s, bedrijfshaven s en waterscoutinglocatie s; c. vaartuigen en drijvende voorwerpen, die worden gebruikt bij het vervoer van uitsluitend bedrijfsmiddelen, voor zover zij tijdelijk voor het laden en lossen van die bedrijfsmiddelen worden afgemeerd; d. 1 open vaartuig met een lengte van maximaal 7 meter bij een direct aan het water gelegen erf , mits er geen gebruik wordt gemaakt van onderdeel e; e. 1 vaartuig, of 1 boatsaver met inliggend vaartuig, in een insteekhaven binnen een direct aan het water gelegen erf, als voor de insteekhaven een omgevingsvergunning, bedoeld in Artikel 2.41 , is verleend en mits het vaartuig of de boatsaver met inliggend vaartuig volledig binnen
    de begrenzing van de insteekhaven past; f. 1 vaartuig bij een direct aan het water gelegen erf in de periode 1 april tot en met 30 september, voor zover het aanmeren plaatsvindt ten behoeve van het zo spoedig als redelijkerwijs mogelijk is in- of uitladen, of vaarklaar maken van het vaartuig voor recreatief gebruik; g. het tijdelijk afmeren van vaartuigen voor het laten in- of uitstappen van passagiers bij horecagelegenheden, die als zodanig zijn aangewezen in een omgevingsplan; en h. historische vaartuigen, die als varend erfgoed, varend monument of historisch casco zijn ingeschreven in het register van de Federatie Varend Erfgoed Nederland en in goede staat van onderhoud verkeren, bij aanlegplaatsen voor historische vaartuigen, die als zodanig in een omgevingsplan zijn aangewezen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.3__art_2.36a
- number: '2.37'
  text: 'Het is verboden zonder omgevingsvergunning in het Gebied ligplaatsen : a. een vaartuig , anders dan een woonschip of woonark , ligplaats te laten nemen, te ankeren, af te meren, of anderszins in, op of vlak boven een water te plaatsen of te houden, tenzij de activiteit is toegelaten op grond van Artikel 2.36a ; of b. een boatsaver in een natuurlijke inham op eigen terrein ligplaats te laten nemen, te ankeren, af te meren, of anderszins in, op of vlak boven een water te plaatsen of te houden, tenzij de activiteit is toegelaten op grond van Artikel 2.36a .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.3__art_2.37
- number: '2.38'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op het ligplaats laten innemen, ankeren, afmeren, of op een andere manier in, op of vlak boven het water plaatsen of houden van een partyschip in het Gebied ligplaatsen , kan de omgevingsvergunning alleen verleend worden als: a. het gaat om maximaal 1 partyschip bij een in een omgevingsplan aangewezen horecagelegenheid; en b. het partyschip voldoet aan een landschappelijk inpassingsplan waarin het partyschip en de aanlegplaats op landschappelijke aspecten positief beoordeeld zijn.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.3__art_2.38
- number: '2.39'
  text: 'In aanvulling op de aanvraagvereisten in de wet worden bij een aanvraag om een omgevingsvergunning, bedoeld in Artikel 2.37 , minimaal de volgende gegevens en bescheiden verstrekt: a. eventuele naam van het vaartuig ; b. lengte van het vaartuig of de boatsaver in centimeters; c. breedte van het vaartuig of de boatsaver in centimeters; d. hoogte van het vaartuig of de boatsaver vanaf de waterspiegel in centimeters; e. type vaartuig (open of gesloten); f. in geval van een partyschip een landschappelijk inpassingsplan; g. omschrijving van de ligplaats (eigen erf , oeverzone tussen vaarweg en weg, oeverland); h. een tekening in A4-formaat op schaal met daarop het vaartuig of de boatsaver, de ligplaats en eventuele afmeervoorzieningen zoals steigers , vlonders en afmeerpalen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.3__art_2.39
- number: '2.40'
  text: Artikel 2.40
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.4__art_2.40
- number: '2.41'
  text: Het is verboden zonder omgevingsvergunning in het Gebied ligplaatsen insteekhaven s, havens of aanlegplaatsen en daarmee verband houdende voorzieningen, zoals steigers , meerpalen en vlonders, te maken of te houden, of als zakelijk gerechtigde dan wel gebruiker van een oever toe te laten of te gedogen dat insteekhavens, havens of aanlegplaatsen en daarmee verband houdende voorzieningen op of aan de betreffende oever worden aangelegd, tenzij de activiteit is toegelaten op grond van Artikel 2.42 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.4__art_2.41
- number: '2.42'
  text: 'Het verbod in Artikel 2.41 geldt niet voor: a. aanlegplaatsen en daarmee verband houdende voorzieningen, in jachthaven s, bedrijfshaven s en waterscoutinglocaties ; b. 1 aanlegsteiger met maximaal 2 meerpalen per direct aan het water gelegen erf , mits deze aanlegsteiger: 1. in of boven water een oppervlakte heeft van maximaal 7,2 m2; en 2. geen afbreuk doet aan het karakter van een eventueel aanwezige natuurlijke of natuurvriendelijke oever.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.4__art_2.42
- number: '2.43'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een insteekhaven in het Gebied ligplaatsen , wordt de omgevingsvergunning alleen verleend als: a. de insteekhaven is of wordt uitgegraven in een erf , waarbij per erf maximaal 1 insteekhaven is of wordt uitgegraven; b. een dubbele insteekhaven op de grens ligt van 2 naast elkaar gelegen erven ligt; c. de insteekhaven dwars op de vaarweg aangelegd wordt of aansluit op de cultuurhistorische verkavelingsrichting van sloten en waterwegen in het achterliggende landschap, tenzij het bevoegd gezag op het gebied van waterveiligheid gemotiveerd aangeeft dat een insteekhaven dwars op de vaarweg op de betreffende locatie niet mogelijk is; d. een enkele insteekhaven maximaal 8 meter lang en 3,25 meter breed is; e. een dubbele insteekhaven niet in de lengterichting van de vaarweg ligt; f. een dubbele insteekhaven maximaal 8 meter lang en 6 meter breed is; g. als op grond van onderdeel c, de insteekhaven wel dwars maar niet
    loodrecht op de vaarweg aangelegd kan worden, kan een geringe afwijking van de lengtemaat toegestaan worden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.4__art_2.43
- number: '2.44'
  text: 'In aanvulling op de aanvraagvereisten in de wet worden bij een aanvraag om een omgevingsvergunning, bedoeld in Artikel 2.41 , minimaal de volgende gegevens en bescheiden verstrekt: a. lengte van de haven of aanlegplaats in centimeters; b. breedte van de haven of aanlegplaats in centimeters; en c. een tekening in A4-formaat op schaal met daarop de haven of aanlegplaats met eventuele voorzieningen zoals steigers , vlonders en afmeerpalen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.2__subsec_2.3.2.4__art_2.44
- number: '2.45'
  text: De regels in deze paragraaf zijn gesteld met het oog op het behoud van landschappelijke, natuurwetenschappelijke, cultuurhistorische en archeologische waarden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.3__art_2.45
- number: '2.46'
  text: Deze paragraaf is van toepassing op het in het Gebied dempen oppervlaktewaterlichaam dempen van een oppervlaktewaterlichaam .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.3__art_2.46
- number: '2.47'
  text: 'Degene die een oppervlaktewaterlichaam dempt en weet of redelijkerwijs kan vermoeden dat die activiteit kan leiden tot nadelige gevolgen voor de belangen, bedoeld in Artikel 2.45 , is verplicht: a. alle maatregelen te nemen die redelijkerwijs van diegene kunnen worden gevraagd om die gevolgen te voorkomen; b. voor zover die gevolgen niet kunnen worden voorkomen, die gevolgen zoveel mogelijk te beperken of ongedaan te maken; en c. als die gevolgen onvoldoende kunnen worden beperkt, die activiteit achterwege te laten voor zover dat redelijkerwijs van diegene kan worden gevraagd.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.3__art_2.47
- number: '2.48'
  text: Het is verboden zonder omgevingsvergunning in het Gebied dempen oppervlaktewaterlichaam oppervlaktewaterlichamen te dempen tenzij de activiteit is toegelaten op grond van Artikel 2.49 en Artikel 2.50 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.3__art_2.48
- number: 2.48a
  text: Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op het dempen van een oppervlaktewaterlichaam in het Gebied dempen oppervlaktewaterlichaam , wordt de omgevingsvergunning verleend voor zover het oogmerk van Artikel 2.45 niet onaanvaardbaar wordt geschaad.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.3__art_2.48a
- number: '2.49'
  text: '1. Het verbod in Artikel 2.48 geldt niet voor: a. het uitvoeren of onderhoud van infrastructurele openbare werken en werken van groot maatschappelijk belang als: 1. het peilscheidingen van het waterschap betreft; 2. de activiteiten plaatsvinden binnen het uitvoeringsgebied van een vergund bestek; of 3. de werken zijn aangewezen in een omgevingsplan. b. onderhouds-, herstel-, bouw- of sloopwerkzaamheden op bouwpercelen als het bouwperceel is aangewezen in een omgevingsplan. 2. De activiteiten, bedoeld in onderdeel a en b van het eerste lid, duren niet langer dan noodzakelijk.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.3__art_2.49
- number: '2.50'
  text: 'Het verbod in Artikel 2.48 geldt niet voor het aanleggen van verbindingen tussen agrarische weide- en akkerpercelen als bij het aanleggen van verbindingen tussen de percelen: a. de onderlinge verbinding tussen de percelen door dammen met duikers wordt ingericht; b. de verbinding maximaal 10 meter breed is, gemeten vanaf het maaiveld in de lengterichting van het afgedamde oppervlaktewaterlichaam tussen de aansluitingen van de dam op de oorspronkelijke oever; en c. niet dusdanig veel verbindingen aangebracht worden dat dit een onaanvaardbare aantasting oplevert van de belangen, bedoeld Artikel 2.45 .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.3__art_2.50
- number: '2.51'
  text: 'In aanvulling op de aanvraagvereisten in de wet worden bij een aanvraag om een omgevingsvergunning, bedoeld in Artikel 2.48 , minimaal de volgende gegevens en bescheiden verstrekt: a. kaart van de planlocatie; b. locatie van het werk; c. materialen die worden toegepast; d. hoeveelheid materialen die worden toegepast; e. herkomst materialen die worden toegepast; f. afmetingen van de demping; g. permanente of tijdelijke demping; h. of de dam een duiker heeft; i. reden van de demping; en j. start- en einddatum van de werkzaamheden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.3__subsec_2.3.3__art_2.51
- number: '3.1'
  text: De regels in deze afdeling zijn gesteld met het oog op het beschermen van de kwaliteit van het grondwater en het vervullen van de functies van grondwaterlichamen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.1__subsec_3.1.1__art_3.1
- number: '3.2'
  text: '1. Een waterschapsverordening regelt dat de informatieverplichting, bedoeld in Artikel 3.1, eerste lid, van de bruidsschat waterschapsverordening , geldt voor onttrekkingen of infiltraties van meer dan 12.000 m3 per jaar en voor tijdelijke onttrekkingen of infiltraties van in totaal meer dan 12.000 m3. 2. Het waterschap verstrekt aan gedeputeerde staten uiterlijk op 31 mei van elk jaar of, bij beëindiging van de onttrekking, binnen 4 maanden na die beëindiging: a. gegevens die op grond van het eerste lid worden verkregen; en b. een overzicht van de vergunningen en meldingen op basis waarvan het onttrekken van grondwater of het infiltreren van water plaatsvindt. 3. Het eerste lid is niet van toepassing op wateronttrekkingsactiviteiten bedoeld in artikel 6.34 , eerste lid, onder b en c, en artikel 16.3 van het Besluit activiteiten leefomgeving.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.1__subsec_3.1.2__art_3.2
- number: 3.2a
  text: '1. Gedeputeerde staten houden een grondwaterregister bij met alle installaties voor: a. het onttrekken van grondwater of het infiltreren van water bedoeld in artikel 16.4 van het Besluit activiteiten leefomgeving, én b. open bodemenergiesystemen bedoeld in artikel 3.19 van het Besluit activiteiten leefomgeving. 2. De in het eerste lid benoemde installaties worden ingeschreven met vermelding van de gegevens die op grond van Artikel 3.4b worden verstrekt. 3. In het register, bedoeld in het eerste lid, worden ook de op grond van artikel 16.3 Besluit activiteiten leefomgeving verleende vergunningen ingeschreven op grond waarvan het onttrekken van grondwater of het infiltreren van water plaatsvindt. 4. Gedeputeerde staten kunnen een installatie voor het onttrekken van grondwater of het infiltreren van water bedoeld in artikel 16.4 van het Besluit activiteiten leefomgeving of open bodemenergiesysteem bedoeld in artikel 3.19 van het Besluit activiteiten leefomgeving ambtshalve inschrijven
    in het grondwaterregister als de installatie: a. niet overeenkomstig Artikel 3.4a is gemeld; of b. overeenkomstig Artikel 3.4a moet worden gemeld aan een ander bestuursorgaan dan gedeputeerde staten. 5. Als datum van inschrijving wordt aangehouden 1 januari van het jaar waarin de ambtshalve inschrijving plaatsvindt.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.1__subsec_3.1.2__art_3.2a
- number: '3.3'
  text: '1. Met het oog op de verplichtingen op grond van artikel 7 van de Kaderrichtlijn water regelt het waterschap in ieder geval dat: a. de locaties en debieten van de onttrekkingen van grondwater voor menselijke consumptie geregistreerd worden; b. eenieder die grondwater voor menselijke consumptie onttrekt, voor zover dagelijks meer dan 10 m3 water wordt onttrokken of water wordt onttrokken ten behoeve van meer dan 50 personen, het ruwwater monitort volgens de methoden en parameters uit tabel II en tabel IIIC van het Drinkwaterbesluit voor de eerste keer bij aanvang van de onttrekking en vervolgens minimaal iedere 6 jaar een meting en analyse van een beperkter parameterpakket, afhankelijk van de uitkomsten van de eerste en daaropvolgende metingen en de te verwachte risico''s; c. eenieder die grondwater voor menselijke consumptie onttrekt voor aanvang van de winning een risicoanalyse van de omgeving van de onttrekking uitvoert en deze risicoanalyse minimaal iedere 6 jaar herhaalt; en
    d. het dagelijks bestuur de gegevens, bedoeld onder a tot en met c, uiterlijk binnen 4 maanden nadat ze zijn verkregen aan gedeputeerde staten verstrekt. 2. Het eerste lid is niet van toepassing op onttrekkingen bedoeld in artikel 16.3 van het Besluit activiteiten leefomgeving.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.1__subsec_3.1.2__art_3.3
- number: '3.4'
  text: 1. Het verbod in artikel 3.19 van het Besluit activiteiten leefomgeving om zonder een omgevingsvergunning een open bodemenergiesysteem aan te leggen of te gebruiken geldt niet in het Gebied klein open bodemenergiesysteem , als de hoeveelheid grondwater die wordt onttrokken niet meer bedraagt dan 10 m3/u. 2. Het eerste lid geldt niet voor het aanleggen of gebruiken van een open bodemenergiesysteem dat gelegen is in een interferentiegebied dat is opgenomen in een omgevingsplan.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.1__subsec_3.1.3__art_3.4
- number: 3.4a
  text: 1. In aanvulling op artikel 4.1150 van het Besluit activiteiten leefomgeving wordt door eenieder die een open bodemenergiesysteem in gebruik heeft de jaarlijks onttrokken en teruggebrachte hoeveelheid grondwater gemeten met een nauwkeurigheid van minimaal 95%. 2. In aanvulling op artikel 4.1150a van het Besluit activiteiten leefomgeving worden de geregistreerde gegevens en bescheiden over de jaarlijks onttrokken en teruggebrachte hoeveelheid grondwater voor 1 april van het daarop volgende kalenderjaar aan het bevoegd gezag verstrekt.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.1__subsec_3.1.3__art_3.4a
- number: 3.4b
  text: 1. In aanvulling op paragraaf 16.2.1 van het Besluit activiteiten leefomgeving geldt bij het uitvoeren van een wateronttrekkingsactiviteit bedoeld in artikel 16.3 van het Besluit activiteiten leefomgeving dat de in elk kwartaal en jaarlijks onttrokken hoeveelheid grondwater of in de bodem gebracht water wordt gemeten met een nauwkeurigheid van minimaal 95%. 2. Uiterlijk voor 1 april van elk jaar, of als de activiteit, bedoeld in artikel 16.3 , onder a en b, van het Besluit activiteiten leefomgeving, is beëindigd binnen een maand na het tijdstip van beëindiging, worden aan het bevoegd gezag de op grond van het eerste lid verkregen meetgegevens verstrekt.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.1__subsec_3.1.3__art_3.4b
- number: '3.5'
  text: De regels in deze afdeling zijn gesteld met het oog op de bescherming van het grondwater in verband met de winning daarvan voor menselijke consumptie.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.1__art_3.5
- number: '3.6'
  text: '1. Een grondwaterbeschermingszone bestaat uit: a. het Waterwingebied ; b. het Grondwaterbeschermingsgebied ; c. de Boringsvrije zone ; d. de Beschermingszone oppervlaktewaterwinning ; e. het 100-jaarsaandachtsgebied ; f. het Gebied kwetsbare strategische grondwatervoorraad ; en g. het Gebied matig kwetsbare strategische grondwatervoorraad . 2. Het Waterwingebied bestaat uit waterwingebied en met uitzondering van het Waterwingebied Bethunepolder. 3. Het Grondwaterbeschermingsgebied bestaat uit: a. de Grondwaterbeschermingsgebieden; en b. het Waterwingebied Bethunepolder .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.1__art_3.6
- number: '3.7'
  text: 1. Een omgevingsplan dat betrekking heeft op locaties binnen een Waterwingebied , een Grondwaterbeschermingsgebied , een Boringsvrije zone , een Beschermingszone oppervlaktewaterwinning , een 100-jaarsaandachtsgebied of een Gebied kwetsbare strategische grondwatervoorraad laat geen activiteiten toe die een risico vormen voor de grond- en oppervlaktewaterwinning voor menselijke consumptie. 2. Een omgevingsplan dat betrekking heeft op locaties binnen een Waterwingebied , een Grondwaterbeschermingsgebied , een Boringsvrije zone , een Beschermingszone oppervlaktewaterwinning , een 100-jaarsaandachtsgebied of een Gebied kwetsbare strategische grondwatervoorraad bevat regels die de functie voor de grond- en oppervlaktewaterwinning voor menselijke consumptie beschermen. 3. De motivering van een omgevingsplan bevat een beschrijving van het door de gemeente te voeren beleid ter zake en de wijze waarop het waterwinbelang in acht is genomen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.2__art_3.7
