- number: '6.14'
  text: Deze paragraaf is van toepassing op activiteiten die het Gebied houtopstand betreffen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.2__art_6.14
- number: '6.15'
  text: 'De meldplicht vellen houtopstanden, bedoeld in artikel 11.126 van het Besluit activiteiten leefomgeving, geldt niet voor: a. het maken van verjongingsgaten, als: 1. deze niet groter zijn dan 10 are; 2. deze gezamenlijk niet meer oppervlakte beslaan dan 10% van het bosperceel; 3. dit maximaal 1 keer per 4 jaar plaatsvindt op dezelfde locatie; en 4. dit plaatsvindt voor duurzaam bosbeheer. b. het verwijderen van houtopstanden voor natuurherstel, als de te verwijderen houtopstand: 1. ontstaan is door spontane boomopslag op natuurterreinen of geregistreerde tijdelijke natuur; 2. niet ouder is dan 20 jaar; en 3. niet diende ter compensatie van herbeplanting.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.2__art_6.15
- number: '6.16'
  text: 'De melding, bedoeld in artikel 11.126 van het Besluit activiteiten leefomgeving, bevat minimaal: a. als degene die de activiteit uitvoert geen eigenaar is van de grond waar de houtopstand staat: contactgegevens van de grondeigenaar; b. een situatietekening van de locatie van de te kappen houtopstand, waaronder minimaal een topografische kaart schaal 1:25.000 en de kadastrale percelen; c. de oppervlakte van de velling in are en, als het rijbeplanting betreft, het aantal bomen; d. de boomsoort; e. de leeftijd van de houtopstand; f. de reden van de velling; en g. de wijze van herbeplanting.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.2__art_6.16
- number: '6.17'
  text: 'Een bosbouwkundig verantwoorde herbeplanting bedoeld in artikel 11.129 , eerste lid, van het Besluit activiteiten leefomgeving, voldoet in ieder geval aan de volgende eisen: a. de oppervlakte van de herbeplanting is minimaal even groot als de gevelde oppervlakte; b. herbeplanting vindt plaats door het aanplanten van voldoende vitaal plantmateriaal of door natuurlijke verjonging ; c. de nieuwe houtopstand kan, gelet op de bodemkwaliteit en de waterhuishouding ter plaatse, uitgroeien tot een volwaardige en duurzame houtopstand, gericht op houtproductie, natuur, landschap, cultuurhistorie of beleving; d. de nieuwe houtopstand kan binnen een periode van 5 jaar een kronendak met een bedekkingsgraad van minimaal 60% vormen; e. de herbeplanting kan op termijn in ieder geval, gelijkwaardige ecologische en landschappelijke waarden vertegenwoordigen; f. naast boomsoorten worden alleen inheemse struiksoorten toegepast; en g. herbeplanting binnen Natura 2000 gebieden vindt plaats op een wijze
    en met soorten die geen schade kunnen toebrengen aan de voor dit gebied geldende instandhoudingsdoelstellingen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.2__art_6.17
- number: '6.18'
  text: '1. De aanvraag om met een maatwerkvoorschrift herbeplanting op andere grond dan de grond bedoeld in artikel 11.129 , eerste lid, van het Besluit activiteiten leefomgeving, toe te staan wordt uiterlijk 6 maanden na het geheel of gedeeltelijk vellen van een houtopstand ingediend. 2. Herbeplanting op andere grond dan de grond, bedoeld in artikel 11.129 , eerste lid, van het Besluit activiteiten leefomgeving, voldoet aan de volgende vereisten: a. de grond is vrij van houtopstand en van een herbeplantingsplicht bedoeld in artikel 11.129 van het Besluit activiteiten leefomgeving; b. het gebruik van de grond past binnen bestaand natuur- en landschapsbeleid van de provincie en de gemeente; c. de grond is vrij van compensatieverplichtingen; d. de herbeplanting vindt plaats binnen 3 jaar nadat de verplichting tot herbeplanting ontstaat; en e. de herbeplanting voldoet aan Artikel 6.17 . 3. De herbeplanting op andere grond vindt bij voorkeur plaats in de provincie in de directe nabijheid van
    de velling. Als dit niet mogelijk is, vindt de herbeplanting elders in de provincie plaats. In uitzonderingsgevallen kan, als hiermee vergelijkbare natuur- en landschapswaarden kunnen worden teruggebracht als die door de velling verloren zijn gegaan, de herbeplanting in de directe nabijheid van de velling in een aangrenzende provincie plaatsvinden. 4. De oppervlakte van de herbeplanting op andere grond bedraagt minimaal de gevelde oppervlakte aangevuld met de volgende toeslag per hectare die geveld is: Tijd dat ter plaatse van de velling een houtopstand aanwezig is geweest ( of ouderdom bosgroeiplaats) Toeslag per hectare < 10 jaar 0,1 10-25 jaar 0,3 25-50 jaar 0,5 50-100 jaar 0,75 100-200 jaar 1,0 > 200 jaar 1,5'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.2__art_6.18
- number: '6.19'
  text: 'De plicht tot herbeplanting, bedoeld in artikel 11.129 , eerste lid, van het Besluit activiteiten leefomgeving, geldt niet voor houtopstanden die verwijderd zijn voor natuurherstel, als de verwijderde houtopstand: a. ontstaan is door spontane boomopslag op natuurterreinen of geregistreerde tijdelijke natuur; b. niet ouder is dan 20 jaar; en c. niet diende ter compensatie van herbeplanting.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.2__art_6.19
- number: '6.20'
  text: Gedeputeerde staten kunnen aan de activiteiten, bedoeld in Artikel 6.18 , maatwerkvoorschriften verbinden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.2__art_6.20
- number: '6.21'
  text: Een aanvraag tot het stellen van een maatwerkvoorschrift voor herbeplanting op andere grond gaat vergezeld van een beplantingsplan voor de herbeplanting met een locatieaanduiding voor de herbeplanting.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.2__art_6.21
- number: '6.22'
  text: 1. Deze paragraaf is van toepassing op activiteiten die het Gebied beschermd klein landschapselement betreffen. 2. Gedeputeerde staten kunnen besluiten kleine landschapselementen, die voldoen aan de door hen vastgestelde beleidsregels, aan te wijzen en toe te voegen aan het Gebied beschermd klein landschapselement .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.3__art_6.22
- number: '6.23'
  text: Degene die in het Gebied beschermd klein landschapselement een activiteit uitvoert en weet of redelijkerwijs kan vermoeden dat die activiteit kan leiden tot het beschadigen of vernielen van een beschermd klein landschapselement , is verplicht alle maatregelen te nemen die redelijkerwijs van diegene kunnen worden gevraagd om deze beschadiging of vernieling te voorkomen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.3__art_6.23
- number: '6.24'
  text: 'Het is verboden in het Gebied beschermd klein landschapselement : a. aan een beschermd klein landschapselement onderhoud te onthouden dat voor de instandhouding daarvan noodzakelijk is; b. een beschermd klein landschapselement boven- of ondergronds te beschadigen, te vernielen, te vernietigen, te bewerken of te gebruiken op een wijze waardoor het wordt ontsierd of het voortbestaan direct of op de langere termijn in gevaar wordt gebracht; c. een beschermd klein landschapselement te vellen of te rooien.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.3__art_6.24
- number: 6.24a
  text: 'Het verbod in Artikel 6.24 geldt niet voor: a. het uitvoeren van noodzakelijk onderhoud gericht op kwaliteitsverbetering of duurzame instandhouding van een beschermd klein landschapselement ; b. het periodiek vellen van griend- en hakhout voor onderhoud; en c. het vellen of rooien van een houtopstand op grond van de Plantgezondheidswet en ter bestrijding van boomziekten.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.3__art_6.24a
- number: '6.25'
  text: 1. Het is verboden zonder melding in het Gebied beschermd klein landschapselement activiteiten uit te voeren, vanwege dringende redenen anders dan bedoeld in Artikel 6.24a . 2. Minimaal 8 weken en maximaal 24 weken voordat het beschermd klein landschapselement aangetast wordt, wordt de melding ingediend. 3. De activiteiten mogen niet worden uitgevoerd tot de acceptatie van de melding onherroepelijk is geworden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.3__art_6.25
- number: '6.26'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding aantasting beschermd klein landschapselement, bedoeld in Artikel 6.25 , minimaal de volgende gegevens en bescheiden verstrekt: a. elementnummer; b. contactgegevens grondeigenaar; c. een situatietekening van de locatie van het beschermd klein landschapselement, waaronder minimaal een topografische kaart met een schaal van 1:25.000; d. een kaart met de kadastrale gegevens; e. indien van toepassing: de oppervlakte van de velling in are en voor zover het een rijbeplanting betreft het aantal bomen; f. indien van toepassing: de boomsoort; g. indien van toepassing: de leeftijd van de houtopstand; h. indien van toepassing: de reden van de velling; i. is melder voornemens het element op dezelfde locatie te herbeplanten of herstellen en als dit niet het geval is, wat is de motivering daarvoor; j. is melder voornemens het element elders te compenseren; k. maatvoering en indien van toepassing soort plantmateriaal;
    l. start- en einddatum van het werk.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.3__art_6.26
- number: '6.27'
  text: 1. Gedeputeerde staten kunnen aan de activiteiten, bedoeld in Artikel 6.25 , eerste lid maatwerkvoorschriften verbinden. 2. De maatwerkvoorschriften houden in ieder geval in dat compenserende maatregelen worden getroffen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.3__art_6.27
- number: '6.28'
  text: 1. Als in strijd met Artikel 6.23 , Artikel 6.24 , Artikel 6.25 of Artikel 6.26 is gehandeld, is de zakelijk gerechtigde van de grond, dan wel degene, die uit anderen hoofde tot het treffen van voorzieningen bevoegd is, verplicht om binnen 1 jaar na de overtreding het beschermd klein landschapselement op dezelfde locatie zo veel mogelijk in de oorspronkelijke staat te herstellen of te herbeplanten. 2. Niet aangeslagen herbeplantingen of andere mislukte herstelmaatregelen worden voor 1 april van het opvolgende jaar vervangen of hersteld.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.3__art_6.28
- number: '6.29'
  text: 1. Er is 1 faunabeheereenheid waarvan het werkgebied zich uitstrekt tot het grondgebied van de provincie. 2. De binnen het werkgebied van de faunabeheereenheid gelegen gronden waarop de in de faunabeheereenheid samenwerkende jachthouders gerechtigd zijn tot de jacht vormen minimaal 75% van de totale oppervlakte van het werkgebied van de faunabeheereenheid.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.1__art_6.29
- number: '6.30'
  text: '1. In het bestuur van de faunabeheereenheid worden de bestuurszetels als volgt ingevuld: a. 1 bestuurszetel door een vertegenwoordiger vanuit de landbouw; b. 1 bestuurszetel door een vertegenwoordiger vanuit de jacht; c. 1 bestuurszetel door een vertegenwoordiger vanuit het particulier grondbezit; d. 1 bestuurszetel door Staatsbosbeheer; en e. 2 bestuurszetels door maatschappelijke organisaties die het doel behartigen van een duurzaam beheer van populaties van in het wild levende dieren. 2. In ieder geval wordt 1 van de bestuurszetels, bedoeld in het eerste lid, onder e, ingevuld door een organisatie die zich tot doel heeft gesteld het dierenwelzijn of het milieu te beschermen en te bevorderen. 3. Elke organisatie kan 1 vertegenwoordiger voordragen voor een bestuurszetel. 4. De organisaties kunnen, in onderling overleg, een vertegenwoordiger voordragen die namens meerdere van deze organisaties deelneemt aan het bestuur van de faunabeheereenheid. 5. Het bestuur van de faunabeheereenheid
    benoemt, met instemming van gedeputeerde staten, een onafhankelijke voorzitter die: a. geen dienstverband bij een van de in het bestuur vertegenwoordigde partijen heeft; b. geen bestuurslid van een van de in het bestuur vertegenwoordigde partijen is; en c. niet in het bezit is van een omgevingsvergunning voor een jachtgeweeractiviteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.1__art_6.30
- number: '6.31'
  text: 1. De organisaties of jachthouders, bedoeld in Artikel 6.29 , eerste lid, eerste lid, dragen op verzoek van de voorzitter een kandidaat voor het bestuur van de faunabeheereenheid. 2. Als meer kandidaten worden voorgedragen dan er bestuurszetels zijn, selecteert de voorzitter de meest geschikte kandidaten.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.1__art_6.31
- number: '6.32'
  text: '1. De faunabeheereenheid is verantwoordelijk voor: a. de coördinatie van de uitvoering van het door haar vastgestelde faunabeheerplan; b. de informatievoorziening aan de leden van alle in haar bestuur vertegenwoordigde organisaties over minimaal de aan de faunabeheereenheid toekomende bevoegdheden, de aan de faunabeheereenheid toegestane activiteiten en actuele ontwikkelingen op het gebied van faunabeheer; en c. het opstellen van telprotocollen voor trendtellingen bedoeld in Artikel 6.39 , tweede lid, onder a. 2. De faunabeheereenheid adviseert gedeputeerde staten over faunabeheer. 3. Besluitvorming door het bestuur vindt plaats bij gewone meerderheid van stemmen, waarbij iedere in het bestuur vertegenwoordigde organisatie een stem heeft. Als de stemmen staken, geeft de stem van de voorzitter de doorslag. 4. De faunabeheereenheid kan in haar statuten opnemen dat besluitvorming over daarbij te bepalen onderwerpen plaatsvindt bij een gekwalificeerde meerderheid van stemmen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.1__art_6.32
- number: '6.33'
  text: '1. Het jaarlijkse verslag, bedoeld in artikel 6.3 , derde lid, van het Omgevingsbesluit, bevat in ieder geval de volgende gegevens: a. cijfermatige rapportages over de uitvoering van de vrijstellingen, opdrachten en vergunningen op basis van de paragrafen 11.2.2 , 11.2.3 en 11.2.4 van het Besluit activiteiten leefomgeving en de uitvoering van de jacht, waarin opgenomen de aantallen gedode dieren en geraapte of onklaar gemaakte eieren, onderverdeeld naar diersoort en naar wildbeheereenheid; b. rapportages van het gebruik van preventieve en alternatieve middelen voor het voorkomen van schade; en c. cijfermatige rapportages over de uitvoering van de jacht, waarin opgenomen het aantal gedode dieren, onderscheiden naar wildsoort. 2. Het verslag wordt uiterlijk op 1 mei van het daaropvolgende kalenderjaar aan gedeputeerde staten verstrekt. 3. Het verslag wordt door de faunabeheereenheid ook op een openbaar toegankelijke website geplaatst.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.1__art_6.33
- number: '6.34'
  text: 1. De faunabeheereenheid stelt voor het werkgebied van de faunabeheereenheid een faunabeheerplan op. 2. Het faunabeheerplan heeft een geldigheidsduur van maximaal 6 jaar. 3. De faunabeheereenheid kan het faunabeheerplan gedeeltelijk wijzigen gedurende het tijdvak waarvoor het is vastgesteld. 4. Gedeputeerde staten kunnen op verzoek van de faunabeheereenheid de geldigheidsduur van het faunabeheerplan eenmaal met maximaal 1 jaar verlengen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.1__art_6.34
- number: '6.35'
  text: 'Het faunabeheerplan bevat in ieder geval de volgende gegevens: a. een topografische kaart waarop de begrenzing van het werkingsgebied van het faunabeheerplan is aangegeven; b. kwantitatieve gegevens over de in het wild levende dieren binnen de provincie, waarop het faunabeheerplan van toepassing is over een periode van minimaal 6 jaar voorafgaand aan de periode waarop het plan betrekking heeft en een beschrijving van de trend van deze soorten over deze periode, zowel binnen de provincie als landelijk; c. een beschrijving van de aanwezigheid van deze diersoorten gedurende het jaar; d. een beschrijving van passende en doeltreffende maatregelen die kunnen worden ingezet om schade aan de belangen, bedoeld in artikel 11.23 van het Besluit activiteiten leefomgeving, te voorkomen; e. een beschrijving van de wijze waarop de planmatigheid en de coördinatie van de uitvoering van de maatregelen ter voorkoming van die schade is gewaarborgd; f. een overzicht per diersoort, onderverdeeld naar
    de verschillende wildbeheereenheden, van de op basis van de toepasselijke vrijstellingen, vergunningen, opdrachten en bij de uitoefening van de jacht gedode dieren en geraapte en onklaar gemaakte eieren in de periode van minimaal 6 jaar voorafgaand aan de periode waarop het plan betrekking heeft; en g. een omschrijving van de wijze waarop geborgd wordt dat de te treffen maatregelen de gunstige staat van instandhouding van de soorten waarop het plan betrekking heeft niet negatief beïnvloeden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.1__art_6.35
- number: '6.36'
  text: 'Het faunabeheerplan bevat ook de volgende gegevens over beheer en schadebestrijding van diersoorten: a. per diersoort en gewas een beschrijving van de schade in, minimaal, de 6 jaren voorafgaand aan de periode waarop het plan betrekking heeft, onderverdeeld naar de verschillende wildbeheereenheden; b. per diersoort een beschrijving van de activiteiten die in, minimaal, de 6 jaren voorafgaand aan de periode waarop het plan betrekking heeft zijn uitgevoerd om schade te voorkomen of beperken en, als daarover kwantitatieve gegevens beschikbaar zijn, een beschrijving van de effectiviteit van deze activiteiten; c. per diersoort een topografische kaart waarop is aangegeven waar zich in, minimaal, de 6 jaren voorafgaand aan de periode waarop het plan betrekking heeft, gevallen van belangrijke schade hebben voorgedaan en waar in het kader van beheer- en schadebestrijding bestrijdingsacties hebben plaatsgevonden; d. per diersoort een onderbouwing van de aard en de noodzaak van activiteiten
    om schade te voorkomen of te beperken en een beschrijving van de plaatsen in het werkgebied van de faunabeheereenheid waar, en de perioden in het jaar waarin, deze activiteiten plaatsvinden; e. een onderbouwde inschatting van de effectiviteit van de voorgenomen activiteiten en een beschrijving van de wijze waarop de effectiviteit van deze activiteiten zal worden bepaald; f. de gewenste stand van de diersoorten waarvoor populatiebeheer wordt voorgestaan; en g. als het faunabeheerplan betrekking heeft op het populatiebeheer van edelherten, damherten, reeën of wilde zwijnen: een beschrijving van het voedselaanbod, de relatie tussen dit voedselaanbod en de grootte van de populatie en de mogelijkheden van uitwisseling met aangrenzende terreinen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.1__art_6.36
- number: '6.37'
  text: 'Het faunabeheerplan bevat ook in ieder geval de volgende gegevens over de jacht: a. een beschrijving van de samenhang tussen de jacht op de wildsoorten, het beheren van de populaties van deze soorten en het bestrijden van schade door deze soorten; b. een omschrijving van de redelijke wildstand, bedoeld in artikel 11.65 van het Besluit activiteiten leefomgeving, en een onderbouwing van de wijze waarop de jacht hieraan zal bijdragen; en c. een overzicht van de gerealiseerde afschotgegevens, onderverdeeld naar diersoort, per wildbeheereenheid, in de 6 jaren voorafgaand aan de periode waarop het plan betrekking heeft.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.1__art_6.37
- number: '6.38'
  text: '1. Het werkgebied van de gezamenlijke wildbeheereenheden strekt zich uit tot het grondgebied van de provincie. 2. Het werkgebied van een wildbeheereenheid: a. heeft een aaneengesloten oppervlakte van minimaal 5.000 hectare; b. strekt zich niet uit tot het grondgebied van een andere provincie; c. overlapt niet met het werkgebied van een andere wildbeheereenheid; en d. wordt in overeenstemming met alle betrokken wildbeheereenheden gewijzigd. 3. Bij wijziging van een begrenzing dragen de betrokken wildbeheereenheden zorg voor: a. het schriftelijk informeren van gedeputeerde staten; en b. het plaatsen van de begrenzing op de website van de faunabeheereenheid. 4. Een wildbeheereenheid heeft de rechtsvorm van een vereniging met volledige rechtsbevoegdheid.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.2__art_6.38
- number: '6.39'
  text: '1. Het secretariaat van een wildbeheereenheid informeert de leden van de wildbeheereenheid op adequate wijze over de uitvoering van de aan de wildbeheereenheid toegestane activiteiten, regelgevende en ecologische feiten en ontwikkelingen op het gebied van faunabeheer. 2. De wildbeheereenheid coördineert voor haar werkgebied: a. de trendtellingen van diersoorten voor het faunabeheerplan; b. de verstrekking van de resultaten van deze trendtellingen aan de faunabeheereenheid; en c. de verstrekking van het overzicht van gerealiseerde afschotgegevens, onderverdeeld naar diersoort, aan de faunabeheereenheid.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.2__art_6.39
- number: '6.40'
  text: '1. Uitgezonderd van artikel 8.2 , eerste lid, van de wet zijn: a. medewerkers van Staatsbosbeheer, de Vereniging Natuurmonumenten en de Stichting het Utrechts Landschap, als de organisatie die zij vertegenwoordigen deel uitmaakt van het bestuur van de faunabeheereenheid, en zij hun activiteiten uitvoeren voor die organisatie; b. medewerkers van het Ganzenbeheerteam Utrecht en medewerkers van in opdracht van de faunabeheereenheid of gedeputeerde staten handelende professionele schadebestrijders. 2. Aan lidmaatschap van een wildbeheereenheid worden alleen eisen gesteld die van belang zijn voor de uitvoering van het faunabeheerplan. 3. De wildbeheereenheid houdt een register bij van aangesloten leden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.2__art_6.40
- number: '6.41'
  text: '1. Het lidmaatschap van een wildbeheereenheid kan worden geweigerd of beëindigd als het lid bij de uitvoering van activiteiten bedoeld in artikel 11.64 van het Besluit activiteiten leefomgeving handelt in strijd met de voor deze activiteiten geldende voorschriften. 2. In de statuten van de wildbeheereenheden wordt hiervoor een regeling getroffen. 3. Door de gezamenlijke wildbeheereenheden wordt, in overeenstemming met het bestuur van de faunabeheereenheid en gedeputeerde staten, een geschillenregeling vastgesteld voor geschillen die betrekking hebben op het lidmaatschap van een wildbeheereenheid. 4. Geschillen worden voorgelegd aan een geschillencommissie, die bestaat uit een vertegenwoordiger namens: a. het bestuur van de wildbeheereenheid; b. het bestuur van de faunabeheereenheid; en c. gedeputeerde staten.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.3__subsec_6.3.2__art_6.41
- number: '6.42'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een flora- en fauna-activiteit bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet gelezen in samenhang met artikel 11.37 , eerste lid, aanhef en onder a, van het Besluit activiteiten leefomgeving, voor afschot van paarvormende grauwe ganzen of brandganzen, wordt de omgevingsvergunning alleen verleend als de periode waarvoor de omgevingsvergunning wordt verleend , beperkt is tot: a. de periode van 1 februari tot 1 april voor grauwe ganzen; b. de periode van 15 maart tot 1 mei voor brandganzen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.1__art_6.42
- number: '6.43'
  text: 'Het verbod bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet, in samenhang met artikel 11.37, eerste lid, aanhef en onder b, van het Besluit activiteiten leefomgeving en artikel 11.54 , eerste lid, aanhef en onder b, van het Besluit activiteiten leefomgeving, om zonder omgevingsvergunning een flora- en fauna-activiteit uit te voeren waardoor van de vogelsoorten huismus, kerkuil en steenuil opzettelijk nesten en rustplaatsen worden vernield of beschadigd dan wel opzettelijk nesten worden weggenomen, of van de diersoorten steenmarter en boommarter opzettelijk vaste voortplantingsplaatsen of rustplaatsen worden beschadigd of vernield, geldt niet als: a. de uit te voeren flora- en fauna-activiteit het vervangen van asbesthoudende dakplaten door asbestvrije dakplaten op een ander bouwwerk dan een woning binnen Landelijk gebied betreft; b. aan de voorwaarden opgenomen in de Bijlage XX Vrijstelling soorten in verband met asbestsanering is voldaan.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.1__art_6.43
- number: '6.44'
  text: '1. Het verbod bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet, gelezen in samenhang met artikel 11.37 , eerste lid, onder a, van het Besluit activiteiten leefomgeving, geldt niet voor activiteiten die dienen voor het verjagen met ondersteunend afschot van de grauwe gans, kolgans en brandgans met het oog op het voorkomen van belangrijke schade aan gewassen, mits is voldaan aan de volgende voorwaarden: a. de activiteiten worden uitgevoerd door of in opdracht van de grondgebruiker; b. de activiteiten worden uitgevoerd op de gronden die bij de grondgebruiker in gebruik zijn; c. de activiteiten vinden plaats met het oog op het voorkomen van schade die in het lopende of daarop volgende jaar door de grauwe gans, kolgans of brandgans dreigt op te treden op deze gronden; d. de activiteiten vinden plaats in de periode van 1 november tot 1 maart; e. de activiteiten vinden plaats op percelen met grasland of nog oogstbare akker en tuinbouwgewassen of direct daaraan grenzende
    percelen; en f. er wordt voldaan aan de eisen opgenomen in de artikelleden 2 tot en met 6 van dit artikel en in Artikel 6.45 en Artikel 6.46 . 2. Er vinden geen activiteiten voor verjaging met ondersteunend doding door afschot plaats: a. op grasland dat is ingezaaid of doorgezaaid vóór 1 augustus voorafgaand aan de winterperiode van dat jaar; b. op grasland dat is ingezaaid of doorgezaaid na 1 augustus voorafgaand aan de winterperiode van dat jaar, met een oppervlakte kleiner dan 1 hectare; c. op percelen die zijn ingezaaid als afvanggewas op geoogste percelen. 3. Activiteiten voor verjaging met ondersteunend doding door afschot vindt alleen plaats als een groep van meer dan 5 ganzen op het schadeperceel, of op een direct hieraan grenzend perceel, aanwezig is of hier invalt. 4. Per verjaagactie worden maximaal 2 ganzen gedood. 5. Metalen ringen die zich aan gedode vogels bevinden worden binnen 48 uur naar het Vogeltrekstation, Postbus 50, 6700 AB Wageningen, gezonden onder vermelding
    van plaats en datum van het afschot, of worden gemeld via het Geautomatiseerd Ring Invoer en Export Loket (GRIEL) via de website www.griel.nl . 6. Kleurringen en halsbanden worden doorgegeven via de website www.geese.org .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.2__art_6.44
- number: '6.45'
  text: 1. Activiteiten die dienen voor het verjagen van grauwe gans, kolgans en brandgans met ondersteunend doding door afschot, bedoeld in Artikel 6.44 zijn alleen toegestaan nadat eerst een preventief akoestisch middel en een visueel middel zijn ingezet conform de voorwaarden voor effectief gebruik die zijn opgenomen in de faunaschade Preventie Kit, module ganzen . 2. De grauwe gans, kolgans en brandgans mogen alleen worden gedood met een hagelgeweer of kogelgeweer. 3. Er wordt geen gebruik gemaakt van lokmiddelen. 4. Als ganzen van de soorten genoemd in het eerste lid, door het ondersteunend afschot gewond zijn geraakt en in nood verkeren, is het toegestaan deze te doden met slag- en steekwapens.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.2__art_6.45
- number: '6.46'
  text: Uiterlijk 2 weken na het uitvoeren van een activiteit, bedoeld in Artikel 6.44 , worden de resultaten hiervan gerapporteerd in het door gedeputeerde staten aangewezen systeem.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.2__art_6.46
- number: '6.47'
  text: Gedeputeerde staten kunnen de werking van Artikel 6.42 en Artikel 6.44 opschorten als weersomstandigheden daar naar hun oordeel aanleiding toe geven.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.2__art_6.47
- number: '6.48'
  text: 'Het is verboden in het Ganzenrustgebied : a. schadeveroorzakende ganzen opzettelijk te verstoren en verjagingsactiviteiten met ondersteunend doding door afschot te ondernemen in de periodes: 1. van 1 november tot 1 april voor grauwe gans en kolgans; en 2. van 1 november tot 1 mei voor brandgans. b. de foerageerfunctie van het gebied opzettelijk teniet te doen; c. jacht, beheer en schadebestrijding uit te voeren tot 12:00 uur, met uitzondering van jacht maximaal 3 dagen per jachtveld per seizoen, mits deze acties niet in hetzelfde gebied plaatsvinden en een afstand in acht wordt genomen van minimaal 300 meter tot groepen foeragerende ganzen van minimaal 100 stuks; en d. jacht, beheer en schadebestrijding uit te voeren vanaf 12:00, tenzij een afstand in acht wordt genomen van minimaal 300 meter tot groepen foeragerende ganzen van minimaal 100 stuks.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.2__art_6.48
- number: '6.49'
  text: Het verbod, bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet gelezen in samenhang met artikel 11.54 , eerste lid, van het Besluit activiteiten leefomgeving geldt niet voor het doden, vangen, verstoren of vernielen van de vaste voortplantingsplaatsen en rustplaatsen van de veldmuis, als deze activiteiten plaatsvinden door of in opdracht van de grondgebruiker met als doel om schade op diens gronden of in het omringende gebied te voorkomen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.3__art_6.49
- number: 6.49a
  text: '1. Het is verboden zonder melding de activiteiten in Artikel 6.49 uit te voeren: a. ter voorkomen van belangrijke schade aan gewassen; of b. in het belang van de volksgezondheid of openbare veiligheid. 2. Voor de bestrijding wordt alleen gebruik gemaakt van de methode inundatie. 3. Minimaal 3 dagen voordat de veldmuizen bestreden worden, wordt de melding ingediend.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.3__art_6.49a
- number: '6.50'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding voor de bestrijding van veldmuizen, bedoeld in Artikel 6.49 , minimaal de volgende gegevens en bescheiden verstrekt: a. locatie van de bestrijding; b. datum en tijdstip van het uitvoeren van de bestrijding; c. frequentie van de bestrijding; d. manier van de bestrijding; e. uitvoerder van de bestrijding.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.3__art_6.50
- number: '6.51'
  text: 'Het verbod, bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet gelezen in samenhang met artikel 11.54 , eerste lid, van het Besluit activiteiten leefomgeving, geldt niet voor de soorten, genoemd in de bijlage X Uitzondering vergunningplicht andere soorten , als de activiteit nodig is: a. in het kader van de ruimtelijke inrichting of ontwikkeling van gebieden, met inbegrip van het daarop volgende gebruik van het ingerichte of ontwikkelde gebied; b. ter voorkoming of bestrijding van onnodig lijden van zieke of gebrekkige dieren; c. in het kader van bestendig beheer of onderhoud in de landbouw of bosbouw; d. in het kader van bestendig beheer van of onderhoud aan vaarwegen, watergangen, waterkeringen, waterstaatswerken, oevers, luchtvaartterreinen, wegen, spoorwegen of bermen, of in het kader van natuurbeheer; of e. in het kader van bestendig beheer van of onderhoud aan de landschappelijke kwaliteiten van een bepaald gebied.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.4__art_6.51
- number: '6.52'
  text: De verboden, bedoeld in de artikel 5.1 , tweede lid, aanhef en onder g, van de wet gelezen in samenhang met artikel 11.39 , eerste lid, en artikel 11.47 , eerste lid, onder b, van het Besluit activiteiten leefomgeving, gelden niet als voor het onder zich hebben of vervoeren van de soort een vrijstelling of vergunning is verleend door een ander bevoegd gezag.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.4__art_6.52
- number: '6.53'
  text: De verboden, bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet gelezen in samenhang met artikel 11.37 , eerste lid, onder b, c en d, van het Besluit activiteiten leefomgeving, gelden niet voor activiteiten bestemd en geschikt voor de bescherming van vogels, hun nesten en eieren en hun niet-vliegvlugge jongen tegen landbouwwerkzaamheden en vee.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.4__art_6.53
- number: '6.54'
  text: 1. De verboden om in het wild levende dieren te vangen en opzettelijk te verstoren, bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet gelezen in samenhang met artikel 11.46 , eerste lid, onder a en b, van het Besluit activiteiten leefomgeving, het verbod om dieren onder zich te hebben of te vervoeren, bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet gelezen in samenhang met artikel 11.47 , eerste lid, onder b, van het Besluit activiteiten leefomgeving en het verbod om amfibieën te vangen, bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet gelezen in samenhang met artikel 11.54 , eerste lid, onder a, van het Besluit activiteiten leefomgeving, gelden niet voor amfibieën als die activiteiten plaatsvinden om deze dieren veilig te stellen tegen het verkeer. 2. Het eerste lid is alleen van toepassing op het vervoer van de dieren over een afstand van maximaal 100 meter vanaf de vangplaats.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.4__art_6.54
- number: '6.55'
  text: 1. Het verbod, bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet gelezen in samenhang met artikel 11.54 , eerste lid, onder a, van het Besluit activiteiten leefomgeving, geldt niet voor het vangen van de Meerkikker (Pelophylax ridibundus), de Middelste groene kikker (Pelophylax kl. esculentus), de Bruine kikker (Rana temporaria) en de Gewone pad (Bufo bufo), voor zover dit plaatsvindt met het oog op gebruik van deze dieren of eieren van deze dieren bij onderzoek of onderwijs. 2. Het eerste lid geldt niet voor dieren waarvan de metamorfose is voltooid.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.4__art_6.55
- number: '6.56'
  text: De verboden op het vervoeren en onder zich hebben, bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet gelezen in samenhang met artikel 11.39 , eerste lid, en artikel 11.47 , eerste lid, onder b, van het Besluit activiteiten leefomgeving, gelden niet voor keutels, braakballen, losse veren en sterrenschot voor gebruik van deze producten bij onderzoek of onderwijs.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.4__art_6.56
- number: '6.57'
  text: Het verbod op het uitzetten van dieren of eieren van dieren, bedoeld in artikel 5.1 , tweede lid, aanhef en onder g, van de wet gelezen in samenhang met artikel 11.61 , eerste lid, van het Besluit activiteiten leefomgeving, geldt niet voor dieren of eieren die zijn gevangen of geraapt op grond van artikel 6.51, mits het uitzetten van soorten of hun eieren binnen 8 uur plaatsvindt in voor de soort geschikt habitat op zo kort mogelijke afstand van de locatie van het vangen of rapen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.4__art_6.57
- number: '6.58'
  text: In afwijking van artikel 11.69 van het Besluit activiteiten leefomgeving, kunnen gedeputeerde staten de jacht op wildsoorten als bedoeld in dat artikel in de gehele provincie of een gedeelte daarvan, sluiten zolang bijzondere weersomstandigheden dat noodzakelijk maken.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.4__subsec_6.4.2__subsec_6.4.2.4__art_6.58
- number: '6.59'
  text: 'Degene die op of in de grond activiteiten uitvoert en weet of redelijkerwijs kan vermoeden dat door die activiteiten planten of delen van planten die behoren tot de Aziatische duizendknoopsoorten kunnen worden verspreid, is verplicht om: a. alle maatregelen te nemen die redelijkerwijs van diegene kunnen worden gevraagd om die verspreiding te voorkomen; b. de directe gevolgen daarvan te beperken en zoveel mogelijk ongedaan te maken; en c. als de verspreiding niet kan worden voorkomen, de activiteiten achterwege te laten.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.5__art_6.59
- number: '6.60'
  text: Het is verboden om planten of delen van planten die behoren tot de Aziatische duizendknoopsoorten , door maaien, grondverzet of anderszins te verspreiden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.5__art_6.60
- number: '6.61'
  text: 1. Het is verboden zonder melding de maatregelen in Artikel 6.59 uit te voeren. 2. Minimaal 10 dagen voordat de maatregelen voor de bestrijding van de Aziatische duizendknoopsoort uitgevoerd worden, wordt de melding ingediend. 3. Gedeputeerde staten sturen de melding zo spoedig mogelijk door aan burgemeester en wethouders van de gemeente waar de verspreiding zich voordoet.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.5__art_6.61
- number: '6.62'
  text: '1. Maatwerkvoorschriften kunnen worden gesteld over de maatregelen, bedoeld in Artikel 6.59 . 2. Gedeputeerde staten kunnen een perceeleigenaar, gebruiker of andere zakelijk gerechtigde van grond bij maatwerkvoorschrift verplichten om de grond te ontdoen van planten of delen van planten die behoren tot de Aziatische duizendknoopsoorten , als dit nodig is vanwege: a. het behouden en versterken van de biodiversiteit; b. het niet voldaan hebben aan de zorgplicht die geldt op basis van Artikel 6.59 ; of c. het niet uitvoeren of laten uitvoeren van de maatregelen genoemd in Artikel 6.59 . 3. Het maatwerkvoorschrift bevat: a. een kaart van de grond met de plaats waarop de te bestrijden planten of delen van planten van de Aziatische duizendknoopsoorten zich bevinden; b. de termijn of termijnen waarbinnen aan de opruimplicht moet zijn voldaan; en c. de geschikte methode of methoden voor bestrijding van de Aziatische duizendknoopsoorten .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.5__art_6.62
- number: '6.63'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding, bedoeld Artikel 6.61 , minimaal de volgende gegevens en bescheiden verstrekt: a. de locatie van de maatregelen; b. de datum en het tijdstip van het uitvoeren van de maatregelen; c. de frequentie van de maatregelen; d. de aard en de manier van de uitvoering van de maatregelen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.5__art_6.63
- number: '7.1'
  text: De regels in deze paragraaf zijn gesteld met het oog op de instandhouding en versterking van de uitzonderlijke universele waarde van het Gebied UNESCO Werelderfgoed Hollandse Waterlinies en het Gebied UNESCO Werelderfgoed Neder-Germaanse Limes (kernzone) en het Gebied UNESCO Werelderfgoed Neder-Germaanse limes (bufferzone) .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.1__subsec_7.1.1__art_7.1
- number: '7.2'
  text: 'Het UNESCO Werelderfgoed bestaat uit: a. het Gebied UNESCO Werelderfgoed Hollandse Waterlinies ; en b. het Gebied UNESCO Werelderfgoed Neder-Germaanse Limes (kernzone) en het Gebied UNESCO Werelderfgoed Neder-Germaanse Limes (bufferzone) .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.1__subsec_7.1.1__art_7.2
- number: '7.3'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied UNESCO Werelderfgoed Hollandse Waterlinies : a. neemt de uitzonderlijke universele waarde van de Hollandse Waterlinies in acht en bevat regels voor instandhouding en versterking daarvan; en b. bevat geen regels die activiteiten toestaan die die waarde aantasten. 2. Als uitzonderlijke universele waarde Hollandse Waterlinies gelden de kernkwaliteiten, bedoeld in de Bijlage XV Cultuurhistorie en de Gebiedsanalyses Kernkwaliteiten Hollandse Waterlinies . 3. De motivering van een omgevingsplan bevat: a. een beschrijving van de uitzonderlijke universele waarde van de Hollandse Waterlinies in het plangebied; en b. een beschrijving van de wijze waarop die waarde in acht is genomen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.1__subsec_7.1.1__art_7.3
