          operation: EQUALS
          subject: $in_beperkingengebied_lokale_spoorweg
          value: true
- number: '4.49'
  text: Deze paragraaf is van toepassing op activiteiten in het Beperkingengebied lokale spoorweg , die nadelige gevolgen kunnen hebben voor de belangen, bedoeld in Artikel 4.45 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.3__subsec_4.3.3__art_4.49
- number: '4.50'
  text: 'Het verbod in artikel 9.48 van het Besluit activiteiten leefomgeving, om zonder omgevingsvergunning een activiteit in een beperkingengebied met betrekking tot een lokale spoorweg uit te voeren, geldt niet voor activiteiten in de Beschermingszone lokale spoorweg , met uitzondering van: a. het bouwen en in stand houden van bouwwerken en het plaatsen en behouden van objecten, met inbegrip van bomen, met een hoogte die groter is dan de kortste afstand van het bouwwerk of object tot de bovenleiding; b. het planten en behouden van bomen waarvan de kroon binnen een afstand van 5 meter vanaf de bovenleiding kan groeien; c. het gebruiken van een ladder, hijskraan of hoogwerker met een hoogte die groter is dan de kortste afstand van de locatie waar de hijskraan of hoogwerker wordt gebruikt tot de bovenleiding; d. het uitvoeren van heiwerkzaamheden; e. het uitvoeren van graafwerkzaamheden met een diepte van meer dan 1/10 van de afstand tot buitenste spoorstaaf; f. het onttrekken van grondwater;
    en g. andere activiteiten die van invloed zijn op het lokale spoor.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.3__subsec_4.3.3__art_4.50
- number: '4.51'
  text: 'In aanvulling op paragraaf 7.2 van de Omgevingsregeling worden bij een aanvraag om een omgevingsvergunning voor een lokale spoorweg, de volgende gegevens en bescheiden verstrekt: a. een werkplan waarin wordt beschreven hoe de activiteit wordt uitgevoerd, inclusief risico-inventarisatie en -evaluatie; b. een beschrijving van de locatie en de inrichting van het werkterrein waarop in ieder geval is aangegeven de locatie van bouwketen, werkmaterieel inclusief draaicirkels en (werk)hoogte, opslagtanks en aan- en afvoerwegen; c. een omschrijving van de gevolgen van de werkzaamheden voor de toegankelijkheid, de veiligheid en het doelmatig gebruik van de spoorweginfrastructuur; d. een Veiligheid & Gezondheid plan Uitvoeringsfase (V&G U-plan) conform het Kader Werkzaamheden Tramweg (KWT); e. een uitvoeringsplan waarin wordt aangetoond dat de baan veilig berijdbaar is tijdens en na de werkzaamheden en indien van toepassing een Plan Veilige Berijdbaarheid conform het Kader Werkzaamheden Tramweg
    (KWT); f. een werktekening met diepteligging onder trambaan, route en diameter of diameters van te boren of persen leidingen) en een kraterberekening indien van toepassing; en g. een monitoringsplan als graaf-, hei- of bronneringswerkzaamheden worden uitgevoerd.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.3__subsec_4.3.3__art_4.51
- number: '4.52'
  text: '1. De regels in deze afdeling zijn gesteld met het oog op: a. de instandhouding en de bruikbaarheid van vaarwegen de bijbehorende werken; en b. de veiligheid en het vlotte verloop van het scheepvaartverkeer op vaarwegen. 2. Taken en bevoegdheden op grond van deze afdeling kunnen ook worden uitgeoefend met het oog op de volgende belangen in het gebied waar de vaarweg is gelegen: a. het beschermen van landschappelijke, cultuurhistorische en aardkundige waarden ; en b. de natuurbescherming.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.1__art_4.52
- number: '4.53'
  text: 1. De provincie is belast met het vaarwegbeheer van de Vaarweg in beheer bij provincie Utrecht , bedoeld in lijst A van Bijlage IX Vaarwegbeheer , onder de nummers 1 tot en met 4 opgenomen regionale wateren en sluizen. 2. Het vaarwegbeheer van de Vaarweg niet in beheer bij provincie Utrecht bij provincie, bedoeld in lijst A van Bijlage IX Vaarwegbeheer , onder de nummers 5 tot en met 13 opgenomen regionale wateren en sluizen, wordt uitgevoerd door de in deze lijst aangegeven bestuursorganen. 3. Met het vaarwegbeheer van de in lijst B en C van Bijlage IX Vaarwegbeheer , opgenomen regionale wateren en sluizen zijn belast de op de betreffende lijst aangegeven bestuursorganen. 4. Het nautisch beheer van de in lijst A, B en C van Bijlage IX Vaarwegbeheer , opgenomen regionale wateren en sluizen ligt bij het op de betreffende lijst aangegeven bestuursorgaan.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.2__art_4.53
- number: '4.54'
  text: '1. De vaarwegbeheerder draagt zorg voor het onderhoud van de vaarweg . Het onderhoud omvat: a. het behouden of realiseren van de vaarwegdiepte en vaarweghoogte, zoals vastgesteld in het Besluit minimaal benodigde doorvaarthoogten en het Besluit minimaal benodigde vaarwegdiepten ; b. het in goede staat houden of brengen van oevers, oevervoorzieningen en kunstwerken; en c. het schoonhouden van de vaarweg. 2. Ontheffing van het realiseren van de vaarweghoogte wordt alleen verleend als bij de bouw van een vaste brug redelijkerwijs niet aan die vaarweghoogte kan worden voldaan.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.2__art_4.54
- number: '4.55'
  text: De vaarwegbeheerder draagt er zorg voor dat de bruggen en sluizen worden bediend op de door gedeputeerde staten vastgestelde tijden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.2__art_4.55
- number: '4.56'
  text: 1. Schepen, samenstellen van schepen en drijvende voorwerpen worden op aanwijzing van de vaarwegbeheerder verhaald, als onderhoud van een vaarweg of bijbehorend werk dat nodig maakt. 2. Uitgezonderd in spoedgevallen wordt de zakelijk gerechtigde of de gebruiker van een schip, een samenstel van schepen of van een drijvend voorwerp ruimschoots van tevoren door de vaarwegbeheerder schriftelijk in kennis gesteld van de uit te voeren onderhoudswerkzaamheden aan een vaarweg of bijbehorend werk.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.2__art_4.56
- number: '4.57'
  text: Deze paragraaf is van toepassing op activiteiten in het Beperkingengebied vaarweg , die nadelige gevolgen kunnen hebben voor de belangen, bedoeld in Artikel 4.52 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.3__art_4.57
- number: '4.58'
  text: '1. Degene die een activiteit uitvoert en weet of redelijkerwijs kan vermoeden dat die activiteit nadelige gevolgen kan hebben voor de belangen, bedoeld in Artikel 4.52 , is verplicht: a. alle maatregelen te nemen die redelijkerwijs van diegene kunnen worden gevraagd om die gevolgen te voorkomen; b. voor zover die gevolgen niet kunnen worden voorkomen: die gevolgen zoveel mogelijk te beperken of ongedaan te maken; en c. als die gevolgen onvoldoende kunnen worden beperkt: die activiteit achterwege te laten voor zover dat redelijkerwijs van diegene kan worden gevraagd. 2. Deze plicht houdt in ieder geval in dat: a. geen stoffen of voorwerpen in het Beperkingengebied vaarweg worden gebracht die schade toebrengen aan de vaarweg of de veiligheid en het vlotte verloop van het scheepvaartverkeer; b. houtopstand zo wordt onderhouden dat geen hinder voor de scheepvaart wordt veroorzaakt; en c. bij het uitvoeren van activiteiten geen belemmering of hinder voor de scheepvaart wordt veroorzaakt.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.3__art_4.58
- number: '4.59'
  text: 'Het is verboden zonder omgevingsvergunning in het Beperkingengebied vaarweg de volgende activiteiten uit te voeren: a. veranderen van de loop of de vaarwegdiepte van de vaarweg ; b. aanbrengen, hebben, veranderen of verwijderen van werken of objecten; en c. aanbrengen, hebben of veranderen van een ligplaats of afmeervoorziening.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.3__art_4.59
- number: 4.59a
  text: Het verbod in Artikel 4.59 geldt niet voor activiteiten door of namens de provincie in het kader van het vaarweg- of nautisch beheer.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.3__art_4.59a
- number: '4.60'
  text: Artikel 4.60 Indieningsvereisten aanvraag omgevingsvergunning beperkingengebiedactiviteit vaarweg
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.3__art_4.60
- number: '4.61'
  text: Het bevoegd gezag kan de omgevingsvergunning intrekken, als de omstandigheden aanmerkelijk zijn gewijzigd.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.3__art_4.61
- number: '4.62'
  text: '1. Het is de vervoerder en de schipper in het gebied Verbod varend ontgassen verboden een ladingtank met restladingdamp en van de volgende stoffen vanaf een binnenschip op een vaarweg te ontgassen : a. benzeen (UN-nummer 1114); b. ruwe aardolie met meer dan 10% benzeen (UN-nummer 1267); c. aardoliedestillaten N.E.G. met meer dan 10% benzeen of aardolieproducten N.E.G met meer dan 10% benzeen (UN 1268); d. brandstof voor straalvliegtuigen met meer dan 10% benzeen (UN 1863); e. brandbare vloeistoffen, N.E.G. met meer dan 10% benzeen (UN 1993); en f. koolwaterstoffen, vloeibaar met meer dan 10% benzeen (UN 3295). 2. Van een restladingdamp zoals bedoeld in het eerste lid, is sprake bij een concentratie van die damp in de ladingtank groter dan of gelijk aan 10% van de onderste explosiegrens.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.4__art_4.62
- number: '4.63'
  text: 'Het verbod in Artikel 4.62 geldt niet wanneer het ontgassen plaatsvindt: a. voor drukverevening die om veiligheidsredenen moet plaatsvinden; b. tijdens of na een calamiteit met het binnenschip , als het ontgassen om veiligheidsredenen noodzakelijk is.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.4__art_4.63
- number: '4.64'
  text: 'Het verbod in Artikel 4.62 geldt niet als kan worden aangetoond dat: a. de 3 voorafgaande ladingen in de desbetreffende ladingtank niet bestonden uit stoffen als genoemd in dat artikel; of b. de desbetreffende ladingtank bij de voorafgaande belading voor meer dan 95% gevuld was met een andere stof dan bedoeld in dat artikel.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.4__subsec_4.4.4__art_4.64
- number: '4.65'
  text: Een omgevingsplan dat betrekking heeft op locaties binnen het Luchtvaartterrein bevat geen regels die voorzien in nieuwvestiging van een luchtvaartterrein voor gemotoriseerde luchtvaartuigen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.5__art_4.65
  machine_readable:
    endpoint: art_4_65
    competent_authority:
      name: Bevoegd gezag
      type: CATEGORY
    execution:
      produces:
        legal_character: TOETS
      parameters: []
      input:
      - name: in_luchtvaartterrein
        type: boolean
        description: 'Geo-feit: locatie binnen zone luchtvaartterrein'
        source:
          description: Buiten wet-YAML; GIO/zone-engine. joinId=
      output:
      - name: result_4_65
        type: boolean
        description: Uitkomst artikel 4.65
      actions:
      - output: result_4_65
        value:
          operation: EQUALS
          subject: $in_luchtvaartterrein
          value: true
- number: '4.66'
  text: 1. Een omgevingsplan dat betrekking heeft op locaties binnen de Buffer luchtvaartterrein bevat geen regels die voorzien in nieuwvestiging van een luchtvaartterrein voor gemotoriseerde luchtvaartuigen tenzij uit onderzoek is gebleken dat de geluidbelasting onder de grens, genoemd in de Bijlage XVII Luchtvaartterrein blijft. 2. De motivering van een omgevingsplan bevat een onderbouwing en de onderzoeksresultaten waaruit blijkt dat aan de voorwaarden is voldaan.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.5__art_4.66
