- number: '3.11'
  text: '1. Degene die in een Grondwaterbeschermingszone een activiteit uitvoert en weet of redelijkerwijs kan vermoeden dat die activiteit nadelige gevolgen kan hebben voor de bescherming van het grondwater in verband met de winning daarvan voor menselijke consumptie, is verplicht: a. alle maatregelen te nemen die redelijkerwijs van diegene kunnen worden gevraagd om die gevolgen te voorkomen; b. voor zover die gevolgen niet kunnen worden voorkomen: die gevolgen zoveel mogelijk te beperken of ongedaan te maken; en c. als die gevolgen onvoldoende kunnen worden beperkt: die activiteit achterwege te laten voor zover dat redelijkerwijs van diegene kan worden gevraagd. 2. De zorgplicht houdt in ieder geval in dat, wanneer er sprake is van een direct optredende of dreigende verontreiniging van het grondwater, gedeputeerde staten onmiddellijk op de hoogte worden gesteld.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.3__art_3.11
- number: '3.12'
  text: Het drinkwaterbedrijf plaatst langs alle openbare wegen, spoorwegen en vaarwegen die toegang geven tot een Waterwingebied of een Grondwaterbeschermingsgebied of daaraan grenzen, op of bij de grenzen van dat gebied borden waarvan het model is vastgesteld in Bijlage IV Modelborden .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.3__art_3.12
- number: '3.13'
  text: Het is verboden in het Waterwingebied Bethunepolder een bestrijdingsmiddel voorhanden te hebben, in voorraad te hebben of toe te passen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.13
- number: 3.13a
  text: '1. Het verbod in Artikel 3.13 geldt niet voor het in een besloten ruimte voorhanden hebben, in voorraad hebben of toepassen van een geringe hoeveelheid van een bestrijdingsmiddel , als dit: a. zonder bewerking kan worden toegepast; b. dient of gediend heeft voor normaal gebruik ter plaatse of afkomstig is van normaal gebruik binnen een gebouw; c. bewaard wordt in een deugdelijke verpakking; en d. afdoende beschermd is tegen weersinvloeden. 2. De onder het eerste lid van dit artikel opgenomen vrijstelling is niet van toepassing op glyfosaathoudende bestrijdingsmiddelen, tenzij deze middelen uitsluitend gebruikt worden voor de bestrijding van onkruiden grote brandnetel, ridderzuring, akkerdistel en ruwe smele in grasland.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.13a
- number: '3.14'
  text: '1. Het is verboden zonder melding in het Waterwingebied Bethunepolder glyfosaathoudende bestrijdingsmiddelen toe te passen voor het bestrijden van de onkruiden grote brandnetel, ridderzuring, akkerdistel en ruwe smele in grasland. 2. De toepassing van glyfosaathoudende bestrijdingsmiddelen is uitsluitend toegestaan, als: a. handmatige of mechanische onkruidbestrijding redelijkerwijs niet kan worden geëist; b. de onkruidbestrijkingsmethode wordt toegepast; c. de toepassing plaatsvindt door een deskundige die beschikt over een licentie bedoeld in de Wet gewasbeschermingsmiddelen en biociden ; d. de weersomstandigheden dit toelaten en de hoogte van het gras redelijkerwijs geen beletsel vormt om de onkruiden aan te strijken zonder het gras te raken; en e. bij de toepassing een afstand van minimaal 1 meter tot geulen en greppels en minimaal 2 meter tot sloten in acht wordt genomen. 3. Minimaal 5 werkdagen voordat de activiteit uitgevoerd wordt, wordt de melding ingediend.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.14
- number: '3.15'
  text: Minimaal 24 uur voor het begin van de activiteit, bedoeld in Artikel 3.14 , wordt het betrokken drinkwaterbedrijf telefonisch geïnformeerd.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.15
- number: '3.16'
  text: '1. Het is verboden in een Waterwingebied de volgende activiteiten uit te voeren: a. een milieubelastende activiteit bedoeld in hoofdstuk 3 van het Besluit activiteiten leefomgeving; b. het toepassen of aanwezig hebben van een (potentieel) schadelijke stof; c. het op of in de bodem aanbrengen van een constructie of uitvoeren van andere werkzaamheden; d. het op of in de bodem brengen van mogelijk schadelijke stoffen, waaronder het toepassen van grond en baggerspecie , het gebruik van meststoffen en het uitstrooien van as; e. het vanaf een locatie buiten een Waterwingebied schuin boren onder een waterwingebied; f. het toepassen van uitloogbare materialen; en g. het gebruiken van een locatie als parkeerterrein of terrein voor evenementen. 2. Als een (potentieel) schadelijke stof worden in ieder geval aangemerkt: a. een zeer zorgwekkende stof, zoals vastgesteld door het RIVM ; b. stoffen opgenomen in de Nederlandse Richtlijn Bodembescherming 2012, deel 3, bijlage 2, stap 5, ''De stoffenlijst''
    ; c. stoffen met een schadelijke werking op de smaak of geur van het grondwater en mengsels en verbindingen waaruit dergelijke stoffen in het grondwater kunnen ontstaan en die het grondwater ongeschikt voor menselijke consumptie maken; en d. gewasbeschermingsmiddelen en biociden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.16
- number: '3.17'
  text: 'Het verbod in Artikel 3.16 , eerste lid geldt niet voor: a. alle noodzakelijke activiteiten in het belang van de duurzame veiligstelling van de openbare drinkwatervoorziening; b. reguliere bodemwerkzaamheden, zoals groenonderhoud en tuinieren, die de beschermende bodemlagen niet aantasten; c. het toepassen van strooizout ten behoeve van de gladheidsbestrijding; d. het aanwezig hebben van stoffen die nodig zijn voor het functioneren van motorvoertuigen, motorwerktuigen of bromfietsen; e. het vervoeren van stoffen in afgesloten en vloeistofdichte tanks of in een deugdelijke gesloten verpakking, als deze afdoende zijn beschermd tegen invloeden van weersomstandigheden en op zodanige wijze dat geen gevaar voor verspreiding of verstuiving bestaat; f. het hebben of gebruiken van geringe hoeveelheden stoffen, anders dan gewasbeschermingsmiddelen of biociden, bij woningen en andere gebouwen, voor normaal gebruik, als deze bewaard worden in een deugdelijke verpakking en afdoende zijn beschermd
    tegen externe invloeden; g. het op of in de bodem brengen van dierlijke meststoffen als gevolg van beweiding; h. de aanleg van verharde of onverharde paden voor niet-gemotoriseerd vervoer; i. het aanbrengen van een constructie of uitvoeren van andere werkzaamheden op of in de bodem, gericht op behoud van de natuurfunctie of ten dienste van extensieve recreatie en mits hiermee geen verspreiding ontstaat van schadelijke stoffen in de bodem of aantasting van de beschermende werking van bodemlagen ontstaat of kan ontstaan; j. aanleg en onderhoud van kabels en onderhoud van leidingen en; k. evenementen waarbij geen gebruik wordt gemaakt van voorzieningen die een risico vormen voor verontreiniging van de bodem en het zich daarin bevindende grondwater en waarvoor voorafgaand schriftelijk toestemming is verkregen van het betreffende drinkwaterbedrijf.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.17
- number: '3.18'
  text: Het verbod in Artikel 3.16 , eerste lid geldt niet voor het aanleggen en in stand houden van rioleringen in het Waterwingebied Bethunepolder waterleidingkanaal die aansluiten op bestaande rioleringen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.18
- number: '3.19'
  text: Het verbod in Artikel 3.16 , eerste lid geldt niet voor het gebruik van kunstmest in de Waterwingebieden Lexmond, Woerden en Vianen .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.19
- number: '3.20'
  text: '1. Het is verboden zonder melding in een Waterwingebied de volgende activiteiten uit te voeren: a. het toepassen van grond of baggerspecie met een kwaliteit die voldoet aan de achtergrondwaarde; b. het uitvoeren van civieltechnisch en bouwtechnische werken nodig voor regulier beheer en onderhoud van bestaande bebouwing, infrastructuur en waterbeheer; c. het verspreiden van baggerspecie die vrijkomt bij regulier onderhoud van watergangen, over het aangrenzend perceel met inachtneming van paragraaf 3.2.26 van het Besluit activiteiten leefomgeving; d. het onderzoeken of saneren van de bodem met inachtneming van paragraaf 3.2.23 van het Besluit activiteiten leefomgeving; e. buitengebruikstelling van een boorput . 2. Minimaal 4 weken voordat de activiteit uitgevoerd wordt, wordt de melding ingediend.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.20
- number: '3.21'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van het toepassen van grond of baggerspecie in een Waterwingebied , bedoeld in Artikel 3.20 , eerste lid, onder a, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. de kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. of het grond of baggerspecie betreft; d. de hoeveelheid grond of baggerspecie in m3; e. de herkomst van de grond of baggerspecie; f. of de grond of baggerspecie voldoet aan de achtergrondwaarde; g. de klasse van de baggerspecie; h. bij toepassing op land, het doel waarvoor de grond of baggerspecie wordt toegepast: 1. landbouw en natuur; 2. wonen; en 3. industrie; i. bij toepassing op de waterbodem, de klasse van de baggerspecie: 1. klasse A; of 2. klasse B; j. een gemotiveerde
    schriftelijke verklaring dat de activiteit geen schade toebrengt aan de bodem en het zich daarin bevindende grondwater; en k. start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.21
- number: '3.22'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van civiel- en bouwtechnische werken in een Waterwingebied , bedoeld in Artikel 3.20 , eerste lid, onder b, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. straatnaam en huisnummer, plaats, kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. een beschrijving van het civieltechnische of bouwtechnische type van de activiteit; d. de oppervlakte van de werken (lengte, breedte); e. als wordt ontgraven, tot welke diepte de werken worden uitgevoerd; f. een gemotiveerde schriftelijke verklaring dat de activiteit geen schade toebrengt aan de bodem en het zich daarin bevindende grondwater; en g. start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.22
- number: '3.23'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van het verspreiden van baggerspecie uit watergang in een Waterwingebied , bedoeld in Artikel 3.20 , eerste lid, onder c, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. straatnaam en huisnummer, plaats, kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. de hoeveelheid grond of baggerspecie in m3; d. de herkomst van de grond of baggerspecie; e. of de baggerspecie voldoet aan artikel 4.1274 van het Besluit activiteiten leefomgeving; f. de klasse van de baggerspecie; g. bij toepassing op land, het doel waarvoor de grond of baggerspecie wordt toegepast: 1. landbouw en natuur; 2. wonen; en 3. industrie. h. bij toepassing op waterbodem, de klasse van de baggerspecie: 1. klasse A; of
    2. klasse B. i. een gemotiveerde schriftelijke verklaring dat de activiteit geen schade toebrengt aan de bodem en het zich daarin bevindende grondwater; en j. start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.23
- number: '3.24'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van onderzoek en sanering van bodem in een Waterwingebied , bedoeld in Artikel 3.20 , eerste lid, onder d, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. straatnaam en huisnummer, plaats, kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. de herkomst van de (verwachte) verontreiniging; d. de omvang van de (verwachte) verontreiniging in m3; e. de maximale diepte van de verontreiniging in meter beneden maaiveld ; f. een beschrijving van de te gebruiken saneringstechniek; g. een gemotiveerde schriftelijke verklaring dat de activiteit geen schade toebrengt aan de bodem en het zich daarin bevindende grondwater; en h. start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.24
- number: '3.25'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van de buitengebruikstelling van een boorput in een Waterwingebied , bedoeld in Artikel 3.20 , eerste lid, onder e, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. de kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. het aantal boorputten dat wordt afgedicht; d. het te gebruiken afdichtmateriaal; en e. de start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.25
- number: '3.26'
  text: Bij buitengebruikstelling van een boorput in een Waterwingebied laat de eigenaar of exploitant binnen 2 weken na buitengebruikstelling de boorput(ten) afdichten door een gecertificeerd en erkend bedrijf conform BRL SIKB 2100 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.4__art_3.26
- number: '3.27'
  text: Het is verboden in een Grondwaterbeschermingsgebied een milieubelastende activiteit uit te voeren, bedoeld in de lijst verboden activiteiten in Bijlage V Lijst verboden activiteiten in grondwaterbeschermingsgebied (inclusief waterwingebied Bethunepolder) .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.27
- number: 3.27a
  text: Het verbod in Artikel 3.27 geldt niet voor het hebben en houden van gastanks voor niet-bedrijfsmatig gebruik.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.27a
- number: '3.28'
  text: Het is verboden in een Grondwaterbeschermingsgebied een niet-toelaatbare voor het grondwater schadelijke stof voorhanden te hebben, bedoeld in Bijlage VI Lijst niet-toelaatbare voor het grondwater schadelijke stoffen .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.28
- number: 3.28a
  text: Het verbod in Artikel 3.28 geldt niet voor een kleine werkvoorraad van maximaal 25 liter of kilogram.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.28a
- number: 3.28b
  text: '1. Het is verboden in een Grondwaterbeschermingsgebied een potentieel voor het grondwater schadelijke stof voorhanden te hebben, als de hoeveelheid meer is dan: a. de in Bijlage VII Tabel hoeveelheidsdrempel voor stoffen aangegeven hoeveelheidsdrempel; b. in geval van een andere potentieel voor het grondwater schadelijke stof: 1. 5 m3 per opslageenheid bij een tot vloeistof gekoeld gas of een vloeistof; en 2. 5000 kilogram per opslageenheid bij een viskeuze of vaste stof. 2. Bij het voorhanden hebben van een potentieel voor het grondwater schadelijke stof met een hoeveelheid die minder is dan de hoeveelheid bedoeld in het eerste lid, worden bodembeschermende voorzieningen en maatregelen toegepast, die de hoogst mogelijke vorm van bescherming bieden. Hieronder wordt in ieder geval verstaan dat de opslag bovengronds en boven een vloeistofdichte bodemvoorziening plaatsvindt en dat processen of overslag boven een vloeistofdichte of vloeistofkerende bodemvoorziening plaatsvinden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.28b
- number: '3.29'
  text: '1. Het is verboden in het Grondwaterbeschermingsgebied Bethunepolder, Bilthoven, Bunnik, Cothen, Groenekan, Linschoten, Zeist en in het Waterwingebied Bethunepolder : a. boorput ten op te richten, in exploitatie te nemen of te hebben met een boordiepte van 40 meter of meer onder maaiveld ; en b. boringen of grond- of funderingswerken uit te voeren of te hebben op een diepte van 40 meter of meer onder het maaiveld , met inbegrip van schuine boringen, uitgevoerd vanaf een locatie buiten de grondwaterbeschermingszone . 2. Het is verboden in het Grondwaterbeschermingsgebied Amersfoort-Berg, Doorn, Langerak, Soestduinen en Woerden : a. boorput ten op te richten, in exploitatie te nemen of te hebben met een boordiepte van 3 meter of meer onder maaiveld ; en b. boringen of grond- of funderingswerken uit te voeren of te hebben op een diepte van 3 meter of meer onder het maaiveld, met inbegrip van schuine boringen, uitgevoerd vanaf een locatie buiten de grondwaterbeschermingszone . 3. Het
    is verboden in het Grondwaterbeschermingsgebied Driebergen, Leersum en Rhenen : a. boorput ten op te richten, in exploitatie te nemen of te hebben met een boordiepte van 10 meter of meer onder maaiveld ; en b. boringen of grond- of funderingswerken uit te voeren of te hebben op een diepte van 10 meter of meer onder het maaiveld, met inbegrip van schuine boringen, uitgevoerd vanaf een locatie buiten de grondwaterbeschermingszone . 4. Het is verboden in het Grondwaterbeschermingsgebied Beerschoten : a. boorput ten op te richten, in exploitatie te nemen of te hebben met een boordiepte van 30 meter of meer onder maaiveld ; en b. boringen of grond- of funderingswerken uit te voeren of te hebben op een diepte van 30 meter of meer onder het maaiveld, met inbegrip van schuine boringen, uitgevoerd vanaf een locatie buiten de grondwaterbeschermingszone .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.29
- number: '3.30'
  text: Het is verboden in een Grondwaterbeschermingsgebied een buisleiding voor het transport van olie, chemicaliën en gassen niet zijnde aardgas of een leiding voor het transport van elektriciteit die wordt gekoeld met olie of chemicaliën, aan te leggen, te vervangen of te verleggen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.30
- number: '3.31'
  text: Het is verboden in een Grondwaterbeschermingsgebied werken tot stand te brengen of activiteiten uit te voeren met als doel het direct of indirect warmte of koude aan de bodem te onttrekken of toe te voegen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.31
- number: '3.32'
  text: Het is verboden in een Grondwaterbeschermingsgebied meststoffen op of in de bodem te brengen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.32
- number: 3.32a
  text: 'Het verbod in Artikel 3.32 geldt niet voor het op of in de bodem brengen van: a. dierlijke meststoffen; en b. anorganische meststoffen, compost of kalkmeststoffen bedoeld in het Uitvoeringsbesluit Meststoffenwet.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.32a
- number: '3.33'
  text: Het is verboden in een Grondwaterbeschermingsgebied afstromend hemelwater via diepinfiltratie in het grondwater te lozen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.33
- number: '3.34'
  text: 'De verboden in een Grondwaterbeschermingsgebied , bedoeld in Artikel 3.29 , gelden niet voor: a. boorputten voor de controle van het grondwater voor de openbare drinkwatervoorziening; b. het oprichten en hebben van boorputten voor het onttrekken van grondwater voor een noodvoorziening; c. bronbemalingen; d. het onderzoeken of saneren van de bodem in het kader van paragraaf 3.2.23 van het Besluit activiteiten leefomgeving; e. sonderingen; en f. ontgrondingen in het kader van paragraaf 16.2.2 van het Besluit activiteiten leefomgeving.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.34
- number: '3.35'
  text: Het is verboden zonder omgevingsvergunning in een Grondwaterbeschermingsgebied een open bodemenergiesysteem in combinatie met een grondwatersanering aan te leggen en te gebruiken.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.35
- number: '3.36'
  text: Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een open bodemenergiesysteem in combinatie met grondwatersanering in een Grondwaterbeschermingsgebied , wordt de omgevingsvergunning in ieder geval geweigerd als niet is aangetoond dat een significante bijdrage wordt geleverd aan het verbeteren van de grondwaterkwaliteit door een koppeling te realiseren tussen duurzaam gebruik van bodemenergie en de gekozen saneringsaanpak.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.36
- number: '3.37'
  text: 'In aanvulling op de aanvraagvereisten in de wet worden bij een aanvraag om een omgevings­vergunning , bedoeld in Artikel 3.35 , minimaal de volgende gegevens en bescheiden verstrekt: a. een nader bodemonderzoek dat voldoet aan NTA 5755 ; b. een beschrijving van het open bodemenergiesysteem, waarbij in ieder geval inzicht wordt gegeven in de bronnenconfiguratie, filterstelling, verpompte hoeveelheid water en energie per bron en in totaal en effecten op de omgeving; c. een beschrijving van de saneringstechniek; d. de te gebruiken boortechnieken om negatieve effecten van doorboring van de in de bodem voorkomende beschermende lagen zoveel mogelijk te voorkomen, en; e. een risicobeoordeling van de effecten van de aanleg en het in gebruik hebben van een open bodemenergiesysteem in combinatie met de grondwatersanering, waarbij in ieder geval inzicht wordt gegeven in: 1. de te verwachten verbetering van de grondwaterkwaliteit; 2. monitoring van de effecten; 3. te treffen tegenmaatregelen,
    mocht niet de verwachte verbetering van de grondwaterkwaliteit optreden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.37
- number: '3.38'
  text: '1. Het is verboden zonder melding in een Grondwaterbeschermingsgebied beneden de in Artikel 3.29 genoemde dieptegrenzen horizontaal gestuurde boringen uit te voeren. De gemelde activiteit moet daarbij voldoen aan de volgende voorwaarden: a. andere werkmethoden zijn aantoonbaar niet toepasbaar; b. de benodigde aanlegdiepte beneden de dieptegrens vormt geen noemenswaardig risico voor de bodem en het zich daarin bevindende grondwater; c. de milieuhygiënische bodemkwaliteit ter plaatse van het in- en uittredepunt overstijgt de achtergrondwaarde niet; d. als het boortracé een ernstige bodemverontreiniging passeert of doorboort, worden afdoende maatregelen getroffen om verspreiding tegen te gaan; e. de boorvloeistof wordt samengesteld met schoon leidingwater; f. de boorvloeistof bevat voldoende bentoniet om uitwisseling met de ondergrond zoveel mogelijk te voorkomen. Hierbij wordt het gebruik van additieven zoveel mogelijk beperkt; g. de vrijkomende grond wordt niet zonder bodembeschermende
    maatregelen opgeslagen of verspreid over het perceel; en h. als de horizontale boring voor de aanleg van een riool is, wordt de mantelbuis voorzien van verklikkers die een zodanige werking hebben dat bij een eventuele breuk de inhoud van het riool aan het maaiveld uittreedt via deze verklikkers. 2. Minimaal 4 weken voordat de horizontale boring uitgevoerd wordt, wordt de melding ingediend.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.38
- number: '3.39'
  text: '1. Het is verboden zonder melding in een Grondwaterbeschermingsgebied beneden de in Artikel 3.29 genoemde dieptegrenzen de volgende activiteiten uit te voeren: a. het uitvoeren van grondwerken, voor zover bij verwijdering van de grond het bodemprofiel zodanig wordt hersteld dat minimaal dezelfde beschermende werking van de bodem ontstaat als voor de grondwerken; b. funderingswerken, voor zover daarbij uitsluitend gebruik wordt gemaakt van: 1. grondverdringende gladde geprefabriceerde palen zonder verbrede voet; 2. in de grond gevormde palen waarbij een hulpbuis wordt gebruikt die niet plaatselijk verbreed is en grondverdringend wordt ingebracht; of 3. voorgevormde of in de grond gevormde schroefpalen; c. het buitengebruikstellen van een boorput . 2. Het is verboden zonder melding in het Grondwaterbeschermingsgebied Amersfoort-Berg, Doorn, Langerak, Soestduinen en Woerden heipalen te verwijderen. 3. Minimaal 4 weken voordat de activiteit uitgevoerd wordt, wordt de melding ingediend.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.39
- number: 3.39a
  text: '1. Het is verboden zonder melding in een Grondwaterbeschermingsgebied de volgende activiteiten uit te voeren: a. aardgasleidingen aan te leggen, te verleggen of te verwijderen; b. een buisleiding voor het transport van olie, chemicaliën en gassen niet zijnde aardgas of leidingen voor het transport van elektriciteit die worden gekoeld met olie of chemicaliën aan te leggen, te verleggen of te verwijderen, zonder dat met een risicoanalyse van een deskundige overeenkomstig Handreiking “Publicatiereeks gevaarlijke stoffen” is aangetoond dat de kans op grondwaterverontreiniging door het aanleggen, verleggen of verwijderen gelijk blijft of vermindert ten opzichte van de daaraan voorafgaande situatie. 2. Minimaal 4 weken voordat de werkzaamheden worden uitgevoerd, wordt de melding ingediend.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.39a
- number: '3.40'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van de realisatie van een horizontaal gestuurde boring in een Grondwaterbeschermingsgebied , bedoeld in Artikel 3.38 , minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. doel van de horizontaal gestuurde boring; d. het diepste punt van de boring; e. de lengte van de boring tussen in- en uittredepunt; f. de totale lengte van de boring; g. een (boor)plan waarin de in Artikel 3.38 genoemde voorwaarden nader zijn uitgewerkt; en h. de start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.40
- number: '3.41'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van de aanleg van een aardgasleiding in een Grondwaterbeschermingsgebied , bedoeld in Artikel 3.39a , onder a, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. de lengte van de aardgasleiding; d. het diepste punt van de aardgasleiding in meter beneden maaiveld; e. het te gebruiken afdichtmateriaal; f. als dit van toepassing is, de gebruikte funderingstechniek; en g. de start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.41
- number: 3.41a
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van de aanleg van een buisleiding, niet zijnde aardgas, in een Grondwaterbeschermingsgebied , bedoeld in Artikel 3.39a , onder b, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. de lengte van de buisleiding; d. het diepste punt van de buisleiding in meter beneden maaiveld; e. het te gebruiken afdichtmateriaal; f. de start- en einddatum van de activiteit en; g. een door een deskundige uitgevoerde risicoanalyse als bedoeld in de Handreiking Publicatiereeks gevaarlijke stoffen , waarin is aangetoond dat de kans op grondwaterverontreiniging door het aanleggen, verleggen of verwijderen gelijk blijft of vermindert ten opzichte van de
    daaraan voorafgaande situatie.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.41a
- number: '3.42'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van grondwerken in een Grondwaterbeschermingsgebied , bedoeld in Artikel 3.39 eerste lid, onder b, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. doel van het ontgraven; d. oppervlakte van de ontgraving in m2; e. diepte tot waar wordt ontgraven in meter beneden maaiveld ; f. de wijze waarop het bodemprofiel wordt hersteld zodat minimaal dezelfde beschermende werking van de bodem ontstaat als voor de grondwerken; en g. de start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.42
- number: '3.43'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van funderingswerken in een Grondwaterbeschermingsgebied , bedoeld in Artikel 3.39 , eerste lid, onder b, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. de kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. het doel waarvoor de fundering geplaatst wordt; d. de te gebruiken funderingstechniek: 1. grondverdringende gladde geprefabriceerde palen zonder verbrede voet; 2. in de grond gevormde palen waarbij een hulpbuis wordt gebruikt die niet plaatselijk is verbreed en grondverdringend wordt ingebracht; 3. schroefpalen; e. de diepte tot waar de fundering komt in meter beneden maaiveld ; en f. de start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.43
- number: '3.44'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van de buitengebruikstelling boorput in een Grondwaterbeschermingsgebied , bedoeld in Artikel 3.39 eerste lid, onder c, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. de kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. aantal boorputten dat wordt afgedicht; d. het te gebruiken afdichtmateriaal; en e. de start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.44
- number: '3.45'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van de verwijdering van heipalen in het Grondwaterbeschermingsgebied Amersfoort-Berg, Doorn, Langerak, Soestduinen en Woerden , bedoeld in Artikel 3.39 , tweede lid, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. de kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. aantal van de te verwijderen heipalen; d. diepte tot welke de heipalen worden verwijderd; e. het te gebruiken afdichtmateriaal; en f. de start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.45
- number: '3.46'
  text: Bij buitengebruikstelling van een boorput in een Grondwaterbeschermingsgebied laat de eigenaar of exploitant binnen 2 weken na buitengebruikstelling die boorput afdichten door een gecertificeerd en erkend bedrijf conform BRL SIKB 2100/2101 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.46
- number: '3.47'
  text: Bij verwijdering van heipalen in het Grondwaterbeschermingsgebied Amersfoort-Berg, Doorn, Langerak, Soestduinen en Woerden wordt het ontstane gat zoveel mogelijk afgedicht met bentoniet.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.47
- number: '3.48'
  text: 1. Bij het lozen van afstromend hemelwater in een Grondwaterbeschermingsgebied wordt mogelijke verontreiniging van het grondwater zoveel als redelijkerwijs mogelijk is beperkt. 2. Aan het gestelde in het eerste lid wordt in ieder geval voldaan als de Leidraad Afkoppelen en infiltreren afstromend hemelwater provincie Utrecht wordt gevolgd.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.48
- number: '3.49'
  text: 1. Eenieder die een verharde of onverharde parkeerplaats voor motorrijtuigen in een Grondwaterbeschermingsgebied aanlegt of in stand houdt, treft zoveel als redelijkerwijs mogelijk is maatregelen om verontreiniging van het grondwater te voorkomen. 2. Aan het eerste lid wordt in ieder geval voldaan als de Leidraad Afkoppelen en infiltreren afstromend hemelwater provincie Utrecht wordt gevolgd.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.5__art_3.49
- number: '3.50'
  text: Het is verboden in een Boringsvrije zone mijnbouwactiviteiten uit te voeren zoals bedoeld in artikel 3.320 van het Besluit activiteiten leefomgeving.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.50
- number: '3.51'
  text: '1. Het is verboden in de Boringsvrije zone Bilthoven, Benschop-ondiep, Bunnik, Cothen, De Meern, Eempolder, Leidsche Rijn, Langerak-Noord, Lexmond-Noord, Linschoten, Nieuwegein, Vianen en Vianen-Panoven : a. boorputten op te richten, in exploitatie te nemen of te hebben met een boordiepte van 40 meter of meer onder maaiveld; en b. boringen of grond- of funderingswerken uit te voeren of te hebben op een diepte van 40 meter of meer onder het maaiveld, met inbegrip van schuine boringen, uitgevoerd vanaf een locatie buiten de boringsvrije zone. 2. Het is verboden in de Boringsvrije zone Amersfoort-Koedijkerweg, Rhenen en Woudenberg : a. boorputten op te richten, in exploitatie te nemen of te hebben met een boordiepte van 10 meter of meer onder maaiveld ; en b. boringen of grond- of funderingswerken uit te voeren of te hebben op een diepte van 10 meter of meer onder het maaiveld, met inbegrip van schuine boringen, uitgevoerd vanaf een locatie buiten de boringsvrije zone. 3. Het is verboden
    in de Boringsvrije zone Langerak en Lexmond : a. boorputten op te richten, in exploitatie te nemen of te hebben met een boordiepte van 3 meter of meer onder maaiveld ; en b. boringen, grond- of funderingswerken uit te voeren of te hebben op een diepte van 3 meter of meer onder het maaiveld, met inbegrip van schuine boringen, uitgevoerd vanaf een locatie buiten de boringsvrije zone. 4. Het is verboden in de Boringsvrije zone Veenendaal : a. boorputten op te richten, in exploitatie te nemen of te hebben met een boordiepte van 30 meter of meer onder maaiveld ; en b. boringen, grond- of funderingswerken uit te voeren of te hebben op een diepte van 30 meter of meer onder het maaiveld, met inbegrip van schuine boringen, uitgevoerd vanaf een locatie buiten de boringsvrije zone. 5. Het is verboden in de Boringsvrije zone Tull en t Waal : a. boorputten op te richten, in exploitatie te nemen of te hebben met een boordiepte van 55 meter of meer onder maaiveld ; en b. boringen of grond- of funderingswerken
    uit te voeren of te hebben op een diepte van 55 meter of meer onder het maaiveld, met inbegrip van schuine boringen, uitgevoerd vanaf een locatie buiten de boringsvrije zone. 6. Het is verboden in de Boringsvrije zone WCB Nieuwegein : a. boorputten op te richten, in exploitatie te nemen of te hebben met een boordiepte van 60 meter of meer onder maaiveld ; en b. boringen of grond- of funderingswerken uit te voeren of te hebben op een diepte van 60 meter of meer onder het maaiveld, met inbegrip van schuine boringen, uitgevoerd vanaf een locatie buiten de boringsvrije zone. 7. Het is verboden in de Boringsvrije zone Benschop-diep : a. boorputten op te richten, in exploitatie te nemen of te hebben met een boordiepte van 80 meter of meer onder maaiveld; en b. boringen of grond- of funderingswerken uit te voeren of te hebben op een diepte van 80 meter of meer onder het maaiveld, met inbegrip van schuine boringen, uitgevoerd vanaf een locatie buiten de boringsvrije zone.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.51
- number: '3.52'
  text: Het is verboden in een Boringsvrije zone op een diepte groter dan de in Artikel 3.51 genoemde dieptegrenzen werken tot stand te brengen of activiteiten uit te voeren met als doel direct of indirect warmte of koude aan de bodem te onttrekken of toe te voegen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.52
- number: '3.53'
  text: 'De verboden in een Boringsvrije zone , bedoeld in Artikel 3.51 , gelden niet voor: a. boorputten voor de controle van het grondwater voor de openbare drinkwatervoorziening; b. het oprichten en hebben van boorputten voor het onttrekken van grondwater voor een noodvoorziening; c. bronbemalingen; d. het onderzoeken of saneren van de bodem in het kader van paragraaf 3.2.23 van het Besluit activiteiten leefomgeving ; e. sonderingen; en f. ontgrondingen in het kader van paragraaf 16.2.2 van het Besluit activiteiten leefomgeving .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.53
- number: '3.54'
  text: Het is verboden zonder omgevingsvergunning in een Boringsvrije zone op een diepte groter dan de in Artikel 3.51 genoemde dieptegrenzen een open bodemenergiesysteem in combinatie met een grondwatersanering aan te leggen en te gebruiken.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.54
- number: '3.55'
  text: Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een open bodemenergiesysteem in combinatie met een grondwatersanering in een Boringsvrije zone beneden de in Artikel 3.51 genoemde dieptegrenzen, wordt de omgevingsvergunning in ieder geval geweigerd als niet is aangetoond dat een significante bijdrage geleverd wordt aan het verbeteren van de grondwaterkwaliteit door een koppeling te realiseren tussen duurzaam gebruik van bodemenergie en de gekozen saneringsaanpak.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.55
- number: '3.56'
  text: Het is verboden zonder omgevingsvergunning in een Boringsvrije zone op een diepte groter dan de in Artikel 3.51 genoemde dieptegrenzen een boorput op te richten en te hebben voor het onttrekken van grondwater voor industriële winningen voor menselijke consumptie.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.56
- number: 3.56a
  text: Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een boorput voor industriële winning in een Boringsvrije zone beneden de in Artikel 3.51 genoemde dieptegrenzen, wordt de omgevingsvergunning in ieder geval geweigerd als niet is aangetoond dat het grondwater wordt ingezet binnen een onderdeel van het productieproces voor menselijke consumptie waarvoor een dergelijk hoge waterkwaliteit noodzakelijk is.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.56a
- number: '3.57'
  text: 'In aanvulling op de aanvraagvereisten in de wet worden bij een aanvraag om een omgevingsvergunning , bedoeld in Artikel 3.54 , minimaal de volgende gegevens en bescheiden verstrekt: a. een nader bodemonderzoek dat voldoet aan NTA 5755 ; b. een beschrijving van het open bodemenergiesysteem, waarbij in ieder geval inzicht wordt gegeven in de bronnenconfiguratie, filterstelling, verpompte hoeveelheid water en energie per bron en in totaal en effecten op de omgeving; c. een beschrijving van de saneringstechniek; d. de te gebruiken boortechnieken om negatieve effecten van doorboring van de in de bodem voorkomende beschermende lagen zoveel mogelijk te voorkomen, en; e. een risicobeoordeling van de effecten van de aanleg en het in gebruik hebben van een open bodemenergiesysteem in combinatie met de grondwatersanering, waarbij in ieder geval inzicht wordt gegeven in: 1. de te verwachten verbetering van de grondwaterkwaliteit; 2. monitoring van de effecten; 3. te treffen tegenmaatregelen,
    mocht niet de verwachte verbetering van de grondwaterkwaliteit optreden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.57
- number: '3.58'
  text: 'In aanvulling op de aanvraagvereisten in de wet worden bij een aanvraag om een omgevingsvergunning voor een boorput voor industriële winning voor menselijke consumptie in een Boringsvrije zone bedoeld in Artikel 3.56 minimaal de volgende gegevens en bescheiden verstrekt: a. inzicht in de proceswaterstromen, waarbij wordt aangetoond dat het onttrokken grondwater wordt gebruikt voor, of in aanraking kan komen met producten voor menselijke consumptie, waarvoor water van drinkwaterkwaliteit noodzakelijk is; b. een verklaring dat het gebruik van grondwater voor de bereiding van producten voor menselijke consumptie bekend is bij de Nederlandse Voedsel en Warenautoriteit (NVWA); c. benodigde hoeveel water in m3/u, m3/kwartaal en m3/jaar; d. waterbesparingsplannen, waarbij wordt aangetoond dat zo zuinig mogelijk met het water wordt omgegaan; e. de te gebruiken boortechnieken om negatieve effecten van doorboring van de in de bodem voorkomende beschermende lagen zoveel mogelijk te voorkomen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.58
- number: '3.59'
  text: '1. Het is verboden zonder melding in een Boringsvrije zone beneden de in Artikel 3.51 genoemde dieptegrenzen horizontaal gestuurde boringen uit te voeren. De gemelde activiteit moet daarbij voldoen aan de volgende voorwaarden: a. andere werkmethoden zijn aantoonbaar niet toepasbaar; b. de benodigde aanlegdiepte beneden de dieptegrens vormt geen noemenswaardig risico voor de bodem en het zich daarin bevindende grondwater; c. de milieuhygiënische bodemkwaliteit ter plaatse van het in- en uittredepunt overstijgt de achtergrondwaarde niet; d. als het boortracé een ernstige bodemverontreiniging passeert of doorboort, worden afdoende maatregelen getroffen om verspreiding tegen te gaan; e. de boorvloeistof wordt samengesteld met schoon leidingwater; f. de boorvloeistof bevat voldoende bentoniet om uitwisseling met de ondergrond zoveel mogelijk te voorkomen. Hierbij wordt het gebruik van additieven zoveel mogelijk beperkt; g. de vrijkomende grond wordt niet zonder bodembeschermende maatregelen
    opgeslagen of verspreid over het perceel; h. als de horizontale boring voor de aanleg van een riool is, wordt de mantelbuis voorzien van verklikkers die een zodanige werking hebben dat bij een eventuele breuk de inhoud van het riool aan het maaiveld uittreedt via deze verklikkers. 2. Minimaal 4 weken voordat de horizontale boring uitgevoerd wordt, wordt de melding ingediend.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.59
- number: '3.60'
  text: '1. Het is verboden zonder melding in een Boringsvrije zone beneden de in Artikel 3.51 genoemde dieptegrenzen de volgende activiteiten uit te voeren: a. grondwerken, voor zover bij verwijdering van de grond het bodemprofiel zodanig wordt hersteld dat minimaal dezelfde beschermende werking van de bodem ontstaat als voor de grondwerken; en b. funderingswerken, voor zover daarbij uitsluitend gebruik wordt gemaakt van: 1. grondverdringende gladde geprefabriceerde palen zonder verbrede voet; 2. in de grond gevormde palen waarbij een hulpbuis wordt gebruikt die niet plaatselijk verbreed is en grondverdringend wordt ingebracht; of 3. voorgevormde, of in de grond gevormde schroefpalen. 2. Het is verboden zonder melding in de Boringsvrije zone Langerak en Lexmond : a. heipalen te verwijderen; b. boorputten buiten gebruik te stellen. 3. Minimaal 4 weken voordat de activiteit uitgevoerd wordt, wordt de melding ingediend.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.60
- number: '3.61'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van het uitvoeren van een horizontaal gestuurde boring in een Boringsvrije zone , bedoeld in Artikel 3.59 minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. de kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. het doel van de horizontaal gestuurde boring; d. het diepste punt van de boring; e. de lengte van de boring tussen in- en uittredepunt; f. de totale lengte van de boring; en g. de start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.61
- number: '3.62'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van het uitvoeren van grondwerken in een Boringsvrije zone , bedoeld in Artikel 3.60, eerste lid , onder a minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. de kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. het doel waarvoor wordt ontgraven; d. de aard van het oppervlak van de ontgraving; e. de diepte tot waar wordt ontgraven in meter beneden maaiveld ; f. de aard van het bodemprofiel ter plaatse; g. de wijze hoe het bodemprofiel hersteld wordt zodat minimaal dezelfde beschermende werking van de bodem ontstaat als voor de grondwerken; en h. de start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.62
- number: '3.63'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van het uitvoeren van funderingswerken in een Boringsvrije zone , bedoeld in Artikel 3.60, eerste lid , onder b, minimaal de volgende gegevens en bescheiden verstrekt: a. naam, adres, postcode vestigingsplaats, telefoonnummer, e-mailadres, naam van een contactpersoon en een bewijs van de certificering van het bedrijf dat de activiteit uitvoert; b. de kadastrale aanduiding van de locatie waar de activiteit wordt uitgevoerd; c. het doel waarvoor de fundering wordt geplaatst; d. de aard van de te gebruiken funderingstechniek: 1. grondverdringende gladde geprefabriceerde palen zonder verbrede voet; 2. in de grond gevormde palen waarbij een hulpbuis wordt gebruikt die niet plaatselijk is en wordt ingebracht; of 3. voorgevormde, of in de grond gevormde schroefpalen; e. de diepte tot waar de fundering komt in meters beneden maaiveld ; en f. de start- en einddatum van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.63
- number: '3.64'
  text: Bij verwijdering van heipalen in de Boringsvrije zone Langerak en Lexmond wordt het ontstane gat zoveel mogelijk afgedicht met bentoniet.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.64
- number: 3.64a
  text: Bij buitengebruikstelling van een boorput in de Boringsvrije zone Langerak en Lexmond laat de eigenaar of exploitant binnen maximaal 2 weken na buitengebruikstelling de boorput afdichten door een gecertificeerd en erkend bedrijf conform BRL SIKB 2100/2101 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.6__art_3.64a
- number: '3.65'
  text: De regels in deze afdeling zijn gesteld met het oog op het beschermen en verbeteren van de chemische en ecologische kwaliteit van watersystemen en het beschermen van de kwaliteit van de bodem.​​
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.1__art_3.65
- number: '3.66'
  text: '1. Een programma gebiedsgerichte aanpak grondwaterverontreiniging in het Gebied saneringsregels voor grondwater is gericht op: a. het zoveel mogelijk voorkomen van de risico’s van verspreiding van verontreiniging buiten het aangewezen gebied; b. het zoveel mogelijk verminderen van de vracht van de verontreiniging; c. de bescherming van bestaande en beoogde functies van, in en op de bodem binnen het aangewezen gebied; en d. het verbeteren van de mogelijkheden om doelmatig gebruik te maken van de ondergrond in verontreinigd gebied. 2. Het programma wordt vastgesteld door gedeputeerde staten. 3. Het programma bevat in ieder geval de volgende gegevens: a. de doelstellingen van de gebiedsgerichte aanpak binnen het beheergebied en de maatregelen die ter verwezenlijking hiervan worden genomen; b. de termijn waarbinnen deze doelstellingen zullen worden verwezenlijkt; c. een beschrijving van de uitgevoerde onderzoeken; d. de wijze waarop het plan past binnen het omgevingsplan, het regionale
    waterprogramma en het waterbeheerprogramma ; e. een begroting van de kosten van de sanering en een overzicht van de daarvoor beschikbare middelen; f. de wijze waarop belemmeringen voor een doelmatige gebiedsgerichte aanpak zullen worden weggenomen; en g. de verontreinigingen in het grondwater binnen het aangewezen gebied. 4. In het programma wordt rekening gehouden met de gevolgen van de gebiedsgerichte aanpak voor locaties die daarvan geen onderdeel uitmaken, en worden zo nodig voorzieningen opgenomen om voor die locaties optredende gevolgen te monitoren en te beheersen. 5. Het programma kan betrekking hebben op gevallen van ernstige verontreiniging waarop op grond van artikel 3.1 van de Aanvullingswet bodem Omgevingswet het recht zoals dat gold voor het tijdstip van inwerkingtreding van die wet, van toepassing is.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.2__art_3.66
- number: '3.67'
  text: Deze paragraaf is van toepassing op het saneren van verontreinigd grondwater met een onaanvaardbaar verspreidingsrisico in het Gebied saneringsregels voor grondwater , bedoeld in Annex 2 van het Water en Bodemprogramma voor zover dit niet valt onder de activiteit zoals gedefinieerd in artikel 4.1241 en artikel 4.1242 van het Besluit activiteiten leefomgeving.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.3__art_3.67
- number: '3.68'
  text: Het is verboden zonder omgevingsvergunning in het Gebied saneringsregels voor grondwater verontreinigd grondwater met een onaanvaardbaar verspreidingsrisico te saneren.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.3__art_3.68
- number: '3.69'
  text: '1. Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op de sanering van verontreinigd grondwater met een onaanvaardbaar verspreidingsrisico in het Gebied saneringsregels voor grondwater , wordt de omgevingsvergunning alleen verleend als: a. het risico van verspreiding van verontreinigende stoffen zoveel als redelijkerwijs mogelijk is wordt beperkt; en b. nazorgmaatregelen en gebruiksbeperkingen zoveel mogelijk beperkt kunnen blijven. 2. De aanvraag wordt getoetst aan de saneringsdoelstellingen uit hoofdstuk 4 van de Circulaire bodemsanering 2013.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.3__art_3.69
- number: '3.70'
  text: 'In aanvulling op de aanvraagvereisten in de wet , worden bij een aanvraag om een omgevingsvergunning, bedoeld in Artikel 3.68 , minimaal de volgende gegevens en bescheiden verstrekt: a. een vooronderzoek bodemonderzoek bedoeld in artikel 5.7a van het Besluit activiteiten leefomgeving; b. een verkennend bodemonderzoek bedoeld in artikel 5.7b van het Besluit activiteiten leefomgeving; c. een nader bodemonderzoek bedoeld in artikel 5.7d van het Besluit activiteiten leefomgeving; d. een beschrijving van de te treffen saneringsmaatregelen en een motivering van de keuze voor deze maatregelen; e. een beschrijving van de effecten die met de maatregelen worden beoogd, waaronder een aanduiding van de terugsaneerwaarde; f. een beschrijving van een andere methode om de beoogde effecten te bereiken, voor het geval de maatregelen niet tot die effecten zouden leiden; en g. een beschrijving van de nazorgmaatregelen die naar verwachting moeten worden getroffen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.3__art_3.70
- number: '3.71'
  text: '1. Minimaal 2 weken voor het begin van de sanering verstrekt de vergunninghouder gegevens en bescheiden over: a. de begrenzing van de locatie waar de sanering wordt uitgevoerd; en b. de startdatum van de sanering 2. Gewijzigde gegevens worden onverwijld verstrekt na het wijzigen van: a. een wijziging van de startdatum van de sanering; b. een wijziging van de begrenzing van de te saneren locatie; c. een verandering van de locatie van de sanering.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.3__art_3.71
- number: '3.72'
  text: '1. Minimaal 5 werkdagen voor het begin van de sanering worden gegevens en bescheiden verstrekt over uitvoerder en milieukundige beheerder die bij de sanering zijn betrokken. 2. De gegevens en bescheiden bevatten minimaal: a. de naam en het adres van de persoon die de sanering gaat uitvoeren; en b. de naam en het adres van de natuurlijke persoon en de onderneming die de milieukundige begeleiding gaan uitvoeren.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.3__art_3.72
- number: '3.73'
  text: 1. De sanering wordt uitgevoerd door een onderneming met een erkenning bodemkwaliteit voor BRL SIKB 7000 en wordt begeleid door een onderneming met een erkenning bodemkwaliteit voor BRL SIKB 6000 . 2. De sanering wordt uitgevoerd overeenkomstig de beschrijving van de te treffen saneringsmaatregelen, bedoeld in Artikel 3.70 , onder d. 3. Als blijkt dat de maatregelen niet tot de beoogde effecten zullen leiden, wordt de sanering uitgevoerd overeenkomstig de andere methode om de beoogde effecten te bereiken, bedoeld in Artikel 3.70 , onder f.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.3__art_3.73
- number: '3.74'
  text: '1. Binnen 4 weken na afronding van de activiteit wordt een evaluatieverslag opgesteld volgens BRL SIKB 6000 en aan gedeputeerde staten verstrekt. 2. Het evaluatieverslag bevat in ieder geval: a. een beschrijving van het resultaat van de milieukundige begeleiding bestaande uit processturing met daarbij in ieder geval een opsomming van bijzondere omstandigheden die zich tijdens de activiteit hebben voorgedaan; b. een beschrijving van de resultaten van de milieukundige begeleiding, indien van toepassing, bestaande uit verificatie van het eindresultaat van de activiteit; c. als na de activiteit nog verontreiniging in het grondwater aanwezig is en daardoor beperkingen in het gebruik van de bodem noodzakelijk zijn: een beschrijving van deze beperkingen; en d. als na de activiteit nazorgmaatregelen nodig zijn: een beschrijving van deze nazorgmaatregelen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.3__art_3.74
- number: '3.75'
  text: 1. De eigenaar, erfpachter of gebruiker van het grondgebied waar na de sanering een verontreiniging in het grondwater aanwezig is gebleven, neemt de beperkingen in het gebruik van de bodem in acht die zijn beschreven in het evaluatieverslag. 2. Degene die de sanering heeft uitgevoerd, dan wel degene die daartoe is aangewezen in het evaluatieverslag, is belast met de uitvoering van de nazorgmaatregelen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.3__art_3.75
- number: '3.76'
  text: Maatwerkvoorschriften kunnen worden gesteld over het bepaalde in de artikelen 3.70 tot en met 3.75.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.3__art_3.76
- number: '3.77'
  text: Deze paragraaf is van toepassing op het bouwen van een bodemgevoelig gebouw bedoeld in artikel 5.89g van het Besluit kwaliteit leefomgeving.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.4__art_3.77
- number: '3.78'
  text: Voordat een bodemgevoelig gebouw wordt gebouwd, wordt op het perceel een vooronderzoek grondwater uitgevoerd, dat voldoet aan NEN 5725 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.4__art_3.78
- number: '3.79'
  text: '1. Als uit het vooronderzoek grondwater blijkt dat er een verdenking bestaat van de aanwezigheid van een verontreiniging in de verzadigde zone van de bodem, wordt een verkennend grondwateronderzoek uitgevoerd, dat voldoet aan NEN 5740 . 2. Bij dit verkennend grondwateronderzoek worden betrokken: a. de signaleringsparameters beoordeling grondwatersanering, bedoeld in bijlage VC bij het Besluit kwaliteit leefomgeving; en b. de omgevingswaarden voor de goede chemische toestand van grondwaterlichamen, bedoeld in bijlage IV bij het Besluit kwaliteit leefomgeving. 3. Het veldwerk wordt uitgevoerd door een onderneming met een erkenning bodemkwaliteit voor BRL SIKB 2000 of een certificatie-instantie of een inspectie-instantie met een erkenning bodemkwaliteit voor AS SIKB 2000 . 4. De laboratoriumanalyse wordt uitgevoerd door een certificatie-instantie of inspectie-instantie met een erkenning bodemkwaliteit voor AS 3000 .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.4__art_3.79
- number: '3.80'
  text: 1. Als het verkennend grondwateronderzoek daartoe aanleiding geeft, wordt een nader grondwateronderzoek uitgevoerd. 2. Het nader grondwateronderzoek voldoet aan NTA 5755 . 3. Het veldwerk wordt uitgevoerd door een onderneming met een erkenning bodemkwaliteit voor BRL SIKB 2000 of een certificatie-instantie of een inspectie-instantie met een erkenning bodemkwaliteit voor AS SIKB 2000 . 4. De laboratoriumanalyse wordt uitgevoerd door een certificatie-instantie of inspectie-instantie met een erkenning bodemkwaliteit voor AS 3000 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.4__art_3.80
- number: '3.81'
  text: Als uit het nader grondwateronderzoek blijkt dat sprake is van inbreng van een significante verontreiniging in het grondwater bedoeld in Annex 2 bij het Bodem- en waterprogramma provincie Utrecht , wordt een risicobeoordeling grondwaterverontreiniging uitgevoerd, bedoeld in Annex 2 bij het Bodem- en waterprogramma provincie Utrecht .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.4__art_3.81
- number: '3.82'
  text: '1. Als uit de risicobeoordeling grondwaterverontreiniging blijkt dat er een onaanvaardbare risico voor verspreiding van verontreiniging in het grondwater is en de bronzone zich deels of geheel bevindt binnen het perceel waar de bouwactiviteit wordt uitgevoerd, wordt voorafgaand aan de bouwactiviteit: a. een bodemsanering voor de bronzone uitgevoerd; b. een grondwatersanering voor de bronzone uitgevoerd; en c. een grondwatersanering voor de verontreinigingspluim uitgevoerd. 2. De bodemsanering en grondwatersaneringen worden uitgevoerd: a. op het perceel waar de bouwactiviteit wordt uitgevoerd; en b. buiten het perceel waar de bouwactiviteit wordt uitgevoerd, voor zover dat redelijkerwijs kan worden gevergd. 3. Voor zover de bronzone of verontreinigingspluim zich bevinden buiten het perceel waar de bouwactiviteit wordt uitgevoerd, belemmert het te bouwen bouwwerk de bodemsanering van de bronzone en de grondwatersaneringen van de bronzone en verontreinigingspluim niet.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.4__art_3.82
- number: '3.83'
  text: Maatwerkvoorschriften kunnen worden gesteld over Artikel 3.82 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.4__art_3.83
- number: '3.84'
  text: Deze paragraaf is van toepassing als een redelijk vermoeden bestaat van grondwaterverontreiniging met een onaanvaardbaar verspreidingsrisico.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.5__art_3.84
- number: '3.85'
  text: Een initiatiefnemer, eigenaar of erfpachter van een locatie is verplicht de informatie die bij degene over de grondwaterverontreiniging bekend is, te verstrekken aan de provincie.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.5__art_3.85
- number: '3.86'
  text: 'De gemeente die een redelijk vermoeden heeft van of wordt geïnformeerd over een grondwaterverontreiniging met een onaanvaardbaar verspreidingsrisico, geeft van de verstrekte informatie onverwijld kennis aan: a. gedeputeerde staten; en b. andere bestuursorganen of overheidsdiensten, die belang hebben bij een onverwijlde kennisgeving.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.3__subsec_3.3.5__art_3.86
- number: '3.87'
  text: De regels in deze afdeling zijn gesteld met het oog op het behoud van landschappelijke, natuurwetenschappelijke, cultuurhistorische en archeologische waarden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.87
- number: '3.88'
  text: '1. Deze afdeling is in het Landelijk gebied van toepassing op het: a. storten van materialen; b. inrichten of hebben van een stortplaats ; c. ophogen of egaliseren van gronden; en d. inrichten of hebben van een rommelterrein . 2. Deze afdeling is niet van toepassing op: a. een rommelterrein dat in geen enkel seizoen zichtbaar is vanaf een voor het publiek toegankelijke plaats; en b. stortplaatsen die zijn aangewezen in een omgevingsplan of zich bevinden in een gebouw.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.88
- number: '3.89'
  text: 'Degene die stort, een stortplaats inricht of houdt, gronden ophoogt of egaliseert of een rommelterrein inricht of houdt en weet of redelijkerwijs kan vermoeden dat die activiteit kan leiden tot nadelige gevolgen voor de belangen, bedoeld in Artikel 3.87 , is verplicht: a. alle maatregelen te nemen die redelijkerwijs van diegene kunnen worden gevraagd om die gevolgen te voorkomen, b. voor zover die gevolgen niet kunnen worden voorkomen, die gevolgen zoveel mogelijk te beperken of ongedaan te maken, en c. als die gevolgen onvoldoende kunnen worden beperkt, die activiteit achterwege te laten voor zover dat redelijkerwijs van diegene kan worden gevraagd.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.89
- number: '3.90'
  text: Het is verboden in het Landelijk gebied een rommelterrein in te richten of te hebben.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.90
- number: '3.91'
  text: Het is verboden zonder omgevingsvergunning in het Landelijk gebied materialen te storten , een stortplaats in te richten en te hebben en gronden op te hogen en te egaliseren, tenzij een vrijstelling uit Artikel 3.92 tot en met Artikel 3.98 of de meldplicht uit Artikel 3.99 van toepassing is.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.91
- number: 3.91a
  text: Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op grondverzet in het Landelijk gebied , wordt de omgevingsvergunning verleend voor zover het oogmerk van Artikel 3.87 niet onaanvaardbaar wordt geschaad.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.91a
- number: '3.92'
  text: 'Het verbod in Artikel 3.91 geldt niet voor: a. het uitvoeren of onderhoud van infrastructurele openbare werken en werken van groot maatschappelijk belang waarbij wordt gestort, opgehoogd of geëgaliseerd als: 1. de activiteiten plaatsvinden binnen het uitvoeringsgebied van een vergund bestek; of 2. de werken zijn aangewezen in een omgevingsplan. b. onderhouds-, herstel-, bouw- of sloopwerkzaamheden op bouwpercelen waarbij wordt gestort, opgehoogd of geëgaliseerd als het bouwperceel is aangewezen in het omgevingsplan.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.92
- number: '3.93'
  text: 'Het verbod in Artikel 3.91 geldt niet voor: a. het storten of ophogen op agrarische weide- en akkerpercelen als dat nodig is voor het aanleggen van rijpaden op die percelen; b. het inrichten of houden van een stortplaats of rommelterrein op of onmiddellijk aangrenzend aan een agrarisch bouwperceel als dat noodzakelijk is voor een doelmatige agrarische bedrijfsvoering.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.93
- number: '3.94'
  text: 'Het verbod in Artikel 3.91 geldt niet voor: a. het storten, egaliseren of ophogen met baggerspecie vrijkomend uit normaal onderhoud van een oppervlaktewaterlichaam als: 1. losse plantenresten bovenaan het talud van het oppervlaktewaterlichaam worden neergelegd; 2. het oorspronkelijke maaiveld met niet meer dan 10 centimeter wordt opgehoogd; 3. de baggerspecie niet wordt gestort op gronden die in agrarisch natuurbeheer zijn of zich bevinden binnen een natuurparel, waterparel of natuurnetwerk Nederland; 4. losse plantenresten en baggerspecie zo spoedig mogelijk worden uitgevlakt; en 5. de baggerspecie gelijkmatig over een perceel, dat gelegen is naast het oppervlaktewaterlichaam, wordt verspreid, waarbij aardkundige waarden en archeologisch of landschappelijk waardevolle terreingedeelten zoals laagten en geulen in stand worden gelaten. b. het storten van baggerspecie in een baggerdepot als: 1. het depot niet is of wordt aangelegd op een locatie, die in de kwaliteitsgidsen landschap
    van de provincie Utrecht als open of extreem open is aangeduid; 2. het depot voor inklinken maximaal 1,50 meter hoog is ten opzichte van het laagste naastgelegen maaiveld; 3. de kaden minimaal 2 meter vanuit de oever van oppervlaktewaterlichamen worden aangelegd en zowel eind juni als in november worden gemaaid; 4. het perceel waarop het baggerdepot zich bevindt na ophogen, inklinken, verspreiden en egalisatie niet meer dan 10 centimeter hoger ligt dan het oorspronkelijke maaiveld van de dichtstbijzijnde naastgelegen niet opgehoogde percelen; en 5. na inklinken, dan wel maximaal na 3 jaar na de activiteit, de bagger en de om het depot opgeworpen kaden zo spoedig mogelijk gelijkmatig worden verspreid tot minimaal 1 meter vanuit de oever van oppervlaktewaterlichamen, waarbij aardkundige waarden en archeologisch of landschappelijk waardevolle terreingedeelten zoals laagten en geulen in stand worden gelaten.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.94
- number: '3.95'
  text: 'Het verbod in Artikel 3.91 geldt niet voor het storten van grond en baggerspecie met inbegrip van blad, takken, stobben en boomstronken ten behoeve van een takkenril, stobbewal en broeihoop nabij een viaduct, ecoduct of faunapassage of planmatige inrichting en ontwikkeling van een natuurterrein of ecologische zone als: a. de beheerder van het betrokken natuurterrein of de ecologische zone hiermee heeft ingestemd en dit schriftelijk vastgelegd en verantwoord is; b. de grond en baggerspecie zo spoedig mogelijk wordt uitgevlakt tot een maximale hoogte van 1 meter boven het maaiveld hebben; c. de ecologische meerwaarde vanuit provinciaal of gemeentelijk beleid wordt aangetoond; d. het gestorte element onderdeel uitmaakt van een ecologische zone of daarbij aansluit; en e. uitsluitend gebiedseigen materiaal wordt gebruikt.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.95
- number: '3.96'
  text: 'Het verbod in Artikel 3.91 geldt niet voor het storten van takhout ten behoeve van een takkenwal of takkenril, anders dan bedoeld in Artikel 3.95 , als: a. de wallen en rillen worden aangelegd tegen de buitenrand van een houtopstand; b. het gebruikte takhout afkomstig is van die nabije houtopstand; c. aanwezige of potentiële natuurwaarden op deze manier worden versterkt; d. het gebruikte takhout zo spoedig mogelijk wordt uitgevlakt tot de wallen en rillen aan de voet maximaal 1 meter breed zijn en een maximale hoogte van 1,50 meter hebben gemeten vanaf het maaiveld ; en e. de wallen en rillen geen stobben of boomstronken bevatten.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.96
- number: '3.97'
  text: 'Het verbod in Artikel 3.91 geldt niet voor het storten van grond voor een wal of grondlichaam in een tuin, park, landgoed of sportaccommodatie als: a. een landschapstype dat aan de stortlocatie grenst niet wordt doorkruist of onderbroken, tenzij dit aanvaardbaar is vanuit cultuurhistorische overwegingen; b. aanwezige bomen niet in het grondlichaam komen te staan; c. de wal of het grondlichaam wordt ingeplant met een gebiedseigen beplantingsmengsel; en d. de grond zo spoedig mogelijk wordt uitgevlakt tot de wal of het grondlichaam maximaal 2 meter breed is en een maximale hoogte heeft van 1 meter gemeten vanaf het maaiveld .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.97
- number: '3.98'
  text: 'In aanvulling op de aanvraagvereisten in de wet worden bij een aanvraag om een omgevingsvergunning, bedoeld in Artikel 3.91 , minimaal de volgende gegevens en bescheiden verstrekt: a. kaart van de planlocatie; b. locatie van het werk; c. materialen die worden toegepast; d. hoeveelheid materialen die worden toegepast; e. herkomst materialen die worden toegepast; f. afmetingen van de werkzaamheden; g. permanente of tijdelijke werkzaamheden; h. reden van de werkzaamheden; en i. start- en einddatum van de werkzaamheden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.98
- number: '3.99'
  text: 1. Het is verboden zonder melding in het Landelijk gebied agrarisch gebruikte weide- en akkerpercelen op te hogen of te egaliseren. 2. De gemelde activiteit moet daarbij voldoen aan de eisen van Artikel 3.102 . 3. Minimaal 4 weken voordat het agrarisch gebruikt weide- en akkerperceel opgehoogd of geëgaliseerd wordt, wordt de melding ingediend.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.99
- number: '3.100'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding voor ophoging of egalisatie van een agrarisch gebruikt weide- of akkerperceel, bedoeld in Artikel 3.99 , minimaal de volgende gegevens en bescheiden verstrekt: a. kaart van de planlocatie; b. locatie van het werk; c. is de locatie buiten een natuurparel, waterparel, natuurnetwerk Nederland en Groene contour; d. functie planlocatie in het omgevingsplan; e. huidig gebruik planlocatie; f. hoeveelheid grond, heideplagsel of bosstrooisel die wordt toegepast; g. afmetingen van de werkzaamheden; h. start- en einddatum van de werkzaamheden; i. of grond wordt gestort volgens het principe zand op zand, klei op klei, veen op veen; j. of bij het verspreiden en egaliseren de aardkundig, archeologisch of landschappelijk waardevolle terreingedeelten zoals laagten en geulen, in stand worden gelaten; en k. of de percelen eens in de 5 jaar worden opgehoogd met maximaal 10 centimeter na uitvlakking.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.100
- number: '3.101'
  text: De activiteiten bedoeld in Artikel 3.92 duren niet langer dan noodzakelijk.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.101
- number: '3.102'
  text: '1. Bij een stortplaats of rommelterrein is het te storten of opgeslagen materiaal afkomstig uit het eigen agrarisch productieproces of bestemd voor de verwerking in dat productieproces. 2. Bij een stortplaats of rommelterrein is het aanwezige materieel benodigd voor het eigen agrarisch productieproces. 3. Op een stortplaats of rommelterrein zijn rijkuilen, sleufsilo''s en hooi- en kuilgrasbalen afgedekt of gewikkeld in plasticfolie. 4. Op een stortplaats of rommelterrein ligt niet meer dan 1 hoop grond van maximaal 50 m3. 5. In het Landelijk gebied worden binnen een natuurparel, waterparel, natuurnetwerk Nederland en Groene contour zonder omgevingsvergunning geen agrarisch gebruikte weide- en akkerpercelen opgehoogd en geëgaliseerd. 6. Voor het zonder omgevingsvergunning ophogen en egaliseren van agrarisch gebruikte weide- en akkerpercelen binnen het Landelijk gebied buiten een natuurparel, waterparel, natuurnetwerk Nederland en het Gebied Groene contour geldt dat: a. alleen grond,
    heideplagsel en bosstrooisel wordt gestort; b. grond wordt gestort volgens het principe zand op zand, klei op klei en veen op veen; c. grond, heideplagsel en bosstrooisel na het storten daarvan zo spoedig mogelijk wordt uitgevlakt; d. bij verspreiden en egaliseren de aardkundig, archeologisch of landschappelijk waardevolle terreingedeelten, zoals laagten en geulen, in stand worden gelaten; en e. de percelen maximaal een keer in de 5 jaar opgehoogd worden met maximaal 10 centimeter na uitvlakking. 7. Het ophogen of egaliseren van agrarisch gebruikte weide- en akkerpercelen wordt binnen 4 weken na aanvang afgerond.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.4__art_3.102
- number: '3.103'
  text: De regels in deze afdeling zijn gesteld met het oog op de bescherming van het milieu.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.5__art_3.103
- number: '3.104'
  text: Deze afdeling is van toepassing op activiteiten in het Gebied gesloten stortplaats .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.5__art_3.104
- number: '3.105'
  text: 'Het is verboden zonder omgevingsvergunning in het Gebied gesloten stortplaats : a. een bouwactiviteit uit te voeren; b. een milieubelastende activiteit uit te voeren; of c. een boom of houtopstand te kappen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.5__art_3.105
- number: '3.106'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een activiteit in het Gebied gesloten stortplaats , wordt de omgevingsvergunning alleen verleend als wordt voldaan aan de volgende criteria: a. er worden maatregelen genomen die strekken tot het in stand houden en onderhouden, het herstellen, verbeteren of vervangen van voorzieningen ter bescherming van de bodem; b. voorzieningen ter bescherming van de bodem worden regelmatig geïnspecteerd; en c. de bodem onder de stortplaats wordt regelmatig onderzocht.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.5__art_3.106
- number: '3.107'
  text: 'In aanvulling op de aanvraagvereisten in de wet worden bij een aanvraag om een omgevingsvergunning, bedoeld Artikel 3.105 , minimaal de volgende gegevens en bescheiden verstrekt: a. een beschrijving van de activiteit; b. een tekening met de locatie van de uit te voeren activiteit; en c. een beschrijving van de maatregelen die genomen worden om beschadiging van de voorzieningen ter bescherming van de bodem te voorkomen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.5__art_3.107
- number: '3.108'
  text: Een omgevingsplanactiviteit die plaatsvindt in het Gebied gesloten stortplaats is een omgevingsplanactiviteit van provinciaal belang.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.5__art_3.108
