- number: '9.20'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied detailhandel buiten bestaand winkelgebied bevat geen regels die voorzien in nieuwvestiging of uitbreiding van detailhandel dan wel het wijzigen van brancheringsregels voor detailhandel , tenzij: a. het gaat om detailhandel waaraan een aantoonbare behoefte bestaat als gevolg van een wijziging van een omgevingsplan dat voorziet in grootschalige toevoeging van woningen of andere stedelijke ontwikkeling; b. het gaat om brand- of explosiegevaarlijke detailhandel op bedrijventerreinen; c. het gaat om nieuwvestiging of uitbreiding van volumineuze detailhandel als daaraan aantoonbare behoefte bestaat en in de regio geen onbenutte capaciteit in omgevingsplannen voor volumineuze detailhandel aanwezig zijn; d. het gaat om oppervlakteneutrale verplaatsing of een verplaatsing met uitbreiding van maximaal 10% van het bestaande winkelvloeroppervlakte van het gebouw van volumineuze detailhandel die noodzakelijk is vanuit het
    oogpunt van hinder, veiligheid, verkeersaantrekkende werking of het maatschappelijk of economisch functioneren van het gebied en onder de voorwaarde dat de bouwvlakken van de te verplaatsen detailhandel een andere functie krijgen; e. het gaat om verplaatsing of uitbreiding van detailhandel in aansluiting op het gebied Bestaand winkelgebied als dit noodzakelijk is voor het maatschappelijk functioneren van het bestaande winkelgebied; f. het gaat om kleinschalige ondergeschikte detailhandel op locaties binnen het Gebied bovenlokaal dagrecreatieterrein ten behoeve van de recreatieve functies op het bovenlokaal dagrecreatieterrein ; of g. het gaat om detailhandel die qua aard en omvang vergelijkbaar is met detailhandel hiervoor genoemd onder a . tot en met f . en waarvan aard en omvang geen negatieve gevolgen hebben voor detailhandel op locaties binnen Bestaand winkelgebied. 2. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied detailhandel buiten bestaand winkelgebied bevat
    regels die voorzien in een functiewijziging van bestaande detailhandelsfunctie naar andere functies als: a. nog geen vergunning is aangevraagd; en b. er geen zicht is op realisatie van de functie binnen 10 jaar. 3. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
