    Algemeen a. De kabels en/of leidingen moeten worden gelegd, gehouden en verwijderd zoals op de bij de verleende toestemming behorende, goedgekeurde en gewaarmerkte, situatie- en detailtekeningen is aangegeven. b. De uit te voeren werkzaamheden moeten, eenmaal in uitvoering genomen, onafgebroken worden uitgevoerd. c. Minimaal 4 weken voor het begin van de activiteiten, bedoeld in Artikel 4.23 en Artikel 4.24 , worden de volgende gegevens en bescheiden verstrekt aan het bevoegd gezag: 1. de verwachte datum en het verwachte tijdstip waarop met de activiteit wordt begonnen; 2. de verwachte duur ervan; en 3. een verkeersmaatregelenplan conform CROW publicaties WIU 96b 2020 Standaardmaatregelen op niet-autosnelwegen en WIU 96b 2020 Werken op niet-autosnelwegen . d. Binnen maximaal 2 maanden na afloop van de activiteit, bedoeld in Artikel 4.23 en Artikel 4.24 , worden revisietekeningen met x-, y- en z-coördinaten en maatvoering vanuit vaste punten verstrekt aan het bevoegd gezag. A. Ontgravingen
    a. In het beperkingengebied beheer provinciale wegen wordt niet gewerkt in de tijdvakken 6.00 - 9.00 uur en 15.00 - 19.00 uur in verband met de ochtend- en avondspits. Bij maatwerkvoorschrift kan van deze venstertijden worden afgeweken. b. Met het oog op een veilig en doelmatig gebruik van de weg wordt een ontgraving: 1. beperkt tot een zo klein mogelijk profiel en onafgebroken uitgevoerd; 2. op dezelfde dag dat deze wordt gemaakt, gedicht met de uitkomende grond of aangevoerde grond met vergelijkbare hydrologische en texturele eigenschappen en wordt een schone grondverklaring aan het bevoegd gezag overlegd; 3. niet verricht bij slecht zicht van minder dan 200 meter door mist, sneeuwval of andere omstandigheden. c. Open sleuven en ingravingen moeten ter beveiliging voor het verkeer gemarkeerd worden met een voldoende aantal retroreflecterende wegbakens (reflectieklasse minimaal overeenkomend met klasse II volgens NEN 3381 ). d. De afwatering van de weg wordt niet belemmerd. e. Overtollige
    grond en puin worden onmiddellijk afgevoerd. f. Bij het vervangen van bestaande kabels of leidingen worden de kabels en leidingen die buiten gebruik worden gesteld, verwijderd. g. Het aanwezige wegmeubilair en de kadasterstenen en grenspalen worden niet verwijderd, anders dan na overeenstemming met het bevoegd gezag. h. Belendende percelen en landwegen blijven toegankelijk, eventueel met behulp van tijdelijke voorzieningen. i. Bij de uitvoering van de werkzaamheden moeten de aanwijzingen worden opgevolgd die ten aanzien van de weg en/of het verkeersbelang door het bevoegd gezag worden gegeven. Verkeersmaatregelen voldoen aan de CROW publicaties WIU 96b 2020 Standaardmaatregelen op niet-autosnelwegen en WIU 96b 2020 Werken op niet-autosnelwegen. j. Personen, die zich voor het leggen of onderhouden van de leidingen met toebehoren op of langs de weg bevinden, moeten een veiligheidsvest dragen, uitgevoerd volgens de eisen omschreven in hoofdstuk 01.12.04 van de standaard RAW bepalingen 2000
    van CROW (ISBN 90-6628-316-5). Het veiligheidsvest moet in zodanige staat verkeren, dat de waarneembaarheid voldoende is gewaarborgd. Veiligheidskleding is ook toegestaan, mits deze voldoet aan de standaard RAW bepalingen 2000. De beoordeling van de waarneembaarheid berust bij de provincie Utrecht. k. Het wegverkeer mag van de uitvoering van de werkzaamheden niet meer hinder ondervinden dan onvermijdelijk is. Zo nodig moeten in overleg met het bevoegd gezag extra maatregelen worden getroffen. B. Afwerking ontgravingen a. Voor de start van de ontgraving wordt het gras over de volle werkbreedte gemaaid. b. De aanvulling van de sleuven en ingravingen in wegbermen en taluds geschiedt met vrijkomende grond en wordt in 3 lagen van gelijke dikte teruggebracht en afzonderlijk verdicht. Het aanvullen onder het grondwaterpeil geschiedt alleen met de uitkomende grond als deze grond uit zuiver zand bestaat. De bovenlaag is humusarm en wordt, in overleg met het bevoegd gezag, zo spoedig mogelijk
    na de afwerking ingezaaid met graszaadmengsel B3. c. Bij buiten de weg gelegen open verhardingen wordt de aanvulling op de overeenkomstige wijze met zand, of zo nodig met cement, gestabiliseerd. Direct onder deze verhardingen wordt minimaal 0,40 meter schoon zand aangebracht. d. Als verontreinigde materialen worden aangetroffen wordt het bevoegd gezag hierover direct geïnformeerd. e. Na beëindiging van de werkzaamheden worden de taluds vanaf de slootbodem over de volle hoogte opnieuw opgezet. De constructie van de taluds wordt in overleg met het bevoegd gezag bepaald. f. Aan de oppervlakte komende constructiedelen van de leiding en markeringen ter aanduiding van de leiding komen op gelijke hoogte met het oppervlak van de verhardingen of de bermen. g. De vooraf opgenomen bestrating moet in goede aansluiting aan het bestaande werk worden herlegd overeenkomstig de oorspronkelijke opbouw en samenstelling. De bij het opbreken van de verharding vrijgekomen materialen (stenen, tegels e.d.)
    mogen, als onbeschadigd, opnieuw worden verwerkt. Beschadigde materialen moeten op kosten van de aanvrager worden vervangen. C. Ontgravingen en beplanting a. Beplanting wordt bij de uitvoering van de werkzaamheden zowel boven- als ondergronds niet beschadigd. Binnen een straal van 10 keer de stamdiameter, gemeten op 1 meter boven het maaiveld, rondom bomen worden geen graafwerkzaamheden verricht. Binnen de kroonprojectie van bomen worden graafwerkzaamheden handmatig uitgevoerd. Wortels dikker dan 25 millimeter in diameter worden in geen geval verwijderd. b. Ontgravingen binnen de wortelzone worden zo snel mogelijk aangevuld en verdicht. Ontgraven wortels worden beschermd tegen uitdrogen, vorst en beschadiging. Binnen de wortelzone van beplanting wordt geen werkterrein ingericht en wordt geen materiaal opgeslagen. c. Er wordt gewerkt volgens het landelijk protocol Omgaan met Aziatische duizendknopen . D. Ligging a. Een kabel of leiding wordt gelegd: 1. 1,5 meter buiten de verharding van
    de weg; 2. als de kabel of leiding parallel aan een bermsloot wordt gelegd: op een afstand van minimaal 1,5 meter vanaf de insteek van de bermsloot; 3. als de kabel of leiding parallel aan een talud wordt gelegd: op een afstand van minimaal 1,5 meter vanaf de teen van het talud; en 4. als de kabel of leiding parallel aan een geleiderailconstructie wordt gelegd: op een afstand van minimaal 1,5 meter vanaf die constructie. b. De afstanden worden gemeten tot aan de dichtstbij gelegen zijde van de kabel of leiding. c. Het vlak, gelegen onder een helling van 1:3 uit de onderkant van de verharding of de fundering, wordt niet doorsneden. d. In de berm van de weg is de gronddekking boven de kabels en leidingen minimaal 0,6 meter. e. Als een kabel of leiding kruist met een bermsloot, is de gronddekking boven de kabel of leiding minimaal 1 meter. f. Waar kabels of leidingen boven een duiker komen te liggen of een persleiding kruisen en de voorgeschreven gronddekking niet kan worden verkregen,
    worden zij over bij maatwerkvoorschrift te bepalen lengte in mantelbuizen gelegd. E. Noodreparatie Een noodreparatie wordt zo spoedig mogelijk uitgevoerd, maar pas als het voor herstel benodigde materiaal op of nabij het werk is aangevoerd en na goedkeuring van het bevoegd gezag. F. Verzakkingen en beschadigingen a. Gedurende 2 jaar na de datum van uitvoering van de werkzaamheden worden optredende verzakkingen en beschadigingen in de verharding van de hoofdrijbaan en de eventueel daarlangs gelegen voet- en fietspaden, parallelwegen, uitwegen e.d. en wegbermen en taluds hersteld. b. Als de hieruit voortkomende schade door of vanwege de provincie wordt hersteld moeten de gemaakte kosten aan de provincie worden vergoed. c. De herstelkosten van de overige schade aan de werken van de provincie, welke het gevolg is van de aanleg en de aanwezigheid van de kabels of leiding met toebehoren moeten eveneens aan de provincie worden vergoed. Afkortingen: AGV: Hoogheemraadschap Amstel, Gooi en Vecht
