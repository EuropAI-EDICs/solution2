- number: 9.16a
  text: 'Ontheffing van Artikel 9.14a kan alleen worden verleend als: a. er sprake is van tijdelijke flexwoning en; b. binnen bestaand Stedelijk gebied onvoldoende locaties beschikbaar zijn voor flexwoning en; c. de flexwoningbouw niet tot extra bodemdaling leidt; d. de flexwoningbouw plaatsvindt in aansluiting op het Stedelijk gebied , of als dat niet mogelijk is, nabij het Stedelijk gebied ; e. omliggende functies niet onevenredig worden geschaad; f. er wordt voorzien in een opruimplicht na beëindiging van de activiteit, maar in ieder geval na 15 jaar; g. de flexwoningbouw wordt gerealiseerd met een goede landschappelijke inpassing die rekening houdt met de tijdelijkheid van de flexwoningen; h. afspraken worden gemaakt over een evenwichtige verhouding tussen de flexwoningen en de lokale groenontwikkeling bij locaties met meer dan 200 flexwoningen; en i. de flexwoningbouw geen onevenredige nadelige gevolgen heeft voor het provinciaal bereikbaarheidsnetwerk .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_9__subchp_9.1__subsec_9.1.2__art_9.16a
- number: '9.17'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Stedelijk gebied kan regels bevatten voor verstedelijking. 2. Een omgevingsplan dat betrekking heeft op locaties binnen het Stedelijk gebied kan regels bevatten voor woningbouw mits is voldaan aan de volgende voorwaarden: a. de woningbouw past in het door gedeputeerde staten vastgestelde programma Wonen en werken ; b. de woningbouw leidt niet tot extra bodemdaling; 3. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
