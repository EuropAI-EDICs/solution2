      - name: in_gebied_cultuurhistorische_hoofdstructuur
        type: boolean
        description: 'Geo-feit: locatie binnen zone gebied_cultuurhistorische_hoofdstructuur'
        source:
          description: Buiten wet-YAML; GIO/zone-engine. joinId=
      output:
      - name: result_7_9
