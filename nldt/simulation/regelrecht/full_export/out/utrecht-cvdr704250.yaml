- number: '9.22'
  text: '1. In afwijking van Artikel 9.3 kan een omgevingsplan dat betrekking heeft op locaties binnen het Gebied bovenlokaal dagrecreatieterrein ten behoeve van de dagrecreatieve functie regels bevatten die ontwikkeling van aan het recreatieve gebruik gerelateerde voorzieningen op een bestaand bovenlokaal dagrecreatieterrein toestaan, mits is voldaan aan de volgende voorwaarden: a. de recreatieve waarde van het gebied wordt versterkt; b. de voorzieningen zijn noodzakelijk voor de duurzame exploitatie van het bestaande bovenlokale dagrecreatieterrein; en c. de voorzieningen worden zo veel mogelijk op één plek geconcentreerd, op zodanige wijze dat nabij gelegen natuurgebieden worden ontzien. 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
