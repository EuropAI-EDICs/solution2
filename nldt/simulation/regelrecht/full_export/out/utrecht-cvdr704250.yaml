        type: boolean
        description: 'Geo-feit: locatie binnen zone landschap'
        source:
          description: Buiten wet-YAML; GIO/zone-engine. joinId=
      output:
      - name: result_7_11a
        type: boolean
        description: Uitkomst artikel 7.11a
      actions:
      - output: result_7_11a
        value:
          operation: EQUALS
          subject: $in_landschap
          value: true
- number: '7.12'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied aardkundige waarden bevat regels ter bescherming van de in het plangebied aangewezen aardkundige waarden . 2. De motivering van een omgevingsplan bevat: a. een beschrijving van de in het plangebied aanwezige aardkundige waarden ; b. de daaraan toe te kennen waardering; c. het door de gemeente te voeren beleid voor aardkundige waarden ; en d. de wijze waarop rekening wordt gehouden met de aardkundige waarden in het plan.'
