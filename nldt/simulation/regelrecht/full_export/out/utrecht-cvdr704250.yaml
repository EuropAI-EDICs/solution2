- number: '2.16'
  text: 1. Een omgevingsplan dat betrekking heeft op locaties binnen het Overstroombaar gebied bevat regels die rekening houden met overstromingsrisico’s. Binnendijks is dit van toepassing op kwetsbare en vitale objecten en woonwijken en bedrijventerreinen. Buitendijks is dit ook van toepassing op individuele woningen en bedrijven. 2. De motivering van een omgevingsplan bevat een beschrijving van het door de gemeente te voeren beleid ter zake en de wijze waarop met het overstromingsrisico is omgegaan.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.2__subsec_2.2.1__art_2.16
  machine_readable:
    endpoint: art_2_16
    competent_authority:
      name: Bevoegd gezag
      type: CATEGORY
    execution:
      produces:
        legal_character: TOETS
      parameters: []
