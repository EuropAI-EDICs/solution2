  text: Artikel 4.68 Veiligheid rond basisnet
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.6__art_4.68
- number: '4.69'
  text: De regels in deze afdeling zijn gesteld met het oog op het behouden van de staat en werking van de provinciale weg.​​
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.7__art_4.69
