- number: '6.1'
  text: De regels in deze afdeling zijn gesteld met het oog op de natuurbescherming, het in stand houden en versterken van een robuust netwerk van natuurgebieden en het behouden en versterken van de biodiversiteit. Daartoe is het uitgangspunt van deze regels en bij de toepassing daarvan, dat de kwaliteit en oppervlakte van het Natuurnetwerk Nederland niet achteruitgaan en dat de samenhang tussen de gebieden van het Natuurnetwerk Nederland wordt behouden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.1__subsec_6.1.1__art_6.1
- number: '6.2'
  text: 1. Een omgevingsplan dat betrekking heeft op locaties binnen het Natuurnetwerk Nederland bevat regels die strekken tot bescherming, instandhouding, verbetering en ontwikkeling van de kwaliteit, de wezenlijke kenmerken en waarden en samenhang van het Natuurnetwerk Nederland . 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de voorwaarden is voldaan.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.1__subsec_6.1.2__art_6.2
