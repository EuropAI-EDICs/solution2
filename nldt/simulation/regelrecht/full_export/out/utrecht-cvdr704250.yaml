  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen de Geluidcontour van provinciale wegen bevat regels voor bestaande gebouwen die getransformeerd worden tot geluidgevoelige gebouwen mits zij een binnenwaarde van maximaal 33 dB Lden hebben. 2. Voor zover een omgevingsplan betrekking heeft op locaties binnen de Geluidcontour van provinciale wegen: a. zijn nieuwe geluidgevoelige gebouwen in de Geluidcontour buiten de bebouwde kom toegestaan tot een geluidbelasting van maximaal 60 dB Lden op de gevel; b. nieuwe geluidgevoelige gebouwen in de Geluidcontour binnen de bebouwde kom toegestaan tot een geluidbelasting van 65 dB Lden op de gevel; 3. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de voorwaarden is voldaan.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.7__art_4.71
