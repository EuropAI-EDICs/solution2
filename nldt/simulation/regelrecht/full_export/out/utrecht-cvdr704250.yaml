- number: 9.14a
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied uitbreiding woningbouw onder voorwaarden mogelijk kan regels bevatten voor een eenmalige en tijdelijke uitbreiding tot maximaal 50 flexwoningen per kern mits wordt voldaan aan de volgende voorwaarden: a. binnen het bestaand Stedelijk gebied zijn onvoldoende locaties beschikbaar voor flexwoningen; b. de woningbouw vindt plaats in aansluiting op het Stedelijk gebied ; c. de woningbouw leidt niet tot extrabodemdaling; d. de woningbouw wordt gerealiseerd met een goede landschappelijke inpassing, die rekening houdt met de tijdelijkheid van de flexwoning en en de beoogde opvolgende groene of agrarische functie; e. er wordt voorzien in een opruimplicht na beëindiging van de activiteit, maar in ieder geval na 15 jaar; f. de opruimplicht is verzekerd op het moment van vaststelling van het omgevingsplan waarmee de activiteit mogelijk wordt gemaakt; en g. omliggende functies worden niet onevenredig geschaad. 2. De motivering
    van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan. Een beeldkwaliteitsparagraaf maakt onderdeel uit van de onderbouwing.'
