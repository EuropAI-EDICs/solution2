- number: '9.9'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Landelijk gebied kan regels bevatten die toestaan dat: a. percelen voor specifieke stedelijke functies een andere stedelijke functie krijgen, niet zijnde permanente bewoning van een recreatiewoning , kantoor of detailhandel , onder de voorwaarde dat de functiewijziging naar aard en omvang, op basis van een integrale afweging, niet leidt tot vergroting van de locatie en tot een toename van de invloed op de omgeving, dat bestaande cultuurhistorische en landschappelijke waarden worden behouden en dat omliggende agrarische bedrijven niet in hun bedrijfsvoering worden belemmerd; b. stedelijke functies worden uitgebreid met maximaal 20% van de bebouwingsmogelijkheden onder het vigerende planologisch regime. Van deze maximale uitbreiding kan afgeweken worden mits er sprake is van een economische noodzaak. Ook het functievlak kan worden uitgebreid als er sprake is van een economische noodzaak. 2. De motivering van een omgevingsplan
    bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
