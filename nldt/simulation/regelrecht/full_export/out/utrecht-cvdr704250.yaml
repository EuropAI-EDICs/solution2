- number: '5.6'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied energie uit biomassa landelijk gebied kan regels bevatten die de realisatie van ontwikkelingen op het gebied van energie uit biomassa toestaan, mits is voldaan aan de volgende voorwaarden: a. de vestiging van kleinschalige biomassa-installaties vindt plaats in het landelijk gebied in aansluiting op bestaande bebouwde agrarische bouwpercelen of bestaande legale halfverhardingen of verhardingen op landgoederen, in overeenstemming met de schaal van de bebouwde omgeving, tenzij op een andere nabijgelegen locatie een betere landschappelijke inpassing kan worden bereikt; b. bestaande omringende functies worden niet onevenredig aangetast of beperkt; en c. voorzien wordt in een goede landschappelijke inpassing. 2. Regels die de realisatie van ontwikkelingen op het gebied van energie uit biomassa toestaan op grond van het eerste lid zijn voor bio-energie installaties met een met een nominaal ingaand thermisch vermogen
