- number: '9.28'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Stiltegebied kan regels bevatten die de realisatie van windturbines toestaan, mits voldaan is aan de volgende voorwaarden: a. de windturbines zijn regionaal afgestemd; b. de windturbines worden in een in de omgeving passende combinatie van meerdere windturbines opgesteld; c. de windturbines worden zodanig opgesteld dat de effecten op het Stiltegebied zo beperkt mogelijk zijn; d. er wordt voor wat betreft de effecten op het stiltegebied zoveel mogelijk aangesloten op de doelstelling voor het geluidniveau in stiltegebieden, bedoeld in Artikel 9.26 ; en e. er wordt voorzien in een opruimplicht na beëindiging van de activiteit. 2. De motivering van een omgevingsplan bevat: a. een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan; en b. een onderbouwing waaruit blijkt dat de locatie binnen het Stiltegebied het meest geschikt is voor windturbines.'
