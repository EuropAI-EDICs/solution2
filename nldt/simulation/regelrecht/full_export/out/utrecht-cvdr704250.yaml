- number: '7.13'
  text: De regels in deze paragraaf zijn gesteld met het oog op het behoud van landschappelijke, natuurwetenschappelijke, cultuurhistorische en archeologische waarden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.2__subsec_7.2.2__art_7.13
- number: '7.14'
  text: '1. Deze paragraaf is van toepassing op het plaatsen en behouden van borden, spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten in het Gebied landschappelijke waarden . 2. Deze paragraaf is niet van toepassing op: a. borden, spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten die niet zichtbaar zijn vanaf een voor het publiek toegankelijke plaats; b. borden, spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten in het inwendige deel van een onroerende zaak; c. onverlichte kunstuitingen ; d. borden aangebracht door een vaarweg- of waterbeheerder voor de zwemveiligheid; e. borden voor educatieve of geografische informatie over een gebied of bezienswaardigheid; f. borden die zijn aangebracht ter voldoening aan een wettelijk voorschrift; g. borden voor verkiezingen van een openbaar bestuur; en h. onverlichte, officiële binnenlandse en buitenlandse vlaggen op locaties waar geen vlaggen zijn geplaatst bedoeld in de onderdelen A, B, D, E en H van Bijlage
    XVIII Toegelaten borden, spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten . 3. In afwijking van het tweede lid is Artikel 7.15 wel van toepassing op de borden, bedoeld in onderdeel d tot en met f van dat lid.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.2__subsec_7.2.2__art_7.14
- number: '7.15'
  text: '1. Degene die een bord , spandoek , vlag , informatiezuil of vergelijkbaar object plaatst of behoudt en weet of redelijkerwijs kan vermoeden dat die activiteit kan leiden tot nadelige gevolgen voor de belangen, bedoeld in Artikel 7.13 , is verplicht: a. alle maatregelen te nemen die redelijkerwijs van diegene kunnen worden gevraagd om die gevolgen te voorkomen; b. voor zover die gevolgen niet kunnen worden voorkomen, die gevolgen zoveel mogelijk te beperken of ongedaan te maken; en c. als die gevolgen onvoldoende kunnen worden beperkt, die activiteit achterwege te laten voor zover dat redelijkerwijs van diegene kan worden gevraagd. 2. Deze plicht houdt in ieder geval in dat: a. borden, spandoeken, vlaggen, informatiezuilen of vergelijkbare objecten worden verwijderd zodra zij hun feitelijke betekenis hebben verloren; b. borden, spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten en dragende hulpconstructies in goede staat worden gehouden; c. borden en spandoeken voor
    of tegen een gebouw niet boven de goot- of dakrand uitsteken en vlaggen voor een gebouw niet boven de nok uitsteken; en d. als borden, spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten worden verlicht: 1. geen verlichting wordt gebruikt tussen 23:00 en 6:00 uur, tenzij de openingstijden van het gebouw die verlichting vereisen; 2. geen knipperende verlichting of bewegende beelden of letters worden gebruikt; en 3. Led of vergelijkbare schermen voldoen aan de Richtlijn Lichthinder van de Nederlandse Stichting voor Verlichtingskunde .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.2__subsec_7.2.2__art_7.15
- number: '7.16'
  text: Het is verboden in het Gebied landschappelijke waarden een bord , spandoek , vlag , informatiezuil of vergelijkbaar object te plaatsen of te behouden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.2__subsec_7.2.2__art_7.16
- number: 7.16a
  text: Het verbod in Artikel 7.16 geldt niet voor bord , spandoek , vlag , informatiezuil of vergelijkbare objecten die voldoen aan Bijlage XVIII Toegelaten borden, spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.2__subsec_7.2.2__art_7.16a
- number: '7.17'
  text: 'Voor de toepassing van Bijlage XVIII Toegelaten borden, spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten wordt als volgt gemeten: a. de afmetingen van een bord of spandoek worden bepaald door de buitenomtrek met inbegrip van de ondergrond, achtergrond, draagconstructie en steunconstructie die kennelijk tot het bord behoren; b. het oppervlak van een vlag en een informatiezuil wordt bepaald door de projectie van het totale oppervlak op een plat vlak; c. de hoogte boven het maaiveld wordt gemeten vanaf het hoogste punt van het bord, spandoek, vlag, informatiezuil of object tot aan het maaiveld; en d. dubbelzijdige borden gelden als 1 bord, tenzij in Bijlage XVIII Toegelaten borden, spandoeken, vlaggen, informatiezuilen en vergelijkbare objecten anders is bepaald.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.2__subsec_7.2.2__art_7.17
- number: '8.1'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied agrarische bedrijven bevat geen regels die voorzien in: a. nieuwe agrarische bouwpercelen , tenzij het gaat om de verplaatsing van een grondgebonden agrarisch bedrijf voor het voldoen aan internationale verplichtingen; en b. een omschakeling van grondgebonden agrarisch bedrijf naar niet-grondgebonden landbouw . 2. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied agrarische bedrijven bevat regels die voorzien in een agrarisch bouwperceel met een oppervlakte van maximaal 1,5 hectare ten behoeve van bestaande agrarische bedrijven, waarbij per bouwperceel maximaal 1 bedrijfswoning en bedrijfsgebouwen met maximaal 1 bouwlaag voor het stallen van dieren zijn toegestaan. 3. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied agrarische bedrijven kan regels bevatten die voorzien in uitbreiding van een bestaand agrarisch bouwperceel voor een grondgebonden veehouderij tot maximaal
    2,5 hectare, mits is voldaan aan de volgende voorwaarden: a. voorzien wordt in een goede landschappelijke inpassing: b. de uitbreiding draagt bij aan verbetering van het dierenwelzijn; c. de uitbreiding draagt bij aan vermindering van de milieubelasting; en d. de uitbreiding draagt bij aan verbetering van de volksgezondheid. 4. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied agrarische bedrijven kan regels bevatten die nevenactiviteiten toestaan, mits voldaan is aan de volgende voorwaarden: a. de nevenactiviteit blijft ruimtelijk ondergeschikt aan de agrarische activiteiten, tenzij de nevenactiviteit bijdraagt aan de dagrecreatiemogelijkheden voor bestaande woongebieden of woongebieden die nog in de nabije omgeving worden gerealiseerd waaraan in het gebied nadrukkelijk behoefte bestaat; b. de nevenactiviteit vindt plaats binnen het bestaande bouwperceel; c. erfinrichting en bedrijfsbebouwing zijn landschappelijk goed inpasbaar; en d. omliggende agrarische bedrijven
    worden niet in hun bedrijfsvoering belemmerd. 5. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan. Een beeldkwaliteitsparagraaf maakt onderdeel uit van de onderbouwing.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_8__subchp_8.1__art_8.1
