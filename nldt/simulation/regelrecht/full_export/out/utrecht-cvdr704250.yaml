- number: 7.3a
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied UNESCO Werelderfgoed Neder-Germaanse Limes (kernzone) : a. neemt de uitzonderlijke universele waarde van de Neder-Germaanse Limes in acht en bevat regels ter instandhouding en versterking daarvan; en b. bevat geen regels die activiteiten toestaan die die waarde aantasten. 2. Als uitzonderlijke universele waarde van de Neder-Germaanse Limes gelden de kernkwaliteiten, bedoeld in de Bijlage XV Cultuurhistorie . 3. De motivering van een omgevingsplan bevat: a. een beschrijving van de in het plangebied aanwezige uitzonderlijke universele waarde van de Neder-Germaanse Limes; en b. een beschrijving van de wijze waarop die waarde in acht is genomen.'
