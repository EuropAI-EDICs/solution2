- number: '10.4'
  text: '[Vervallen per 01‑03‑2024]'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.1__subsec_10.1.1__art_10.4
- number: '10.5'
  text: '[Vervallen per 01‑03‑2024]'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.1__subsec_10.1.1__art_10.5
- number: '10.6'
  text: 1. Een aanvraag om een tegemoetkoming als genoemd in artikel 15.53 van de wet wordt door de aanvrager langs elektronische weg bij BIJ12 ingediend op een daartoe vastgesteld formulier met bijlagen. 2. De aanvraag wordt uiterlijk binnen 7 werkdagen nadat de aanvrager de schade heeft geconstateerd, ingediend. 3. Als een aanvraag om tegemoetkoming niet voldoet aan het eerste en tweede lid, komt de schade niet voor tegemoetkoming in aanmerking.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.1__subsec_10.1.2__art_10.6
- number: '10.7'
  text: a. Het gewas, de teelt of de producten, waarop de aanvraag om tegemoetkoming betrekking heeft, worden pas geoogst of van het bedrijf afgevoerd, nadat de schade definitief is getaxeerd door de taxateur . b. Bedenkingen over de taxatie worden binnen 8 werkdagen na ontvangst van het taxatierapport kenbaar gemaakt aan BIJ12 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.1__subsec_10.1.2__art_10.7
- number: '10.8'
  text: 'Deze afdeling is van toepassing op de uitvoeringstaak, bedoeld in artikel 18.18 , tweede lid, van de wet en de handhavingstaak, bedoeld in artikel 18.1 van de wet , door of in opdracht van gedeputeerde staten: a. voor wat betreft de taken die in het verband van een omgevingsdienst worden uitgevoerd; en b. voor wat betreft de taken die niet in het verband van een omgevingsdienst worden uitgevoerd voor zover door gedeputeerde staten nader bepaald.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.2__art_10.8
- number: '10.9'
  text: Provinciale staten zien toe op de hoofdlijnen van het beleid voor de uitvoeringstaak en handhavingstaak in het licht van de voor de provincie Utrecht vastgestelde beleidskaders voor de fysieke leefomgeving.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.2__art_10.9
- number: '10.10'
  text: '1. Gedeputeerde staten beoordelen de kwaliteit van de uitvoeringstaak en handhavingstaak in het licht van daarvoor door hen op grond van artikel 13.5 , eerste lid, van het Omgevingsbesluit gestelde doelen. 2. De doelen hebben in ieder geval betrekking op: a. de uitvoeringskwaliteit van diensten en producten; b. de dienstverlening; en c. de financiën.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.2__art_10.10
- number: '10.11'
  text: 1. Op de uitvoeringstaak en handhavingstaak door of in opdracht van gedeputeerde staten zijn de kwaliteitscriteria van toepassing. 2. Over de naleving van de kwaliteitscriteria doen gedeputeerde staten jaarlijks mededeling aan provinciale staten. 3. Voor zover de kwaliteitscriteria niet zijn of niet konden worden nageleefd, doen gedeputeerde staten daarvan gemotiveerd opgave. 4. Het derde lid is niet van toepassing op de criteria voor kritieke massa voor de uitvoeringstaak en handhavingstaak bij milieubelastende activiteiten bedoeld in afdeling 3.3 van het Besluit activiteiten leefomgeving. Die criteria voor kritieke massa worden te allen tijde gehaald.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.2__art_10.11
- number: '10.12'
  text: Deze paragraaf is van toepassing op besluiten, meldingen en kennisgevingen op grond van de Interim Omgevingsverordening provincie Utrecht , tenzij afdeling 4.1 of paragraaf 4.2.8 van de Invoeringswet Omgevingswet daarop van toepassing is.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.3__subsec_10.3.1__art_10.12
- number: '10.13'
  text: '1. Als voor de inwerkingtreding van deze verordening een aanvraag om een besluit is ingediend, blijft het oude recht van toepassing: a. als tegen het besluit beroep openstaat: tot het besluit onherroepelijk wordt; of b. als tegen het besluit geen beroep openstaat: tot het besluit van kracht wordt. 2. Als voor de inwerkingtreding van deze verordening voor een ambtshalve te nemen besluit een ontwerp ter inzage is gelegd van een besluit op de voorbereiding waarvan afdeling 3.4 van de Algemene wet bestuursrecht van toepassing is, blijft het oude recht van toepassing: a. als tegen het besluit beroep openstaat: tot het besluit onherroepelijk wordt; of b. als tegen het besluit geen beroep openstaat: tot het besluit van kracht wordt. 3. Als voor de inwerkingtreding van deze verordening voor een ambtshalve te nemen besluit toepassing is gegeven aan artikel 4:8 van de Algemene wet bestuursrecht of het besluit is bekendgemaakt, blijft het oude recht van toepassing: a. als tegen het besluit
    beroep openstaat: tot het besluit onherroepelijk wordt; of b. als tegen het besluit geen beroep openstaat: tot het besluit van kracht wordt.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.3__subsec_10.3.1__art_10.13
- number: '10.14'
  text: 'Als voor de inwerkingtreding van deze verordening een overtreding van de Interim Omgevingsverordening provincie Utrecht heeft plaatsgevonden, een overtreding is aangevangen of het gevaar voor een overtreding klaarblijkelijk dreigde, en voor de inwerkingtreding van deze verordening een bestuurlijke sanctie is opgelegd voor die overtreding of dreigende overtreding, blijft het oude recht op die bestuurlijke sanctie van toepassing tot het tijdstip waarop: a. de beschikking onherroepelijk is geworden en volledig is uitgevoerd of ten uitvoer is gelegd; b. de beschikking is ingetrokken of is komen te vervallen; of c. als de beschikking gaat om de oplegging van een last onder dwangsom: 1. de last volledig is uitgevoerd; 2. de dwangsom volledig is verbeurd en betaald; of 3. de last is opgeheven.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.3__subsec_10.3.1__art_10.14
- number: '10.15'
  text: 1. Een melding of kennisgeving van een activiteit op grond van de Interim Omgevingsverordening provincie Utrecht die voor de inwerkingtreding van deze verordening is gedaan, geldt, als op die activiteit na de inwerkingtreding van deze verordening een verbod om de activiteit zonder melding uit te voeren van toepassing is, als een melding van die activiteit. 2. Een melding of kennisgeving van een activiteit op grond van de Interim Omgevingsverordening provincie Utrecht die voor de inwerkingtreding van deze verordening is gedaan, geldt, als voor die activiteit na de inwerkingtreding van deze verordening een verplichting geldt om informatie te verstrekken, als het verstrekken van die informatie. 3. Een aanvraag om een ontheffing of vergunning voor een activiteit op grond van de Interim Omgevingsverordening provincie Utrecht die voor inwerkingtreding van deze verordening is ingediend, geldt, als op die activiteit na de inwerkingtreding van deze verordening een verbod om zonder melding
    de activiteit uit te voeren van toepassing is, als een melding van die activiteit. 4. Een onherroepelijk maatwerkvoorschrift voor een activiteit op grond van de Interim Omgevingsverordening provincie Utrecht geldt als een maatwerkvoorschrift op grond van deze verordening.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.3__subsec_10.3.1__art_10.15
- number: '10.16'
  text: 1. Een bouw- of gebruiksmogelijkheid die wordt geboden bij of krachtens een omgevingsplan dat in werking is getreden op het moment dat deze verordening in werking treedt, dan wel bij of krachtens een omgevingsplan waarvan voorafgaand aan dat tijdstip een ontwerp ter inzage is gelegd, mag, ondanks strijdigheid met deze verordening, van kracht blijven en kan in opvolgende omgevingsplannen opnieuw geboden worden. 2. In afwijking van het eerste lid geldt voor agrarische bedrijven dat uiterlijk binnen 2 jaar na 5 maart 2013, de inwerkingtredingsdatum van de Provinciale Ruimtelijke Verordening, Provincie Utrecht 2013, een omgevingsplan moet zijn vastgesteld met in achtneming van Artikel 8.1 , leden 2 en 3, Artikel 8.2 en Artikel 8.3 . Voor agrarische bedrijven die zijn gelegen in gebieden die in de Provinciale Ruimtelijke Verordening provincie Utrecht 2013 waren aangemerkt als landbouwontwikkelingsgebied of als verwevingsgebied geldt, dat binnen 2 jaar na de inwerkingtredingsdatum van
    deze regeling een bestemmingsplan moet zijn vastgesteld met inachtneming van Artikel 8.1 , leden 2 en 3, Artikel 8.2 en Artikel 8.3 . 3. In afwijking van het eerste lid worden de in het eerste lid genoemde bouw- en gebruiksmogelijkheden in een nieuw omgevingsplan alleen opnieuw geboden met in achtneming van Artikel 9.19 . Uiterlijk binnen 10 jaar na 10 januari 2019 moet een omgevingsplan zijn vastgesteld met inachtneming van het Artikel 9.19 , als er sprake is van onbenutte plancapaciteit voor zelfstandige kantoren. 4. In afwijking van het eerste lid worden de in het eerste lid genoemde bouw- en gebruiksmogelijkheden in een nieuw omgevingsplan alleen opnieuw geboden met in achtneming van Artikel 9.20 , tweede lid. Uiterlijk binnen 10 jaar na 10 januari 2019 moet een omgevingsplan zijn vastgesteld met inachtneming van het Artikel 9.20 , tweede lid, als er sprake is van onbenutte plancapaciteit voor detailhandel .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.3__subsec_10.3.1__art_10.16
- number: '10.17'
  text: 1. De paragrafen 3.2.3 tot en met 3.2.6 zijn niet van toepassing op activiteiten in Waterwingebied , Grondwaterbeschermingsgebied en Boringsvrije zone die direct voorafgaand aan de inwerkingtreding van deze verordening rechtmatig werden uitgevoerd, voor zover de regels van die paragrafen strenger zijn dan de regels die golden direct voorafgaand aan die inwerkingtreding of direct voorafgaand aan de inwerkingtreding van de Interim Omgevingsverordening provincie Utrecht . 2. Het eerste lid geldt alleen als die activiteit naar aard en omvang niet verschilt van de activiteit zoals deze werd uitgevoerd voor de inwerkingtreding van deze verordening of de Interim Omgevingsverordening provincie Utrecht . 3. Gedeputeerde staten kunnen maatwerkvoorschriften stellen over de activiteit, als dat nodig is ter bescherming van de kwaliteit van het grondwater.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.3__subsec_10.3.2__art_10.17
- number: '10.18'
  text: 1. Paragraaf 3.2.5 is tot 1 april 2024 niet van toepassing op activiteiten in het Grondwaterbeschermingsgebied Langerak die voorafgaand aan de inwerkingtreding van de Interim Omgevingsverordening provincie Utrecht rechtmatig werden uitgevoerd, voor zover de regels van die paragraaf strenger zijn dan de regels die golden voor die inwerkingtreding. 2. Het eerste lid geldt alleen als die activiteit naar aard en omvang niet verschilt van de activiteit zoals deze werd uitgevoerd voor de inwerkingtreding van de Interim Omgevingsverordening provincie Utrecht . 3. Gedeputeerde staten kunnen maatwerkvoorschriften stellen over de activiteit, als dat nodig is ter bescherming van de kwaliteit van het grondwater.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.3__subsec_10.3.2__art_10.18
- number: '10.19'
  text: '1. Als een omgevingsvergunning is verleend voor een of meer grotere maten dan bepaald is in Artikel 2.32 , eerste lid, onder b, vervalt die omgevingsvergunning bij wijziging of vervanging van het woonschip . 2. Woonschepen, die sinds 1 januari 1989 of eerder onafgebroken dezelfde ligplaats hebben ingenomen en vanaf die datum voortdurend in gebruik geweest zijn als hoofdverblijf, en die op die ligplaats in strijd zijn met Artikel 2.30 worden op die locatie gedoogd. 3. Bij woonschepen, die vanaf een datum na 1 januari 1989 onafgebroken dezelfde ligplaats hebben ingenomen en vanaf die datum voortdurend in gebruik geweest zijn als hoofdverblijf, en die op die ligplaats in strijd zijn met Artikel 2.30 geldt bij bestuurlijke handhaving ter verwijdering de volgende begunstigingstermijn vanaf de datum van het handhavingsbesluit: Jaar van inname ligplaats Begunstigingstermijn 1989-1997 3 jaar 1998-2002 18 maanden 2003 3 maanden 2004-heden de kortste redelijke termijn 4. Een gedoogsituatie
    kan worden beëindigd en een begunstigingstermijn kan worden verkort, als voor het betreffende woonschip een wisselligplaats, dan wel een reguliere ligplaats in overeenstemming met deze verordening beschikbaar komt. 5. Als een aanlegplaats aanwezig is in strijd met Artikel 2.30 Vergunningplicht woonschip en aan die aanlegplaats een woonschip ligplaats heeft conform het tweede lid van dit artikel, geldt voor de aanlegplaats dezelfde gedoog- of begunstigingstermijn als voor het woonschip. De bedoelde besluiten worden op hetzelfde moment bekendgemaakt.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.3__subsec_10.3.2__art_10.19
- number: '10.20'
  text: 1. Voor een aanlegplaats, die aantoonbaar al voor 1 januari 2004 aanwezig was en in strijd is met het verbod bedoeld in Artikel 2.41 , en die de maatvoering in Artikel 2.42 met meer dan 50% overschrijdt, kan de provincie de kosten van het aanpassen aan de geldende regelgeving geheel of gedeeltelijk voor haar rekening nemen of vergoeden. Een verzoek hiertoe wordt ingediend bij gedeputeerde staten. 2. Insteekhavens, die aantoonbaar al voor 1 januari 2004 aanwezig waren, worden geacht aanwezig te zijn met een omgevingsvergunning krachtens deze verordening. Dit geldt ook voor een binnen deze insteekhaven passend vaartuig .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_10__subchp_10.3__subsec_10.3.2__art_10.20
- number: '10.21'
  text: 'Deze verordening wordt aangehaald als: Omgevingsverordening provincie Utrecht. geologische, geomorfologische en bodemkundige verschijnselen, die representatief zijn voor de natuurlijke ontstaansgeschiedenis van het landschap, zoals hoogteverschillen of variaties in de samenstelling van de bodem een bedrijf dat is ingericht voor zowel de grondgebonden als niet-grondgebonden activiteiten: het telen van gewassen, boomteelt daaronder begrepen, of het houden van dieren (veehouderij), een en ander ten behoeve van het voortbrengen van producten aaneengesloten terrein, waarbinnen bedrijfsgebouwen, bijgebouwen, bedrijfswoning(en) met bijbehorend erf en tuin, andere bouwwerken zoals hooibergen, voersilo’s, kuilvoerplaten, mestopslag, erfverharding, parkeervoorzieningen en erfbeplanting zijn geconcentreerd Japanse duizendknoop (Fallopia japonica var. Japonica en Fallopia japonica var. compacta), Boheemse of Bastaard duizendknoop (Fallopia x bohemica) en Sachalinse duizendknoop (Fallopia sachalinensis)
    materiaal, dat is vrijgekomen uit de bodem van een oppervlaktewater, of de voor dat water bestemde ruimten en dat bestaat uit minerale delen met een maximale korrelgrootte van 2 millimeter, organische stof in een verhouding en met een structuur, zoals deze van nature in de bodem wordt aangetroffen, evenals van nature in de bodem aanwezige schelpen en grind met een korrelgrootte van 2 tot en met 63 millimeter gebied dat door gedeputeerde staten als zodanig is aangewezen op grond van artikel 27 van de Wegenwet geconcentreerde bebouwing kleiner dan 5 hectare, waarvoor geen locatie Stedelijk gebied is opgenomen aaneengesloten bebouwing in een langgerekte vorm, waarvoor geen locatie Stedelijk gebied is opgenomen als zodanig in een onherroepelijk omgevingsplan bestemde haven een terrein van minimaal 1 hectare bruto dat vanwege zijn bestemming bestemd en geschikt is voor gebruik door handel, nijverheid, industrie en commerciële en niet-commerciële dienstverlening, met uitzondering van een terrein
    voor grondstoffenwinning, olie- en gaswinning, terrein voor waterwinning, terrein voor agrarische doeleinden, terrein voor afvalstort en terreinen met laad- en/of loskade langs diep vaarwater toegankelijk voor grote zeeschepen Ter toelichting: begripsomschrijving uit Integraal Bedrijventerreinen Informatie Systeem (IBIS). Bij de begripsomschrijving van een bedrijventerrein is gebruik gemaakt van de definitie uit het Convenant Bedrijventerreinen 2010-2020 (in werking getreden op 28 november 2009). Het kabinet sloot het convenant over een nieuwe aanpak van bedrijventerreinen met het Interprovinciaal Overleg (IPO) en de Vereniging van Nederlandse Gemeenten (VNG). Het doel is het stimuleren van een gezond economisch vestigingsklimaat en tegelijk het sparen van open landschappen, tegengaan van verrommeling en stimulering van duurzaamheid; Een onderdeel van de ruimtelijke onderbouwing dat aangeeft op welke wijze de beoogde ontwikkeling in de leefomgeving optimaal in de omgeving wordt ingepast.
    Ter toelichting: de basis voor beeldkwaliteitsparagraaf is een analyse van de kwaliteiten van het omringende landschap in de vorm van een schets of beschrijving van een bepaald gebied, met onder meer de bouwmassa''s (bestaand en beoogd, zo mogelijk met kapvorm en richting), het beoogde grondgebruik, de beplanting en wegenstructuur; onderdeel van een klein landschapselement dat als beschermwaardig is opgenomen op de waardenkaart kleine landschapselementen gewasbeschermingsmiddel of biocide als bedoeld in artikel 1 van de Wet gewasbeschermingsmiddelen en biociden uitvoeringsorganisatie van de 12 provincies schip als bedoeld in artikel 1, eerste lid, van de Binnenvaartwet energie die wordt opgewekt uit organisch materiaal (biomassa), zoals mest, hout, vezels, plantaardig en dierlijk vet drijvende of vaste constructie met geringe hoogte boven een wateroppervlak bestemd ter bescherming van een vaartuig tegen weersinvloeden een met daartoe geschikte werktuigen aangebrachte geboorde put opschrift,
    aankondiging, afbeelding, kleurvlak en/of een combinatie daarvan, op of tegen een bouwwerk aangebracht, dan wel vrijstaand, samen met de bijbehorende vaste of verplaatsbare draag-, bevestigings- en/of steunconstructies een aaneengesloten stuk grond, waarop ingevolge een onherroepelijk omgevingsplan een zelfstandige, bij elkaar behorende bebouwing is toegelaten terrein dat aantoonbaar voorziet in een dagrecreatiefunctie van meer dan de aanliggende kernen of aantoonbaar meer dan 50.000 unieke bezoekers per jaar trekt. Ter toelichting: hierbij moet gedacht worden aan terreinen zoals het Henschotermeer, de Maarsseveense plassen e.d.. Nieuwvestiging van golfterreinen is alleen in recreatiezones en kernrandzones toegestaan. Ook een terrein dat aantoonbaar potentie heeft bovenlokaal te worden door toevoeging van recreatieve functies of dat duidelijk een dagrecreatiefunctie vervult of zou moeten vervullen in de agglomeraties Utrecht of Amersfoort valt binnen deze bepaling; de regels, bedoeld
    in artikel 7.4 van het Invoeringsbesluit Omgevingswet bruto vloeroppervlakte, uitgedrukt in m2. Het betreft alle tot het gebouw behorende binnenruimten, waarbij de oppervlakte wordt gemeten op vloerniveau langs de buitenomtrek van de opgaande scheidingsconstructies, die de desbetreffende ruimte of groep van ruimten omhullen (CHS) het geheel van historisch waardevolle structuren en elementen van bovenlokaal belang. Ter toelichting: het gaat om ruimtelijk herkenbare, dan wel in de ondergrond aanwezige structuren en elementen die representatief zijn voor een historische ontwikkeling en/of kenmerkend zijn voor het ontstaan van een gebied. Onder elementen wordt verstaan: afzonderlijke objecten en infrastructurele lijnen en patronen die visueel of historisch-functioneel een samenhang vertonen met structuren. De Historische buitenplaatszone, het Militair erfgoed, Agrarisch cultuurlandschap, de Historische infrastructuur en Archeologisch waardevolle zone vormen gezamenlijk de CHS (zie Bijlage
    Cultuurhistorie); geheel of gedeeltelijk dichtgooien en/of dichtgegooid houden van oppervlaktelichamen of tijdelijk drooggevallen oppervlaktelichamen, zoals sloten, greppels, slenken, wielen en sleuven het bedrijfsmatig te koop aanbieden, waaronder begrepen de uitstalling ten verkoop, het verkopen en/of leveren van goederen aan personen die deze goederen kopen voor gebruik, verbruik of aanwending anders dan in de uitoefening van een beroeps- of bedrijfsactiviteit en anders dan voor gebruik ter plaatse, met uitzondering van afhaalpunten infiltratie van hemelwater in de bodem, op een diepte van 10 meter of meer onder het maaiveld drinkwaterbedrijf als bedoeld in artikel 1, eerste lid, van de Drinkwaterwet (behorende bij een woonschip, vaartuig, insteek havens en havens) tuin of onbebouwd terrein behorend bij een woning, bij de woningen op de begane grond van een wooncomplex, dan wel bij een overeenkomstig de geldende wettelijke voorschriften aanwezige zomerwoning, woonwagen, of woonschip.
    Tot het erf wordt in principe ook de ten opzichte van het erf meest nabije oever gerekend, die door een openbare weg en/of een ander perceel van dat erf gescheiden wordt, tenzij het aan de openbare weg, dan wel het aan het andere perceel grenzende deel van het erf het karakter van een uit-, of inrit, of oprijlaan heeft, of het scheidende perceel een agrarische, natuur- of industriële bestemming heeft. Ter toelichting: dit begrip is exclusief gericht op erven bij woonschip, vaartuig, insteekhavens en havens en is een voortzetting van de regelgeving uit de oude Verordening natuur en landschap. Dit beperkte begrip wijkt daarmee af van het bredere begrip erf uit het gangbare spraakgebruik. Met het begrip erf wordt de grond bedoeld, die direct bij de woning aansluit en ook behoort tot die woning. Daarbij is vooral de visuele aansluiting van belang. Dit is zeker het geval als een erf direct aan het water gelegen is, maar ook als een oever van een erf wordt gescheiden door een openbare weg
    en/of een ander perceel, kan die visuele binding aanwezig zijn. Maar dat is niet zonder meer het geval. De definitie bevat in dit kader een drietal beperkingen: de visuele binding, die maakt dat een afgescheiden oever bij het erf gerekend kan worden, ontbreekt als: a. het scheidende perceel een agrarische, natuur of industriële functie (voorheen bestemming) heeft, waarbij onder agrarische functie (voorheen bestemming) ook alle functies (voorheen bestemmingen) met de toevoeging NLC en/of A waarden vallen; b. het erf voornamelijk op grotere afstand van de scheidende weg ligt en daar alleen door middel van een in-, uitrit of oprijlaan mee verbonden is (de situatie van de zogenaamde achtergelegen erven); of c. de oeverstrook ten opzichte van het erf niet direct aan de overzijde van de weg of het scheidende perceel ligt, maar slechts bereikbaar is door de weg of het perceel schuin over te steken. Dit komt bijvoorbeeld voor als recht tegenover (rekening houdend met de verkavelingsrichting
    ter plaatse) het erf al een woonschip is afgemeerd. In dat geval wordt een verderop langs de weg gelegen vrije oeverstrook niet meer tot het erf gerekend; kleine, verplaatsbare woning die vaak stapelbaar, schakelbaar of splitsbaar is en voor de maximale duur van 15 jaar geplaatst of gebouwd kan worden op een locatie; gebiedsanalyses die de uitwerking bevatten van de in de Hollandse Waterlinies aanwezige kernkwaliteiten en uitzonderlijke universele waarde van het UNESCO Werelderfgoed en die inzicht geeft in de uitgangspunten bij planvorming en waar er ontwikkelingsruimte is aanpak die is gericht op de sanering van meerdere gevallen van verontreinigd grondwater in een daartoe aangewezen gebied werk in de bodem, daaronder begrepen sonderingen, het plaatsen of verwijderen van palen, dam-, scherm- of diepwanden en folies agrarisch bedrijf met een bedrijfsvoering die geheel of in overwegende mate niet in gebouwen plaatsvindt. Het betreft akkerbouw, vollegrondstuinbouw, fruitteelt en boomteelt
    en rundvee-, paarden-, schapen- of geitenhouderij voor zover bij deze veehouderijen het benodigde ruwvoer (gras, voedergewassen) geheel of vrijwel geheel afkomstig is van de structureel bij het bedrijf behorende gronden, waarbij de norm van 2,5 grootvee-eenheden (GVE) per hectare of minder wordt aangehouden. Ter toelichting: bij grondgebonden landbouwbedrijven gaat het om landbouwbedrijven, waarbij het voortbrengend vermogen van de bij het landbouwbedrijf behorende landbouwgrond de basis van het landbouwbedrijf is. Denk hierbij aan akker- of tuinbouwbedrijven of om zogenoemde graasdierbedrijven (zoals melkveebedrijven), waarbij de teelt van gras en voedergewassen de basis voor de bedrijfsvoering is. Er is bij veebedrijven sprake van grondgebondenheid wanneer het voor het vee benodigde ruwvoer geheel of vrijwel geheel afkomstig is van de bij het bedrijf behorende landbouwgrond. Bij een veebezetting van 2,5 grootvee-eenheden of minder per hectare gras en voedergewassen wordt aan deze voorwaarde
    voldaan. Grootvee-eenheid (GVE) is rekeneenheid voor het vaststellen van de veebezetting zoals vastgelegd door de Europese Commissie (EU 2009, L329/3). Melkkoe is 1,0 GVE, kalf is 0,4 GVE, paard is 0,8 GVE, schaap of geit is 0,1 GVE. Eventuele aanvoer van krachtvoer van buiten het bedrijf wordt buiten beschouwing gelaten. Onder bij het bedrijf behorende landbouwgrond wordt verstaan landbouwgrond in de directe omgeving van het bedrijf, waar het bedrijf structureel, bij voorkeur op basis van eigendom of langdurige pacht over kan beschikken. Op basis van landbouwkundige productiegegevens en voedernormen is vastgesteld dat een veebedrijf wat betreft ruwvoer nog net zelfvoorzienend is bij een veebezetting van 2,0 GVE per ha op matige grond tot 2,5 GVE per ha op goede grond. Grondgebondenheid van veebedrijven wordt ook wel gedefinieerd op basis van het criterium wel of geen mestoverschot op bedrijfsniveau. Op basis van dit criterium worden ook maximale veebezettingen van 2,0 - 2,5 GVE per
    ha vastgesteld. Gelet hierop is 2,5 GVE per hectare ook als norm in de begripsbepaling opgenomen. Met de vermelding ''of minder'' is daarbij ook aangegeven dat veehouderijen met meer grond voor het vee en daardoor een lagere veebezetting per hectare, zoals 2.3 GVE, onder het begrip grondgebonden landbouw vallen. Met het opnemen van deze norm in de begripsbepaling wordt de bestaande praktijk onder de Interim Omgevingsverordening en daarvoor de Provinciale Ruimtelijke Verordening provincie Utrecht, voortgezet; beschermingsgebied aangewezen op grond van artikel 2.18, eerste lid, onder c, van de Omgevingswet het UNESCO Werelderfgoed, bestaande uit de Stelling van Amsterdam (SvA) en de Nieuwe Hollandse Waterlinie (NHW), dat gekenmerkt wordt door het uitgebreide en ingenieuze systeem van militaire verdediging door inundatie (zie Bijlage Cultuurhistorie) opschrift, aankondiging, afbeelding, kleurvlak en/of combinatie daarvan, aangebracht op, dan wel gedragen door een zuilvormige constructie
    kleine, in een particulier terrein uitgegraven haven, die bedoeld en geschikt is als ligplaats voor een vaartuig als zodanig in een onherroepelijk omgevingsplan opgenomen haven een gebouw of een deel van een gebouw in de vorm van een ruimtelijk en bouwkundig zelfstandige eenheid dat geheel of grotendeels in gebruik is of te gebruiken is voor bureaugebonden werkzaamheden of daaraan ondersteunende activiteiten. Ter toelichting: onder dit begrip vallen zelfstandige en ondergeschikte kantoren. Opleidings-, congres- en vergaderactiviteiten vallen niet onder bureaugebonden werkzaamheden of ondersteunende activiteiten; stedelijke functies gericht op recreatief, sportief of maatschappelijk gebruik op lokale schaal, waarbij de gronden merendeels onbebouwd zijn. Ter toelichting: sommige functies zijn naar de aard wel als stedelijk aan te merken, maar kunnen door hun ruimtevraag moeilijk binnen bestaand stedelijk gebied worden gefaciliteerd. Te denken valt aan functies zoals sportvelden, begraafplaatsen
    en volkstuincomplexen en andere functies waar de bebouwing ruimtelijk ondergeschikt is aan open of beplante gronden. Deze functies zijn gericht op de kern, maar nieuwvestiging en uitbreiding zullen doorgaans slechts in de kernrandzone kunnen worden gefaciliteerd. In het artikel voor kernrandzone is geregeld, dat voor deze vestiging of uitbreiding geen tegenprestatie in de vorm kwaliteitsverbetering hoeft te worden gerealiseerd, alleen landschappelijke inpassing; zone gelegen in het landelijk gebied rondom en direct aansluitend op het stedelijk gebied. Hieronder vallen ook dorpskernen. De omvang van deze zone is indicatief aangegeven en kan variëren, onder meer afhankelijk van de al aanwezige functies, de kwaliteiten en de aanwezige bebouwingsdichtheid. In deze zone komen, naast agrarische activiteiten, kernrandactiviteiten voor. Ter toelichting: stadsrandactiviteiten en functies met een overwegend onbebouwd en groen karakter, zoals sportvelden, begraafplaatsen, volkstuincomplexen, stadslandbouw,
    recreatiecomplexen, wandel en fietspaden en groenvoorzieningen. Tuincentra worden hieronder niet begrepen; object, dan wel een bord, informatiezuil, spandoek of vlag, dat zoals blijkt uit de plaatsingsgeschiedenis kennelijk bedoeld is als locatiegebonden artistiek expressiemiddel en niet als drager van een commerciële, of reclameboodschap tank vast verbonden met een binnenschip waarvan de wanden hetzij door de scheepsromp zelf, hetzij door van de scheepsromp onafhankelijke wanden zijn gevormd gemiddelde hoogte van de vaste bodem op een locatie, zoals vastgelegd in het Actueel hoogtebestand Nederland (AHN) van de meerwaardebenadering is sprake als in een omgevingsplan of een combinatie van omgevingsplannen wordt voorzien in een ontwikkeling die mede is gericht op verbetering en/of uitbreiding van het natuurnetwerk Nederland (NNN) en waarbij in dat plan of in 1 van die plannen nieuwe activiteiten of wijziging van bestaande activiteiten mogelijk worden gemaakt die leiden tot aantasting
    van de NNN. De activiteiten die leiden tot aantasting worden gecompenseerd met dusdanige maatregelen dat de uitvoering van die maatregelen gezamenlijk binnen 10 jaar resulteert in een duidelijk aantoonbare meerwaarde voor het NNN en de wezenlijke kenmerken en waarden daarvan, voor wat betreft kwaliteit, oppervlakte en samenhang. Deze compensatie en meerwaarde worden gerealiseerd binnen een gebied dat samenhangt met de in het plan toegestane nieuwe activiteiten of wijziging van bestaande activiteiten; het op natuurlijke wijze ontstaan van een bosbouwkundig verantwoorde houtopstand (intensieve veehouderij) agrarisch bedrijf met een bedrijfsvoering die geheel of in overwegende mate in gebouwen plaatsvindt en gericht is op het houden van dieren, zoals rundveemesterij, varkens-, vleeskalver-, pluimvee-, pelsdier-, geiten- of schapenhouderij of een combinatie van deze bedrijfsvormen, en naar de aard daarmee gelijk te stellen bedrijfsvormen, met uitzondering van grondgebonden veehouderij duidt
    op de integrale kwaliteit van ruimtes. Integraal, dus niets uitsluitend. De ondergrond noch de sterrenhemel. De lokale inbedding noch de internationale aansluiting. Schoonheid noch functionaliteit. Omgevingskwaliteit omvat in ieder geval: a. ruimtelijke kwaliteit: gebruiks-, belevings- en toekomstwaarde; b. milieu-, gezondheids- en veiligheidskwaliteit; c. maatschappelijke waarden zoals sociale samenhang en economische vitaliteit een gebouw of een deel van een gebouw dat geheel of grotendeels in gebruik is of te gebruiken is voor bureaugebonden werkzaamheden of daaraan ondersteunende activiteiten, waarbij deze werkzaamheden en activiteiten uitsluitend worden verricht ten dienste van en ondergeschikt zijn aan een andere functie dan kantoor op hetzelfde bouwperceel. Ter toelichting: kantoren die ondergeschikt zijn aan de hoofdfunctie. Dit begrip is gebaseerd op de definitie van kantoren in het Provinciale Inpassingsplan Kantoren 2018-2028, Provincie Utrecht. Ondergeschikt aan de hoofdfunctie
    betekent in elk geval dat minder dan 50% van het bvo op het bouwperceel bestaat uit kantoor. Dit begrip moet in samenhang worden gelezen met de begrippen zelfstandig kantoor, hoofdfunctie en bouwperceel; afvoeren van restladingdamp uit een ladingtank waarbij restladingdampen terechtkomen in de open lucht storten ten behoeve van het tijdelijk of definitief ophogen van de bodem een onderscheiden oppervlaktewater van aanzienlijke omvang, zoals een meer, een waterbekken, een stroom, een rivier, een kanaal, een deel van een stroom, rivier of kanaal, een plas, overgangswater, watergang, sloot of een strook kustwater; gronden met actueel bos waarop in 1832 een bosgroeiplaats met bos, dennenbos of heide met struiken aanwezig was en waarop sindsdien een bosgroeiplaats aanwezig is geweest, dan wel locaties met actueel bos waarop al meer dan 150 jaar een bosgroeiplaats aanwezig is en die in het informatiebestand als oude bosgroeiplaats zijn aangewezen; vaartuig gebruikt als commercieel passagierschip
    voor het houden van feesten en partijen, al dan niet in combinatie met rondvaarten gedurende meerdere uren VOOR WONEN: het provinciaal programma waarin de hoofdlijnen van de regionale programmeringsafspraken voor woningbouw zijn opgenomen. In deze regionale programmering: - worden de basisprincipes voor verstedelijking gevolgd, te weten: a. zo veel mogelijk binnenstedelijk/binnendorps (binnen het stedelijk gebied) nabij knooppunten; b. daarnaast in overig stedelijk gebied; c. eventuele nieuwe (grootschalige) uitleg koppelen hoogwaardig openbaar vervoer en aan (bestaande of nieuwe) knooppunten van de belangrijkste infrastructurele corridors); - worden afspraken vastgelegd om te borgen dat binnen het programma voldoende woningen worden gebouwd in het sociale en -middensegment waarbij wordt uitgegaan van de afspraken uit de regionale woondeals; en - worden afspraken gemaakt over energieneutrale, circulaire, klimaatadaptieve woningbouw, evenredige groenontwikkeling en efficiënt ruimtegebruik.
    Het programma kan kwantitatieve en kwalitatieve bandbreedtes bevatten. VOOR WERKEN: het provinciaal programma waarin de hoofdlijnen van de regionale programmeringsafspraken voor bedrijventerreinen zijn opgenomen. In deze regionale programmering wordt naast nieuwe bedrijventerreinen aandacht besteed aan herstructurering, intensivering, verduurzaming en efficiënt ruimtegebruik op bestaande bedrijventerreinen; het samenhangend geheel van provinciale fietspaden, provinciale (vaar)wegen en OV-lijnen en aanvullend die fietspaden, (vaar)wegen en OV-lijnen van gemeenten die de provincie tot een provinciaal belang heeft benoemd het samenhangend geheel van OV lijnen dat begin- en eindpunten met elkaar verbindt via tussengelegen haltes een openbare weg, zoals bedoeld in de Wegenverkeerswet en Wegenwet in beheer bij de provincie, met inbegrip van de daarin gelegen kunstwerken en wat verder naar zijn aard daartoe behoort woning, caravan, stacaravan of bouwwerk ten behoeve van recreatief verblijf,
    inclusief overnachting damp die na het lossen in de ladingtank achterblijft een terrein dat zich buiten het erf of buiten een in het omgevingsplan aangewezen bedrijfsbestemming bevindt, dat gebruikt wordt voor het al dan niet geordend bewaren of opslaan van voorwerpen, materieel, apparaten, goederen of, al dan niet los gestort, materiaal (bij varend ontgassen) persoon als bedoeld in artikel 1.2.1 van deel 1 van het ADN (Europees Verdrag inzake het internationale vervoer van gevaarlijke goederen over de binnenwateren, Trb. 2001/67); opschrift, aankondiging, afbeelding, kleurvlak en/of combinatie daarvan, enkel- of tweezijdig aangebracht op doek, plastic of een ander als spandoek te gebruiken materiaal, samen met de bijbehorende vaste of verplaatsbare draag- bevestigings- en/of steunconstructies functie die door de intensiteit van de bebouwing en gebruik, door afhankelijkheid van geconcentreerde infrastructuur en door de intensieve wisselwerking met andere functies primair is aangewezen
    op of verbonden is met aaneengesloten bebouwd gebied. Ter toelichting: onder het begrip stedelijke functie vallen de functies die voor het grootste deel in, of in de onmiddellijke nabijheid van dorpen en steden (stedelijk gebied) liggen en verbonden zijn aan stad en dorp. Functies die traditioneel in het landelijk gebied thuishoren horen hier niet bij. De provincie beschouwt de infrastructuur, zowel wegen als leidingen, als een onlosmakelijk onderdeel van het gehele landelijke gebied. De definitie van het begrip stedelijke functie is van belang in verband met het verbod op verstedelijking zoals dat is opgenomen in artikel 9.3 Verstedelijkingsverbod landelijk gebied en de uitzonderingen op dat verbod. Onder stedelijke functie vallen onder meer: - woningen en woongebieden; - niet-agrarische bedrijven en bedrijfsterreinen; - stedelijke voorzieningen en kernrandactiviteiten; - gebouwde voorzieningen voor energieproductie; - recreatiewoningen en complexen voor verblijfsrecreatie; Onder verstedelijking
    vallen in ieder geval niet: - landbouw met de daarvoor noodzakelijke bebouwing op agrarische bouwvlakken; - ondergeschikte nevenfuncties op agrarische bouwpercelen; - bos en natuur; - terreinen ingericht voor dagrecreatie en kleinschalige dagrecreatieve voorzieningen, zoals picknickplaatsen en bebording; drijvende of boven water aangebrachte constructie waarop gelopen kan worden, bedoeld om vaartuigen aan af te meren (bij varend ontgassen) chemische elementen, verbindingen daarvan dan wel mengsels van die elementen of verbindingen op of in de bodem brengen van materialen om ze daar langdurig of permanent te laten locatie, waar gestort, opgehoogd of geëgaliseerd wordt of is takken en boomstammen met een grootste diameter van maximaal 8 centimeter, dat vrijkomt bij reguliere snoei- en dunningswerkzaamheden in houtopstanden een taxateur die werkzaam is voor een door BIJ12 aangewezen taxatiebureau of een consulent faunazaken van BIJ12 Outstanding Universal Value (OUV), de culturele en/of
    natuurlijke betekenis die zo uitzonderlijk is dat deze nationale grenzen overstijgt en van algemeen belang is voor de huidige en toekomstige generaties van heel de mensheid voorwerp of constructie, gereed of in aanbouw, uitsluitend of in hoofdzaak bestemd of ingericht voor het vervoer over water van personen of goederen voor het openbaar verkeer met schepen openstaand water in de zin van artikel 1.01, onder D, onder 5°, van het Binnenvaartpolitiereglement omgevingsverordening van verstedelijking is sprake als een omgevingsplan ten opzichte van het vigerende regime nieuwe mogelijkheden biedt voor vestiging of uitbreiding van stedelijke functies. Ter toelichting: de vestiging of uitbreiding van al bestaande stedelijke functies. Denk daarbij aan nieuwvestiging of de vergroting van de gebruiksoppervlakte of bebouwingsmogelijkheden ten opzichte van het geldende omgevingsplan; (bij varend ontgassen) de onderneming, bedoeld in 1.2.1 van deel 1 van het ADN (Europees Verdrag inzake het internationale
    vervoer van gevaarlijke goederen over de binnenwateren, Trb. 2001, 67) opschrift, aankondiging, afbeelding, kleurvlak en/of combinatie daarvan, enkel- of tweezijdig aangebracht op doek, plastic of een ander als vlag te gebruiken materiaal, samen met de bijbehorende vaste of verplaatsbare draag- bevestigings- en/of steunconstructies vormen van detailhandel die een assortiment voeren van overwegend ruimte vergende goederen, waaronder bouwmarkten, tuincentra, woninginrichtingszaken, auto-, boten-, en caravan­-bedrijven mede worden begrepen waterbeheerprogramma als bedoeld in artikel 3.7 van de wet als zodanig in een onherroepelijk omgevingsplan bestemde locatie beschermingsgebied aangewezen op grond van artikel 2.18, eerste lid, onder c, van de wet Omgevingswet casco met opbouw, dan wel in of op het water geplaatst voorwerp, niet zijnde een woonschip, dat uitsluitend of hoofdzakelijk wordt gebruikt als dag- of nachtverblijf van een of meer personen, dan wel, te oordelen naar zijn constructie,
    inrichting of getroffen voorzieningen daartoe uitsluitend of hoofdzakelijk bestemd is vaartuig, niet zijnde een woonark, dat uitsluitend of hoofdzakelijk wordt gebruikt als dag- of nachtverblijf van een of meer personen, dan wel, te oordelen naar zijn constructie, inrichting of getroffen voorzieningen daartoe uitsluitend of hoofdzakelijk bestemd is kleinschalige woonaccommodatie ten behoeve van zorgvragers met mogelijkheden voor zorg en dagactiviteiten. Ter toelichting: kleinschalige woonaccommodatie voor ongeveer 25 zorgvragers; een gebouw of een deel van een gebouw in de vorm van een ruimtelijk en bouwkundig zelfstandige eenheid dat geheel of grotendeels in gebruik is of te gebruiken is voor bureaugebonden werkzaamheden of daaraan ondersteunende activiteiten, met uitzondering van een ondergeschikt kantoor. Ter toelichting: dit begrip is afgestemd op de definitie van kantoren in het Provinciale Inpassingsplan Kantoren 2018-2028, Provincie Utrecht. Bij ''een deel van een gebouw in de
