            subject: $in_groene_contour
            value: true
- number: '6.6'
  text: '1. In afwijking van Artikel 9.3 kan een omgevingsplan dat betrekking heeft op locaties binnen de Groene contour ten behoeve van de realisatie van nieuwe natuur regels bevatten die verstedelijking toestaan, mits is voldaan aan de volgende voorwaarden: a. de verstedelijking vindt plaats in samenhang met de realisatie van nieuwe natuur; b. de omvang van de verstedelijking staat in evenwichtige verhouding tot de oppervlakte en kwaliteit van de te realiseren nieuwe natuur; c. de nieuwe natuur wordt gerealiseerd binnen de Groene contour ; d. de verstedelijking vindt plaats binnen de Groene contour of, als dit vanuit ecologisch of landschappelijk oogpunt beter is, op een locatie daarbuiten, bij voorkeur aansluitend bij een kernrand of een bestaande bebouwingsconcentratie; e. de in samenhang ontwikkelde verstedelijking en nieuwe natuur gezamenlijk leiden tot een verhoging van de ruimtelijke kwaliteit; en f. de omliggende agrarische bedrijven worden door de activiteit niet in hun bedrijfsvoering
    belemmerd. 2. In aanvulling op het eerste lid kan uitsluitend toepassing worden gegeven aan de realisatie van opwekking van zonne-energie op locaties binnen de Groene contour door middel van zonnevelden met een procedure die de opruimplicht borgt, zoals een omgevingsvergunning, waarbij aan de omgevingsvergunning in ieder geval de volgende voorwaarden worden verbonden: a. de omgevingsvergunning geldt voor een bepaalde termijn en bedraagt maximaal 25 jaar; b. na het verstrijken van de termijn worden de zonnevelden verwijderd. 3. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.1__subsec_6.1.2__art_6.6
- number: '6.7'
  text: 1. Een omgevingsplan dat betrekking heeft op locaties binnen het Weidevogelkerngebied kan regels bevatten die nieuwe ontwikkelingen toestaan, onder voorwaarde dat de kwaliteit van het leefgebied van de weidevogels aantoonbaar per saldo minimaal wordt behouden. 2. Het eerste lid is niet van toepassing op de uitbreiding van agrarische bouwblokken. 3. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarde is voldaan.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.1__subsec_6.1.2__art_6.7
- number: '6.8'
  text: Deze paragraaf is van toepassing op de uit te voeren compensatie die vereist is op grond van Paragraaf 6.1.2 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.1__subsec_6.1.3__art_6.8
- number: '6.9'
  text: '1. Compensatie vindt zodanig plaats dat deze de kwaliteit, oppervlakte en samenhang van het Natuurnetwerk Nederland versterkt. 2. De compensatie vindt in de nabijheid van de aantasting plaats als het functioneren van het natuurnetwerk dat vereist. 3. Als sprake is van activiteiten bedoeld in Artikel 6.3 , tweede lid, sub a onder 3, vindt de compensatie in de directe nabijheid van de aantasting plaats en eerst op het terrein van de bestaande activiteit. Als deugdelijk is onderbouwd dat compensatie op het terrein van de bestaande activiteit blijvend onmogelijk is, volstaat het dat de compensatie in de directe nabijheid van de aantasting plaatsvindt. 4. Als sprake is van activiteiten als bedoeld in Artikel 6.3 , tweede lid, sub a, onder 1, of 2, vindt de compensatie van het verlies in oppervlakte plaats: a. buiten het natuurnetwerk Nederland en in directe aansluiting op het natuurnetwerk Nederland; b. buiten het natuurnetwerk Nederland en binnen de Groene contour; of c. binnen agrarische
    gronden gelegen in het natuurnetwerk Nederland (Agrarisch binnen NNN) waar geen nieuwe natuur is beoogd volgens kaart 1 behorende bij het Natuurbeheerplan . 5. In afwijking van het vierde lid is compensatie van het verlies in oppervlakte binnen het natuurnetwerk Nederland mogelijk, als gedeputeerde staten de begrenzing van het natuurnetwerk Nederland uitbreiden met een oppervlakte gelijk aan de compensatie wanneer die buiten het natuurnetwerk Nederland zou plaatsvinden, en compensatie in de directe omgeving plaatsvindt op een locatie waar volgens het Natuurbeheerplan nog nieuwe natuur moet worden ontwikkeld en de compensatie leidt tot een versnelling van de realisatie van het natuurnetwerk Nederland ter plekke van deze natuur. 6. De oppervlakte ter compensatie van het verlies van oppervlakte natuurnetwerk Nederland wordt bepaald aan de hand van Bijlage XII Berekenen oppervlaktecompensatie natuurtypen . 7. Aan de compensatie ligt een compensatieplan ten grondslag, gebaseerd op recent
    uitgevoerd ecologisch onderzoek ter plaatse, waarin worden beschreven: a. de natuurwaarden van de locatie en de directe omgeving waar het natuurnetwerk Nederland wordt aangetast en het belang van deze waarden voor het functioneren van het natuurnetwerk Nederland in de omgeving; b. de maatregelen die worden genomen om de aantasting zoveel mogelijk te beperken; c. de overblijvende aantasting na het treffen van de maatregelen; d. de maatregelen die worden uitgevoerd ter compensatie van de overblijvende aantasting; e. de compensatieoppervlakte ten gevolge van de aantasting, bedoeld in Bijlage XII Berekenen oppervlaktecompensatie natuurtypen ; f. de wijze waarop de ontwikkeling, het beheer en de instandhouding van de maatregelen genoemd onder d, plaatsvinden; en g. als compensatie van verlies van oppervlakte van het natuurnetwerk Nederland met de realisatie van nieuwe natuur plaatsvindt: een inrichting- en beheerplan, waarin in ieder geval is opgenomen: 1. de uitgangssituatie van het terrein
    waarop de nieuwe natuur wordt gerealiseerd; 2. de te treffen inrichtingsmaatregelen; 3. de motivering van de te treffen maatregelen; 4. de met de maatregelen beoogde eindsituatie van het terrein, waarbij de beoogde natuur- en landschapsbeheertypen en de oppervlakten daarvan worden aangegeven; en 5. de wijze waarop na de inrichting de verdere ontwikkeling, het beheer en de instandhouding van de beoogde beheertypen plaatsvinden. 8. Bij de keuze van de beoogde natuur- en landschapsbeheertypen in het inrichtings- en beheerplan wordt het Natuurbeheerplan in acht genomen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.1__subsec_6.1.3__art_6.9
- number: '6.10'
  text: Artikel 6.10
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.1__subsec_6.1.3__art_6.10
- number: '6.11'
  text: '1. Aan de realisatie van nieuwe natuur bedoeld in de Artikel 6.5 en Artikel 6.6 ligt een inrichtings- en beheerplan ten grondslag waarin in ieder geval wordt beschreven: a. de uitgangssituatie van het terrein waarop de nieuwe natuur wordt gerealiseerd; b. de te treffen inrichtingsmaatregelen; c. de motivering van de te treffen maatregelen; d. de met de maatregelen beoogde eindsituatie van het terrein, waarbij de beoogde natuur- en landschapsbeheertypen en de oppervlaktes daarvan worden aangegeven; en e. de wijze waarop na de inrichting de verdere ontwikkeling, het beheer en de instandhouding van de beoogde beheertypen plaatsvindt. 2. Bij de keuze van de beoogde natuur- en landschapsbeheertypen in het inrichtings- en beheerplan wordt het Natuurbeheerplan in acht genomen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.1__subsec_6.1.3__art_6.11
- number: '6.12'
  text: Artikel 6.12
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.1__subsec_6.1.3__art_6.12
- number: '6.13'
  text: 1. Een omgevingsplan dat betrekking heeft op locaties binnen de Waardevolle Houtopstanden - oude bosgroeiplaatsen bevat regels die strekken tot bescherming en instandhouding van op de locatie van die oude bosgroeiplaats aanwezige waarden. 2. De motivering van een omgevingsplan bevat een beschrijving van de op de oude bosgroeiplaats aanwezige waarden én een beschrijving van de wijze waarop in het plan met deze waarden rekening is gehouden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_6__subchp_6.2__subsec_6.2.1__art_6.13
