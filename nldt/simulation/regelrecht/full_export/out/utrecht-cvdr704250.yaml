  text: 'De regels in deze paragraaf zijn gericht op het bereiken en behouden van: a. een 24-uursgemiddeld geluidniveau LAeq,24h van maximaal 40 dB(A) in het Gebied stille kern ; en b. een 24-uursgemiddeld geluidniveau LAeq,24h van bij voorkeur 40 dB(A) maar maximaal 45 dB(A) in de Bufferzone stiltegebied .'
