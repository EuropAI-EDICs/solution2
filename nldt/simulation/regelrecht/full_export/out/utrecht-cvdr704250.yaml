- number: '8.4'
  text: '1. Een omgevingsplan bevat geen regels die voorzien in: a. de vestiging van een geitenhouderij of uitbreiding van een bestaande geitenhouderij; b. de gehele of gedeeltelijke omschakeling van een agrarisch bedrijf naar een geitenhouderij; c. uitbreiding van het aantal geiten dat wordt gehouden; d. het vergroten van de oppervlakte van een dierenverblijf voor geiten, tenzij het aantal vergunde of gemelde geiten aantoonbaar niet toeneemt; en e. het tijdelijk gebruik van bouwwerken en gronden voor een geitenhouderij. 2. Een omgevingsplan kan regels bevatten die activiteiten, bedoeld in het eerste lid, toestaan, voor activiteiten waarvoor: a. geen meldplicht is opgenomen op grond van het Besluit activiteiten leefomgeving; b. voor 11 juli 2018 een op dat moment ontvankelijke melding voor die activiteit is gedaan; c. voor 11 juli 2018 een op dat moment ontvankelijke aanvraag voor een vergunning voor die activiteit bij het bevoegd gezag is ingediend, uitgezonderd een aanvraag voor een vergunning
    voor het slopen van een bouwwerk in een krachtens een zodanige verordening aangewezen stads- of dorpsgezicht.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_8__subchp_8.1__art_8.4
