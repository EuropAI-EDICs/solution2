- number: '4.1'
  text: '1. Een omgevingsplan waarin nieuwe ontwikkelingen zijn voorzien, bevat regels die waarborgen dat knelpunten in de bereikbaarheid niet toenemen en bij voorkeur afnemen. 2. De motivering van een omgevingsplan bevat: a. een beschrijving van het aantal verplaatsingen die deze nieuwe ontwikkelingen tot gevolg hebben; b. een beschrijving van de wijze waarop het plangebied wordt ontsloten voor de verschillende vervoerwijzen; c. een analyse of er door het aantal verplaatsingen knelpunten op het omliggende (regionale) verkeers- en vervoersnetwerk voor de diverse vervoerwijzen kunnen ontstaan; en d. een analyse of de bereikbaarheid door de beoogde ontwikkelingen verslechtert en of de reistijd significant toeneemt. 3. Als uit de Bereikbaarheidsscan blijkt dat er mogelijk sprake is van verslechtering van de bereikbaarheid of toename van knelpunten op het omliggende verkeers- en vervoernetwerk, wordt een bereikbaarheidsonderzoek als bedoeld in de Bijlage XIV Bereikbaarheidsanalyse uitgevoerd.
    Binnen dit bereikbaarheidsonderzoek worden mogelijke oplossingen voor de geconstateerde knelpunten uitgewerkt, waarbij ook realisatie en financiering van deze maatregelen aan bod komen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.1__art_4.1
- number: '4.2'
  text: 1. Een omgevingsplan waarin nieuwe ontwikkelingen zijn voorzien, bevat regels die het belang van de ongewijzigde instandhouding, het ongewijzigde gebruik en de mogelijkheid tot uitbreiding van het provinciaal OV-netwerk in het Gebied provinciaal OV-netwerk waarborgen. 2. De motivering van een omgevingsplan bevat een beschrijving van de wijze waarop het belang van de ongewijzigde instandhouding en mogelijkheid tot uitbreiding van het provinciaal OV-netwerk in acht is genomen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.1__art_4.2
- number: '4.3'
  text: 1. Een omgevingsplan waarin nieuwe ontwikkelingen zijn voorzien, bevat regels die het belang van de ongewijzigde instandhouding, het ongewijzigde gebruik en de mogelijkheid tot uitbreiding van het provinciaal bereikbaarheidsnetwerk in het Gebied provinciaal bereikbaarheidsnetwerk waarborgen. 2. De motivering van een omgevingsplan bevat een beschrijving van de wijze waarop met het belang van de ongewijzigde instandhouding en mogelijkheid tot uitbreiding van het provinciaal bereikbaarheidsnetwerk is gewaarborgd.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.1__art_4.3
- number: '4.4'
  text: 1. Een omgevingsplan waarin nieuwe ontwikkelingen zijn voorzien, bevat regels die het belang van de ongewijzigde instandhouding, het ongewijzigde gebruik en de mogelijkheid tot uitbreiding van het regionale fietsnetwerk in het Gebied regionaal fietsnetwerk waarborgen. 2. De motivering van een omgevingsplan bevat een beschrijving van de wijze waarop met het belang van de ongewijzigde instandhouding en mogelijkheid tot uitbreiding van het regionale fietsnetwerk is gewaarborgd.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.1__art_4.4
- number: '4.5'
  text: '1. De regels in deze afdeling zijn gesteld met het oog op het behoeden van de staat en een doelmatige en veilige werking van een provinciale weg voor nadelige gevolgen van activiteiten op of rond die weg, waartoe ook het belang van verruiming of wijziging van die weg behoort. 2. Taken en bevoegdheden op grond van deze afdeling kunnen ook worden uitgeoefend met het oog op de volgende belangen in het gebied waar de provinciale weg is gelegen: a. het beschermen van landschappelijke en aardkundige waarden ; b. het beschermen van ecologische waarden en natuur; c. het beschermen van cultuurhistorische en archeologische waarden; en d. het beschermen van recreatieve en toeristische belangen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.1__art_4.5
- number: '4.6'
  text: 'Een provinciale weg bestaat uit: a. het Beperkingengebied bouwwerken provinciale weg ; b. het Beperkingengebied vrij zicht provinciale weg ; en c. het Beperkingengebied beheer provinciale weg .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.1__art_4.6
- number: '4.7'
  text: 1. Een omgevingsplan dat betrekking heeft op locaties binnen het Beperkingengebied bouwwerken provinciale weg kan regels bevatten die voorzien in het realiseren of wijzigen van bouwwerken, mits rekening wordt gehouden met het belang van de ongewijzigde instandhouding en de mogelijkheid uitbreiding van de provinciale weg . 2. De motivering van een omgevingsplan bevat een beschrijving van de wijze waarop rekening is gehouden met de ongewijzigde instandhouding en de mogelijkheid tot uitbreiding van de provinciale weg .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.2__art_4.7
  machine_readable:
    endpoint: art_4_7
    competent_authority:
      name: Bevoegd gezag
      type: CATEGORY
    execution:
      produces:
        legal_character: TOETS
      parameters: []
      input:
      - name: in_beperkingengebied_bouwwerken_provinciale_weg
        type: boolean
        description: 'Geo-feit: locatie binnen zone beperkingengebied_bouwwerken_provinciale_weg'
        source:
          description: Buiten wet-YAML; GIO/zone-engine. joinId=
      output:
      - name: result_4_7
        type: boolean
        description: Uitkomst artikel 4.7
      actions:
      - output: result_4_7
        value:
          operation: EQUALS
          subject: $in_beperkingengebied_bouwwerken_provinciale_weg
          value: true
- number: '4.8'
  text: 1. Deze paragraaf is van toepassing op activiteiten in het Beperkingengebied vrij zicht provinciale weg en het Beperkingengebied beheer provinciale weg die nadelig zijn voor de belangen, bedoeld in Artikel 4.5 . 2. Paragraaf 4.2.3 geldt niet voor activiteiten die worden verricht door of namens de wegbeheerder in het kader van de aanleg, de wijziging of het beheer van een weg of de regeling van het verkeer over die weg.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.1__art_4.8
- number: '4.9'
  text: '1. Degene die een activiteit in het Beperkingengebied vrij zicht provinciale weg uitvoert en weet of redelijkerwijs kan vermoeden dat die activiteit nadelige gevolgen kan hebben voor de belangen in Artikel 4.5 , is verplicht: a. alle maatregelen te nemen die redelijkerwijs van diegene kunnen worden gevraagd om die gevolgen te voorkomen; b. voor zover die gevolgen niet kunnen worden voorkomen, die gevolgen zoveel mogelijk te beperken of ongedaan te maken; en c. als die gevolgen onvoldoende kunnen worden beperkt, die activiteit achterwege te laten voor zover dat redelijkerwijs van diegene kan worden gevraagd. 2. Deze plicht houdt in ieder geval in dat: a. het veilig en doelmatig gebruik en de instandhouding van wegen wordt verzekerd; b. het gebruik van de weg, in overeenstemming met haar functie als openbare weg, wordt verzekerd; c. het vrije zicht niet wordt beperkt; d. werkzaamheden op een zodanige wijze worden uitgevoerd dat hieruit geen schade voor de weg kan ontstaan; e. geen
    vaste stoffen of voorwerpen worden gedeponeerd, anders dan bij werkzaamheden ten behoeve van kabels en leidingen; f. het Beperkingengebied beheer provinciale weg niet wordt verontreinigd met hinderlijke of schadelijke vaste stoffen, hinderlijke of schadelijke vloeistoffen, en hinderlijke of schadelijke voorwerpen of met beplantingsresten; g. beplanting in een zodanige conditie wordt gehouden dat zij geen gevaar of hinder vormt voor de weggebruikers en geen schade veroorzaakt aan de weg; h. borden, spandoeken, vlaggenmasten, handelsreclame en licht- of geluidgevende voorzieningen op een zodanige plaats of wijze worden aangebracht dat de veiligheid van het verkeer niet in gevaar wordt gebracht; i. bermsloten in het Beperkingengebied beheer provinciale weg alleen worden gedempt, afgedamd of de afvoercapaciteit daarvan gewijzigd door of namens de wegbeheerder; j. aanleg of wijziging van de provinciale weg alleen geschiedt door of namens de wegbeheerder; en k. alle passende maatregelen worden
    genomen om ongewone voorvallen en de nadelige gevolgen daarvan , bedoeld in artikel 19.1 van de wet , te voorkomen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.1__art_4.9
- number: '4.10'
  text: 'In aanvulling op de indieningsvereisten in de wet worden bij een aanvraag om een omgevingsvergunning voor een activiteit op grond van deze paragraaf , minimaal de volgende gegevens en bescheiden verstrekt: a. de kilometrering en het wegnummer van de locatie waar de activiteit plaatsvindt op tekening; b. de datum en het tijdstip waarop de activiteit wordt begonnen; en c. de duur van de activiteit.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.1__art_4.10
- number: '4.11'
  text: 1. Met het oog op het belang van aanleg, verruiming of wijziging van een provinciale weg worden bouwwerken, werken die geen bouwwerken zijn of andere objecten, waarvoor geen omgevingsvergunning op grond van deze paragraaf is vereist, verplaatst of verlegd als die een belemmering vormen voor de voorbereiding of uitvoering van de aanleg, verruiming of wijziging van die weg door of namens de wegbeheerder. 2. Als, ondanks een redelijke poging daartoe, met de rechthebbende op het bouwwerk, het werk dat geen bouwwerk is of het andere object geen schriftelijke overeenstemming is bereikt over de termijn waarop dat bouwwerk, werk of object wordt verplaatst of verlegd, stelt het bevoegd gezag die termijn bij maatwerkvoorschrift vast.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.1__art_4.11
- number: '4.12'
  text: 1. Met het oog op een veilig en doelmatig gebruik van de weg steekt beplanting boven het Beperkingengebied beheer provinciale weg niet lager dan 4,50 meter boven de verkeersbanen en fietspaden uit en niet lager dan 3 meter boven voetpaden uit. 2. In aanvulling op Artikel 1.5 geldt het eerste lid ook voor de rechthebbenden op de beplanting.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.1__art_4.12
- number: '4.13'
  text: 1. Gedeputeerde staten kunnen maatwerkvoorschriften stellen of een vergunningvoorschrift aan de omgevingsvergunning verbinden voor de activiteiten genoemd in Paragraaf 4.2.3 . 2. Met een maatwerkvoorschrift of een vergunningvoorschrift kan worden afgeweken van het bepaalde in Paragraaf 4.2.3 . 3. Een maatwerkvoorschrift wordt niet gesteld als over dat onderwerp een voorschrift aan een omgevingsvergunning bedoeld in Paragraaf 4.2.3 kan worden verbonden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.1__art_4.13
- number: '4.14'
  text: '1. Het is verboden zonder omgevingsvergunning in het Beperkingengebied beheer provinciale weg de volgende activiteiten uit te voeren: a. het hebben of maken van een uitweg naar de provinciale weg ; b. het maken van wijzigingen aan een bestaande uitweg naar de provinciale weg; c. het veranderen van het gebruik van een bestaande uitweg naar de provinciale weg van particulier naar bedrijfsmatig gebruik; en d. het intensiveren van het gebruik van een bedrijfsmatige uitweg. 2. Het eerste lid is niet van toepassing op verkooppunten bedoeld in Artikel 4.35 .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.2__art_4.14
- number: '4.15'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een uitweg bij een provinciale weg in het Beperkingengebied beheer provinciale weg , wordt de omgevingsvergunning in ieder geval geweigerd als: a. de uitweg bij een perceelsplitsing voor het nieuwe perceel wordt aangesloten op de provinciale hoofdrijbaan als er sprake is van een gebiedsontsluitingsweg; b. de uitweg kan worden aangesloten op een parallelweg of op een weg van een gemeente, een waterschap of op een andere weg van lagere orde; c. de aanvraag betrekking heeft op een tweede uitweg van het perceel, tenzij een tweede uitweg in het belang van de verkeersveiligheid noodzakelijk is; d. de uitweg wordt aangesloten op een stroomweg; e. de uitweg wordt aangelegd op minder dan 50 meter van bochten, kruispunten, splitsingen, rotondes of verkeersregelinstallaties; of f. de verkeersveiligheid door de verkeersaantrekkende werking van het gebruik van het te ontsluiten perceel onevenredig wordt aangetast.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.2__art_4.15
- number: '4.16'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een tijdelijke uitweg bij een provinciale weg in het Beperkingengebied beheer provinciale weg , wordt de omgevingsvergunning, aanvullend op Artikel 4.15 , in ieder geval geweigerd als: a. de uitweg niet noodzakelijk is voor het uitvoeren van werkzaamheden van tijdelijke aard; of b. het werkverkeer kan worden ontsloten via een bestaande uitweg.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.2__art_4.16
- number: '4.17'
  text: In aanvulling op de indieningsvereisten in Artikel 4.10 wordt bij een aanvraag om een omgevingsvergunning voor een uitweg bij een provinciale weg, bedoeld in Artikel 4.14 , in ieder geval aangegeven of er obstakels zijn die voor de beoogde aanleg of wijziging van de uitweg verwijderd moeten worden.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.2__art_4.17
- number: '4.18'
  text: 'Uit oogpunt van verkeersveiligheid, doorstroming en een uniforme inrichting van de provinciale weg bepalen gedeputeerde staten in de voorschriften van een omgevingsvergunning voor een uitweg dat: a. de aanleg en het onderhoud van de uitweg in het Beperkingengebied beheer provinciale weg door of in opdracht van de provincie wordt uitgevoerd; en b. een financiële vergoeding verschuldigd is voor het onder a. genoemde aanleg en onderhoud.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.2__art_4.18
- number: '4.19'
  text: Het is verboden zonder omgevingsvergunning in het Beperkingengebied beheer provinciale weg kabels, leidingen, duikers, goten, buizen, afrasteringen en andere werken te hebben, op te richten, aan te leggen, te wijzigen of te verwijderen, tenzij een meldplicht geldt, tenzij de meldplicht uit Artikel 4.23 van toepassing is.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.3__art_4.19
- number: '4.20'
  text: Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op kabels, leidingen, lasgaten, huisaansluitingen, duikers, goten, buizen, afrasteringen of andere werken in het Beperkingengebied beheer provinciale weg , wordt de omgevingsvergunning in ieder geval geweigerd als er een aanmerkelijke kans bestaat op schade of aantasting van het veilig en doelmatig gebruik van een weg.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.3__art_4.20
- number: '4.21'
  text: 'In aanvulling op het bepaalde in Artikel 1.9 kan een omgevingsvergunning voor kabels of leidingen worden gewijzigd of ingetrokken als: a. een kabel of leiding of een deel daarvan, moet worden verlegd als gevolg van werkzaamheden van de provincie of derden, en er geen ruimte is om de kabel of leiding te laten liggen of terug te plaatsen; b. de vergunninghouder niet voldoet aan het verzoek tot het nemen van maatregelen of het doen van aanpassingen, die nodig zijn voor de realisering van provinciale infrastructurele maatregelen of voor de uitvoering van beheer en onderhoud.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.3__art_4.21
- number: '4.22'
  text: 'In aanvulling op de indieningsvereisten in Artikel 4.10 worden bij een aanvraag om een omgevingsvergunning voor het bouwen, aanleggen, plaatsen, in stand houden, slopen of verwijderen van kabels en leidingen, bedoeld in Artikel 4.19 , minimaal de volgende gegevens en bescheiden verstrekt: a. voor het aanleggen of plaatsen van een kabel of leiding: 1. een beschrijving van de soort kabel of leiding; 2. een beschrijving van de wijze van aanleg van de kabel of leiding; 3. de kilometrering, het wegnummer en de ligging van de kabel of leiding op tekening; 4. als een gestuurde boring wordt gebruikt: een boorplan; 5. als wordt geboord bij de fundering van een viaduct: een beschrijving van de invloed van de boring op de fundering; b. voor het in stand houden van een kabel of leiding: 1. een beschrijving van de werkzaamheden aan de kabel of leiding; 2. de kilometrering en de ligging van de kabel of leiding en van objecten die daarmee samenhangen op tekening; en c. voor het slopen of verwijderen
    van een kabel of leiding: 1. een beschrijving van de wijze van verwijderen; 2. de kilometrering en de ligging van de kabel of leiding en van objecten die daarmee samenhangen op tekening.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.3__art_4.22
- number: '4.23'
  text: 1. Het is verboden zonder melding in het Beperkingengebied beheer provinciale weg lasgaten en huisaansluitingen voor de watervoorziening, de energievoorziening of de telecommunicatie te hebben, op te richten, aan te leggen, te wijzigen of te verwijderen als daarvoor geen verhardingen van de weg worden opgebroken of gekruist. 2. Minimaal 4 weken en maximaal 6 maanden voordat het lasgat of de huisaansluiting aangelegd, gewijzigd of verwijderd wordt, wordt de melding ingediend. 3. Minimaal 4 weken voordat het lasgat of de huisaansluiting op een andere manier aangelegd, gewijzigd of verwijderd wordt dan eerder gemeld, wordt een nieuwe melding ingediend. 4. De melding met alle daarbij behorende stukken zijn tijdens de werkzaamheden op het werk aanwezig. Op verzoek van het bevoegd gezag wordt deze melding onmiddellijk getoond. 5. De activiteit bedoeld in het eerste lid wordt uitgevoerd met in achtneming van de regels van Bijlage VIII Eisen kabels en leidingen .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.3__art_4.23
- number: '4.24'
  text: '1. Het is verboden zonder melding in het Beperkingengebied beheer provinciale weg kabels en leidingen in de zin van de Telecommunicatiewet of laag- en middenspanning elektriciteitskabels te hebben, op te richten, aan te leggen, te wijzigen of te verwijderen als daarvoor geen verhardingen van de weg worden opgebroken of gekruist, met inbegrip van: a. het bouwen, in stand houden en slopen van bouwwerken die daarmee samenhangen; en b. het aanleggen, plaatsen, in stand houden en verwijderen van werken die geen bouwwerken zijn, die daarmee samenhangen. 2. Minimaal 4 weken en maximaal 6 maanden voordat de telecom-, laagspanning-, middenspanning of elektriciteitskabel of -leiding aangelegd, gewijzigd of verwijderd wordt, wordt de melding ingediend. 3. Minimaal 4 weken voordat de telecom-, laagspanning-, of middenspanning-elektriciteitskabel of -leiding op een andere manier aangelegd, gewijzigd of verwijderd wordt dan eerder gemeld, wordt een nieuwe melding ingediend. 4. De melding met
    alle daarbij behorende stukken zijn tijdens de werkzaamheden op het werk aanwezig. Op verzoek van het bevoegd gezag wordt deze melding onmiddellijk getoond. 5. De activiteit bedoeld in het eerste lid wordt uitgevoerd met in achtneming van de regels van Bijlage VIII Eisen kabels en leidingen .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.3__art_4.24
- number: '4.25'
  text: 1. Het is verboden zonder melding in het Beperkingengebied beheer provinciale weg een gedenkteken naar aanleiding van een dodelijk ongeval te plaatsen. 2. Het gedenkteken naar aanleiding van een dodelijk ongeval wordt onder voorwaarden door de provincie ter beschikking gesteld en wordt alleen in overleg met de directe nabestaanden geplaatst.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.3__art_4.25
- number: '4.26'
  text: In aanvulling op de indieningsvereisten in Artikel 1.12 wordt ten behoeve van een melding voor een lasgat of huisaansluiting, bedoeld in Artikel 4.23 , minimaal een tekening met wegnummer en kilometrering van de beoogde ligging van de lasgaten en huisaansluitingen verstrekt.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.3__art_4.26
- number: '4.27'
  text: 'In aanvulling op de indieningsvereisten in Artikel 1.12 worden bij een melding ten behoeve van een telecom-, laagspanning-, middenspanning of elektriciteitskabel of -leiding, bedoeld in Artikel 4.24 , minimaal de volgende gegevens en bescheiden verstrekt: a. voor het aanleggen of plaatsen van een kabel of leiding: 1. een beschrijving van de soort kabel of leiding; 2. een beschrijving van de wijze van aanleg van de kabel of leiding; 3. de kilometrering, het wegnummer en de ligging van de kabel of leiding op tekening; b. voor het in stand houden van een kabel of leiding: 1. een beschrijving van de werkzaamheden aan de kabel of leiding; 2. de kilometrering en de ligging van de kabel of leiding en van objecten die daarmee samenhangen op tekening; en c. voor het slopen of verwijderen van een kabel of leiding: 1. een beschrijving van de wijze van verwijderen; 2. de kilometrering en de ligging van de kabel of leiding en van objecten die daarmee samenhangen op tekening.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.3__art_4.27
- number: '4.28'
  text: Artikel 4.28 Indieningsvereisten melding gedenkteken
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.3__art_4.28
- number: '4.29'
  text: Het is verboden zonder omgevingsvergunning in het Beperkingengebied beheer provinciale weg bord en, spandoek en, vlaggenmasten, handelsreclame, kunstuiting en, licht- of geluidgevende voorzieningen of vergelijkbare objecten te hebben, plaatsen of wijzigen, tenzij een meldplicht geldt.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.4__art_4.29
- number: 4.29a
  text: Het verbod in Artikel 4.29 geldt niet voor verkeerstekens en onderborden bedoeld in artikel 14 van de Wegenverkeerswet 1994.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.4__art_4.29a
- number: '4.30'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op borden of vergelijkbare objecten in het Beperkingengebied beheer provinciale weg , wordt de omgevingsvergunning in ieder geval geweigerd als: a. niet voldaan wordt aan Artikel 4.9 , tweede lid, sub h; b. er sprake is van commerciële aanduidingen; c. het object in zichthoeken komt te staan; d. het object botsgevaarlijk is; of e. het object bevestigd wordt aan wegmeubilair.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.4__art_4.30
- number: '4.31'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op borden of vergelijkbare objecten voor de aanduiding van objecten en terreinen, al dan niet met een toeristisch karakter, in het Beperkingengebied beheer provinciale weg , wordt, aanvullend op Artikel 4.30 , de omgevingsvergunning in ieder geval geweigerd als: a. er op basis van de algemene geografische bewegwijzering kan worden gereden naar een geografische bestemming waar het terrein of object is gelegen of waarmee het terrein of object wordt geassocieerd; of b. hiermee geen verkeersveilige afwikkeling en geen ongehinderde doorstroming van het verkeer bevorderd wordt.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.4__art_4.31
- number: '4.32'
  text: 'In aanvulling op de indieningsvereisten in Artikel 4.10 worden bij een aanvraag om een omgevingsvergunning voor een bord of vergelijkbaar object, bedoeld in Artikel 4.29 , minimaal de volgende gegevens en bescheiden verstrekt: a. de kilometrering en het wegnummer van de locatie waar de borden of vergelijkbare objecten worden geplaatst op tekening; b. de datum en het tijdstip waarop met de plaatsing wordt begonnen; en c. de duur van de periode waarin de borden aanwezig zijn.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.4__art_4.32
- number: '4.33'
  text: 1. Het is verboden zonder melding in het Beperkingengebied beheer provinciale weg borden, spandoeken, vlaggenmasten, handelsreclame, kunstuiting en, licht- of geluidgevende voorzieningen of vergelijkbare objecten te hebben, plaatsen of wijzigen buiten het Gebied landschappelijke waarden . 2. De in het eerste lid genoemde objecten moeten voldoen aan het bepaalde in Artikel 4.30 . 3. Minimaal 2 weken voordat het bord of vergelijkbaar object geplaatst of gewijzigd wordt, wordt de melding ingediend.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.4__art_4.33
- number: '4.34'
  text: 'Bij een melding voor een bord of vergelijkbaar object, bedoeld in Artikel 4.33 , worden minimaal de volgende gegevens en bescheiden verstrekt: a. de kilometrering en het wegnummer van de locatie waar de borden of vergelijkbare objecten worden geplaatst op tekening; b. de datum en het tijdstip waarop met de plaatsing wordt begonnen; en c. de duur van de periode waarin de borden aanwezig zijn.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.4__art_4.34
- number: '4.35'
  text: 'Het is verboden zonder omgevingsvergunning in het Beperkingengebied beheer provinciale weg de volgende activiteiten uit te voeren: a. een standplaats voor handel of bedrijf in te nemen en te hebben; of b. een verkooppunt voor het leveren van energie aan voertuigen of andere goederen in te richten en te hebben.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.5__art_4.35
- number: '4.36'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een standplaats of verkooppunt in het Beperkingengebied beheer provinciale weg , wordt de omgevingsvergunning in ieder geval geweigerd als: a. er een aanmerkelijke kans bestaat op overlast, hinder of onveiligheid voor het verkeer en de omgeving; of b. toestemming van de desbetreffende gemeente ontbreekt.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.5__art_4.36
- number: '4.37'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een standplaats of verkooppunt op een carpoolplaats in het Beperkingengebied beheer provinciale weg , wordt de omgevingsvergunning, aanvullend op Artikel 4.36 , in ieder geval geweigerd als: a. op de carpoolplaats op hetzelfde tijdstip al een standplaats of verkoopplaats van de betreffende productgroep vergund is; of b. onvoldoende parkeerruimte overblijft.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.5__art_4.37
- number: '4.38'
  text: 'In aanvulling op de indieningsvereisten in Artikel 4.10 worden bij een aanvraag om een omgevingsvergunning voor een standplaats of verkooppunt, bedoeld in Artikel 4.35 , minimaal de volgende gegevens en bescheiden verstrekt: a. omschrijving van de aanleiding, doelstelling en doelgroep van de standplaats of verkooppunt; b. de wijze waarop invulling wordt gegeven aan een duurzame opzet van de standplaats of verkooppunt; c. de wijze waarop het terrein zal worden schoongehouden; d. de wijze waarop zorg wordt gedragen voor toezicht en sociale veiligheid; e. de vereiste diploma''s voor en de opgedane ervaring met het exploiteren van een standplaats of verkooppunt; f. indien van toepassing: de wijze waarop een energievoorziening wordt gerealiseerd; en g. indien van toepassing: de wijze waarop de standplaats of verkooppunt wordt gepromoot.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.5__art_4.38
- number: '4.39'
  text: Het is verboden zonder omgevingsvergunning in het Beperkingengebied beheer provinciale weg een evenement te houden waarbij de doorstroming van het verkeer wordt belemmerd of de verkeersveiligheid op de provinciale weg in gevaar wordt gebracht.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.6__art_4.39
- number: '4.40'
  text: '1. Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op een evenement in het Beperkingengebied beheer provinciale weg , wordt de omgevingsvergunning in ieder geval geweigerd als: a. een evenement onaanvaardbare verstoring van of schade aan natuur en landschap tot gevolg zou hebben; b. de route van een evenement binnen het natuurnetwerk Nederland ligt; c. de bereikbaarheid van het verkeer, waaronder het openbaar vervoer en hulpdiensten, en de verkeersveiligheid onvoldoende geborgd zijn; of d. de politie of hulpdiensten negatief adviseren over de gevolgen van het evenement voor het gebruik van en de veiligheid op de provinciale weg . 2. Als voor dezelfde datum meerdere evenementen aangevraagd worden die gelijktijdig plaatsvinden en die in verband met situering, schaalgrootte en verkeersaantrekkende werking niet gelijktijdig kunnen plaatsvinden geldt de volgende rangorde: a. internationale evenementen; b. nationale evenementen; c. regionale evenementen; d. lokale
    evenementen'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.6__art_4.40
- number: '4.41'
  text: 'In aanvulling op de indieningsvereisten in Artikel 4.10 worden bij een aanvraag om een omgevingsvergunning voor een evenement, bedoeld in Artikel 4.39 , minimaal de volgende gegevens en bescheiden verstrekt: a. naam en Kamer van Koophandel inschrijving van de vereniging die het evenement organiseert; b. een kopie van de verzekeringspolis waaruit blijkt dat de organisatie verzekerd is tegen de wettelijke aansprakelijkheid voor schade, die uit (het organiseren van) het evenement kan voortvloeien; c. de doelgroep van het evenement; d. het verwachte aantal deelnemers; e. het verwachte aantal bezoekers; f. een indicatie van vanwaar de bezoekers afkomstig zijn (plaatselijk, regionaal, landelijk of internationaal); g. het aantal volgauto''s indien van toepassing; h. een verkeersplan met de te treffen verkeersmaatregelen conform de CROW-publicatie/richtlijn 96b : 1. de benodigde afsluitingen van wegen; 2. de benodigde en geregelde parkeergelegenheid; 3. de benodigde en geregelde fietsenstallingen;
    4. de benodigde omleidingen van het openbaar vervoer en het overige verkeer indien van toepassing; 5. de benodigde verkeersregelaars; en 6. de beoogde locaties voor verkeersregelaars; i. de organisatie die de verkeersmaatregelen uitvoert; j. het aantal, de soort en de plaats waar objecten zoals podia, kramen en tenten worden geplaatst; k. een topografische kaart waarop de plaats van het evenement is aangegeven of waarop de gehele route van het evenement is aangegeven, inclusief rijrichting en eventuele controleposten; l. een routebeschrijving met tijdschema, waarin alle wegen die binnen de provincie bereden worden staan vermeld, evenals de gemeenten waarbinnen ze gelegen zijn, indien van toepassing. Bij provincie overschrijdende evenementen moeten ook de wegen in de andere provincie(s) vermeld worden; m. een verklaring waaruit blijkt dat de betrokken gemeentelijke overheid bereid is medewerking te verlenen aan het te houden evenement , als een dergelijke verklaring vanuit de betrokken
    gemeentelijke overheid noodzakelijk is; n. een verklaring waaruit blijkt dat er overeenstemming is met betrokken wegbeheerders over de eventuele omleidingsroutes; o. een verklaring van de beheerder(s) van in de route opgenomen onverharde weggedeelten of eigen wegen, dat tegen het berijden daarvan geen bezwaren bestaan, dan wel een verklaring van de organisatie dat bedoelde verklaring van geen bedenkingen mondeling is verkregen; en p. de wijze waarop de belangen van aanwonenden zijn meegenomen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.6__art_4.41
- number: '4.42'
  text: 1. Het is verboden zonder melding in het Beperkingengebied beheer provinciale weg tijdelijke verwijsborden kort voor en tijdens een evenement te plaatsen. 2. Tijdelijke verwijsborden moeten voldoen aan het bepaalde in Artikel 4.30 . 3. Minimaal 2 weken voordat het tijdelijke verwijsbord geplaatst wordt, wordt de melding ingediend.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.6__art_4.42
- number: '4.43'
  text: 'Bij een melding voor een tijdelijk verwijsbord voor een evenement, bedoeld in Artikel 4.42 , worden minimaal de volgende gegevens en bescheiden verstrekt: a. de kilometrering en het wegnummer van de locatie waar de borden of vergelijkbare objecten worden geplaatst op tekening; b. de datum en het tijdstip waarop met de plaatsing wordt begonnen; en c. de duur van de periode waarin de borden aanwezig zijn.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.6__art_4.43
- number: '4.44'
  text: 1. Met het oog op een veilig en doelmatig gebruik van de weg zijn tijdelijke verwijsborden uitsluitend maximaal 24 uur vóór en tijdens een evenement aanwezig. 2. De borden zijn niet groter dan 1 meter bij 1 meter. 3. De borden worden binnen 24 uur na afloop van het evenement verwijderd. 4. Er worden niet meer dan 2 borden bij elkaar op een locatie aangebracht. 5. De borden worden geplaatst in de onverharde buitenberm op een afstand van minimaal 2,5 meter uit de kant van de verharding.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.2__subsec_4.2.3__subsec_4.2.3.6__art_4.44
- number: '4.45'
  text: Deze afdeling is van toepassing op het Beperkingengebied lokale spoorweg en bevat regels met het oog op het ongewijzigd in stand houden van de aanwezige infrastructuur en werking daarvan alsmede voor nadelige gevolgen van activiteiten op of rond die spoorweg, waartoe ook het belang van verruiming of wijziging van die spoorweg behoort.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.3__subsec_4.3.1__art_4.45
- number: '4.46'
  text: 'Het Beperkingengebied lokale spoorweg bestaat uit: a. de Kernzone lokale spoorweg ; en b. de Beschermingszone lokale spoorweg .'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_4__subchp_4.3__subsec_4.3.1__art_4.46
- number: '4.47'
  text: 1. Een omgevingsplan dat betrekking heeft op locaties binnen het Beperkingengebied lokale spoorweg kan regels bevatten die voorzien in het realiseren of wijzigen van bouwwerken, mits rekening wordt gehouden met het belang van de ongewijzigde instandhouding en uitbreiding van de lokale spoorweg. 2. De motivering van een omgevingsplan bevat een beschrijving van de wijze waarop rekening is gehouden met de ongewijzigde instandhouding en mogelijkheid tot uitbreiding van de lokale spoorweg.
