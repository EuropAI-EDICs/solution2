- number: '9.7'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Landelijk gebied kan regels bevatten die toestaan dat in bebouwingsenclaves of bebouwingslinten verstedelijking plaatsvindt, mits is voldaan aan de volgende voorwaarden: a. gelijktijdig met de verstedelijking wordt de omgevingskwaliteit verhoogd; b. bebouwing vindt niet plaats buiten de bestaande bebouwingsenclaves of bebouwingslinten ; en c. belangen van bestaande omringende functies worden niet onevenredig aangetast. 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan. Een beeldkwaliteitsparagraaf maakt onderdeel uit van de onderbouwing.'
