- number: '3.8'
  text: Een omgevingsplan dat betrekking heeft op locaties binnen het Waterwingebied Bethunepolder bevat voor het parkeren van motorrijtuigen regels die het waterwinbelang beschermen en staat met name in drukke perioden van zomer- of winterrecreatie, uitsluitend parkeren toe op daartoe expliciet aangewezen locaties.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.2__art_3.8
- number: '3.9'
  text: 1. Een omgevingsplan dat betrekking heeft op locaties binnen een Waterwingebied of een Grondwaterbeschermingsgebied verbiedt het aanleggen van een nieuwe begraafplaats of uitstrooiveld, bedoeld in artikel 66a en artikel 66b van de Wet op de lijkbezorging, of een dierenbegraafplaats. 2. Een omgevingsplan dat betrekking heeft op locaties binnen een Waterwingebied of een Grondwaterbeschermingsgebied stelt, met betrekking tot het hebben of uitbreiden van een bestaande begraafplaats, uitstrooiveld, bedoeld in artikel 66a en artikel 66b van de Wet op de lijkbezorging, of dierenbegraafplaats, regels ter bescherming van de kwaliteit van het grondwater.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.2__art_3.9
