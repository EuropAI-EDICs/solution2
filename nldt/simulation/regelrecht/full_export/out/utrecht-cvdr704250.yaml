- number: '7.5'
  text: 'Ontheffing van Artikel 7.3 , eerste lid, kan alleen worden verleend als: a. er sprake is van dwingende redenen van groot openbaar belang; b. reële alternatieven die de Hollandse Waterlinies niet of minder aantasten ontbreken; c. de aantasting zoveel mogelijk wordt beperkt; en d. er op of nabij de locatie waarvoor ontheffing wordt gevraagd voldoende compenserende maatregelen worden genomen, in de vorm van versterking van de resterende uitzonderlijke universele waarde van de Hollandse Waterlinies.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.1__subsec_7.1.1__art_7.5
- number: 7.5a
  text: Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op het Gebied UNESCO Werelderfgoed Neder-Germaanse Limes (kernzone) wordt de omgevingsvergunning alleen verleend als door middel van archeologisch onderzoek is aangetoond dat de voorgenomen activiteit de uitzonderlijke universele waarde van de Neder-Germaanse Limes niet aantast.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.1__subsec_7.1.1__art_7.5a
- number: '7.6'
  text: 'Voor zover een aanvraag om een omgevingsvergunning betrekking heeft op het Gebied UNESCO Werelderfgoed Neder-Germaanse Limes (bufferzone) wordt de omgevingsvergunning alleen verleend: a. als door middel van archeologisch onderzoek is aangetoond dat de voorgenomen activiteit geen archeologische waarden van de Limes zal aantasten; of b. op voorwaarde dat de archeologische waarden van de Limes ex-situ, in de vorm van een opgraving, behouden blijven, wanneer in situ behoud niet mogelijk is.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.1__subsec_7.1.1__art_7.6
- number: '7.7'
  text: De regels in deze paragraaf zijn gesteld met het oog op het beschermen en benutten van de waarden van de Cultuurhistorische hoofdstructuur .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.1__subsec_7.1.2__art_7.7
- number: '7.8'
  text: '1. Het Gebied cultuurhistorische hoofdstructuur bestaat uit 5 gebieden: a. de Historische buitenplaatszone ; b. het Gebied militair erfgoed ; c. het Agrarisch cultuurlandschap ; d. de Historische infrastructuur ; en e. de Archeologisch waardevolle zone . 2. Deze 5 gebieden bestaan uit deelgebieden: a. de Historische buitenplaatszone bestaat uit de deelgebieden Stichtse Lustwarande, Langbroekerwetering, Vecht, Amersfoortseweg (Wegh der Weegen), Laagte van Pijnenburg, Valleilandgoederen, Amelisweerd, Kasteel de Haar, Landgoed Linschoten, Maarsbergse Flank en Prattenburg-Remmerstein; b. het Gebied militair erfgoed bestaat uit de deelgebieden Nieuwe Hollandse Waterlinie, Oude Hollandsche Waterlinie, Grebbelinie en Soesterberg en omgeving; c. het Agrarisch cultuurlandschap bestaat uit de deelgebieden Lopikerwaard, Kockengen-Kamerik-Zegveld, Westbroek, Linschoten, Ronde Venen, Soester Eng, Cope-ontginningscomplex Hei- en Boeicop e.o. en Zouweboezem; d. de Historische infrastructuur bestaat
    uit de deelgebieden Route Impériale, Via Regia en Wegh der Weegen; en e. de Archeologisch waardevolle zone bestaat uit de deelgebieden Utrechtse Heuvelrug, Limes en Dorestad.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.1__subsec_7.1.2__art_7.8
- number: '7.9'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied cultuurhistorische hoofdstructuur houdt rekening met de waarden van de Cultuurhistorische hoofdstructuur en bevat regels ter bescherming en benutting van deze waarden. 2. De waarden van de Cultuurhistorische hoofdstructuur zijn per gebied vastgelegd in de Bijlage XV Cultuurhistorie . 3. De motivering van een omgevingsplan bevat: a. een beschrijving van de in het plangebied aanwezige cultuurhistorische waarden; en b. een beschrijving van de wijze waarop rekening is gehouden met deze waarden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_7__subchp_7.1__subsec_7.1.2__art_7.9
  machine_readable:
    endpoint: art_7_9
    competent_authority:
      name: Bevoegd gezag
      type: CATEGORY
    execution:
      produces:
        legal_character: TOETS
