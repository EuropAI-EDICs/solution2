$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.7.1/schema.json
$id: omgevingsverordening_provincie_utrecht
name: Omgevingsverordening provincie Utrecht
regulatory_layer: PROVINCIALE_VERORDENING
publication_date: '2025-10-13'
valid_from: '2025-10-13'
cvdr_id: CVDR704250
officiele_titel: Omgevingsverordening provincie Utrecht
organisation: Provincie Utrecht
url: https://lokaleregelgeving.overheid.nl/CVDR704250
articles:
- number: '1.1'
  text: 1. Bijlage I Begripsbepalingen bevat begripsbepalingen voor de toepassing van deze verordening. 2. Bijlage II Overzicht informatieobjecten wijst de geometrische begrenzing van de gebieden aan voor de toepassing van deze verordening.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.1__art_1.1
- number: '1.2'
  text: Artikel 1.2 Meet- en rekenbepalingen
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.1__art_1.2
- number: '1.3'
  text: 'Regels in deze verordening worden gesteld met het oog op het: a. bereiken en in stand houden van een veilige en gezonde leefomgeving en een goede omgevingskwaliteit ; en b. doelmatig beheren, gebruiken en ontwikkelen van de fysieke leefomgeving ter vervulling van maatschappelijke functies.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.1__art_1.3
- number: '1.4'
  text: '1. In deze verordening en de daarop berustende bepalingen wordt onder een omgevingsplan mede verstaan: a. een projectbesluit; en b. een omgevingsvergunning voor een buitenplanse omgevingsplanactiviteit. 2. In deze verordening en de daarop berustende bepalingen wordt onder motivering van een omgevingsplan mede verstaan de toelichting op de besluiten, bedoeld in het eerste lid.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.1__art_1.4
- number: '1.5'
  text: Aan de regels over activiteiten in deze verordening wordt voldaan door degene die de activiteit uitvoert. Diegene draagt zorg voor de naleving van de regels over de activiteit.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.1__art_1.5
- number: '1.6'
  text: 1. Gedeputeerde staten kunnen op basis van een integrale afweging van provinciale belangen ontheffing verlenen van een instructieregel. 2. Gedeputeerde staten kunnen aan de ontheffing voorschriften verbinden als dit noodzakelijk is vanwege de betrokken provinciale belangen.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.1__art_1.6
- number: '1.7'
  text: '1. Om experimenten in een gebied of innovatieve ontwikkelingen een kans te geven, kunnen gedeputeerde staten ontheffing van instructieregels verlenen. 2. Een ontheffing van de instructieregels kan alleen worden verleend als: a. projecten die zijn gericht op verbetering van de kwaliteit van de fysieke leefomgeving niet kunnen worden gerealiseerd onder de geldende regelgeving; en b. nadat door een gemeente of waterschap en provincie een gezamenlijk kader en daarbij behorende werkwijze is vastgesteld; of c. er sprake is van nieuwe technologische ontwikkelingen.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.1__art_1.7
- number: '1.8'
  text: 1. Gedeputeerde staten kunnen op basis van een integrale afweging van provinciale belangen met een omgevingsvergunning afwijken van andere regels dan instructieregels, als dit nodig is voor het realiseren van een project of plan dat onevenredig wordt belemmerd door deze regels. 2. Gedeputeerde staten kunnen aan de omgevingsvergunning voorschriften verbinden als dit noodzakelijk is vanwege de betrokken provinciale belangen
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.1__art_1.8
- number: '1.9'
  text: 'Gedeputeerde staten kunnen een omgevingsvergunning op grond van deze verordening wijzigen of intrekken, als: a. in strijd met de omgevingsvergunning of de daaraan verbonden voorschriften wordt gehandeld; b. de omgevingsvergunning ten gevolge van een onjuiste of onvolledige gegevens is verleend; c. door verandering van wetgeving, gewijzigde omstandigheden of gewijzigde inzichten de bescherming van de belangen waarop deze verordening ziet, zwaarder wegen dan het belang van de betrokkene bij een ongewijzigde omgevingsvergunning; d. gedurende 2 jaar of een binnen de omgevingsvergunning langere genoemde termijn geen activiteiten zijn uitgevoerd met gebruikmaking van de omgevingsvergunning.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.1__art_1.9
- number: '1.10'
  text: 'Bij een aanvraag om een ontheffing van instructieregels worden in ieder geval de volgende gegevens en bescheiden verstrekt: a. de instructieregels waarvan ontheffing wordt aangevraagd; b. een onderbouwing van de aanvraag om ontheffing; en c. als de ontheffing wordt aangevraagd vanwege een aanvraag om een omgevingsvergunning voor een omgevingsplanactiviteit: deze aanvraag en de daarbij verstrekte gegevens en bescheiden.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.2__art_1.10
- number: '1.11'
  text: 'Bij een aanvraag tot toepassing van de hardheidsclausule worden in ieder geval de volgende gegevens en bescheiden verstrekt: a. als de toepassing van de hardheidsclausule wordt aangevraagd vanwege een aanvraag om een omgevingsvergunning voor een omgevingsplanactiviteit: deze aanvraag en de daarbij verstrekte gegevens en bescheiden; en b. een onderbouwing van de aanvraag tot toepassing.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.2__art_1.11
- number: '1.12'
  text: 'Een melding wordt ondertekend en bevat in ieder geval: a. de naam en het adres van degene die de activiteit uitvoert; b. het telefoonnummer en het e-mailadres van de indiener van de melding of van de gemachtigde; c. de aanduiding van de activiteit; d. het adres waarop de activiteit wordt uitgevoerd; en e. de dagtekening.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_1__subchp_1.2__art_1.12
- number: '2.1'
  text: De regels in deze afdeling zijn gesteld met het oog op het waarborgen van de veiligheid en het voorkomen of beperken van wateroverlast.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.1__art_2.1
- number: '2.2'
  text: '1. Voor het Dijktraject 1 op 10 geldt: a. als omgevingswaarde de gemiddelde overschrijdingskans waarop een dijktraject moet zijn berekend; b. de gemiddelde overschrijdingskans van 1 keer per 10 jaar van de hoogste waterstand waarop het dijktraject moet zijn berekend; c. deze omgevingswaarde is een resultaatsverplichting; en d. aan de omgevingswaarde wordt voldaan met ingang van 1 januari 2031. 2. Voor het Dijktraject 1 op 30 geldt: a. als omgevingswaarde de gemiddelde overschrijdingskans waarop een dijktraject moet zijn berekend; b. de gemiddelde overschrijdingskans van 1 keer per 30 jaar van de hoogste waterstand waarop het dijktraject moet zijn berekend; c. deze omgevingswaarde is een resultaatsverplichting; en d. aan de omgevingswaarde wordt voldaan met ingang van 1 januari 2031. 3. Voor het Dijktraject 1 op 100 geldt: a. als omgevingswaarde de gemiddelde overschrijdingskans waarop een dijktraject moet zijn berekend; b. de gemiddelde overschrijdingskans van 1 keer per 100 jaar
    van de hoogste waterstand waarop het dijktraject moet zijn berekend; c. deze omgevingswaarde is een resultaatsverplichting; en d. aan de omgevingswaarde wordt voldaan met ingang van 1 januari 2031. 4. Voor het Dijktraject 1 op 300 geldt: a. als omgevingswaarde de gemiddelde overschrijdingskans waarop een dijktraject moet zijn berekend; b. de gemiddelde overschrijdingskans van 1 keer per 300 jaar van de hoogste waterstand waarop het dijktraject moet zijn berekend; c. deze omgevingswaarde is een resultaatsverplichting; en d. aan de omgevingswaarde wordt voldaan met ingang van 1 januari 2031. 5. Voor het Dijktraject 1 op 1000 geldt: a. als omgevingswaarde de gemiddelde overschrijdingskans waarop een dijktraject moet zijn berekend; b. de gemiddelde overschrijdingskans van 1 keer per 1000 jaar van de hoogste waterstand waarop het dijktraject moet zijn berekend; c. deze omgevingswaarde is een resultaatsverplichting; en d. aan de omgevingswaarde wordt voldaan met ingang van 1 januari 2031.
    6. Voor het Dijktraject 1 op 1250 geldt: a. als omgevingswaarde de gemiddelde overschrijdingskans waarop een dijktraject moet zijn berekend; b. de gemiddelde overschrijdingskans van 1 keer per 1250 jaar van de hoogste waterstand waarop het dijktraject moet zijn berekend; c. deze omgevingswaarde is een resultaatsverplichting; en d. aan de omgevingswaarde wordt voldaan met ingang van 1 januari 2031.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.2__art_2.2
- number: '2.3'
  text: '1. Voor het Dijktraject Slaperdijk gelden de volgende omgevingswaarden: a. handhaven van het profiel dat op 1 september 2008 aanwezig was; en b. afsluitbaar maken van de doorgangen in de Slaperdijk, waaronder die in het Valleikanaal ter hoogte van de Rode Haan. 2. Deze omgevingswaarden zijn een resultaatsverplichting.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.2__art_2.3
- number: '2.4'
  text: 1. Met het oog op de bergings- en afvoercapaciteit waarop regionale wateren worden ingericht, geldt voor het gebied van een gemeente in het beheersgebied van het Hoogheemraadschap De Stichtse Rijnlanden binnen de bebouwde kom waar feitelijk bebouwing, hoofdinfrastructuur of spoorwegen aanwezig zijn als omgevingswaarde een gemiddelde overstromingskans van 1 keer per 100 jaar. 2. Voor het overige gebied binnen de bebouwde kom geldt als omgevingswaarde een gemiddelde overstromingskans van 1 keer per 10 jaar. 3. Bij de beoordeling of een gebied bedoeld in het tweede lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 10% buiten beschouwing worden gelaten. 4. Deze omgevingswaarde is een inspanningsverplichting.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.2__art_2.4
- number: '2.5'
  text: 1. Met het oog op de bergings- en afvoercapaciteit waarop regionale wateren worden ingericht, geldt voor het gebied van een gemeente in het beheersgebied van het Waterschap Amstel, Gooi en Vecht binnen de bebouwde kom waar feitelijk bebouwing, hoofdinfrastructuur of spoorwegen aanwezig zijn als omgevingswaarde een gemiddelde overstromingskans van 1 keer per 100 jaar. 2. Voor het overige gebied binnen de bebouwde kom geldt als omgevingswaarde een gemiddelde overstromingskans van 1 keer per 10 jaar. 3. Bij de beoordeling of een gebied bedoeld in het tweede lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 5% buiten beschouwing worden gelaten. 4. Deze omgevingswaarde is een inspanningsverplichting.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.2__art_2.5
- number: '2.6'
  text: 1. Met het oog op de bergings- en afvoercapaciteit waarop regionale wateren worden ingericht, geldt voor het gebied van een gemeente in het beheersgebied van het Waterschap Vallei en Veluwe binnen de bebouwde kom waar feitelijk bebouwing, hoofdinfrastructuur of spoorwegen aanwezig zijn als omgevingswaarde een gemiddelde overstromingskans van 1 keer per 100 jaar. 2. Voor het overige gebied binnen de bebouwde kom geldt als omgevingswaarde een gemiddelde overstromingskans van 1 keer per 10 jaar. 3. Bij de beoordeling of een gebied bedoeld in het tweede lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 5% buiten beschouwing worden gelaten. 4. Deze omgevingswaarde is een inspanningsverplichting.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.2__art_2.6
- number: '2.7'
  text: 1. Met het oog op de bergings- en afvoercapaciteit waarop regionale wateren worden ingericht, geldt voor het gebied van een gemeente in het beheersgebied van het Waterschap Rivierenland binnen de bebouwde kom waar feitelijk bebouwing, hoofdinfrastructuur of spoorwegen aanwezig zijn, als omgevingswaarde een gemiddelde overstromingskans van 1 keer per 100 jaar. 2. Voor het overige gebied binnen de bebouwde kom geldt als omgevingswaarde een gemiddelde overstromingskans van 1 keer per 10 jaar. 3. Bij de beoordeling of een gebied bedoeld in het tweede lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 5% buiten beschouwing worden gelaten. 4. Deze omgevingswaarde is een inspanningsverplichting.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.2__art_2.7
- number: '2.8'
  text: 1. Met het oog op de bergings- en afvoercapaciteit waarop regionale wateren worden ingericht, geldt voor het gebied van een gemeente in het beheersgebied van het Hoogheemraadschap De Stichtse Rijnlanden buiten de bebouwde kom waar glastuinbouw en hoogwaardige land- en tuinbouw aanwezig zijn als omgevingswaarde een gemiddelde kans op overstroming van 1 keer per 50 jaar. 2. Bij de beoordeling of een gebied bedoeld in het eerste lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 1% buiten beschouwing worden gelaten. 3. Voor het overige gebied buiten de bebouwde kom geldt in de periode 1 maart tot 1 november als omgevingswaarde een gemiddelde kans op overstroming van 1 keer per 10 jaar. 4. Bij de beoordeling of een gebied bedoeld in het derde lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 10% buiten beschouwing worden gelaten. 5. Deze omgevingswaarde is een inspanningsverplichting.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.2__art_2.8
- number: '2.9'
  text: 1. Met het oog op de bergings- en afvoercapaciteit waarop regionale wateren worden ingericht, geldt voor het gebied van een gemeente in het beheersgebied van het Waterschap Amstel, Gooi en Vecht buiten de bebouwde kom waar bebouwing aanwezig is, als omgevingswaarde een gemiddelde kans op overstroming van 1 keer per 100 jaar. 2. Voor het gebied buiten de bebouwde kom waar glastuinbouw en hoogwaardige land- en tuinbouw aanwezig zijn in het beheersgebied van het waterschap geldt als omgevingswaarde een gemiddelde kans op overstroming van 1 keer per 50 jaar. 3. Bij de beoordeling of een gebied bedoeld in het tweede lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 1% buiten beschouwing worden gelaten. 4. Voor het gebied buiten de bebouwde kom waar akkerbouw aanwezig is in het beheersgebied van het waterschap geldt als omgevingswaarde een gemiddelde kans op overstroming van 1 keer per 25 jaar. 5. Bij de beoordeling of een gebied bedoeld
    in het vierde lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 1% buiten beschouwing worden gelaten. 6. Voor het gebied buiten de bebouwde kom waar grasland aanwezig is in het beheersgebied van het waterschap geldt in de periode 1 maart tot 1 oktober als omgevingswaarde een gemiddelde kans op overstroming van 1 keer per 10 jaar. 7. Bij de beoordeling of een gebied bedoeld in het zesde lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 10% buiten beschouwing worden gelaten. 8. Deze omgevingswaarde is een inspanningsverplichting.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.2__art_2.9
- number: '2.10'
  text: 1. Met het oog op de bergings- en afvoercapaciteit waarop regionale wateren worden ingericht, geldt voor het gebied van een gemeente in het beheersgebied van het Waterschap Vallei en Veluwe buiten de bebouwde kom als omgevingswaarde een gemiddelde kans op overstroming van 1 keer per 10 jaar. 2. Bij de beoordeling of een gebied bedoeld in het eerste lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 5% buiten beschouwing worden gelaten. 3. Deze omgevingswaarde is een inspanningsverplichting.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.2__art_2.10
- number: '2.11'
  text: 1. Met het oog op de bergings- en afvoercapaciteit waarop regionale wateren worden ingericht, geldt voor het gebied van een gemeente in het beheersgebied van het Waterschap Rivierenland buiten de bebouwde kom waar feitelijk hoofdinfrastructuur en spoorwegen aanwezig zijn in het beheersgebied van het waterschap, als omgevingswaarde een gemiddelde kans op overstroming van 1 keer per 100 jaar. 2. Voor het gebied van een gemeente buiten de bebouwde kom waar glastuinbouw en hoogwaardige land- en tuinbouw aanwezig zijn in het beheersgebied van het waterschap geldt als omgevingswaarde een gemiddelde kans op overstroming van 1 keer per 50 jaar. 3. Bij de beoordeling of een gebied bedoeld in het tweede lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 1% buiten beschouwing worden gelaten. 4. Voor het gebied van een gemeente buiten de bebouwde kom waar akkerbouw aanwezig is in het beheersgebied van het waterschap geldt als omgevingswaarde een
    gemiddelde kans op overstroming van 1 keer per 25 jaar. 5. Bij de beoordeling of een gebied bedoeld in het vierde lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 1% buiten beschouwing worden gelaten. 6. Voor het gebied van een gemeente buiten de bebouwde kom waar grasland aanwezig is in het beheersgebied van het waterschap geldt als omgevingswaarde een gemiddelde kans op overstroming van 1 keer per 10 jaar. 7. Bij de beoordeling of een gebied bedoeld in het zesde lid voldoet aan de omgevingswaarde, kan een gedeelte van de oppervlakte van het gebied van maximaal 5% buiten beschouwing worden gelaten. 8. Voor bebouwing die is gelegen buiten de bebouwde kom , geldt de omgevingswaarde van het omringende landgebruik, bedoeld in het eerste tot en met zevende lid. 9. Deze omgevingswaarde is een inspanningsverplichting.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.2__art_2.11
- number: '2.12'
  text: Het waterschap is belast met de uitvoering van de monitoring voor de omgevingswaarden, bedoeld in Artikel 2.2 en Artikel 2.3 .
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.3__art_2.12
- number: '2.13'
  text: '1. Het waterschap is belast met de uitvoering van de monitoring voor de omgevingswaarden, bedoeld in de artikelen 2.4 tot en met 2.11. 2. De monitoring vindt plaats door bepaling van de bergings- en afvoercapaciteit van de regionale wateren in de actuele toestand door metingen, berekeningen en modellen volgens: a. een door gedeputeerde staten beschikbaar gestelde leidraad; of b. een door het waterschap, in overleg met gedeputeerde staten, te bepalen methode.'
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.1__subsec_2.1.3__art_2.13
- number: '2.14'
  text: Een omgevingsplan dat betrekking heeft op locaties binnen de Vrijwaringszone regionale waterkering bevat regels die de waterkerende functie beschermen en voorzien in een vrijwaringszone aan weerszijden van de waterkering.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_2__subchp_2.2__subsec_2.2.1__art_2.14
