- number: '9.10'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen de Kernrandzone kan ten behoeve van het versterken van de ruimtelijke kwaliteit regels bevatten die verstedelijking toestaan, mits voldaan is aan de volgende voorwaarden: a. de verstedelijking gaat gepaard met versterking van de ruimtelijke kwaliteit die in een redelijke verhouding staat tot de aard en de omvang van de verstedelijking, tenzij de verstedelijking betrekking heeft op kernrandactiviteiten ; b. de verstedelijking is ruimtelijk en landschappelijk goed inpasbaar en wordt, met uitzondering van windenergie en zonnevelden , in aansluiting op het Stedelijk gebied gerealiseerd, of in samenhang met overige verstedelijkte structuur; c. tijdige en duurzame realisatie van de verhoging van de ruimtelijke kwaliteit is geborgd; en d. omliggende functies worden niet onevenredig geschaad. 2. De motivering van een omgevingsplan bevat: a. een onderbouwing waaruit blijkt op welk gebied deze toepassing betrekking heeft en dat
    aan de genoemde voorwaarden is voldaan; b. een beschrijving van de in het plangebied voorkomende ruimtelijke kwaliteit en de wijze waarop met het versterken daarvan is omgegaan. Hierbij wordt aangegeven hoe de verstedelijking aansluit op de ruimtelijke en landschappelijke structuur; en c. een beeldkwaliteitsparagraaf maakt onderdeel uit van de onderbouwing.'
