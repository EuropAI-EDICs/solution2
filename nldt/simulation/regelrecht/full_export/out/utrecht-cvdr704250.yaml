          description: 'Buiten de wet-YAML op te lossen (register/GIO): punt-in-polygoon tegen de GIO "Gebied kleine windturbine" uit Bijlage II van CVDR704250 (join-id /join/id/regdata/pv26/2025/gio73f71441-6b83-4be5-9fef-293714578255/nld@2025-10-10;822). In de LDT-toolbox levert de zone-engine van PoC-1 dit feit (agrest IMOW-laag van de vigerende verordening als GIO-alias).'
      output:
