- number: '9.12'
  text: '1. Een omgevingsplan dat betrekking heeft op locaties binnen het Landelijk gebied kan regels bevatten die toestaan dat een agrarisch bedrijfsperceel waar het agrarisch gebruik is beëindigd een woonfunctie wordt gegeven aan de bedrijfswoning en de tot het hoofdgebouw behorende aangebouwde bedrijfsruimte, mits is voldaan aan de volgende voorwaarden: a. het bouwperceel is niet optimaal gesitueerd en uitgerust voor de grondgebonden landbouw , of, in het geval van een glastuinbouwbedrijf, het bouwperceel ligt niet in een Concentratiegebied glastuinbouw ; b. de bestaande cultuurhistorische en landschappelijke waarden worden behouden of versterkt; c. de omliggende agrarische bedrijven worden niet in hun bedrijfsvoering belemmerd; en d. een kantoor of bedrijf aan huis is mogelijk als de omvang van die activiteiten ondergeschikt blijft aan de woonfunctie. 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de genoemde voorwaarden is voldaan.'
