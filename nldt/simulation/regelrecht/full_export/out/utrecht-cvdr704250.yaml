- number: '3.10'
  text: 1. Een omgevingsplan dat betrekking heeft op locaties binnen het Gebied matig kwetsbare strategische grondwatervoorraad houdt rekening met de bescherming van de kwaliteit van het grondwater voor de grondwaterwinning voor menselijke consumptie. 2. De motivering van een omgevingsplan bevat een onderbouwing waaruit blijkt dat aan de voorwaarde is voldaan.
  url: https://lokaleregelgeving.overheid.nl/CVDR704250/8#chp_3__subchp_3.2__subsec_3.2.2__art_3.10
