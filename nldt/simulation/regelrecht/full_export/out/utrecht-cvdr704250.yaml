- number: 6.5a
  text: 1. De realisatie van de compensatie, de ontwikkeling, de instandhouding en het beheer zijn verzekerd op het moment van vaststelling van het besluit waarmee de activiteit mogelijk wordt gemaakt. 2. De realisatie van de compensatie wordt in het omgevingsplan zeker gesteld door middel van een voorwaardelijke verplichting waarin de aard en omvang van de compensatie is vastgesteld en waarin is bepaald dat de uitvoering van benodigde compensatie zo spoedig mogelijk, maar in ieder geval gegarandeerd binnen 3 jaar na de ruimtelijke ontwikkeling, is gerealiseerd en daarna in stand wordt gehouden. 3. In afwijking van tweede lid geldt voor de realisatie van nieuwe natuur als compensatie voor de plaatsing van zonneveld en dat de inrichtingsmaatregelen uiterlijk 25 jaar na plaatsing van de zonnepanelen worden uitgevoerd.
