<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EDIC Marketplace · LDT CitiVERSE</title>
    <meta
      name="description"
      content="EDIC Marketplace — reusable digital twin recipes from LDT CitiVERSE and the nLDT testbed."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Quantico:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=citiverse-7" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="https://ldtcitiverse-edic.eu/" target="_blank" rel="noopener" data-i18n="brand">
        LDT CitiVERSE EDIC
      </a>
      <div class="header-actions">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" id="btn-nl" aria-pressed="true">NL</button>
          <button type="button" id="btn-en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-inner">
        <p class="eyebrow" data-i18n="heroEyebrow">PROJECT</p>
        <p class="hero-brand" data-i18n="heroBrand">Marketplace</p>
        <h1 id="hero-title" data-i18n="tagline">Herbruikbare recepten voor digitale tweelingen</h1>
        <p class="lead" data-i18n="heroLead"></p>
        <div class="cta-row">
          <a class="btn btn-primary" href="#catalog" data-i18n="ctaCatalog">Bekijk recepten</a>
          <button type="button" class="btn btn-ghost" id="btn-explain" data-i18n="ctaExplain">
            Wat zijn recepten?
          </button>
        </div>
      </div>
    </section>

    <main class="catalog" id="catalog">
      <div class="catalog-head">
        <p class="eyebrow" data-i18n="catalogEyebrow">OVERZICHT</p>
        <h2 data-i18n="catalogTitle">Receptencatalogus</h2>
        <p data-i18n="catalogLead"></p>
      </div>

      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Zoek recepten…" autocomplete="off" />
        <div class="chips" id="chips" role="group" aria-label="Themes"></div>
      </div>

      <div class="grid" id="grid"></div>
    </main>

    <div class="detail-backdrop" id="detail-backdrop"></div>
    <aside class="detail detail-left" id="explain-panel" aria-live="polite"></aside>
    <aside class="detail" id="detail" aria-live="polite"></aside>

    <footer class="site-footer">
      <p data-i18n="footer"></p>
    </footer>

    <script type="module" src="./app.js?v=citiverse-7"></script>
  </body>
</html>
