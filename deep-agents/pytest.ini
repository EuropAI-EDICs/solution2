# deep-agents/pytest.ini — testmarkers (spec 2026-10-07-hitl-mens-agent-grens-design §5)
# De standaardsuite is offline en LLM-vrij; de llm-gemarkeerde volledige-loop-
# test wordt expliciet geselecteerd met `pytest -m llm` en geskipt zonder
# LDT_DEEP_AGENTS_ENDPOINT (patroon: poc/pytest.ini, S1/S7-comparators).
[pytest]
addopts = --strict-markers
markers =
    llm: volledige agent-loop met echt lokaal LLM (alleen met LDT_DEEP_AGENTS_ENDPOINT)
