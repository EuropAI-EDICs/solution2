<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>nLDT deep-agent simulatie</title>
<link rel="stylesheet" href="/assets/leaflet.css"/>
<style>
  :root { --blue:#2563eb; --bg:#f4f6fa; --line:#e2e6ee; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system,"Segoe UI",sans-serif; margin:0; background:var(--bg); color:#1a2233; }
  header { background:#0f1b33; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:14px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .models { margin-left:auto; font-size:11px; opacity:.75; }
  #agents { display:flex; flex-wrap:wrap; gap:4px; padding:4px 18px 8px; background:#0f1b33; }
  .chip { font-size:10.5px; border-radius:10px; padding:2px 8px; background:#26365a; color:#cfe0ff; transition: box-shadow .2s; }
  .chip.role { background:#3d2a68; color:#e6d9ff; }
  .chip.active { box-shadow: 0 0 0 2px #fbbf24; color:#fff; }
  #graph-bar { font-size:11px; padding:4px 18px 6px; background:#1a2744; color:#94a3b8; font-family: ui-monospace, Menlo, monospace; }
  #status { font-size:12px; padding:3px 10px; border-radius:12px; background:#334166; }
  #status.running { background:#b45309; } #status.done { background:#15803d; }
  #status.error { background:#7f1d1d; }
  .step.error { border-left-color:#b91c1c; background:#fdeaea; } .step.error .badge { background:#f5c9c9; }
  #controls { display:flex; gap:10px; padding:10px 18px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; align-items:flex-end; }
  label { font-size:11px; display:block; color:#556; margin-bottom:3px; }
  select { font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; min-width:180px; max-width:340px; }
  #start { background:var(--blue); color:#fff; border:0; border-radius:6px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer; }
  #start:disabled { background:#93a4c8; cursor:wait; }
  #stop { background:#b91c1c; color:#fff; border:0; border-radius:6px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; display:none; }
  #main { display:flex; gap:0; height:calc(100vh - 96px); }
  #timeline { width:430px; overflow-y:auto; border-right:1px solid var(--line); background:#fff; padding:12px; }
  #tl-title { font-size:12px; font-weight:600; color:#667; margin-bottom:8px; }
  .step { display:flex; gap:8px; padding:7px 8px; border-left:3px solid transparent; margin-bottom:6px; background:var(--bg); border-radius:6px; font-size:12.5px; }
  .step .t { color:#8895ad; font-size:10.5px; min-width:52px; padding-top:2px; }
  .step .badge { font-size:10px; border-radius:8px; padding:1px 7px; height:fit-content; white-space:nowrap; }
  .step.start { border-left-color:var(--blue); } .step.start .badge { background:#dbe7ff; }
  .step.delegate { border-left-color:#7c3aed; background:#f3eefe; } .step.delegate .badge { background:#e6d9ff; }
  .step.tool_call { border-left-color:#64748b; } .step.tool_call .badge { background:#e2e8f0; }
  .step.tool_result { border-left-color:#15803d; } .step.tool_result .badge { background:#d9f0e1; }
  .step.assistant { border-left-color:#0ea5e9; background:#eff8ff; } .step.assistant .badge { background:#d6ecff; }
  .step.done { border-left-color:#15803d; background:#e7f6ec; } .step.done .badge { background:#bbf0cd; }
  .step.graph_node { border-left-color:#6366f1; background:#eef2ff; } .step.graph_node .badge { background:#c7d2fe; }
  .step .sum { flex:1; } .step .sum small { display:block; color:#667; font-size:11px; margin-top:2px; }
  #agentgraph { width:100%; height:186px; display:block; background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
  .gedge { stroke:#d9deea; stroke-width:1.2; } .gedge.lit { stroke:var(--blue); stroke-width:2.4; }
  .gnode circle { fill:#fff; stroke:#94a3b8; stroke-width:2; transition: fill .3s; }
  .gnode.poc circle { stroke:#2563eb; } .gnode.role circle { stroke:#7c3aed; }
  .gnode.visited circle { fill:#dbe7ff; } .gnode.role.visited circle { fill:#e6d9ff; }
  .gnode.active circle { animation:gpulse 1.1s ease-in-out infinite; }
  .gnode text { font-size:8.5px; fill:#33415c; text-anchor:middle; pointer-events:none; }
  .gnode.orch circle { fill:#0f1b33; stroke:#0f1b33; }
  @keyframes gpulse { 0%,100% { stroke-width:2; } 50% { stroke-width:5; } }
  #autobtn { font-size:11px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:2px 8px; cursor:pointer; margin-left:8px; color:#556; float:right; }
  #autobtn.on { background:#dbe7ff; border-color:var(--blue); color:var(--blue); font-weight:600; }
  #viz { flex:1; display:flex; flex-direction:column; }
  #viz-header { padding:8px 16px; font-size:12px; color:#667; background:#fff; border-bottom:1px solid var(--line); }
  #viz-body { display:flex; flex:1; min-height:0; }
  #cards { width:330px; overflow-y:auto; padding:12px; background:#fff; border-right:1px solid var(--line); }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; cursor:pointer; background:#fff; }
  .card.active { border-color:var(--blue); box-shadow:0 0 0 2px rgba(37,99,235,.2); }
  .delta { font-size:19px; font-weight:600; margin:4px 0; } .neg { color:#b91c1c; } .pos { color:#15803d; }
  .note { font-size:11.5px; color:#556; }
  details { margin-top:5px; } summary { font-size:11.5px; color:var(--blue); cursor:pointer; }
  .pin { float:right; font-size:10.5px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:2px 8px; cursor:pointer; color:#556; margin-left:6px; }
  .pin.on { background:#ffedd5; border-color:#ea580c; color:#9a3412; font-weight:600; }
  .hint { font-size:10.5px; color:#8895ad; margin:2px 0 8px; }
  #map { flex:1; background:#e8edf3; }
  .legend { display:inline-flex; align-items:center; gap:4px; margin-right:12px; font-size:11.5px; color:#556; }
  .sw { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .placeholder { display:flex; align-items:center; justify-content:center; height:100%; color:#8895ad; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>nLDT deep-agent simulatie — Utrecht Plane B</h1>
  <span id="status">idle</span>
  <span class="models" id="models"></span>
</header>
<div id="agents"></div>
<div id="controls">
  <div><label>Scenario run</label><select id="scenario"></select></div>
  <div><label>Prompting / modus</label><select id="mode"></select></div>
  <div><label>Orchestrator model</label><select id="model"></select></div>
  <div><label>Specialist model</label><select id="submodel"></select></div>
  <button id="start">▶ Start simulatie</button>
  <button id="stop">■ Stop</button>
</div>
<div id="main">
  <div id="timeline">
    <div id="tl-title">Agent-graf (live)</div>
    <svg id="agentgraph" viewBox="0 0 406 186"></svg>
    <div id="tl-title" style="margin-top:10px;">Agent-stappen (live)</div>
    <div id="steps"><div class="placeholder">Nog geen run — druk op “Start simulatie”.</div></div>
  </div>
  <div id="viz">
    <div id="viz-header">
      <span class="legend"><span class="sw" style="background:#2563eb;opacity:.45"></span>control</span>
      <span class="legend"><span class="sw" style="background:#dc2626;opacity:.45"></span>scenario</span>
      <span id="viz-note">geen basemap nodig — overlays zijn engine-grounded</span>
      <button id="autobtn" class="on" title="kaart volgt automatisch de geo-stappen van de agents">▶ auto-volgen</button>
    </div>
    <div id="viz-body">
      <div id="cards"><div class="placeholder">Visualisatie verschijnt zodra de agents de world scene bouwen.</div></div>
      <div id="map"></div>
    </div>
  </div>
</div>
<script src="/assets/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
let vizRunId = null, map = null, controlLayer = null, scenarioLayer = null, controlDrawn = false;
let lastRunId = null, followedIndex = 0, autoFollow = true;
const GRAPH_AGENTS = [
  ['breda','poc'],['rijnland','poc'],['utrecht','poc'],['crosstrack','poc'],['minigim','poc'],['eindhoven','poc'],
  ['geospecialist','role'],['normspecialist','role'],['critic','role'],['explainer','role'],['intake','role'],['formalizer','role'],
];

function buildGraph() {
  const svg = $('agentgraph');
  const orch = { x: 203, y: 26, r: 19 };
  const rowY = [104, 162], colX = i => 40 + i * 65;
  let out = '';
  GRAPH_AGENTS.forEach(([name, kind], i) => {
    const y = rowY[Math.floor(i / 6)], x = colX(i % 6);
    out += `<line class="gedge" id="ge-${name}" x1="${orch.x}" y1="${orch.y}" x2="${x}" y2="${y - 13}"></line>`;
  });
  out += `<g class="gnode orch" id="gn-orchestrator"><circle cx="${orch.x}" cy="${orch.y}" r="${orch.r}"></circle><text x="${orch.x}" y="${orch.y - 26}" font-size="10" font-weight="600" fill="#33415c">orchestrator</text></g>`;
  GRAPH_AGENTS.forEach(([name, kind], i) => {
    const y = rowY[Math.floor(i / 6)], x = colX(i % 6);
    out += `<g class="gnode ${kind}" id="gn-${name}"><circle cx="${x}" cy="${y}" r="14"></circle><text x="${x}" y="${y + 3}">${name}</text></g>`;
  });
  svg.innerHTML = out;
}

function updateGraph(entries) {
  const seen = new Set(), lastAgent = 'orchestrator';
  let last = null;
  for (const e of entries) {
    if (e.kind === 'graph_node') continue;
    last = e;
    if (e.agent && e.agent !== '?') seen.add(e.agent);
    const m = (e.summary || '').match(/specialist: (\w+)/);
    if (m) seen.add(m[1]);
  }
  document.querySelectorAll('.gnode').forEach(g => g.classList.remove('active'));
  for (const [name] of GRAPH_AGENTS) {
    const node = $('gn-' + name);
    if (!node) continue;
    node.classList.toggle('visited', seen.has(name));
    $('ge-' + name).classList.toggle('lit', seen.has(name));
  }
  const lastEntryAgent = last ? (last.agent || '') : '';
  if (last && last.kind === 'delegate') {
    const m = (last.summary || '').match(/specialist: (\w+)/);
    if (m && $('gn-' + m[1])) $('gn-' + m[1]).classList.add('active');
  } else if (lastEntryAgent && $('gn-' + lastEntryAgent)) {
    $('gn-' + lastEntryAgent).classList.add('active');
  } else if (last) {
    $('gn-orchestrator').classList.add('active');
  }
}

// --- plain-English rendering: the raw journal stays technical, the display talks
function stripCodes(s) {
  return String(s)
    .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, '')
    .replace(/\/Users\/\S+/g, '…')
    .replace(/\bdeep-agents\/runs\//g, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}
function humanize(e) {
  const s = stripCodes(e.summary || '');
  const n = m => m || '';
  const rules = [
    [/^start/, m => `📋 Brief: ${m[0].replace(/^start\s*/, '')}`],
    [/^→\s*specialist:\s*(\S+)/, m => m[1] === '?' ? '👉 Handing the task to a specialist…' : `👉 Handed over to the **${m[1]}** specialist`],
    [/submit_request → PASS/, () => '✅ The normalized request passed the schema check and was submitted'],
    [/submit_request → FAIL \((\d+)/, m => `❌ The request failed the schema check (${m[1]} issue(s)) — fixing it`],
    [/validate_request.*→ PASS/, () => '✅ Schema check passed for the request'],
    [/validate_request.*→ FAIL \((\d+)/, m => `❌ Schema check found ${m[1]} problem(s) in the request — fixing them`],
    [/submit_norm_cards → PASS \((\d+)/, m => `✅ Submitted ${m[1]} relevant norm cards for the brief`],
    [/submit_norm_cards → FAIL/, () => '❌ The norm-card submission was malformed — rewriting it'],
    [/submit_formal_rule.*→ PASS/, () => '✅ The formal rule passed the schema check and was submitted'],
    [/submit_formal_rule.*→ FAIL \((\d+)/, m => `❌ The formal rule failed the schema check (${m[1]} issue(s)) — fixing it`],
    [/validate_formal_rule.*→ FAIL \((\d+)/, m => `❌ The drafted rule has ${m[1]} schema problem(s) — fixing them`],
    [/validate_formal_rule.*→ PASS/, () => '✅ The drafted rule now passes the schema check'],
    [/get_formal_rules\((.*)\)/, m => `📚 Looked up existing formal rules in the corpus (${m[1] || 'all tracks'}) for calibration`],
    [/search_norms\((.*)\)/, m => `🔎 Searched the norm-card corpus for: ${m[1]}`],
    [/request_template/, () => '📐 Loaded the request schema as a template'],
    [/list_recipes\(\) → (\d+)/, m => `📖 Listed the ${m[1]} available recipes`],
    [/get_recipe\('(.+?)'\)/, m => `📖 Read the recipe details of ${m[1]}`],
    [/run_world_scene\('(.+?)'\)/, m => `🏗️ Building the world-scene layers for ${m[1]}`],
    [/world-scene-specs.json built: (\d+)/, m => `✅ World scene built — ${m[1]} scenario layer(s)`],
    [/demo.html rendered/, () => '✅ Rendered the interactive map demo'],
    [/inspect_geo_layer\('(.+?)'\) → ([\d.]+) km²/, m => `🗺️ Measured layer ${m[1]}: ${m[2]} km² total area`],
    [/compare_layers\('(.+?)'\) → Δ (.*?km².*?)$/, m => `⚖️ Compared ${m[1]} against control: ${m[2]}`],
    [/validate_world_scene.*→ PASS \((\d+)/, m => `✅ Validation gate PASSED — all ${m[1]} checks OK`],
    [/validate_world_scene.*→ FAIL/, () => '❌ Validation gate FAILED — see the issues'],
    [/crosscheck_formal_rule\('(.+?)'\) → UITGEVOERD/, m => `✅ Verified the engine really executed rule ${m[1]}`],
    [/crosscheck_formal_rule\('(.+?)'\) → NIET/, m => `⚠️ Rule ${m[1]} exists on paper, but the engine did not apply it in this run`],
    [/get_provenance\('(.+?)'\)/, m => `🧾 Collected provenance for ${m[1]} (which norm card produced what)`],
    [/specialist klaar|specialist-rapport/, m => `📨 The specialist finished and reported back`],
    [/geen gesubmiteerde aanvraag|GEWEIGERD/, () => '🚧 The build was refused — a submitted request is required first'],
    [/error|Error/, m => `⚠️ Problem: ${stripCodes(m[0]).replace(/^error\s*/i, '').slice(0, 160)}`],
  ];
  for (const [re, fn] of rules) {
    const m = s.match(re);
    if (m) return fn(m);
  }
  return s.charAt(0).toUpperCase() + s.slice(1, 180);
}
const KIND_LABEL = { start: 'brief', delegate: 'handover', tool_call: 'working', tool_result: 'result', assistant: 'report', done: 'finished', error: 'problem' };

function fullReset() {
  vizRunId = null;
  followedIndex = 0;
  for (const layer of pinned.values()) map && map.removeLayer(layer);
  pinned.clear();
  document.querySelectorAll('.pin.on').forEach(b => b.classList.remove('on'));
  $('steps').innerHTML = '<div class="placeholder">Simulation started — first steps will appear here…</div>';
  $('cards').innerHTML = '<div class="placeholder">The map appears as soon as the agents build the world scene.</div>';
  if (map && controlLayer && scenarioLayer) { controlLayer.clearLayers(); scenarioLayer.clearLayers(); controlDrawn = false; }
  updateGraph([]);
}

async function initControls() {
  const [scen, modes, models, agents] = await Promise.all([
    fetch('/api/scenarios').then(r => r.json()),
    fetch('/api/modes').then(r => r.json()),
    fetch('/api/models').then(r => r.json()),
    fetch('/api/agents').then(r => r.json()),
  ]);
  $('agents').innerHTML = agents.map(a =>
    `<span class="chip ${a.kind === 'role' ? 'role' : ''}" title="${escapeHtml(a.description)}">${a.name}</span>`).join('');
  $('scenario').innerHTML = scen.map(s => `<option value="${s}">${s}</option>`).join('');
  const saved = localStorage.getItem('sim-scenario');
  if (saved && scen.includes(saved)) $('scenario').value = saved;
  $('mode').innerHTML = modes.map(m => `<option value="${m.id}">${m.label}</option>`).join('');
  $('model').innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
  $('submodel').innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
  const pick = (key, fallback) => {
    const saved = localStorage.getItem(key);
    if (saved && models.includes(saved)) return saved;   // only valid local models
    localStorage.setItem(key, fallback);
    return fallback;
  };
  $('model').value = pick('sim-model', models.find(m => m.includes('31b-mlx')) || models[0] || '');
  $('submodel').value = pick('sim-submodel', models.find(m => m.includes('12b-mlx')) || models.find(m => m.includes('12b')) || models[0] || '');
  $('models').textContent = `${$('model').value} + ${$('submodel').value}`;
}

$('start').addEventListener('click', async () => {
  const body = {
    scenario: $('scenario').value,
    mode: $('mode').value,
    model: $('model').value,
    submodel: $('submodel').value,
  };
  localStorage.setItem('sim-scenario', body.scenario);
  localStorage.setItem('sim-model', body.model);
  localStorage.setItem('sim-submodel', body.submodel);
  fullReset();
  $('start').disabled = true; $('status').textContent = 'running'; $('status').className = 'running';
  $('stop').style.display = 'inline-block';
  const res = await fetch('/api/run', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  if (!res.ok) {
    const detail = (await res.json().catch(() => ({}))).detail || 'run geweigerd';
    $('steps').innerHTML = `<div class="placeholder">${escapeHtml(String(detail))}</div>`;
    $('start').disabled = false; $('stop').style.display = 'none';
    $('status').textContent = 'fout'; $('status').className = 'error';
    return;
  }
  const r = await res.json();
  lastRunId = r.run_id;
});

$('stop').addEventListener('click', async () => {
  await fetch('/api/stop', { method: 'POST' });
});

function renderSteps(entries) {
  const visible = entries.filter(e => e.kind !== 'graph_node');
  updateGraph(visible);
  if (!visible.length) return;
  const box = $('steps');
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  box.innerHTML = visible.map(e => `
    <div class="step ${e.kind}">
      <span class="t">${e.ts || ''}</span>
      <span class="badge">${KIND_LABEL[e.kind] || e.kind}</span>
      <span class="sum">${humanize(e).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')}${e.detail ? `<small>${escapeHtml(String(e.detail).slice(0,140))}</small>` : ''}</span>
    </div>`).join('');
  if (stick) box.scrollTop = box.scrollHeight;
  const last = visible[visible.length - 1];
  document.querySelectorAll('#agents .chip').forEach(chip => {
    const name = chip.textContent.trim();
    chip.classList.toggle('active', (last.agent || '') === name || (last.summary || '').includes(name));
  });
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function ensureMap() {
  if (map) return;
  map = L.map('map');
  controlLayer = L.featureGroup().addTo(map);
  scenarioLayer = L.featureGroup().addTo(map);
}

function fadeTo(layerGroup, newLayer, targetOpacity) {
  // crossfade: animate the new layer in, the old one out, then swap
  const old = layerGroup.getLayers();
  const t0 = performance.now(), dur = 700;
  if (newLayer) layerGroup.addLayer(newLayer);
  function step(t) {
    const k = Math.min((t - t0) / dur, 1);
    if (newLayer) newLayer.setStyle({ fillOpacity: targetOpacity * k, opacity: k });
    for (const l of old) l.setStyle({ fillOpacity: targetOpacity * (1 - k) * 0.9, opacity: 1 - k });
    if (k < 1) requestAnimationFrame(step);
    else for (const l of old) layerGroup.removeLayer(l);
  }
  requestAnimationFrame(step);
}

async function focusScen(base, control, scenId, el) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  if (el) el.classList.add('active');
  ensureMap();
  if (!controlDrawn) {
    fadeTo(controlLayer, L.geoJSON(control, {style:{color:'#2563eb',weight:1,fillColor:'#2563eb',fillOpacity:.18}}), .18);
    controlDrawn = true;
  }
  let scen = control;
  try { scen = await fetch(`${base}/scenarios/${scenId}.geojson`).then(r => r.json()); } catch {}
  fadeTo(scenarioLayer, L.geoJSON(scen, {style:{color:'#dc2626',weight:2,fillColor:'#dc2626',fillOpacity:.32}}), .32);
  try { map.fitBounds(controlLayer.getBounds().pad(0.05)); } catch {}
}

// pinned layers: toggle individual scenario layers on/off for side-by-side comparison
const pinned = new Map();
async function togglePin(base, scenId, btn) {
  ensureMap();
  if (pinned.has(scenId)) {
    const layer = pinned.get(scenId);
    pinned.delete(scenId);
    btn.classList.remove('on');
    const t0 = performance.now(), dur = 500;
    (function step(t) {
      const k = Math.min((t - t0) / dur, 1);
      layer.setStyle({ fillOpacity: .16 * (1 - k), opacity: 1 - k });
      if (k < 1) requestAnimationFrame(step); else map.removeLayer(layer);
    })(t0);
    return;
  }
  btn.classList.add('on');
  let scen = null;
  try { scen = await fetch(`${base}/scenarios/${scenId}.geojson`).then(r => r.json()); } catch {}
  if (!scen) { btn.classList.remove('on'); return; }
  const layer = L.geoJSON(scen, {style:{color:'#ea580c',weight:1.4,fillColor:'#ea580c',fillOpacity:0}}).addTo(map);
  pinned.set(scenId, layer);
  const t0 = performance.now(), dur = 700;
  (function step(t) {
    const k = Math.min((t - t0) / dur, 1);
    layer.setStyle({ fillOpacity: .16 * k, opacity: k });
    if (k < 1) requestAnimationFrame(step);
  })(t0);
  try { map.fitBounds(controlLayer.getBounds().pad(0.05)); } catch {}
}

// geo steps of the geospecialist, in order: the map follows them gradually
function geoSteps(entries) {
  const out = [];
  for (const e of entries) {
    const s = e.summary || '';
    let m = s.match(/inspect_geo_layer\('([^']+)'\)/);
    if (m && m[1].toLowerCase() !== 'control') out.push(m[1].replace(/^WSS-/, ''));
    m = s.match(/compare_layers\('([^']+)'\)/);
    if (m) out.push(m[1].replace(/^WSS-/, ''));
  }
  return [...new Set(out)];
}

$('autobtn').addEventListener('click', () => {
  autoFollow = !autoFollow;
  $('autobtn').classList.toggle('on', autoFollow);
  $('autobtn').textContent = autoFollow ? '▶ auto-volgen' : '⏸ handmatig';
});
async function showViz(runId) {
  if (runId === vizRunId) return;
  const base = `/${runId}-worldscene`;
  let bundle;
  try { bundle = await fetch(`${base}/world-scene-specs.json`).then(r => r.json()); }
  catch { return; }
  vizRunId = runId;
  ensureMap();
  const control = await fetch(`${base}/scenarios/CONTROL.geojson`).then(r => r.json());
  $('cards').innerHTML = `<div class="hint">Klik een kaart = dat gebied op de kaart · 👁 = laag aan/uit zetten</div>` + bundle.specs.map(s => `
    <div class="card" data-scen="${s.scenarioId}">
      <button class="pin" data-scen="${s.scenarioId}">👁 laag</button>
      <div class="note"><b>${s.id}</b></div>
      <div class="delta ${s.headlineDeltaKm2 < 0 ? 'neg' : 'pos'}">${s.headlineDeltaKm2 > 0 ? '+' : ''}${s.headlineDeltaKm2.toFixed(2)} km² (${s.headlineDeltaPct > 0 ? '+' : ''}${s.headlineDeltaPct.toFixed(2)}%)</div>
      <div class="note">${escapeHtml(s.mutationSummary)} · ${s.provenanceBasis.type} · ${s.groundingStamp}</div>
      <details><summary>Marble prompt (gated)</summary><div class="note">${escapeHtml(s.marblePrompt)}</div></details>
    </div>`).join('');
  document.querySelectorAll('.card').forEach(el => el.addEventListener('click', () => focusScen(base, control, el.dataset.scen, el)));
  document.querySelectorAll('.pin').forEach(btn => btn.addEventListener('click', ev => { ev.stopPropagation(); togglePin(base, btn.dataset.scen, btn); }));
  focusScen(base, control, bundle.specs[0].scenarioId, document.querySelector('.card'));
}

async function tick() {
  let entries = [];
  try { entries = (await fetch('/api/steps?_=' + Date.now()).then(r => r.text())).trim().split('\n').filter(Boolean).map(l => JSON.parse(l)); } catch {}
  let st = null;
  try { st = await fetch('/api/status').then(r => r.json()); } catch {}
  if (st && st.run_id !== undefined) {
    if (lastRunId !== null && st.run_id !== lastRunId) fullReset();
    lastRunId = st.run_id;
  }
  renderSteps(entries);
  const vizEntry = [...entries].reverse().find(e => e.viz && e.viz.kind === 'worldscene');
  if (vizEntry) showViz(vizEntry.viz.runId);
  // progressive map: follow the geospecialist's steps as they land
  const gsteps = geoSteps(entries);
  if (autoFollow && vizRunId && gsteps.length > followedIndex) {
    const base = `/${vizRunId}-worldscene`;
    const control = await fetch(`${base}/scenarios/CONTROL.geojson`).then(r => r.json()).catch(() => null);
    if (control) {
      const sid = gsteps[gsteps.length - 1];
      focusScen(base, control, sid, document.querySelector(`.card[data-scen="${sid}"]`));
      followedIndex = gsteps.length;
    }
  }
  if (st) {
    if (st.running) { $('status').textContent = 'running'; $('status').className = 'running'; $('start').disabled = true; $('stop').style.display = 'inline-block'; }
    else if (st.ever_ran && st.rc === 0) { $('status').textContent = 'done'; $('status').className = 'done'; $('start').disabled = false; $('stop').style.display = 'none'; }
    else if (st.ever_ran && st.rc !== null && st.rc !== 0) { $('status').textContent = `fout (rc=${st.rc})`; $('status').className = 'error'; $('start').disabled = false; $('stop').style.display = 'none'; }
    else { $('status').textContent = 'idle'; $('status').className = ''; $('start').disabled = false; $('stop').style.display = 'none'; }
  }
}
initControls();
buildGraph();
poll = setInterval(tick, 700);
tick();
</script>
